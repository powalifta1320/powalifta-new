<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — POWALIFTA</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0c">
<script>(function(){try{var k='powa-theme';var s=localStorage.getItem(k);var t=(s==='light'||s==='dark')?s:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);if(t==='light'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#ffffff');}}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="cookie-consent.css">
<style>
  .nf-wrap {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
  }
  .nf-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 110%, rgba(255,45,63,0.18), transparent 65%);
    pointer-events: none;
  }
  .nf-ghost {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Anton', sans-serif;
    font-size: clamp(14rem, 42vw, 34rem);
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--ghost-stroke);
    pointer-events: none;
    user-select: none;
  }
  .nf-inner { position: relative; z-index: 2; }
  .nf-inner h1 { font-size: clamp(2.6rem, 7vw, 5rem); margin-bottom: 16px; }
  .nf-inner h1 .accent {
    background: var(--grad-red);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-style: italic;
  }
  .nf-inner p { color: var(--text-2); margin-bottom: 30px; font-size: 1.02rem; }
  .nf-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
<script defer data-domain="powalifta.com" src="https://plausible.io/js/script.js"></script>
<script defer src="error-log.js"></script>
<script defer src="cookie-consent.js"></script>
</head>
<body>
<div class="nf-wrap">
  <div class="nf-ghost" aria-hidden="true">404</div>
  <div class="nf-inner">
    <h1>MISSED <span class="accent">LIFT.</span></h1>
    <p>This page doesn't exist — three red lights. Rack the bar and head back.</p>
    <div class="nf-actions">
      <a href="/" class="btn btn-primary btn-lg">Back to the platform</a>
      <a href="/marketplace.html" class="btn btn-ghost btn-lg">Browse programs</a>
    </div>
  </div>
</div>
</body>
</html>
