<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients, POWALIFTA Coach</title>
<script>
/* the theme before any CSS: ?theme= wins, then powa-r6-theme, else dark */
(function () { var t = null; var m = /[?&]theme=(light|dark)\b/.exec(location.search); if (m) t = m[1]; if (!t) { try { t = localStorage.getItem('powa-r6-theme'); } catch (e) { t = null; } } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>
<link rel="stylesheet" href="../kit/r6/tokens.css">
<link rel="stylesheet" href="../kit/r6/glass.css">
<link rel="stylesheet" href="../kit/r6/ui.css">
<link rel="stylesheet" href="../kit/r6/fix.css">
<link rel="stylesheet" href="../kit/r6/newcoach.css">
<style>
  /* Clients (screens.md §7, professional.md §10.9): who owes me, who wants in, who is leaving, how full am I. The To do
     list is the work card in the list column (it scrolls inside itself, so it is always whole in the window and the
     detail scrolls beside it); the detail is the month (the picture card), then Still to come this month and Seats on the
     floor, or one lifter's ledger. The crimson is the store's next decision, in the toolbar. Tokens only; widths in px. */
  .cv { display: grid; grid-template-columns: var(--list-w) minmax(0, 1fr); column-gap: var(--sp-6); align-items: start; }
  .cv.is-wide { grid-template-columns: minmax(0, 1fr); }
  /* the list column starts right under the toolbar band with its head (PX3: the same y on every list page); the page's
     title and facts lead the detail column beside it */
  .cv { margin-top: calc(var(--sp-3) * -1); }
  .cl { position: sticky; top: var(--edge-h); display: flex; flex-direction: column; min-width: 0; max-height: calc(100dvh - var(--cl-top, 160px) - var(--sp-4)); }
  .cl > .lh { flex: none; padding-left: var(--sp-3); }
  .cl > .lh .link { white-space: nowrap; }
  .cd { min-width: 0; padding-top: var(--sp-3); }
  .cv.is-wide .cd, .cv.is-free .cd { padding-top: var(--sp-3); }

  /* ---- To do: the work card; its list scrolls under a fade at either edge ---- */
  .td { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  .td-l {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--sp-3) var(--sp-2);
    -webkit-mask-image: linear-gradient(transparent, var(--ink) var(--sp-3), var(--ink) calc(100% - var(--sp-3)), transparent);
    mask-image: linear-gradient(transparent, var(--ink) var(--sp-3), var(--ink) calc(100% - var(--sp-3)), transparent);
  }
  .td .lrow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'n e' 'w w' 'q q' 'm m'; align-items: baseline; row-gap: 2px; padding: var(--sp-3) var(--sp-3); }
  .td .lrow + .lrow::before { left: var(--sp-3); right: var(--sp-3); }
  .td .nm { grid-area: n; }
  .td .amt { grid-area: e; color: var(--ink); font: 600 var(--fs-body)/var(--lh-sub) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .td .why { grid-area: w; text-wrap: pretty; }
  .td .q { grid-area: q; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; }
  /* the moves under the words, their labels on the words' edge; the "…" ends the line */
  .td .mv { grid-area: m; display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1); margin: var(--sp-2) calc(var(--sp-2) * -1) 0 calc(var(--sp-3) * -1); }
  .td .mv .fix { padding: 0 var(--sp-3); }
  .td .mv { padding-right: calc(var(--ctl-s) + var(--sp-1)); }
  .td .mv .more { position: absolute; right: var(--sp-1); bottom: var(--sp-3); }
  .td .done-row { grid-area: w; flex-wrap: wrap; row-gap: 2px; column-gap: var(--sp-3); margin-top: 2px; }
  .td .done-row .dw { white-space: normal; text-wrap: pretty; flex: 1 1 100%; }
  .td .done-tick { align-self: flex-start; margin-top: 1px; }
  .td .done-row .lnk { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .late, .kvs dd.late, .tbl td.late { color: var(--warn); }
  /* the row's "…" shows on the row in hand, under the pointer, or with the keys inside it */
  .lrow .more { opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
  .lrow.is-sel .more, .lrow:focus-within .more, .lrow .more.is-open { opacity: 1; }
  @media (hover: hover) and (pointer: fine) { .lrow:hover .more { opacity: 1; } }
  .td-h { display: flex; align-items: baseline; gap: var(--sp-2); margin: var(--sp-5) var(--sp-3) var(--sp-1); font: 600 var(--fs-sub)/var(--lh-sub) var(--font); }
  .td-h .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .td-empty { margin: 0; padding: var(--sp-5) var(--sp-4); color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }

  /* ---- the month: one number, one bar, three buttons, one line ---- */
  .mo { padding: var(--sp-5) var(--sp-6) var(--sp-6); }
  .mo-h { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-height: var(--ctl-h); }
  .mo-h h2 { margin: 0; font: 600 var(--fs-head)/var(--lh-head) var(--font); letter-spacing: var(--ls-head); }
  .mo-v { display: flex; align-items: baseline; gap: var(--sp-3); margin: var(--sp-3) 0 var(--sp-4); }
  .mo-v b { font: 800 var(--fs-hero)/var(--lh-hero) var(--font); letter-spacing: var(--ls-hero); font-variant-numeric: tabular-nums; font-stretch: var(--num-stretch); }
  .mo-v span { color: var(--ink-2); font: 500 var(--fs-body)/var(--lh-body) var(--font); font-variant-numeric: tabular-nums; }
  .mbar { display: flex; gap: var(--sp-1); height: 12px; border-radius: var(--r-pill); overflow: hidden; }
  .mbar i { display: block; height: 100%; min-width: 6px; flex-basis: 0; }
  .mbar .in { background: var(--up); }
  .mbar .lt2 { background: var(--warn); }
  .mbar .tc { background: var(--fill-3); }
  /* the bar's legend (P44): a square in each bar colour, the words in ink-2, the amounts at 600; they do not filter */
  .mo-k { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-6); margin: var(--sp-4) 0 0; padding: 0; list-style: none; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .mo-k li { display: inline-flex; align-items: center; gap: var(--sp-2); }
  .mo-k i { display: block; flex: none; width: var(--sp-2); height: var(--sp-2); }
  .mo-k i.in { background: var(--up); } .mo-k i.lt2 { background: var(--warn); } .mo-k i.tc { background: var(--fill-3); }
  .mo-k b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .mo-k .moves { margin-left: auto; }
  .mo-n { margin: var(--sp-4) 0 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; }

  /* ---- under the month: Still to come this month | Seats, flat on the floor ---- */
  .ov2 { display: grid; grid-template-columns: minmax(0, 1fr) 264px; gap: var(--sp-7); align-items: start; margin-top: var(--sp-7); }
  @media (max-width: 1280px) { .ov2 { grid-template-columns: minmax(0, 1fr) 232px; gap: var(--sp-6); } }
  .tc-l { padding: 0 var(--sp-1); }   /* the rows' words start under the title's (P46, PX2: .sec-h sits 4 px in) */
  .tc-l .lrow { width: 100%; grid-template-columns: 96px minmax(0, 1fr) auto; min-height: 44px; padding: 0; border: 0; background-color: transparent; color: inherit; font: inherit; text-align: left; }
  .tc-l .lrow + .lrow::before { left: 0; right: 0; }
  .tc-l .d { color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tc-l .nm { font-size: var(--fs-sub); }
  .tc-l .v { color: var(--ink); font: 600 var(--fs-sub)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .se-v { display: flex; align-items: baseline; gap: var(--sp-2); margin: 0 var(--sp-1); }
  .se-v b { font: 800 var(--fs-num)/var(--lh-num) var(--font); letter-spacing: var(--ls-num); font-variant-numeric: tabular-nums; font-stretch: var(--num-stretch); }
  .se-v span { color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }
  .se-l { margin: var(--sp-4) var(--sp-1) 0; padding: 0; list-style: none; }
  .se-l li { display: flex; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-2) 0; border-top: 1px solid var(--line); color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .se-l li b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .se-a { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1); margin: var(--sp-4) 0 0; }
  .se-a .btn { margin-left: calc(var(--sp-3) * -1); }

  /* ---- one lifter's ledger ---- */
  .lg { padding: var(--sp-5) var(--sp-6) var(--sp-6); }
  .lg-h { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3); }
  .lg-h h2 { margin: 0; font: 700 var(--fs-title)/var(--lh-title) var(--font); letter-spacing: var(--ls-title); text-wrap: balance; }
  .lg-p { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-3); margin: var(--sp-1) 0 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .kvs { display: grid; grid-template-columns: 160px minmax(0, 1fr); margin: var(--sp-5) 0 0; }
  .kvs dt, .kvs dd { margin: 0; padding: var(--sp-3) 0; border-top: 1px solid var(--line); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .kvs dt { color: var(--ink-2); }
  .kvs dd { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; text-wrap: pretty; }
  .kvs dd q { quotes: '“' '”'; color: var(--ink); font-weight: 400; }
  .lg-mv { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-5); }
  .lg h3 { margin: var(--sp-7) 0 var(--sp-2); font: 600 var(--fs-head)/var(--lh-head) var(--font); letter-spacing: var(--ls-head); }
  .pays { padding: 0; }
  .pays .lrow { grid-template-columns: 112px 96px minmax(0, 1fr) auto; min-height: 48px; padding: 0 var(--sp-3); cursor: default; }
  .pays .lrow .v { color: var(--ink); font: 600 var(--fs-sub)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; }
  .pays .lrow .m { color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-tight) var(--font); }
  .pays .lrow .short { color: var(--warn); }
  .lg-note { margin: 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; max-width: 62ch; }
  .lg .done-row { margin-top: var(--sp-5); flex-wrap: wrap; }
  .lg .done-row .dw { white-space: normal; }

  /* ---- Everyone: the ledger as tables (To collect, then Paid up), one card ---- */
  .ev { padding: var(--sp-2) var(--sp-3) var(--sp-3); }
  .ev h3 { display: flex; align-items: baseline; gap: var(--sp-2); margin: var(--sp-4) var(--sp-3) var(--sp-1); font: 600 var(--fs-head)/var(--lh-head) var(--font); letter-spacing: var(--ls-head); }
  .ev h3 .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .ev .tbl + h3 { margin-top: var(--sp-6); }
  .ev .tbl td:first-child { color: var(--ink); font-weight: 600; }
  .ev col.c-who { width: 200px; } .ev col.c-pkg { width: 176px; } .ev col.c-amt { width: 104px; } .ev col.c-cad { width: 104px; }
  .ev col.c-due { width: 112px; } .ev col.c-last { width: 104px; }
  @media (max-width: 1280px) { .ev col.c-who { width: 176px; } .ev col.c-pkg { width: 152px; } .ev col.c-amt { width: 96px; } .ev col.c-cad { width: 92px; } .ev col.c-due { width: 100px; } .ev col.c-last { width: 96px; } }
  .ev.is-narrow { max-height: calc(100dvh - var(--cl-top, 160px) - var(--sp-4)); overflow-y: auto; overscroll-behavior: contain;
    -webkit-mask-image: linear-gradient(transparent, var(--ink) var(--sp-3), var(--ink) calc(100% - var(--sp-3)), transparent);
    mask-image: linear-gradient(transparent, var(--ink) var(--sp-3), var(--ink) calc(100% - var(--sp-3)), transparent); }
  .ev.is-narrow col.c-who { width: auto; } .ev.is-narrow col.c-due { width: 72px; } .ev.is-narrow col.c-st { width: 92px; }
  .ev.is-narrow .tbl td, .ev.is-narrow .tbl th { padding: 0 var(--sp-2); }
  .ev .tbl td[data-ellipsis] { overflow: hidden; text-overflow: ellipsis; }

  /* ---- a coach who charges nobody (FTC §10.1): one flat section on the floor, no crimson ---- */
  .free { max-width: 560px; margin: var(--sp-2) var(--sp-1) 0; }
  .free h2 { margin: 0; font: 600 var(--fs-body)/var(--lh-body) var(--font); }
  .free p { margin: var(--sp-1) 0 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; }
  .free .btn { margin-top: var(--sp-5); }

  /* ---- sheets and popovers on this page ---- */
  .fx-sf .fx-set { margin-right: auto; }
  /* the package rows' words start on the labels' edge (Goal); the chosen row's tint reaches 12 px past it (P50) */
  .pko-l { display: flex; flex-direction: column; margin: 0 calc(var(--sp-3) * -1); }
  .pko { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-height: 44px; padding: 0 var(--sp-3); border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; color: var(--ink); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); text-align: left; cursor: pointer; }
  .pko:last-child { border-bottom: 1px solid var(--line); }
  .pko span { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pko b { font-weight: 500; }
  .pko[aria-checked='true'] { border-radius: var(--r-field); background: var(--place-sel); }
  .pko[aria-checked='true'] b { font-weight: 600; }
  .pko[aria-checked='true'], .pko[aria-checked='true'] + .pko { border-top-color: transparent; }
  @media (hover: hover) and (pointer: fine) { .pko:not([aria-checked='true']):hover { border-radius: var(--r-field); background: var(--fill); } }
  .pko:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: var(--r-field); }
  .ap { display: grid; grid-template-columns: 112px minmax(0, 1fr); margin: var(--sp-3) 0 0; }
  .ap dt, .ap dd { margin: 0; padding: var(--sp-2) 0; border-top: 1px solid var(--line); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .ap dt { color: var(--ink-2); }
  .ap dd { color: var(--ink); text-wrap: pretty; }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-3); }
  .ra { margin-top: var(--sp-5); }
  .ra:first-child { margin-top: var(--sp-2); }
  .ra h3 { margin: 0; font: 600 var(--fs-sub)/var(--lh-sub) var(--font); }
  .ra p { margin: 2px 0 var(--sp-2); color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .pop .cmp textarea { width: 100%; margin-top: var(--sp-3); }
  .pop .ef { display: flex; flex-direction: column; gap: var(--sp-1); margin-top: var(--sp-3); color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .pop .ef .input { width: 100%; }
  .pop .ef .seg { align-self: flex-start; }
  .pop .pk-n { color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: var(--sp-1); }
  .pop .err { margin-top: var(--sp-2); }
</style>
</head>
<body data-place="clients">
<div id="page">
  <main class="page" id="main">
    <div class="cv" id="cv">
      <div class="cl" id="cl" data-crop="list"></div>
      <div class="cd" id="cd">
        <div class="lt"><div><h1>Clients</h1><p class="facts" id="facts" data-crop="sentence"></p></div></div>
        <div id="cdb"></div>
      </div>
    </div>
  </main>
</div>
<script src="../kit/data.js"></script>
<script src="../kit/kit.js"></script>
<script src="../kit/coach.js"></script>
<script src="../kit/r6/block.js"></script>
<script src="../kit/r6/store.js"></script>
<script src="../kit/r6/desk.js"></script>
<script src="../kit/r6/fix.js"></script>
<script src="../kit/r6/newcoach.js"></script>
<script>
(function () {
  'use strict';
  var K = window.K, PL = window.PL, DESK = window.DESK, esc = K.esc;
  var $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };
  var fn = function (o, k) { return !!o && typeof o[k] === 'function'; };
  var data = function (r) { return r && !r.error ? r.data : null; };
  var money = K.money;
  var first = function (s) { return String(s || '').split(' ')[0]; };
  var cap1 = function (s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); };
  var day = function (iso) { return iso ? (K.daysTo(iso) === 0 ? 'Today' : K.wd3(iso) + ' ' + K.dm(iso)) : ''; };
  var short = function (iso) { return iso ? K.dm(iso) : ''; };
  /* a stored time as 07:21: a UTC stamp in local time, a local one as written */
  var hm = function (iso) { if (!iso || String(iso).length < 16) return ''; if (/Z$/.test(iso)) { var d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); } return String(iso).slice(11, 16); };
  var nowHm = function () { var n = fn(PL, 'now') ? PL.now() : null; n = n && n.data ? n.data : n; return hm(n); };
  var ICON = { more: DESK.ic('more'), x: DESK.ic('x', 2), check: DESK.ic('check', 2.4) };
  var METHOD = { bank: 'Bank', card: 'Card', paypal: 'PayPal', cash: 'Cash' };
  var EVERY = { monthly: 'Month', '4-weekly': '4 weeks', fortnightly: '2 weeks', weekly: 'Week', quarterly: '3 months', yearly: 'Year', once: 'Once' };
  /* a price in words: "$100 a month", "$600 once" (one table for the ledger and the sheets) */
  var EVERYW = { monthly: ' a month', '4-weekly': ' every 4 weeks', fortnightly: ' every 2 weeks', weekly: ' a week', quarterly: ' a quarter', yearly: ' a year', once: ' once' };
  var everyW = function (c) { return EVERYW[c] || ' a month'; };

  /* ---------------- the store, read once per render ---------------- */
  var SUM = function () { return data(PL.billing.summary()) || { month: { in: 0, late: 0, toCome: 0, total: 0, rows: { in: [], late: [], come: [] } }, seats: {} }; };
  var TODO = function () { return data(PL.billing.todo()) || []; };
  var LED = function (id) { return data(PL.billing.get(id)); };
  var item = function (id) { return id && fn(PL.items, 'get') ? data(PL.items.get(id)) : null; };
  var lifter = function (id) { return K.L(id); };
  var times = {};   /* when the coach acted on a row this visit (the store's clock), for the done row */

  var st = { view: 'todo', sel: null, sort: 'state' };
  function readUrl() {
    var u = DESK.url.get();
    st.view = u.view === 'everyone' ? 'everyone' : 'todo';
    st.sel = u.id || null;
    return u;
  }
  function writeUrl(push) { DESK.url.set({ id: st.sel, view: st.view === 'everyone' ? 'everyone' : null }, push); }

  /* ---------------- the toolbar: To do · Everyone, Add a lifter…, the crimson ---------------- */
  DESK.mount({ place: 'clients', title: 'Clients',
    mid: '<div class="seg" role="group" aria-label="Show" data-show-seg><button type="button" data-view="todo" aria-pressed="true">To do <span class="n" data-count="clientsToDo"></span></button><button type="button" data-view="everyone" aria-pressed="false">Everyone <span class="n" data-count="lifters"></span></button></div>',
    trail: '<div class="cluster" role="group" aria-label="Clients actions"><button class="btn" type="button" data-add aria-haspopup="dialog">Add a lifter…</button>' +
      '<button class="btn" type="button" data-primary data-crimson aria-keyshortcuts="E"></button></div>' });
  DESK.keyMap([['J K', 'Next or previous decision'], ['E', 'Do what the red button says'], ['Enter', 'Open the ledger of the row in hand'], ['⌘↵', 'Send in a sheet'], ['Esc', 'Close the menu, the sheet, then the ledger']]);

  /* ---------------- the facts line: the four answers ---------------- */
  /* the seats in the coach's words (FTC §10.1): "Free, 1 of 3 lifters", "21 of 25 seats", from billing.summary only */
  function seatWords() {
    var se = SUM().seats || {};
    if (se.unlimited) return K.plural(se.used || 0, 'lifter');
    return (se.plan === 'Free' ? 'Free, ' + (se.used || 0) + ' of ' + se.limit + ' lifters' : (se.used || 0) + ' of ' + se.limit + ' seats');
  }
  /* nobody pays this coach yet: no lifter has a package and no application is open (FTC §10.1) */
  function isFree() {
    var rows = data(PL.billing.list({})) || [];
    if (rows.some(function (r) { return !!r.pkg; })) return false;
    return !TODO().some(function (r) { return r.kind === 'app' && !r.done; });
  }
  function paintFacts() {
    if (isFree()) { $('#facts').textContent = seatWords() + ' · Nobody pays you yet'; return; }
    var s = SUM(), td = TODO(), parts = [];

      '<label class="fx-f"><span class="fx-fl">Message to ' + esc(f) + '</span><textarea class="input fx-msg" rows="3" data-f="text">' + esc(draft) + '</textarea></label><p class="fx-err" data-fx-err="sheet" hidden></p></div>' +
      '<div class="fx-sf"><button type="button" class="btn quiet" data-close>Cancel</button><button type="button" class="btn" data-primary data-main>Send and decline</button></div></div>'), box = $('.fx-s', d);
    var go = function () {
      var t = $('[data-f=text]', box).value.trim(); if (!t) { var e0 = $('[data-fx-err=sheet]', box); e0.textContent = 'Write a few words first.'; e0.hidden = false; return; }
      var res = PL.billing.decline(r.id, { text: t }); if (!res || res.error) { var e1 = $('[data-fx-err=sheet]', box); e1.textContent = (res && res.error && res.error.message) || 'That did not go through.'; e1.hidden = false; return; }
      stamp(r.key); d.close(); toastRes(res);
    };
    box.addEventListener('click', function (e) { if (e.target.closest('[data-main]')) go(); });
    d.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); go(); } });
  }
  function openRemindAll() {
    var s = SUM(), ids = s.late || [];
    var items = ids.map(function (id) { var dr = data(PL.billing.remindDraft(id)) || {}, g = LED(id) || {}; return { id: id, name: g.name, line: money(g.amount) + ', ' + (g.status ? g.status.text : ''), text: dr.text || '', when: dr.when || 'now', why: dr.why }; });
    if (!items.length) return;
    var label = items.length === 2 ? 'Remind both' : 'Remind all ' + items.length;
    var d = sheet('remind-all', label, '<div class="fx-s" data-crop="remind-all"><div class="fx-sh"><h2 class="fx-st">' + esc(label) + '</h2><p class="fx-who">' + esc(money(s.month.late) + ' late') + '</p></div><div class="fx-sb">' +
      items.map(function (x, i) {
        return '<div class="ra"><h3>' + esc(x.name) + '</h3><p>' + esc(x.line) + (x.when === 'tomorrow' ? '. Goes tomorrow 08:00: ' + esc(x.why || '') : '. Goes now') + '</p><label class="sr" for="ra-' + i + '">Reminder to ' + esc(first(x.name)) + '</label><textarea class="input fx-msg" id="ra-' + i + '" rows="2" data-i="' + i + '">' + esc(x.text) + '</textarea></div>';
      }).join('') + '<p class="fx-err" data-fx-err="sheet" hidden></p></div>' +
      '<div class="fx-sf"><button type="button" class="btn quiet" data-close>Cancel</button><button type="button" class="btn" data-primary data-main>Send ' + items.length + '</button></div></div>'), box = $('.fx-s', d);
    var go = function () {
      var h = PL.hooks, prev = h ? h.toast : null, toks = [], bad = null;
      if (h) h.toast = function () {};
      try {
        items.forEach(function (x, i) { var t = $('[data-i="' + i + '"]', box).value.trim(); if (!t) { bad = 'Write the reminder to ' + first(x.name) + '.'; return; } var res = PL.billing.remind(x.id, { text: t, when: x.when }); if (res && res.error) bad = res.error.message; else if (res && res.meta) { toks.push(res.meta.undo); var rr = rowFor(x.id); if (rr) stamp(rr.key); } });
      } finally { if (h) h.toast = prev; }
      if (bad && !toks.length) { var e0 = $('[data-fx-err=sheet]', box); e0.textContent = bad; e0.hidden = false; return; }
      d.close();
      DESK.toast(items.map(function (x) { return first(x.name) + (x.when === 'tomorrow' ? ' tomorrow 08:00' : ' now'); }).join(', ').replace(/^/, 'Reminders: ') + '.', function () { var last = null; toks.slice().reverse().forEach(function (t) { last = PL.undo(t); }); return last && !last.error ? { meta: { label: 'Reminders taken back.' } } : last; });
    };
    box.addEventListener('click', function (e) { if (e.target.closest('[data-main]')) go(); });
    d.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); go(); } });
  }

  /* ---------------- popovers: a part of the month, a payment's edit ---------------- */
  function partPop(btn, part) {
    var s = SUM(), m = s.month, rows = (m.rows && m.rows[part]) || [];
    var head = part === 'in' ? money(m.in) + ' in' : part === 'late' ? money(m.late) + ' late' : money(m.toCome) + ' to come';
    var pick = function (x) {
      var l = lifter(x.id) || { name: x.id }, sub = part === 'in' ? K.dm(x.on) + ', ' + (METHOD[x.method] || x.method) : part === 'late' ? K.dm(x.date) + ', ' + K.plural(-K.daysTo(x.date), 'day') + ' late' : day(x.date);
      return '<button class="pick" type="button" data-pick="' + esc(x.id) + '"><span class="pk"><b>' + esc(l.name) + '</b><small>' + esc(sub) + '</small></span><span class="v">' + money(x.amount) + '</span></button>';
    };
    var acts = part === 'late' && rows.length ? '<div class="acts"><button class="btn" type="button" data-remind-all aria-haspopup="dialog">' + (rows.length === 2 ? 'Remind both…' : rows.length === 1 ? 'Remind ' + esc(first((lifter(rows[0].id) || {}).name)) + '…' : 'Remind all ' + rows.length + '…') + '</button></div>' : '';
    var el = DESK.pop.open(btn, '<h3>' + esc(head) + '<span class="pk-n">' + rows.length + '</span></h3><div class="pop-b">' + (rows.length ? rows.map(pick).join('') : '<p class="lede">Nobody here this month.</p>') + '</div>' + acts, { label: head, anchor: btn });
    el.addEventListener('click', function (e) {
      var p = e.target.closest('[data-pick]'); if (p) { DESK.pop.close(); select(p.getAttribute('data-pick'), { push: true }); return; }
      if (e.target.closest('[data-remind-all]')) { if (rows.length === 1) { DESK.pop.close(); var r1 = rowFor(rows[0].id); doAct('remind', r1, btn); } else openRemindAll(); }
    });
  }
  function editPop(btn, id, i) {
    var g = LED(id), p = g && (g.payments || []).filter(function (x) { return x.i === i; })[0]; if (!p) return;
    var f = { amount: p.amount, on: p.on, method: p.method };
    var el = DESK.pop.open(btn, '<h3>Edit the payment</h3><p class="who-l">' + esc(g.name + ', ' + K.dm(p.on)) + '</p>' +
      '<label class="ef"><span>Amount ($)</span><input class="input num" type="number" min="1" step="1" data-e="amount" value="' + esc(String(p.amount)) + '"></label>' +
      '<label class="ef"><span>Date</span><input class="input num" type="date" data-e="on" max="' + esc(K.today) + '" value="' + esc(p.on) + '"></label>' +
      '<div class="ef"><span id="pm-l">Method</span><div class="seg" role="radiogroup" aria-labelledby="pm-l">' + ['bank', 'card', 'paypal', 'cash'].map(function (k) { return '<button type="button" role="radio" data-m="' + k + '" aria-checked="' + (k === f.method) + '" aria-pressed="' + (k === f.method) + '">' + METHOD[k] + '</button>'; }).join('') + '</div></div>' +
      '<p class="err" hidden></p><div class="acts"><button class="btn quiet" type="button" data-pop-close>Cancel</button><button class="btn" type="button" data-save>Save</button></div>', { label: 'Edit the payment', anchor: btn.closest('[data-row]') || btn, focus: '[data-e=amount]' });
    DESK.segSync($('.seg', el));
    var save = function () {
      var a = Number($('[data-e=amount]', el).value), on = $('[data-e=on]', el).value, er = $('.err', el);
      if (!(a > 0)) { er.textContent = 'Write the amount paid, like ' + p.amount + '.'; er.hidden = false; return; }
      var res = PL.billing.editPayment(id, i, { amount: a, on: on || p.on, method: f.method });
      if (res && res.error) { er.textContent = res.error.message; er.hidden = false; return; }
      DESK.pop.close(); toastRes(res);
    };
    el.addEventListener('click', function (e) {
      var m = e.target.closest('[data-m]'); if (m) { f.method = m.getAttribute('data-m'); $$('[data-m]', el).forEach(function (b) { var on = b === m; b.setAttribute('aria-checked', String(on)); b.setAttribute('aria-pressed', String(on)); }); DESK.segSync($('.seg', el), true); return; }
      if (e.target.closest('[data-save]')) save();
      if (e.target.closest('[data-pop-close]')) DESK.pop.close();
    });
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.matches('input')) { e.preventDefault(); save(); } });
  }

  /* ---------------- the CSV, the link ---------------- */
  function exportCsv() {
    var r = PL.billing.exportCsv(), text = r && r.data != null ? r.data : r, name = (r && r.meta && r.meta.filename) || 'payments.csv';
    try {
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      DESK.toast('Saved ' + name + '.');
    } catch (e) { DESK.toast('The file could not be saved here.'); }
  }
  function copy(text) {
    var done = function () { var s = SUM(); DESK.toast('Copied ' + text + (s.seats && !s.seats.unlimited ? '. ' + K.plural(s.seats.free || 0, 'seat') + ' left.' : '.')); };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText('https://' + text).then(done, done); else done(); } catch (e) { done(); }
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target;
    var v = t.closest('[data-view]'); if (v) { st.view = v.getAttribute('data-view'); if (st.view === 'everyone' && st.sel && !lifter(st.sel)) st.sel = null; writeUrl(true); render(); return; }
    if (t.closest('[data-crimson]')) {
      var r = rowByKey(t.closest('[data-crimson]').getAttribute('data-key')), c = crimsonOf(r); if (!c) return;
      /* the row it acts on comes into view first, so a sheet that grows from it has a row to grow from (instant: no animation) */
      var re = rowEl(r.key); if (re) re.scrollIntoView({ block: 'nearest' });
      doAct(c.act, r, t.closest('[data-crimson]')); return;
    }
    if (t.closest('[data-add]')) { addLifter(); return; }
    if (t.closest('[data-charge]')) { openCharge(); return; }
    if (t.closest('[data-export]')) { exportCsv(); return; }
    var cp = t.closest('[data-copy]'); if (cp) { copy(cp.getAttribute('data-copy')); return; }
    if (t.closest('[data-link-cancel]')) { toastRes(PL.billing.inviteCancel()); return; }
    if (t.closest('[data-link-new]')) { toastRes(PL.billing.inviteNew()); return; }
    var pt = t.closest('[data-part]'); if (pt) { if (DESK.pop.justClosed(pt)) return; partPop(pt, pt.getAttribute('data-part')); return; }
    if (t.closest('[data-close-ledger]')) { select(null); return; }
    var srt = t.closest('[data-sort]'); if (srt) { var k = srt.getAttribute('data-sort'); st.sort = st.sort === k ? '-' + k : k; render(); return; }
    var pm = t.closest('[data-pay-more]'); if (pm) {
      if (DESK.pop.justClosed(pm)) return;
      var pid = pm.getAttribute('data-pay-more'), pi = Number(pm.getAttribute('data-i'));
      DESK.menu.open(pm, [{ id: 'edit', label: 'Edit' }, { id: 'remove', label: 'Remove', red: true }], { label: 'This payment', anchor: pm, run: function (mid) {
        if (mid === 'edit') editPop(pm, pid, pi);
        else if (mid === 'remove' && fn(PL.billing, 'removePayment')) toastRes(PL.billing.removePayment(pid, pi));
      } });
      return;
    }
    var ep = t.closest('[data-edit-pay]'); if (ep) { if (DESK.pop.justClosed(ep)) return; editPop(ep, ep.getAttribute('data-edit-pay'), Number(ep.getAttribute('data-i'))); return; }
    var un = t.closest('[data-undo]'); if (un) {
      var res = PL.billing.undo(un.getAttribute('data-undo'));
      if (res && res.error) DESK.toast(res.error.message); else if (res) DESK.toast('Undone: ' + cap1(String((res.meta && res.meta.label) || 'the last move').replace(/^Undone:\s*/, '')));
      return;
    }
    var mo = t.closest('[data-menu]'); if (mo) {
      if (DESK.pop.justClosed(mo)) return;
      var row = mo.closest('[data-row]'), rr = rowByKey(row.getAttribute('data-row'));
      row.classList.add('is-open');
      DESK.menu.open(mo, menuOf(rr), { label: 'Moves for ' + rr.name, anchor: mo, run: function (id) { doAct(id, rowByKey(rr.key), mo); } });
      return;
    }
    var d = t.closest('[data-do]'); if (d) {
      var host = d.closest('[data-row], [data-key]'), key = host ? host.getAttribute('data-row') || host.getAttribute('data-key') : null;
      var r2 = key ? rowByKey(key) : null;
      if (!r2 && d.getAttribute('data-do') === 'package') { openTerms({ mode: 'package', id: d.getAttribute('data-id') || st.sel }); return; }
      doAct(d.getAttribute('data-do'), r2, d); return;
    }
    var op = t.closest('[data-open]'); if (op) { select(op.getAttribute('data-open'), { push: true }); return; }
    var rw = t.closest('#cl [data-row], #cl [data-done-key]'); if (rw && !t.closest('button, a, input, textarea')) {
      var key2 = rw.getAttribute('data-row') || rw.getAttribute('data-done-key'), r3 = rowByKey(key2);
      select(r3 ? (r3.lifterId || r3.id) : key2, { push: true, keepScroll: true });
    }
  });
  document.addEventListener('keydown', function (e) {
    var a = document.activeElement, typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable);
    var layer = DESK.pop.isOpen() || !!document.querySelector('dialog[open]');
    if (e.key === 'Enter' && !typing && !layer && a && a.matches && a.matches('#cl [data-row], #cl [data-done-key]')) { e.preventDefault(); a.click(); return; }
    if ((e.key === 'e' || e.key === 'E') && !e.metaKey && !e.ctrlKey && !e.altKey && !typing && !layer) { var b = $('[data-crimson]'); if (b && !b.hidden) { e.preventDefault(); b.click(); } return; }
  });
  /* Esc: the menu, the sheet and the popover close themselves first; then the ledger */
  addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || e.defaultPrevented) return;
    if (DESK.pop.isOpen() || document.querySelector('dialog[open]')) return;
    var a = document.activeElement; if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
    if (st.sel) { e.preventDefault(); var was = st.sel; select(null); var rw0 = rowFor(was), r = $('#cl [data-row="' + cssEsc(rw0 ? rid(rw0) : was) + '"]'); if (r) r.focus({ preventScroll: true }); }
  }, true);

  addEventListener('hashchange', function () { var u = readUrl(); render(); if (u.invite && !document.querySelector('dialog[data-sheet=invite][open]')) openTerms({ mode: 'invite' }); });
  PL.on('change', function () { render(); });
  /* a row whose menu is open stays the row in hand until the menu closes */
  DESK.on('pop:closed', function () { $$('#cl .lrow.is-open').forEach(function (r) { r.classList.remove('is-open'); }); });
  /* one way in for a lifter (FTC §3.1): the shared add sheet; the old #invite=1 link still opens the invite with a price */
  function addLifter() { if (fn(DESK, 'addLifter')) DESK.addLifter({ from: 'clients' }); else openTerms({ mode: 'invite' }); }
  document.addEventListener('desk:newcoach', function () { render(); });
  DESK.actions([
    { title: 'Add a lifter…', run: addLifter },
    { title: 'Charge a lifter…', run: openCharge },
    { title: 'Remind everyone late…', run: openRemindAll },
    { title: 'Show everyone', run: function () { st.view = 'everyone'; writeUrl(true); render(); } }
  ]);

  /* ---------------- first paint ---------------- */
  var u0 = readUrl();
  render();
  if (u0.invite) openTerms({ mode: 'invite' });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (!scrollY) document.body.style.removeProperty('--cl-top'); fitPane(); });
})();
