<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Meets, POWALIFTA Coach</title>
<script>
/* the theme before any CSS: ?theme= wins, then powa-r6-theme, else dark */
(function () { var t = null; var m = /[?&]theme=(light|dark)\b/.exec(location.search); if (m) t = m[1]; if (!t) { try { t = localStorage.getItem('powa-r6-theme'); } catch (e) { t = null; } } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>
<link rel="stylesheet" href="../kit/r6/tokens.css">
<style>html, body { margin: 0; min-height: 100dvh; background-color: var(--floor); }</style>
<script>
/* lifter-meet.html, one lifter's meet prep in round 4, now lives in Meets (shared.md §7):
     lifter-meet.html?id=<lifter> → meets.html#lifter=<lifter> (Meets opens their next meet)
   The old page's id is a lifter, so it becomes lifter (an id on meets.html is a meet). Every other parameter travels:
   reset, theme, probe and anything unknown stay where they were (query or hash); the Meets parameters go into the hash.
   location.replace leaves no history entry. */
(function () {
  var TARGET = 'meets.html';
  var PAGE = /^(id|lifter|stage|sheet|book|from)$/;
  var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var p = {}, query = new URLSearchParams(), rest = new URLSearchParams();
  q.forEach(function (v, k) { if (PAGE.test(k)) p[k] = v; else query.append(k, v); });
  h.forEach(function (v, k) { if (PAGE.test(k)) p[k] = v; else rest.append(k, v); });
  var hash = new URLSearchParams(), who = p.lifter || p.id;
  if (who) hash.set('lifter', who);
  ['stage', 'sheet', 'book', 'from'].forEach(function (k) { if (p[k] != null) hash.set(k, p[k]); });
  rest.forEach(function (v, k) { hash.append(k, v); });
  var qs = query.toString(), hs = hash.toString();
  location.replace(TARGET + (qs ? '?' + qs : '') + (hs ? '#' + hs : ''));
})();
</script>
</head>
<body>
<noscript><a href="meets.html">Open Meets</a></noscript>
</body>
</html>
