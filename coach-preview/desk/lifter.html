<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lifters, POWALIFTA Coach</title>
<script>
/* the theme before any CSS: ?theme= wins, then powa-r6-theme, else dark */
(function () { var t = null; var m = /[?&]theme=(light|dark)\b/.exec(location.search); if (m) t = m[1]; if (!t) { try { t = localStorage.getItem('powa-r6-theme'); } catch (e) { t = null; } } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>
<link rel="stylesheet" href="../kit/r6/tokens.css">
<style>html, body { margin: 0; min-height: 100dvh; background-color: var(--floor); }</style>
<script>
/* lifter.html, one lifter's page in round 4, now lives beside the list in Lifters (overview-lifters.md §3.2, shared.md §7):
     lifter.html?id=<id>&tab=<tab> → lifters.html#id=<id>&tab=<tab>
     lifter.html                   → lifters.html (Lifters restores the last list and lifter)
   Lifters' parameters (id, tab, f, q, sort, view, from) go into the hash, wherever they were. Every other parameter
   travels where it was: reset, theme, probe and anything unknown. location.replace leaves no history entry. */
(function () {
  var TARGET = 'lifters.html';
  var PAGE = /^(id|tab|f|q|sort|view|from)$/;
  var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var p = {}, query = new URLSearchParams(), rest = new URLSearchParams();
  q.forEach(function (v, k) { if (PAGE.test(k)) p[k] = v; else query.append(k, v); });
  h.forEach(function (v, k) { if (PAGE.test(k)) p[k] = v; else rest.append(k, v); });
  var hash = new URLSearchParams();
  ['id', 'tab', 'f', 'q', 'sort', 'view', 'from'].forEach(function (k) { if (p[k] != null && p[k] !== '') hash.set(k, p[k]); });
  rest.forEach(function (v, k) { hash.append(k, v); });
  var qs = query.toString(), hs = hash.toString();
  location.replace(TARGET + (qs ? '?' + qs : '') + (hs ? '#' + hs : ''));
})();
</script>
</head>
<body>
<noscript><a href="lifters.html">Open Lifters</a></noscript>
</body>
</html>
