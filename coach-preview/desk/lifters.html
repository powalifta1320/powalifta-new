<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifters, POWALIFTA Coach</title>
<script>
/* a phone gets the coach's phone app: this desk is a laptop screen (22 Nov: at 393 px its menu filled the page and the
   rest overlapped). A phone held sideways counts too. ?desk=1 keeps the desk. */
(function () { try { if (window.matchMedia && matchMedia('(max-width: 760px), (pointer: coarse) and (max-height: 520px)').matches && !/[?&]desk=1\b/.test(location.search)) location.replace('/coach.html?demo=1'); } catch (e) {} })();
/* the sidebar's pin before any paint, so a desk kept open does not slide sideways as it loads (desk.js isPinned holds the same rule) */
(function () { try { var v = localStorage.getItem('powa-r6-side'); if (v === 'open' || (v !== 'fold' && window.matchMedia && matchMedia('(hover: none) and (min-width: 1100px)').matches)) document.documentElement.classList.add('side-pinned'); } catch (e) {} })();
/* the theme before any CSS: ?theme= wins, then powa-r6-theme, else dark */
(function () { var t = null; var m = /[?&]theme=(light|dark)\b/.exec(location.search); if (m) t = m[1]; if (!t) { try { t = localStorage.getItem('powa-r6-theme'); } catch (e) { t = null; } } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>
<link rel="stylesheet" href="../kit/r6/tokens.css">
<link rel="stylesheet" href="../kit/r6/glass.css">
<link rel="stylesheet" href="../kit/r6/ui.css">
<link rel="stylesheet" href="../kit/r6/fix.css">
<link rel="stylesheet" href="../kit/r6/week.css">
<link rel="stylesheet" href="../kit/r6/newcoach.css">
<style>
  /* Lifters (overview-lifters.md §6): everyone in a list on the left that never hides by itself, the lifter's page beside
     it. Tokens only; widths in px. The list is a pane of its own (as Programs' list): pinned from the toolbar's foot to
     the window's foot, it scrolls by itself, a hairline on its right edge, on the floor. The detail's content runs 812 px
     at 1440 and 696 at 1280 (the week grid's width), 16 px right of the line. */
  .tb-slot { display: contents; }
  .tb .pos { display: inline-flex; align-items: center; gap: var(--sp-1); }
  .tb .pos-n { min-width: 64px; text-align: center; color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-none) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tb .btn.icon[aria-pressed='true'] { background: var(--fill-2); }

  .ll {
    position: fixed; z-index: var(--z-side); top: calc(var(--inset) + var(--tb-h)); bottom: 0; left: calc(var(--col-l) - var(--sp-6)); width: calc(var(--list-w) + var(--sp-6) * 2);
    display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); background: var(--floor);
  }
  .ll[hidden] { display: none; }
  /* the list head (function-polish PX3): the view's name and count (a menu of views), Add a lifter…, and what the row
     numbers are, right over them; then the search field and Sort, at the same height on every page */
  .ll > .lh[data-list-head] { gap: var(--sp-1); padding: 0 calc(var(--sp-4) + var(--sp-3)); }
  .ll > .lh[data-list-head] h2 { min-width: 0; flex: 0 1 auto; }
  .ll > .lh[data-list-head] .grow { display: none; }
  .ll > .lh[data-list-head] > .btn { margin-left: auto; }
  /* the view button is as tall as its words, so the head's words sit on every list head's line (PC16); its 40 px hit
     area and hover fill are a ::before behind the words */
  .ll-v { position: relative; isolation: isolate; display: inline-flex; align-items: center; gap: var(--sp-2); min-width: 0; height: 24px; margin-left: calc(var(--sp-1) * -1); padding: 0 var(--sp-1); border: 0; border-radius: var(--r-field); background: none; color: inherit; font: inherit; letter-spacing: inherit; cursor: pointer; white-space: nowrap; }
  .ll-v::before { content: ''; position: absolute; z-index: -1; inset: -8px 0; border-radius: var(--r-field); }
  @media (hover: hover) and (pointer: fine) { .ll-v:hover::before { background: var(--hover); } }
  .ll-v .n { color: var(--ink-3); font-weight: 600; font-variant-numeric: tabular-nums; }
  .ll-v .vt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .ll > .lh .btn.quiet { flex: none; padding: 0 var(--sp-1); }
  .ll > .lh .btn .ic { display: none; }
  .lh-k { flex: none; margin-left: var(--sp-1); color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); white-space: nowrap; }
  @media (max-width: 1280px) { .ll > .lh .btn .t { display: none; } .ll > .lh .btn .ic { display: inline-flex; } .ll > .lh .btn .ic svg { width: 20px; height: 20px; } }
  /* a long view name keeps its words: the add button gives up its own (Keep an eye on, Trained since you looked) */
  .ll > .lh.is-long .btn .t { display: none; } .ll > .lh.is-long .btn .ic { display: inline-flex; } .ll > .lh.is-long .btn .ic svg { width: 20px; height: 20px; }
  .ll-h { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-6) var(--sp-2); }
  .ll-h .field { flex: 1; min-width: 0; }
  .ll-h .btn.quiet { flex: none; padding: 0 var(--sp-3); }
  .ll-s {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: var(--sp-2) var(--sp-4) var(--sp-9);
    -webkit-mask-image: linear-gradient(transparent, var(--ink) var(--sp-4), var(--ink) calc(100% - var(--sp-6)), transparent);
    mask-image: linear-gradient(transparent, var(--ink) var(--sp-4), var(--ink) calc(100% - var(--sp-6)), transparent);
  }
  .ll-s::-webkit-scrollbar { display: none; }
  .ll-gh { display: flex; align-items: center; gap: var(--sp-2); min-height: 36px; margin: var(--sp-2) 0 0; padding: 0 var(--sp-3); color: var(--ink-2); font: 600 var(--fs-sub)/var(--lh-sub) var(--font); }
  .ll-gh:first-child { margin-top: 0; }
  .ll-gh .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .ll-fold { width: 100%; border: 0; border-radius: var(--r-row); background: none; text-align: left; cursor: pointer; }
  .ll-fold svg { width: 16px; height: 16px; color: var(--ink-3); transition: transform var(--dur-fast) var(--ease-out); }
  .ll-fold[aria-expanded='true'] svg { transform: rotate(180deg); }
  .ll-caught { margin: 0 0 var(--sp-2); padding: var(--sp-2) var(--sp-3); color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }
  .ll-empty { padding: var(--sp-6) var(--sp-3); color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .ll-empty .btn { margin-top: var(--sp-3); }

  /* a row: the lifter's photo (or their initials) first, the name and the total on line one, the active view's reason
     under it; no ring, no glyph, no dot */
  .lr { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; grid-template-areas: 'g n v' 'g r r'; align-items: center; column-gap: var(--sp-3); row-gap: 3px; min-height: 60px; padding: 10px var(--sp-3); border-radius: var(--r-row); cursor: pointer; outline: 0; user-select: none; }
  .lr.has-total { grid-template-areas: 'g n t' 'g r v'; }
  .lr.one { grid-template-areas: 'g n v'; min-height: 48px; }
  /* who it is, before the name (desk.js DESK.photo): their own photo, or their initials until they add one */
  .lr .ph { grid-area: g; align-self: center; }
  .lr .tv { grid-area: t; justify-self: end; display: inline-flex; align-items: baseline; gap: 3px; color: var(--ink); white-space: nowrap; }
  .lr .tv b { font: 800 17px/var(--lh-tight) var(--font); letter-spacing: -0.01em; }
  .lr .tv i { color: var(--ink-3); font: 500 var(--fs-cap)/1 var(--font); font-style: normal; }
  .lr.has-total .nv { justify-self: end; font: 600 var(--fs-label)/var(--lh-label) var(--font); }
  /* the change is a quiet figure; only a fall takes a colour (the row's one status colour is its reason) */
  .lr.has-total .nv { color: var(--ink-2); }
  .lr.has-total .nv.down { color: var(--warn); }
  .lr.has-total .rs { grid-area: r; }
  .lr + .lr::before { content: ''; position: absolute; top: 0; left: var(--sp-3); right: var(--sp-3); height: 1px; background: var(--line); }
  .lr[aria-selected='true'] { background: var(--place-sel); }
  .lr[aria-selected='true']::before, .lr[aria-selected='true'] + .lr::before { opacity: 0; }
  .lr:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) { .lr:hover:not([aria-selected='true']) { background: var(--hover); } }
  .lr .nm { grid-area: n; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font: 700 var(--fs-body)/var(--lh-tight) var(--font); letter-spacing: -0.005em; }
  .lr .nv { grid-area: v; color: var(--ink-2); font: 600 var(--fs-sub)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lr .rs { grid-area: r; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .lr .rs.pain { color: var(--pain); font-weight: 500; }
  /* the reason wears its kind's colour, one word-colour a row: a meet gold, bodyweight blue, a warning amber, their words green */
  .lr .rs.meet { color: var(--gold); font-weight: 500; }
  .lr .rs.bw { color: var(--bw); font-weight: 500; }
  .lr .rs.warn { color: var(--warn); font-weight: 500; }
  .lr .rs.msg { color: var(--words); font-weight: 500; }
  .lr .rs.wk { color: var(--ink-3); }
  .lr .rs.ses { color: var(--ink); }
  .lr .done-tick { max-width: 100%; }
  .lr .rs .at { margin-left: var(--sp-2); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  /* the tight list keeps the photo, small, in a column of its own before the name */
  .ll.is-compact .lr, .ll.is-compact .lr.has-total { grid-template-columns: 22px auto minmax(0, 1fr) auto; grid-template-areas: 'g n r v'; column-gap: var(--sp-2); min-height: 32px; padding-top: 0; padding-bottom: 0; }
  .ll.is-compact .lr .tv { display: none; }
  .ll.is-compact .lr .ph { --s: 22px !important; }
  .ll.is-compact .lr .nm { font-size: var(--fs-sub); }
  .ll.is-compact .lr .rs { font-size: var(--fs-label); }
  .ll.is-compact .ll-gh { min-height: 24px; margin-top: var(--sp-1); font-size: var(--fs-label); }
  .ll-multi { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; padding: var(--sp-3) var(--sp-6) var(--sp-4); border-top: 1px solid var(--line); }
  .ll-multi b { margin-right: auto; font: 600 var(--fs-sub)/var(--lh-sub) var(--font); font-variant-numeric: tabular-nums; }
  .ll-multi .btn { padding: 0 var(--sp-3); }

  /* the detail */
  .ld { min-width: 0; margin-left: calc(var(--list-w) + var(--sp-6)); margin-right: calc(var(--sp-4) - var(--gutter)); padding-left: var(--sp-4); }
  body.no-list .ld, body.is-table .ld { margin-left: 0; padding-left: 0; margin-right: 0; }
  .ld > * + * { margin-top: var(--sp-6); }
  .pnl > * + * { margin-top: var(--sp-9); }
  .pnl > [data-crop=needs] + [data-crop=attempts], .pnl > .since1 + * { margin-top: var(--sp-7); }
  .lh h1 { margin: 0; font: 700 var(--fs-large)/var(--lh-large) var(--font); letter-spacing: var(--ls-large); text-wrap: balance; outline: 0; }
  .lh .facts { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--sp-3); margin: var(--sp-2) 0 0 calc(var(--sp-2) * -1); }
  .fact { display: inline-flex; align-items: center; height: 40px; padding: 0 var(--sp-2); border: 0; border-radius: var(--r-field); background: none; color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-none) var(--font); cursor: pointer; white-space: nowrap; }
  .fact.flat, .fact.flat:hover { cursor: default; background: none; color: var(--ink-2); }
  .fact.book { color: var(--ink); font-weight: 600; }
  .fact:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) { .fact:not(.flat):hover { background: var(--hover); color: var(--ink); } }
  .lh-t { display: flex; align-items: center; gap: var(--sp-4); }
  .lh-t h1 { min-width: 0; }
  /* the lifter's photo sits before their name, when they have one */
  .lh-t .ph + h1 { margin-left: calc(var(--sp-1) * -1); }
  table.tv td .ph { margin-right: var(--sp-2); }
  .lh-t .rec { margin-left: auto; flex: none; color: var(--ink-2); }
  .lh .tabs { margin-top: var(--sp-4); }
  .ld .tabs { gap: var(--sp-5); }
  .ld .tabs > [role='tab'] { min-height: 40px; }
  .sh { display: flex; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap; margin: 0 0 var(--sp-3); }
  .sh h2 { margin: 0; font: 600 var(--fs-head)/var(--lh-head) var(--font); letter-spacing: var(--ls-head); }
  .sh .sub { color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .sh .grow { flex: 1; }
  .sh .link, .sh .btn { align-self: center; }
  .quiet-t { color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .line2 { color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .warn-t { color: var(--warn); }
  .pain-t { color: var(--pain); }
  .up-t { color: var(--up); }

  /* the numbers on top: the total card and its tiles read as one section */
  .pnl > [data-crop=hero] + [data-crop=tiles] { margin-top: var(--sp-3); }
  .pnl > .tot0 + [data-crop=tiles] { margin-top: var(--sp-4); }
  .tot0 .sh { margin-bottom: var(--sp-1); }

  /* 3. Needs you: flat, under the numbers; the title, what it means, what to do, then the moves as one row of buttons */
  .nd-t { margin: 0; font: 600 var(--fs-head)/var(--lh-head) var(--font); text-wrap: balance; }
  .nd-m { margin: var(--sp-1) 0 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; }
  .nd-r { margin: var(--sp-2) 0 0; color: var(--ink); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }
  .nd-q { margin: var(--sp-2) 0 0; color: var(--ink); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; }
  .nd-q small { display: block; margin-top: 2px; color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .nd-a { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-top: var(--sp-4); }
  [data-crop=needs] .nd-m, [data-crop=needs] .nd-r, [data-crop=needs] .nd-q { max-width: 68ch; }
  [data-crop=needs] .nd-a .nd-b { box-shadow: var(--shadow-field); }
  .nd-o { display: grid; gap: 0; margin-top: var(--sp-5); padding-top: var(--sp-2); border-top: 1px solid var(--line); }
  .nd-o button { display: flex; align-items: center; min-height: 40px; padding: 0 var(--sp-2); margin: 0 calc(var(--sp-2) * -1); border: 0; border-radius: var(--r-field); background: none; color: var(--ink); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-align: left; cursor: pointer; }
  .nd-o button b { margin-right: var(--sp-2); color: var(--ink-2); font-weight: 500; }
  .nd-o button { transition: background-color var(--dur-fast) var(--ease-out); }
  .nd-o button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) { .nd-o button:hover { background: var(--hover); } }
  .nd-done { display: grid; gap: var(--sp-3); margin-top: var(--sp-5); }
  .nd-done h3 { margin: 0; font: 600 var(--fs-sub)/var(--lh-sub) var(--font); color: var(--ink-2); }
  .dn { display: grid; gap: 2px; }
  .dn .done-row { min-height: 40px; }
  .dn .said { margin: 0 0 0 calc(16px + var(--sp-3)); color: var(--ink-2); font: 400 var(--fs-label)/var(--lh-label) var(--font); }
  .done-row .done-tick { max-width: 460px; }

  /* tables: flat, one value per cell, hairlines */
  .tw { width: 100%; }
  .tbl td { color: var(--ink); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .tbl td.n, .tbl th.n { font-variant-numeric: tabular-nums; }
  .tbl tbody tr > td { border-top: 1px solid var(--line); }
  .cellb { display: inline-flex; align-items: center; max-width: 100%; min-height: 36px; margin: 0 calc(var(--sp-2) * -1); padding: 0 var(--sp-2); border: 0; border-radius: var(--r-field); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; white-space: nowrap; }
  @media (hover: hover) and (pointer: fine) { .cellb:hover { background: var(--hover); } }
  .cellb.warn-t { color: var(--warn); }
  .cellin { width: 100%; height: 36px; padding: 0 var(--sp-2); border: 0; border-radius: var(--r-field); background: var(--fill); box-shadow: var(--shadow-field); color: var(--ink); font: 500 var(--fs-sub)/var(--lh-none) var(--font); font-variant-numeric: tabular-nums; }
  .cellin:focus { outline: 2px solid var(--focus); outline-offset: 0; }
  .cell-err { display: block; margin-top: 2px; color: var(--warn); font: 500 var(--fs-label)/var(--lh-label) var(--font); white-space: normal; }
  .sub2 { display: block; margin-top: 2px; color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub2.warn-t { color: var(--warn); }

  /* 3. This week */
  .wk td, .wk th { padding: 0 var(--sp-2); }
  .wk .after-n, .att .after-n { padding-left: var(--sp-7); }
  .wk tbody td { height: 44px; vertical-align: middle; }
  .wk td.ex .bo { padding-left: var(--sp-4); color: var(--ink-2); }
  .wk tr.day td { height: 48px; padding-top: var(--sp-2); }
  .dayl { display: flex; align-items: center; gap: var(--sp-4); min-height: 40px; flex-wrap: wrap; }
  .dayl b { font: 600 var(--fs-sub)/var(--lh-sub) var(--font); }
  .dayl .nm2 { color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }
  .dayl .st { color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .dayl .st.warn-t { color: var(--warn); }
  .dayl .grow { flex: 1; }
  .dayl .btn { padding: 0 var(--sp-3); }
  .wk tr.note td { height: auto; padding: var(--sp-1) var(--sp-2) var(--sp-3); box-shadow: none; }
  .wk tr.note .input { width: 100%; }
  .wk tr.ruleln td { height: auto; padding: 0 var(--sp-2) var(--sp-2); box-shadow: none; }
  .ruleb { display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-2); min-height: 40px; flex-wrap: wrap; }
  .ruleb .quiet-t { margin-right: auto; }
  .ruleb .btn { padding: 0 var(--sp-3); }
  .follow { display: block; margin-top: 2px; color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); white-space: nowrap; }

  /* 2. Attempts */
  .att td, .att th { padding: 0 var(--sp-2); }
  .att tbody td { height: 48px; }
  .att .cellb { font-weight: 600; font-variant-numeric: tabular-nums; }
  .att-f { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-top: var(--sp-3); }
  .att-f .grow { flex: 1; }

  /* 4. Total and lifts (the picture card) and 5. the tiles card */
  .tot { padding: var(--sp-6); }
  .hero-top { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: var(--sp-6); align-items: center; }
  .hero-k { margin: 0; font: 600 var(--fs-body)/var(--lh-body) var(--font); }
  .hero-v { margin: var(--sp-2) 0 0; font: 800 var(--fs-hero)/var(--lh-hero) var(--font); font-stretch: 112%; letter-spacing: var(--ls-hero); font-variant-numeric: tabular-nums; white-space: nowrap; }   /* the unit never drops under its number */
  .hero-v .unit { color: var(--ink-2); }
  .hero-c { margin: var(--sp-2) 0 0; font: 500 var(--fs-sub)/var(--lh-sub) var(--font); color: var(--ink-2); }
  .hero-c.up-t { color: var(--up); }
  .hero-line { min-width: 0; overflow: hidden; }
  .lifts3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-4); margin-top: var(--sp-5); padding-top: var(--sp-5); border-top: 1px solid var(--line); }
  .lift3 { display: grid; gap: var(--sp-2); align-content: start; min-width: 0; }
  .lift3 > button { display: grid; gap: 4px; justify-items: start; min-width: 0; margin: calc(var(--sp-2) * -1); padding: var(--sp-2); border: 0; border-radius: var(--r-row); background: none; color: var(--ink); text-align: left; font: inherit; cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { .lift3 > button:hover { background: var(--hover); } }
  .lift3 .k { font: 600 var(--fs-sub)/var(--lh-sub) var(--font); }
  .lift3 .v { font: 800 var(--fs-num)/var(--lh-num) var(--font); font-stretch: 112%; letter-spacing: var(--ls-num); font-variant-numeric: tabular-nums; }
  .lift3 .v .unit { color: var(--ink-2); }
