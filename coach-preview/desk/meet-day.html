<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Meets, POWALIFTA Coach</title>
<script>
/* the theme before any CSS: ?theme= wins, then powa-r6-theme, else dark */
(function () { var t = null; var m = /[?&]theme=(light|dark)\b/.exec(location.search); if (m) t = m[1]; if (!t) { try { t = localStorage.getItem('powa-r6-theme'); } catch (e) { t = null; } } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>
<link rel="stylesheet" href="../kit/r6/tokens.css">
<style>html, body { margin: 0; min-height: 100dvh; background-color: var(--floor); }</style>
<script>
/* meet-day.html, the round-4 meet day, now lives in Meets (shared.md §7):
     → meets.html#id=<id or today's meet>&stage=<s>
   Stage map: weighin, weigh-in, scale → weigh; squats → squat; benches → bench; deadlifts → deadlift; final, results →
   done; unknown or none → weigh. Every other parameter travels: reset, theme, probe and anything unknown stay where they
   were (query or hash); the Meets parameters go into the hash. With no id, today's meet comes from the store
   (PL.meets.list(), days 0), loaded only for that. location.replace leaves no history entry. */
(function () {
  var TARGET = 'meets.html';
  var PAGE = /^(id|lifter|stage|sheet|book|from)$/;
  var STAGE = { weigh: 'weigh', weighin: 'weigh', 'weigh-in': 'weigh', scale: 'weigh', squat: 'squat', squats: 'squat',
    bench: 'bench', benches: 'bench', deadlift: 'deadlift', deadlifts: 'deadlift', done: 'done', final: 'done', results: 'done' };
  var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var p = {}, query = new URLSearchParams(), rest = new URLSearchParams();
  q.forEach(function (v, k) { if (PAGE.test(k)) p[k] = v; else query.append(k, v); });
  h.forEach(function (v, k) { if (PAGE.test(k)) p[k] = v; else rest.append(k, v); });
  p.stage = STAGE[String(p.stage || '').trim().toLowerCase()] || 'weigh';
  var gone = false;
  function go(todayId) {
    if (gone) return; gone = true;
    var hash = new URLSearchParams(), id = p.id || todayId;
    if (id) hash.set('id', id);
    hash.set('stage', p.stage);
    ['lifter', 'sheet', 'book', 'from'].forEach(function (k) { if (p[k] != null) hash.set(k, p[k]); });
    rest.forEach(function (v, k) { hash.append(k, v); });
    var qs = query.toString();
    location.replace(TARGET + (qs ? '?' + qs : '') + '#' + hash.toString());
  }
  if (p.id) { go(null); return; }
  /* today's meet, from the store (data.js, kit.js, coach.js, store.js in the order every page loads them) */
  function today() {
    try { var r = window.PL && window.PL.meets && window.PL.meets.list ? window.PL.meets.list() : null; var m = r && r.data ? r.data.filter(function (x) { return x.days === 0; })[0] : null; return m ? m.id : null; }
    catch (e) { return null; }
  }
  var files = ['../kit/data.js', '../kit/kit.js', '../kit/coach.js', '../kit/r6/store.js'];
  files.forEach(function (src, i) {
    var s = document.createElement('script'); s.src = src; s.async = false;
    if (i === files.length - 1) s.onload = function () { go(today()); };
    s.onerror = function () { go(null); };
    document.head.appendChild(s);
  });
  setTimeout(function () { go(today()); }, 1500);
})();
</script>
</head>
<body>
<noscript><a href="meets.html">Open Meets</a></noscript>
</body>
</html>
