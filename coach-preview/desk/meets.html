<script>

(function () { var t = null; var m = /[?&]theme=(light|dark)\b/.exec(location.search); if (m) t = m[1]; if (!t) { try { t = localStorage.getItem('powa-r6-theme'); } catch (e) { t = null; } } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();

<style>
  /* Meets (screens.md §5, professional.md §10.7): the meets list on the left that never hides, beside the overview, a
     lifter's prep or the day's board. Two cards a screen at most (the picture and the work); everything else flat on the
     floor under an 18/600 title with hairline rows. The crimson lives at the end of the toolbar on every view, so a
     popover never covers it. Tokens only. */
  .tb-slot { display: contents; }
  .tb .pos { display: inline-flex; align-items: center; gap: var(--sp-1); }
  .tb .pos-n { min-width: 64px; padding: 0 var(--sp-2); text-align: center; color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-none) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---- the list column: pinned from the toolbar's foot to the window's foot, as on Lifters and Programs ---- */
  .ml {
    position: fixed; z-index: var(--z-side); top: calc(var(--inset) + var(--tb-h)); bottom: 0; left: calc(var(--col-l) - var(--sp-6)); width: calc(var(--list-w) + var(--sp-6) * 2);
    display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); background: var(--floor);
  }
  /* the one list head (function-polish PX3, DESK.listHead): at the column's top, its words on the rows' words */
  .ml > .lh[data-list-head] { flex: none; padding-left: calc(var(--sp-4) + var(--sp-3)); padding-right: var(--sp-5); }
  .ml-s {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: var(--sp-2) var(--sp-4) var(--sp-9);
    -webkit-mask-image: linear-gradient(transparent, var(--ink) var(--sp-4), var(--ink) calc(100% - var(--sp-6)), transparent);
    mask-image: linear-gradient(transparent, var(--ink) var(--sp-4), var(--ink) calc(100% - var(--sp-6)), transparent);
  }
  .ml-s::-webkit-scrollbar { display: none; }
  .ml-gh { display: flex; align-items: center; gap: var(--sp-2); min-height: 36px; margin: var(--sp-3) 0 0; padding: 0 var(--sp-3); color: var(--ink-2); font: 600 var(--fs-sub)/var(--lh-sub) var(--font); }
  .ml-gh:first-child { margin-top: 0; }
  .ml-gh .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .ml-empty { padding: var(--sp-6) var(--sp-3); color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .mr { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); grid-template-areas: 'd n' 'd w'; align-items: baseline; column-gap: var(--sp-2); row-gap: 2px; min-height: 64px; padding: var(--sp-3) var(--sp-3); border-radius: var(--r-row); cursor: pointer; outline: 0; user-select: none; align-content: center; }
  .mr + .mr::before { content: ''; position: absolute; top: 0; left: var(--sp-3); right: var(--sp-3); height: 1px; background: var(--line); }
  .mr[aria-selected='true'] { background: var(--place-sel); }   /* the chosen meet wears the place's tint (Meets: gold) */
  .mr[aria-selected='true']::before, .mr[aria-selected='true'] + .mr::before { opacity: 0; }
  .mr:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) { .mr:not([aria-selected='true']):hover { background: var(--hover); } .mr:hover::before, .mr:hover + .mr::before { opacity: 0; } }
  .mr .d { grid-area: d; color: var(--ink-2); font: 600 var(--fs-sub)/var(--lh-sub) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mr .d.is-today { color: var(--gold); }
  .mr .nm { grid-area: n; min-width: 0; color: var(--ink); font: 600 var(--fs-body)/var(--lh-sub) var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mr .w { grid-area: w; min-width: 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mr .w.tone-warn { color: var(--warn); }

  /* ---- the detail: 812 px at 1440, 696 at 1280, 16 px right of the list's line ---- */
  .md { min-width: 0; margin-left: calc(var(--list-w) + var(--sp-6)); margin-right: calc(var(--sp-4) - var(--gutter)); padding-left: var(--sp-4); }
  .md > * + * { margin-top: var(--sp-6); }
  .md-fade { position: fixed; z-index: var(--z-edge); top: calc(var(--inset) + var(--tb-h)); left: calc(var(--col-l) + var(--list-w) + var(--sp-6)); right: 0; height: var(--sp-5); pointer-events: none; background: linear-gradient(var(--floor), transparent); opacity: 0; }
  body.is-scrolled .md-fade { opacity: 1; }
  .hd { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-5); min-height: 64px; }
  .hd h1 { margin: 0; font: 700 var(--fs-large)/var(--lh-large) var(--font); letter-spacing: var(--ls-large); text-wrap: balance; outline: 0; }
  .hd .facts { margin: var(--sp-2) 0 0; color: var(--ink-2); font: 400 var(--fs-body)/var(--lh-body) var(--font); font-variant-numeric: tabular-nums; }
  .hd .facts .tw { font-weight: 500; }
  .hd .hd-r { display: flex; align-items: center; gap: var(--sp-3); flex: none; }
  .sec-t { display: flex; align-items: baseline; gap: var(--sp-2); margin: 0 0 var(--sp-3); font: 600 var(--fs-head)/var(--lh-head) var(--font); letter-spacing: var(--ls-head); }
  .sec-t .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .sec-t .sub { margin-left: var(--sp-2); color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-tight) var(--font); letter-spacing: 0; }
  .sec-t .grow { flex: 1; }
  .line { margin: 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; }
  .line b { color: var(--ink); font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; }
  .err-l { margin: var(--sp-2) 0 0; color: var(--pain); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .tabs.lt-tabs { margin-bottom: var(--sp-5); }

  /* ---- overview: the Today card (the picture) and Everyone with a meet (the work) ---- */
  .today { padding: var(--sp-6) var(--sp-6) var(--sp-5); }
  .today h2 { margin: 0; font: 700 var(--fs-title)/var(--lh-title) var(--font); letter-spacing: var(--ls-title); }
  .today .sub { margin: var(--sp-1) 0 0; color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }
  .today .rows { margin: var(--sp-4) calc(var(--sp-3) * -1) 0; }
  .trow { position: relative; display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; align-items: center; column-gap: var(--sp-4); min-height: 56px; padding: var(--sp-2) var(--sp-3); }
  .trow + .trow::before { content: ''; position: absolute; top: 0; left: var(--sp-3); right: var(--sp-3); height: 1px; background: var(--line); }
  .trow .nm { color: var(--ink); font: 600 var(--fs-body)/var(--lh-sub) var(--font); }
  .trow .why { min-width: 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .trow .why.tone-pain { color: var(--pain); font-weight: 500; }
  .trow .why.tone-q { color: var(--ink-3); }
  .trow .act { display: flex; justify-content: flex-end; min-width: 0; }
  .trow > .done-row { grid-column: 2 / -1; }
  .tl8 { position: relative; height: 52px; margin-top: var(--sp-4); padding-top: var(--sp-4); border-top: 1px solid var(--line); }
  .tl8 > .tl { height: 52px; }
  .ev { padding: var(--sp-2) var(--sp-2) var(--sp-3); }
  .ev .tbl col.c-l { width: 18%; } .ev .tbl col.c-m { width: 19%; } .ev .tbl col.c-w { width: 12%; } .ev .tbl col.c-wt { width: 12%; } .ev .tbl col.c-a { width: 11%; } .ev .tbl col.c-r { width: 28%; }
  .ev .tbl td, .ev .tbl th { padding: 0 var(--sp-2); }
  .ev .tbl td { overflow: hidden; text-overflow: ellipsis; }
  .ev .tbl td .q { color: var(--ink-3); }
  .ev .tbl td .mv { max-width: 100%; }
  .ev .tbl td .mv > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .tbl a.who { color: var(--ink); font: 600 var(--fs-sub)/var(--lh-tight) var(--font); text-decoration: none; }
  @media (hover: hover) and (pointer: fine) { .ev .tbl a.who:hover { text-decoration: underline; text-underline-offset: 3px; } }

  /* ---- a lifter's prep ---- */
  .att { padding: var(--sp-5) var(--sp-6) var(--sp-5); }
  .att-h { display: flex; align-items: center; gap: var(--sp-3); min-height: 40px; }
  .att-h h2 { margin: 0; font: 600 var(--fs-head)/var(--lh-head) var(--font); letter-spacing: var(--ls-head); }
  .att-h .st { color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-tight) var(--font); }
  .att-h .grow { flex: 1; }
  .att-h .yours { color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-tight) var(--font); }
  .ag { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 124px); align-items: center; margin-top: var(--sp-3); }
  .ag .ch { padding: 0 0 var(--sp-2); color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-tight) var(--font); text-align: center; }
  .ag .rh, .ag .cell { min-height: 76px; border-top: 1px solid var(--line); }
  .ag .rh { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; padding-right: var(--sp-3); }
  .ag .rh b { color: var(--ink); font: 600 var(--fs-body)/var(--lh-tight) var(--font); }
  .ag .rh span { min-width: 0; color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag .cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .ag .cell input { width: 100px; height: 36px; padding: 0; border: 0; border-radius: var(--r-field); background: transparent; box-shadow: var(--shadow-field); color: var(--ink); font: 800 var(--fs-title)/var(--lh-none) var(--font); font-stretch: var(--num-stretch); font-variant-numeric: tabular-nums; text-align: center; outline: 0; transition: background-color var(--dur-fast) var(--ease-out); }
  .ag .cell input:focus { background: var(--fill); outline: 2px solid var(--focus); outline-offset: 0; }
  .ag .cell input::placeholder { color: var(--ink-4); font-weight: 500; font-size: var(--fs-sub); }
  .ag .cell input.is-error { outline: 1.5px solid var(--pain); outline-offset: -1.5px; }
  /* each lift's name and its three attempts wear the lift's colour (ui.css [data-lift]) */
  .ag .rh b[data-lift], .ag .cell[data-lift] input { color: var(--lc-ink); }
  /* an attempt the store guessed from the intake reads quieter until the coach types or steps it (F7.4) */
  .ag .cell[data-lift] input[data-guess] { color: var(--ink-2); }
  .att .basis { margin: var(--sp-2) 0 0; color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .att-h .mv { margin-left: calc(var(--sp-2) * -1); }
  .ag .cell .sh { color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; }
  .ag .cell .pm { position: absolute; top: 50%; translate: 0 -60%; width: 28px; height: 28px; padding: 0; border: 0; border-radius: var(--r-pill); background: var(--btn-2); color: var(--ink); font: 600 var(--fs-sub)/var(--lh-none) var(--font); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity var(--dur-fast) var(--ease-out); }
  .ag .cell .pm::after { content: ''; position: absolute; inset: -6px; }
  .ag .cell .pm.l { left: 0; } .ag .cell .pm.r { right: 0; }
  .ag .cell:focus-within .pm { opacity: 1; pointer-events: auto; }
  .tot { display: flex; align-items: center; gap: var(--sp-4); min-height: 56px; margin-top: var(--sp-1); border-top: 1px solid var(--line); }
  .tot .t { color: var(--ink); font: 600 var(--fs-sub)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; }
  .tot .t.acc { color: var(--place-ink); }
  .tot .grow { flex: 1; }
  .tot label { display: inline-flex; align-items: center; gap: var(--sp-2); color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-tight) var(--font); }
  .tot .input { width: 96px; text-align: right; }
  .tot .tgt { color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-tight) var(--font); white-space: nowrap; }
  .warns { margin-top: var(--sp-2); border-top: 1px solid var(--line); padding-top: var(--sp-3); }
  .warns p { margin: 0 0 var(--sp-2); color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; }
  .warns p b { color: var(--warn); font-weight: 600; }
  .chg { display: flex; align-items: center; gap: var(--sp-3); min-height: 48px; border-top: 1px solid var(--line); color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-tight) var(--font); }
  .chg .input { width: 84px; }
  .flat .moves { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3); }
  .bwc { margin-top: var(--sp-3); }
  .bwc svg { display: block; overflow: visible; }
  .bwc .grid { stroke: var(--line); stroke-width: 1; }
  .bwc .cl { stroke: var(--line-2); stroke-width: 1; }
  .bwc .ln { fill: none; stroke: var(--bw); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
  .bwc .pt { fill: var(--bw); stroke: var(--floor); stroke-width: 2; }
  .bwc .plan { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .bwc .lab { fill: var(--ink-3); font: 500 var(--fs-cap) var(--font); }
  .rin { margin-top: var(--sp-3); }
  .rin svg { display: block; overflow: visible; }
  .rin .ax { stroke: var(--line-2); stroke-width: 2; stroke-linecap: round; }
  .rin .win { fill: var(--fill-2); }
  .rin .wk { stroke: var(--line-2); stroke-width: 1; }
  .rin .lab { fill: var(--ink-3); font: 500 var(--fs-cap) var(--font); }
  .rin .meet { fill: var(--gold); }
  .mk { margin: var(--sp-3) 0 0; padding: 0; list-style: none; }
  .mk li.r { grid-template-columns: 176px minmax(0, 1fr) auto; }
  .mk li.r .d { color: var(--ink); font: 400 var(--fs-sub)/var(--lh-label) var(--font); font-variant-numeric: tabular-nums; }
  .mk .r { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: var(--sp-4); min-height: 44px; }
  .mk .r + .r::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--line); }
  .mk .r b { color: var(--ink); font: 600 var(--fs-sub)/var(--lh-label) var(--font); }
  .mk .r span { color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-label) var(--font); font-variant-numeric: tabular-nums; }
  .mk .r em { font-style: normal; color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-tight) var(--font); white-space: nowrap; }
  .ready { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--sp-5); row-gap: var(--sp-2); margin-top: var(--sp-2); }
  .ready .tick { margin-top: 0; min-height: 40px; }
  .ready .rk { display: inline-flex; align-items: center; gap: var(--sp-2); color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-tight) var(--font); }
  .ready .rk .input { width: 48px; padding: 0 var(--sp-2); text-align: center; }
  .ready.rk-row { column-gap: var(--sp-4); margin-top: var(--sp-3); }
  .ready .rk-l { color: var(--ink); font: 600 var(--fs-sub)/var(--lh-tight) var(--font); }
  .note-f { display: flex; align-items: center; gap: var(--sp-3); margin-top: var(--sp-3); color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-tight) var(--font); }
  .note-f .input { flex: 1; min-width: 0; }

  /* ---- the board ---- */
  .up { padding: var(--sp-5) var(--sp-6) var(--sp-5); }
  .up .lbl { margin: 0; color: var(--ink-3); font: 600 var(--fs-label)/var(--lh-tight) var(--font); }
  .up h2 { margin: var(--sp-2) 0 0; font: 700 var(--fs-title)/var(--lh-title) var(--font); letter-spacing: var(--ls-title); text-wrap: balance; }
  .up .line { margin-top: var(--sp-1); }
  .up ol { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-5); margin: var(--sp-4) 0 0; padding: 0; list-style: none; }
  .up li { display: inline-flex; align-items: center; gap: var(--sp-2); }
  .up li .k { min-width: 12px; color: var(--ink-3); font: 600 var(--fs-label)/var(--lh-none) var(--font); font-variant-numeric: tabular-nums; text-align: right; }
  .up li .mv { margin-left: 0; }
  .up li .done-w { color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-tight) var(--font); }
  .up .another { display: inline-flex; align-items: center; gap: var(--sp-1); }
  .up .another .input { width: 84px; text-align: center; }
  .plat { display: flex; align-items: center; gap: var(--sp-3); min-height: 48px; color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-tight) var(--font); }
  .plat b { color: var(--ink); font-weight: 600; }
  .plat .input { width: 64px; text-align: center; font-weight: 700; }
  .plat .grow { flex: 1; }
  .wu .r { position: relative; display: grid; grid-template-columns: 112px 104px minmax(0, 1fr) auto; align-items: center; column-gap: var(--sp-3); min-height: 48px; padding: 0 var(--sp-1); }
  .wu .r + .r::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--line); }
  .wu .r .nmb { justify-self: start; height: 36px; margin-left: calc(var(--sp-2) * -1); padding: 0 var(--sp-2); border: 0; border-radius: var(--r-field); background: none; color: var(--ink); font: 600 var(--fs-sub)/var(--lh-none) var(--font); cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { .wu .r .nmb:hover { background: var(--fill); } }
  .wu .r .kg { color: var(--ink); font: 600 var(--fs-sub)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wu .r .kg[data-lift], .pp .rl .r .kg[data-lift] { color: var(--lc-ink); }
  .wu .r .wh { min-width: 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wu .r .wh.tone-warn { color: var(--warn); font-weight: 500; }
  .wu .r .tick { margin: 0; }
  .wu .none { color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .wi .tbl col.c-l { width: 88px; } .wi .tbl col.c-s { width: 96px; } .wi .tbl col.c-res { width: 136px; } .wi .tbl col.c-r { width: 196px; } .wi .tbl col.c-o { width: 132px; }
  .wi .tbl td, .wi .tbl th { padding: 0 var(--sp-2); }
  .wi .tbl td { height: 64px; }
  .wi .tbl td .nm { color: var(--ink); font: 600 var(--fs-sub)/var(--lh-tight) var(--font); }
  .wi .tbl td .rs { display: block; white-space: normal; text-wrap: pretty; }
  .wi .tbl td .rs.tone-warn { color: var(--warn); font-weight: 500; }
  .wi .tbl td .rs.tone-up { color: var(--up); font-weight: 500; }
  .wi .tbl td .rs.q { color: var(--ink-3); }
  .wi .tbl input.input { width: 100%; max-width: 84px; text-align: center; }
  .wi .tbl .rk { display: flex; gap: var(--sp-1); }
  .wi .tbl .rk .input { width: 60px; padding: 0; text-align: center; }
  .wi .tbl .rk .input::placeholder { color: var(--ink-4); }
  .wi .tbl td.op { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .wi .tbl td .hi { color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-tight) var(--font); white-space: normal; }
  .bd { padding: var(--sp-2) var(--sp-3) var(--sp-3); }
  .bd .tbl { table-layout: fixed; }

    var h = DESK.url.get();
    S.id = h.id || null; S.lifter = h.lifter || null;
    if (!S.id && S.lifter) { var lm = lifterMeet(S.lifter); if (lm) S.id = lm.id; }
    if (S.id && !meetRow(S.id)) S.id = null;
    if (h.stage && S.id && view() === 'board') {
      var b = boardOf(S.id), want = h.stage === 'weighin' || h.stage === 'weigh-in' ? 'weigh' : h.stage;
      if (b && b.stage !== want && STAGES.some(function (s) { return s[0] === want; })) quiet(function () { return PL.meets.stage(S.id, want); });
    }
    return h;
  }
  function openSheets(h) {
    if (h.sheet === 'cut') { var id = h.lifter || prepLifter(); if (id) cutSheet(id); }
    else if (h.book || h.sheet === 'book') { var bid = h.book || null; var h2 = DESK.url.get(); delete h2.book; if (h2.sheet === 'book') delete h2.sheet; DESK.url.set(h2); if (fn(DESK, 'bookMeet')) DESK.bookMeet(bid); }
  }
  var h0 = readHash();
  PL.on('change', schedule);
  addEventListener('hashchange', function () { var h = readHash(); paint(); openSheets(h); });
  paint();
  syncUrl(false);
  openSheets(h0);

  DESK.states({
    board: function () { var tm = todayMeet(); if (tm) go({ id: tm.id }); },
    prep: function () { go({ id: 'state-championships', lifter: 'demo-d4' }); }
  });
})();
