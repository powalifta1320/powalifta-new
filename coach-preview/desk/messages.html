<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages, POWALIFTA Coach</title>
<script>
/* a phone gets the coach's phone app: this desk is a laptop screen (22 Nov: at 393 px its menu filled the page and the
   rest overlapped). A phone held sideways counts too. ?desk=1 keeps the desk. */
(function () { try { if (window.matchMedia && matchMedia('(max-width: 760px), (pointer: coarse) and (max-height: 520px)').matches && !/[?&]desk=1\b/.test(location.search)) location.replace('/coach.html?demo=1'); } catch (e) {} })();
/* the sidebar's pin before any paint, so a desk kept open does not slide sideways as it loads (desk.js isPinned holds the same rule) */
(function () { try { var v = localStorage.getItem('powa-r6-side'); if (v === 'open' || (v !== 'fold' && window.matchMedia && matchMedia('(hover: none) and (min-width: 1100px)').matches)) document.documentElement.classList.add('side-pinned'); } catch (e) {} })();
/* the theme before any CSS: ?theme= wins, then powa-r6-theme, else dark */
(function () { var t = null; var m = /[?&]theme=(light|dark)\b/.exec(location.search); if (m) t = m[1]; if (!t) { try { t = localStorage.getItem('powa-r6-theme'); } catch (e) { t = null; } } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>
<link rel="stylesheet" href="../kit/r6/tokens.css">
<link rel="stylesheet" href="../kit/r6/glass.css">
<link rel="stylesheet" href="../kit/r6/ui.css">
<link rel="stylesheet" href="../kit/r6/fix.css">
<link rel="stylesheet" href="../kit/r6/newcoach.css">
<style>
  /* Messages (screens.md §6, professional.md §10.8): the threads | the thread | the facts. The window never scrolls: the
     list pane, the thread's words and the facts' body each scroll on their own between fades. The thread is the one card
     (the work), the composer its foot under a hairline; the facts are the flush inspector pane. Tokens only. */
  body[data-place='messages'] { --inspector-w: 340px; --mgap: var(--sp-6); overflow: hidden; }
  @media (max-width: 1280px) { body[data-place='messages'] { --inspector-w: 300px; --mgap: var(--sp-4); } }

  /* ---------- the list column: search, then the groups; it never hides ---------- */
  .ml {
    position: fixed; z-index: var(--z-edge); top: var(--edge-h); bottom: 0; left: calc(var(--col-l) - var(--mgap)); width: calc(var(--list-w) + var(--mgap) * 2);
    display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); background: var(--floor);
  }
  /* the list head right under the toolbar band, the search 12 px under it (PX3: the same y as every list) */
  .ml > .lh { flex: none; padding: 0 var(--mgap); }
  .ml-h { padding: var(--sp-3) var(--mgap) var(--sp-2); }
  .ml-h .field { width: 100%; }
  .ml-s {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: var(--sp-2) calc(var(--mgap) - var(--sp-3)) var(--sp-9);
    -webkit-mask-image: linear-gradient(transparent, var(--ink) var(--sp-4), var(--ink) calc(100% - var(--sp-6)), transparent);
    mask-image: linear-gradient(transparent, var(--ink) var(--sp-4), var(--ink) calc(100% - var(--sp-6)), transparent);
  }
  .ml-s::-webkit-scrollbar { display: none; }
  .ml-g + .ml-g { margin-top: var(--sp-3); }
  .ml-gh { display: flex; align-items: center; gap: var(--sp-2); min-height: 40px; margin: 0; padding: 0 var(--sp-3); color: var(--ink-2); font: 600 var(--fs-sub)/var(--lh-sub) var(--font); }
  .ml-gh .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  button.ml-gh { width: 100%; border: 0; border-radius: var(--r-row); background: none; text-align: left; cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out); }
  button.ml-gh .grow { flex: 1; }
  button.ml-gh .w { color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  @media (hover: hover) and (pointer: fine) { button.ml-gh:hover { background: var(--hover); } }
  .ml-empty { margin: 0; padding: var(--sp-2) var(--sp-3); color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .ml-none { padding: var(--sp-5) var(--sp-3); color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .ml-none .btn { margin-top: var(--sp-3); }

  /* a thread row, one shape for all (owner 16 Nov): the name and when on line 1; one line of their words and the one
     status on line 2, the status always in the right-hand slot under the time. The row in hand as Lifters' row in hand. */
  .mr {
    position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'n w' 't s'; align-items: baseline; align-content: center;
    column-gap: var(--sp-3); row-gap: 2px; min-height: 52px; padding: var(--sp-2) var(--sp-3); border-radius: var(--r-row); cursor: pointer; outline: 0; user-select: none;
    transition: background-color var(--dur-fast) var(--ease-out);
  }
  .mr + .mr::before { content: ''; position: absolute; top: 0; left: var(--sp-3); right: var(--sp-3); height: 1px; background: var(--line); }
  .mr[aria-current='true'] { background: var(--place-sel); }
  .mr[aria-current='true']::before, .mr[aria-current='true'] + .mr::before { opacity: 0; }
  .mr:has(.nm:focus-visible) { outline: 2px solid var(--focus); outline-offset: -2px; }
  .mr .nm:focus-visible { outline: 0; }
  .mr .nm { text-decoration: none; }
  @media (hover: hover) and (pointer: fine) { .mr:not([aria-current='true']):hover { background: var(--hover); } .mr:hover::before, .mr:hover + .mr::before { opacity: 0; } }
  .mr .nm { grid-area: n; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font: 600 var(--fs-body)/var(--lh-tight) var(--font); }
  .mr .wh { grid-area: w; justify-self: end; color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mr .ln { grid-area: t; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .mr .st { grid-area: s; justify-self: end; color: var(--ink-2); font: 600 var(--fs-label)/var(--lh-sub) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* an empty slot still holds its line, so a row with no time or no status is as tall as the rest */
  .mr .wh:empty::before, .mr .st:empty::before { content: '\200b'; }
  .mr .st.pain { color: var(--pain); }
  .mr .st.dl { color: var(--warn); }
  .mr .st.new { color: var(--words); }
  /* on the chosen row's tint the green falls under 4.5:1 in light: the count reads in ink there */
  .mr[aria-current='true'] .st.new { color: var(--ink); }
  .mr .ln .done-tick { max-width: 100%; vertical-align: bottom; font: inherit; }
  /* Undo reads as the other statuses do, in the same slot; its hit area grows past the text, not the row */
  .mr .undo { position: relative; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; }
  .mr .undo::after { content: ''; position: absolute; inset: -10px -8px; }
  .mr .undo:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-mark); }
  @media (hover: hover) and (pointer: fine) { .mr .undo:hover { text-decoration: underline; text-underline-offset: 3px; } }

  /* ---------- the thread: the work card, fixed between the list and the facts ---------- */
  .th {
    position: fixed; top: var(--edge-h); bottom: var(--sp-4); left: calc(var(--col-l) + var(--list-w) + var(--mgap) * 2); right: calc(var(--inspector-w) + var(--mgap));
    display: flex; flex-direction: column; min-width: 0; overflow: clip;
  }
  .th-h { flex: none; padding: var(--sp-5) var(--sp-6) var(--sp-3); border-bottom: 1px solid var(--line); }
  .th-h h1 { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 var(--fs-title)/var(--lh-title) var(--font); letter-spacing: var(--ls-title); }
  .th-h .facts { margin: var(--sp-1) 0 0; color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .th-h .links { display: flex; gap: var(--sp-5); margin-top: var(--sp-1); }
  .th-m {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: var(--sp-4) var(--sp-6) var(--sp-5);
    -webkit-mask-image: linear-gradient(transparent, var(--ink) var(--sp-4), var(--ink) calc(100% - var(--sp-4)), transparent);
    mask-image: linear-gradient(transparent, var(--ink) var(--sp-4), var(--ink) calc(100% - var(--sp-4)), transparent);
  }
  /* the words sit at the foot, just above the draft, as in any chat (owner 16 Nov: "looks very messy", the empty middle):
     a column whose first item takes the spare room above it; a long thread still scrolls from its top */
  .th-m { display: flex; flex-direction: column; }
  .th-m > * { flex: none; }
  .th-m > :first-child, .th-m > .dv:first-child { margin-top: auto; }
  .th-empty { margin: var(--sp-6) 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-align: center; }
  .dv { display: flex; align-items: center; justify-content: center; gap: var(--sp-3); margin: var(--sp-4) 0 0; color: var(--ink-3); font: 600 var(--fs-cap)/var(--lh-cap) var(--font); }
  .dv.new { color: var(--words); }
  .dv.new::before, .dv.new::after { content: ''; flex: 1; height: 1px; background: var(--words); }
  /* a message: theirs on the left, yours on the right; a card (a change, a check-in, attempts) a hairline box, no fill */
  .mg { display: flex; flex-direction: column; align-items: flex-start; max-width: 86%; margin-top: var(--sp-2); }
  .mg.me { align-items: flex-end; margin-left: auto; }
  .mg .bubble { max-width: 100%; overflow-wrap: anywhere; }
  .mg .bubble .k { display: block; margin-bottom: 2px; color: var(--ink-3); font: 600 var(--fs-cap)/var(--lh-cap) var(--font); }
  .mg .bubble mark, .mc mark { border-radius: var(--r-mark); background: var(--fill-3); color: inherit; }
  .mt { display: flex; align-items: center; gap: var(--sp-2); min-height: 24px; margin-top: 2px; color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; }
  .mt .btn.icon { --h: var(--ctl-s); }
  .mc { width: 100%; padding: var(--sp-3) var(--sp-4); border: 1px solid var(--line-2); border-radius: var(--r-pop); color: var(--ink); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; }
  .mc .k { display: block; margin-bottom: 2px; color: var(--ink-3); font: 600 var(--fs-cap)/var(--lh-cap) var(--font); }
  .mc .link { margin-top: var(--sp-1); }
  .mc .a3 { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); column-gap: var(--sp-4); row-gap: 2px; margin-top: var(--sp-1); font-variant-numeric: tabular-nums; }
  .mc .a3 span:nth-child(4n+1):not([data-lift]) { color: var(--ink-2); }
  .mg.wide { max-width: 100%; width: 100%; }
  /* a check-in is their message (left), a change card and the attempts yours (right): as wide as their words, not the pane */
  .mg:not(.wide) > .mc { width: auto; max-width: 100%; }
  .voice { display: flex; align-items: center; gap: var(--sp-3); }
  .voice .btn.icon { --h: var(--ctl-s); flex: none; }
  .voice .vt { min-width: 0; }
  .voice .vt b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .voice .vt q { display: block; color: var(--ink-2); quotes: '“' '”'; }
  .vid { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: var(--sp-3); align-items: center; }
  .vid svg { display: block; width: 128px; height: 72px; }
  .vid .vt { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1); min-width: 0; }
  .vid .vt small { color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .ed { width: 100%; }
  .ed textarea { width: 100%; }
  .ed .row { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-2); }

  /* ---------- the composer: the card's foot, one hairline above, no box of its own ---------- */
  .cmp { flex: none; padding: var(--sp-3) var(--sp-6) var(--sp-4); border-top: 1px solid var(--line); }
  .cmp-t {
    display: block; width: 100%; min-height: 48px; max-height: calc(var(--lh-sub) * var(--fs-sub) * 12 + var(--sp-4)); margin: 0; padding: var(--sp-3);
    border: 0; border-radius: var(--r-field); outline: 0; background: var(--fill); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); font: 400 var(--fs-sub)/var(--lh-sub) var(--font);   /* a field you can see (20 Nov): on the bare card the desk's own draft read as a message already sent */
    resize: none; field-sizing: content; overflow-y: auto;
  }
  .cmp-t:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .cmp-w { margin: var(--sp-1) 0 0; color: var(--warn); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .ride { margin-top: var(--sp-2); }
  .ride > .tick, .cmp > .tick, .ride .tick { margin-top: var(--sp-2); }
  .ride > .tick:first-child { margin-top: 0; }
  .rl { display: grid; gap: 2px; margin: var(--sp-1) 0 0; padding: 0 0 0 26px; list-style: none; }
  .rl li { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: var(--sp-2); color: var(--ink); font: 500 var(--fs-label)/var(--lh-label) var(--font); font-variant-numeric: tabular-nums; }
  .rl .w:not([data-lift]), .rl .was { color: var(--ink-2); }
  .rl b { font-weight: 600; }
  .rl .ed-n { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--sp-2); border: 0; border-radius: var(--r-mark); background: var(--fill-2); color: var(--ink); font: 600 var(--fs-label)/var(--lh-none) var(--font); font-variant-numeric: tabular-nums; cursor: pointer; }
  .rl input.input { width: 84px; height: 28px; }
  .rl .err { flex-basis: 100%; margin: 0; }
  .rl .link { padding: 0; }
  .rn { margin: var(--sp-1) 0 0 26px; color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .att { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--sp-3); margin-top: var(--sp-2); color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .att b { color: var(--ink); font-weight: 600; }
  .cmp-f { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-3); }
  .cmp-f .grow { flex: 1; min-width: 0; }
  .cmp-f .btn.quiet { padding: 0 var(--sp-3); }
  /* the first quiet move's words start on the draft's edge, as the ticks above it do */
  .cmp-f > .btn.quiet:first-child { margin-left: calc(var(--sp-3) * -1); }
  .cmp-f [data-primary] { max-width: 100%; }
  .cmp-f [data-primary] span { overflow: hidden; text-overflow: ellipsis; }
  /* a narrow thread (1280 with the sidebar pinned, about 360 px): the quiet moves say less so Send keeps its place */
  .cmp { container-type: inline-size; }
  .cmp-f .xs { display: none; }
  @container (max-width: 480px) { .cmp-f .xl { display: none; } .cmp-f .xs { display: inline; } .cmp-f [data-primary] { min-width: 0; } .sg-f kbd { display: none; } }
  .cmp-r { display: flex; margin-top: var(--sp-2); }
  .cmp-r .tick { margin: 0; }

  /* ---------- the suggestion (23 Nov, owner: "share this but also allow me to text smth completely seperate"): the
     message box is an ordinary one, always empty and yours; what the desk would send sits above it in one hairline card
     with its own moves. Use this puts it in the box, Send as is sends it, Not now folds it to one line ---------- */
  .sg { margin: 0 0 var(--sp-3); padding: var(--sp-3) var(--sp-4); border: 1px solid var(--line-2); border-radius: var(--r-pop); }
  .sg-h { display: flex; align-items: baseline; gap: var(--sp-2); min-width: 0; }
  .sg-k { flex: none; color: var(--ink-3); font: 600 var(--fs-cap)/var(--lh-cap) var(--font); }
  .sg-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font: 600 var(--fs-sub)/var(--lh-sub) var(--font); }
  .sg-q { margin: var(--sp-1) 0 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .sg-q.none { color: var(--ink-3); }
  .sg .rl { padding-left: 0; margin-top: var(--sp-2); }
  .sg .rn { margin-left: 0; }
  .sg-f { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-top: var(--sp-3); }
  .sg-f .grow { flex: 1; }
  .sg-f kbd, .chg-h kbd { margin-left: var(--sp-2); color: var(--ink-3); font: 600 var(--fs-cap)/1 var(--font); }
  /* folded (Not now): one line, the whole line is the way back, worded as the list's Answered fold */
  button.sg-fold { display: flex; align-items: center; gap: var(--sp-2); width: 100%; min-height: 40px; margin: 0 0 var(--sp-2); padding: 0 var(--sp-4); border: 1px solid var(--line); border-radius: var(--r-pop); background: none; color: var(--ink-2); text-align: left; font: 500 var(--fs-label)/var(--lh-label) var(--font); cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out); }
  button.sg-fold .sg-t { flex: 1; color: var(--ink-2); font-weight: 500; font-size: var(--fs-label); }
  button.sg-fold .w { flex: none; color: var(--ink-3); }
  button.sg-fold:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { button.sg-fold:hover { background: var(--hover); } }
  /* in the box: the change that goes with the words, as a chip you can take off (and put back) */
  .chg-h { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); }
  .chg-h .grow { flex: 1; }
  .chg-h .src { color: var(--ink-3); font: 600 var(--fs-cap)/var(--lh-cap) var(--font); }
  .chg { display: inline-flex; align-items: center; gap: var(--sp-1); height: 32px; max-width: 100%; padding: 0 var(--sp-3); border: 1px dashed var(--line-2); border-radius: var(--r-pill); background: none; color: var(--ink-2); font: 600 var(--fs-label)/var(--lh-none) var(--font); cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out); }
  .chg > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chg.on { padding-right: var(--sp-1); border: 0; background: var(--fill); color: var(--ink); cursor: default; }
  .chg.on .btn.icon { --h: 24px; flex: none; }
  button.chg:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { button.chg:hover { background: var(--fill); } }
  .cmp .ride .rl { padding-left: 0; }
  .cmp .ride { margin: 0 0 var(--sp-3); }
  .cmp .ride .rn { margin-left: 0; }
  @media (prefers-reduced-motion: reduce) { button.sg-fold, .chg { transition: none; } }

  /* ---------- the facts pane (the flush inspector) ---------- */
  /* its first line sits on the thread's name and the list's head (one top line across the three columns), not up in the
     empty toolbar band */
  body[data-place='messages'] .insp-h { padding-top: calc(var(--edge-h) + var(--sp-5)); }
  .fq { min-width: 0; padding-bottom: var(--sp-2); }
  .fq h2 { margin: 0; font: 600 var(--fs-head)/var(--lh-head) var(--font); letter-spacing: var(--ls-head); text-wrap: balance; }
  .fq .q { margin: var(--sp-2) 0 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; }
  .fq .q time { color: var(--ink-3); font-size: var(--fs-label); white-space: nowrap; }
  .fq .m { margin: var(--sp-2) 0 0; color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); text-wrap: pretty; }
  /* the decision's answers: one style, stacked; the one in the draft carries a tick, never a fill of its own (owner 16 Nov:
     "three move buttons in two styles") */
  .moves.ans:has(> .mv) { flex-direction: column; align-items: stretch; gap: 0; }
  .ans > .mv { gap: var(--sp-2); width: 100%; min-width: 0; text-align: left; }
  .ans > .mv .ck { display: grid; place-items: center; flex: none; width: 18px; height: 18px; color: transparent; }
  .ans > .mv .ck svg { width: 14px; height: 14px; }
  .ans > .mv[aria-pressed='true'] .ck { color: var(--ink); }
  .ans > .mv .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .insp .ig:first-child { margin-top: var(--sp-2); }
  /* the numbers in one row: each e1RM in its lift's colour, then the total */
  .nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--sp-3); }
  .nums > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .nums .k { color: var(--ink-3); font: 500 var(--fs-cap)/var(--lh-cap) var(--font); white-space: nowrap; }
  .nums .v { color: var(--ink); font: 600 var(--fs-body)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .nums .v[data-lift] { color: var(--lc-ink); }
  /* the meet in one line, its move at the line's end */
  .meet1 { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-width: 0; }
