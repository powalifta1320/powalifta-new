<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview, POWALIFTA Coach</title>
<script>
/* the theme before any CSS: ?theme= wins, then powa-r6-theme, else dark */
(function () { var t = null; var m = /[?&]theme=(light|dark)\b/.exec(location.search); if (m) t = m[1]; if (!t) { try { t = localStorage.getItem('powa-r6-theme'); } catch (e) { t = null; } } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>
<link rel="stylesheet" href="../kit/r6/tokens.css">
<link rel="stylesheet" href="../kit/r6/glass.css">
<link rel="stylesheet" href="../kit/r6/ui.css">
<link rel="stylesheet" href="../kit/r6/fix.css">

<style>
  /* the Overview (overview-lifters.md §5, professional.md §10.2): the charts card, then Needs you (the work card) beside a
     side column of two flat sections, Today and Messages. Two cards on the screen, nothing else raised. Tokens only. */
  body { --side-col: 340px; }
  @media (max-width: 1280px) { body { --side-col: 312px; } }
  .charts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: var(--sp-2); }
  .ch-f .said { display: block; margin-top: var(--sp-1); }
  .mid { display: grid; grid-template-columns: minmax(0, 1fr) var(--side-col); gap: var(--sp-7); align-items: start; margin-top: var(--sp-7); }
  .col { display: flex; flex-direction: column; gap: var(--sp-7); min-width: 0; }
  .sec { min-width: 0; }
  .sec-h .sub [data-count] { font-variant-numeric: tabular-nums; }
  /* the page's key count (how many need you) wears the Overview's warm colour */
  .sec-h h2 .n.acc { color: var(--place-ink); }

  /* Needs you reads as a sheet (owner, 16 Nov): four columns under one header line, every row built the same way.
     Lifter (the name, the reason under it) | Context (left-aligned, one width, quiet) | Next step (the fix, the same quiet
     text button on every row, its words on one vertical line) | a fixed slot for ⋯ (empty where a row has no more moves).
     A done row is the name over the shared done row. */
  .mid { --rh: 52px; }
  .need { --ctx-w: 168px; --fix-w: 220px; --more-w: 32px; }
  .need .lrow, .need .nhd { grid-template-columns: minmax(0, 1fr) var(--ctx-w) var(--fix-w) var(--more-w); column-gap: var(--sp-4); }
  /* a laptop window: the context takes two lines before a reason is cut */
  @media (max-width: 1280px) { .need { --ctx-w: 112px; --fix-w: 196px; } .need .lrow, .need .nhd { column-gap: var(--sp-3); } }
  /* the header line: column names in ink-3, sentence case, on a hairline as between rows. It is one row tall, so the rows
     under it keep the side column's rhythm (every hairline level across the page) */
  .need .nhd { position: relative; display: grid; align-items: end; min-height: calc(var(--rh) + var(--sp-1)); padding: 0 var(--sp-4) var(--sp-2); margin: 0 var(--sp-2); color: var(--ink-3); font: 500 var(--fs-cap)/var(--lh-cap) var(--font); }
  .need .nhd::after { content: ''; position: absolute; left: var(--sp-4); right: var(--sp-4); bottom: 0; height: 1px; background: var(--line); }
  .need .nhd[hidden] { display: none; }
  /* 52 px rows (the Lifters list's two-line row) */
  .need .list { padding-top: var(--sp-1); padding-bottom: var(--sp-1); }
  .need .nhd:not([hidden]) + .list { padding-top: 0; }
  .need .lrow { min-height: var(--rh); padding-top: 5px; padding-bottom: 5px; }
  .need .lrow .nm { line-height: var(--lh-tight); }
  .need .lrow .why { line-height: var(--lh-tight); }
  .need .lrow.c2 { grid-template-columns: minmax(0, 1fr); }
  .need .nm { text-decoration: none; }
  /* the context: left-aligned in its own column, quiet, never cut (it wraps to a second line on a narrow window) */
  .need .lrow .ctx { min-width: 0; text-align: left; white-space: normal; line-height: var(--lh-tight); text-wrap: pretty; }
  .need .act { display: contents; }
  /* the fix: the quiet text kind on every row, its words on the column's line (the button's padding hangs into the gap).
     It never turns into a filled pill on one row: the row in hand shows by its own fill, a hovered fix by the quiet fill. */
  .need .lrow .fix { justify-self: start; min-width: 0; max-width: calc(100% + 14px); margin-left: -14px; }
  .need .lrow .fix span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .need .lrow.is-sel .fix, .need .lrow:focus-within .fix { background: transparent; box-shadow: none; }
  @media (hover: hover) and (pointer: fine) {
    .need .lrow:hover .fix { background: transparent; box-shadow: none; }
    .need .lrow .fix:hover:not(:disabled) { background-color: var(--fill); }
  }
  .need .more, .need .more-slot { justify-self: end; width: var(--more-w); }
  /* a done row keeps the row's 64 px: the name over one line of done words, its Undo 24 px to see and 40 px to hit */
  .need .done-row { line-height: var(--lh-tight); }
  .need .done-row .btn.sm { --h: 20px; }
  /* the card's foot lines: words in ink-3 on hairlines, the way on (a link) at the right */
  .nf { display: flex; align-items: center; gap: var(--sp-3); min-height: 40px; padding: 0 var(--sp-6); border-top: 1px solid var(--line); color: var(--ink-3); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .nf .w { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nf .w b { color: var(--ink-2); font-weight: 500; }
  .nf .link { margin-left: auto; flex: none; }
  .need .empty { margin: 0; padding: var(--sp-5) var(--sp-4); color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .need .empty .btn { margin-top: var(--sp-3); }

  /* Today and Messages: flat sections on the floor, rows on hairlines, built as the Needs you rows (the name over one line
     of words, 52 px) and on their rhythm: the first row starts level with the first Needs you row, and one row's height
     between the two sections puts every Messages hairline level with a Needs you hairline. The right end of a row's first
     line holds its action or its time; the ⋯ (the meet's only) sits after it. */
  .col { gap: var(--rh); }
  .flat .list { padding: var(--sp-1) 0 0; }
  .flat .sec-h { margin-left: 0; margin-right: 0; }
  .flat .lrow, .flat .lrow.two { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'n a' 'w w'; align-items: center; row-gap: 2px; min-height: var(--rh); padding-top: 5px; padding-bottom: 5px; }
  .flat .lrow > .nm { grid-area: n; line-height: var(--lh-tight); }
  .flat .lrow > .why { grid-area: w; line-height: var(--lh-tight); }
  .flat .lrow > .acts, .flat .lrow > .when { grid-area: a; }
  .flat .lrow.two .why .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-line-clamp: none; line-clamp: none; }
  .flat .lrow .when { font-size: var(--fs-label); line-height: var(--lh-tight); }
  .flat .lrow.two > .nm, .flat .lrow.two > .when { align-self: baseline; }
  /* the action sits in the name's line: the 32 px button hangs into the row's padding, so every row stays 52 px; its words
     end on the column's right edge, as the times do */
  .lrow.duo > .acts { display: flex; align-items: center; gap: var(--sp-1); margin: -8px 0; }
  .lrow.duo .act-t { padding: 0 14px; color: var(--ink); font: 600 var(--fs-label)/var(--lh-tight) var(--font); white-space: nowrap; }
  .lrow.duo .more-slot { flex: none; width: var(--ctl-s); }
  .flat .empty { min-height: var(--rh); display: flex; align-items: center; }
  button.lrow { width: 100%; border: 0; background-color: transparent; color: inherit; font: inherit; text-align: left; }
  a.lrow { color: inherit; text-decoration: none; }
  .flat .empty { margin: 0; padding: var(--sp-3) 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .sfoot { display: flex; align-items: center; min-height: 48px; padding: 0; border-top: 1px solid var(--line); }

  /* a desk under 4 lifters (first-time-coach §5): Getting started, then Your lifters in the charts' place */
  .first-col { display: grid; gap: var(--sp-7); align-items: start; }
  .first-col > [hidden] { display: none; }
  /* both on screen: Getting started over the Needs you column, Your lifters over Today and Messages (one grid with .mid) */
  .first-col.duo { grid-template-columns: minmax(0, 1fr) var(--side-col); }
  .first-col.duo > .look-around { grid-column: 1 / -1; }
  /* in the columns (a small desk): one step of space under Getting started, as between the side column's sections */
  .sec.need > #setup:not([hidden]) { margin-bottom: var(--sp-7); }
  /* a done step's words read in ink, as every done row on the desk (one line, never a grey sentence in a row) */
  #setup .is-done .done-tick span { color: var(--ink); }
  /* flat (beside Your lifters): the words start under the heading, as every flat section's do (PX2) */
  #setup:not(.card) { max-width: none; }
  #setup:not(.card) .nc-set-h { min-height: var(--ctl-h); padding: 0 var(--sp-1); margin-bottom: var(--sp-1); }
  #setup:not(.card) .nc-steps { margin-inline: calc(var(--sp-1) - var(--sp-6)); padding-top: 0; }
  .look-around { margin: 0; color: var(--ink-3); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .nf .w.none { color: var(--ink-3); }

  /* popovers on this page: a title with its count, people as rows, one quiet way on at the foot */
  .pop h3 .n { color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: var(--sp-1); }
  .pop .pk-h { margin: var(--sp-4) 0 var(--sp-1); font: 600 var(--fs-sub)/var(--lh-tight) var(--font); }
  .pop .pk-h .n { color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: var(--sp-1); }
  .pop .ppl { margin-top: var(--sp-3); }
  .pop a.pick { text-decoration: none; }
  .pop .pop-f { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); padding-top: var(--sp-3); border-top: 1px solid var(--line); }
  .pop .inv { margin: var(--sp-3) 0 0; font: 600 var(--fs-sub)/var(--lh-sub) var(--font); font-variant-numeric: tabular-nums; user-select: all; }
  .pop .seats { margin: var(--sp-1) 0 0; color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .pop .compose { display: block; width: 100%; margin-top: var(--sp-3); }
</style>
</head>
<body data-place="overview">
<div id="page">
  <main class="page" id="main">
    <div class="lt"><div><h1>Overview</h1><p class="facts" id="facts"></p></div></div>
    <div class="first-col" id="first" hidden>
      <div id="setup" hidden></div>
      <p class="look-around" id="look" hidden>Want to look around first? <a class="link" data-demo href="overview.html?fresh=0">Open the example desk</a></p>
      <div id="small" hidden></div>
    </div>
    <div class="card charts" id="charts" data-crop="charts" role="group" aria-label="This week across your lifters"></div>
    <div class="mid" id="mid">
      <div class="sec need" aria-labelledby="need-h">
        <div class="sec-h" id="need-hd"><h2 id="need-h">Needs you <span class="n acc" data-count="needYou"></span></h2><span class="grow"></span><span class="sub" id="need-sum"><span data-count="doneToday"></span> done today</span></div>
        <div class="card" data-crop="needs"><div class="nhd" id="need-cols" aria-hidden="true"><span>Lifter</span><span>Context</span><span>Next step</span><span></span></div><div class="list" id="need" data-list aria-label="Needs you"></div><div id="need-f"></div></div>
      </div>
      <div class="col">
        <div class="sec flat" data-crop="today" aria-labelledby="today-h">
          <div class="sec-h"><h2 class="sec-t" id="today-h">Today</h2></div>
          <div class="list" id="today" data-list aria-label="Today"></div>
        </div>
        <div class="sec flat" data-crop="messages" aria-labelledby="msgs-h">
          <div class="sec-h"><h2 class="sec-t" id="msgs-h">Messages</h2><span class="grow"></span><span class="sub" id="msgs-sub"><span data-count="waitingThreads"></span> waiting</span></div>
          <div class="list" id="msgs" data-list aria-label="Waiting for a reply"></div>
          <div class="sfoot"><a class="link" href="messages.html">Open messages</a></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../kit/data.js"></script>
<script src="../kit/kit.js"></script>
<script src="../kit/coach.js"></script>
<script src="../kit/r6/block.js"></script>
<script src="../kit/r6/store.js"></script>
<script src="../kit/r6/charts.js"></script>
<script src="../kit/r6/desk.js"></script>
<script src="../kit/r6/fix.js"></script>
<script src="../kit/r6/newcoach.js"></script>
<script>
(function () {
  'use strict';
  var K = window.K, PL = window.PL, DESK = window.DESK, CH = window.CHARTS, esc = K.esc, n = K.n;
  var $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };
  var fn = function (o, k) { return !!o && typeof o[k] === 'function'; };
  var data = function (r) { return r && !r.error ? r.data : null; };
  var LIFTS = ['squat', 'bench', 'deadlift'];
  var L = function (id) { return K.L(id); };
  var firstOf = function (id) { var l = L(id); return l ? l.first : id; };
  /* "Ines, Tomas, Leo and 2 more": up to three first names, then how many more */
  var names = function (ids, max) { max = max || 3; var f = ids.map(firstOf); return f.length <= max ? f.join(', ') : f.slice(0, max).join(', ') + ' and ' + (f.length - max) + ' more'; };
  var minus = function (v, d) { var x = Math.abs(v), s = d ? x.toFixed(d) : n(x); return (v > 0 ? '+' : v < 0 ? '−' : '') + s; };
  var hm = function (iso) { return iso ? String(iso).slice(11, 16) : ''; };
  var counts = function () { return PL.counts().data; };
  var LIFTERS = DESK.routes.lifters, MESSAGES = DESK.routes.messages;
  var DEMO_FRESH = !!(window.DEMO && window.DEMO.fresh);
  var lifterHref = function (id, f) { return LIFTERS + '#id=' + encodeURIComponent(id) + (f ? '&f=' + f : ''); };
  var words = function (s) { return String(s || '').trim().split(/\s+/).filter(Boolean).length; };
  /* the desk's day is the demo clock's (PL.now moves on when the demo skips to a lifter's session), never a fixed date */
  var dayNow = function () { var t = fn(PL, 'now') ? String(PL.now() || '') : ''; return /^\d{4}-\d{2}-\d{2}/.test(t) ? t.slice(0, 10) : K.today; };
  var localDay = function (iso) { if (!iso) return ''; var x = String(iso); if (!/Z$/.test(x)) return x.slice(0, 10); var d = new Date(x); return isNaN(d) ? x.slice(0, 10) : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  /* Needs you is today's: a row done on an earlier day has left it (its Undo with it) */
  var needsNow = function () { var td = dayNow(); return PL.roster.needs().data.filter(function (x) { return !(x.done && x.done.at && localDay(x.done.at) < td); }); };

  /* ---------------- the toolbar: Add a lifter… (quiet), then the crimson ---------------- */
  DESK.mount({ place: 'overview', title: 'Overview',
    trail: '<div class="cluster" role="group" aria-label="Overview actions" id="tb-acts"></div>' });
  /* the lifters on the desk who are not invited-and-unjoined (first-time-coach §5): 0, 1 to 3, or 4 and more */
  var rosterN = function (c) { c = c || counts(); return Math.max(0, (c.lifters || 0) - (c.invited || 0)); };
  var size = function (c) { c = c || counts(); var k = rosterN(c); return k >= 4 ? 'full' : k === 0 && !(c.invited || 0) ? 'empty' : 'small'; };
  var setupOf = function () { return fn(PL.setup, 'get') ? data(PL.setup.get()) : null; };
  /* the next Getting started step, while the card is shown and not done (§4.2 rule 1) */
  function setupStep() {
    var s = setupOf(); if (!s || !s.show || s.done >= s.of || !s.next) return null;
    return s.steps.filter(function (x) { return x.key === s.next; })[0] || null;
  }
  DESK.keyMap([['↑ ↓', 'Move between Needs you rows'], ['Enter', 'Open in Lifters'], ['E', 'Do what the red button says'], ['⌘↵', 'Apply the open fix'], ['Esc', 'Close the fix or the popover']]);

  /* ---------------- the title row and the crimson, in this order of truth (§5.2) ---------------- */
  /* Keep an eye on: the store's list, and the ones not handled today (function-polish F10.1: the line counts open ones) */
  function watchList() { var r = PL.lifters.list({ f: 'watch' }); return r && r.data ? r : { data: [], meta: { total: 0 } }; }
  function handled(x) { if (!x) return false; if (x.handled || x.group === 'done') return true; var t = fn(PL.lifters, 'today') ? data(PL.lifters.today(x.id)) : null; return !!(t && t.length); }
  function watchOpen() { return watchList().data.filter(function (x) { return !handled(x); }); }
  /* the plan in words: "Free, 0 of 3 lifters" (the sidebar's coach line says the same) */
  function planWords() {
    var bs = fn(PL.billing, 'summary') ? data(PL.billing.summary()) : null, st = bs && bs.seats; if (!st) return '';
    if (st.unlimited) return st.plan;
    return st.plan + ', ' + st.used + ' of ' + st.limit + (st.planId === 'free' || st.plan === 'Free' ? ' lifters' : ' seats');
  }
  /* the crimson, in this order of truth (first-time-coach §4.2): the next setup step; who needs you; a small desk's new
     sessions; who to keep an eye on (4 or more lifters); the weeks due; all caught up */
  function crimsonOf() {
    var c = counts(), k = rosterN(c), st = setupStep(), open = watchOpen().length;
    var one = c.needYou === 1 && k <= 3 ? needsNow().filter(function (x) { return !x.done && x.fix && x.fix.go && x.fix.label; })[0] : null;
    if (st && st.act && !(st.key === 'week1' && c.needYou)) return { label: st.act.label, step: st.key };
    if (one) return { label: one.fix.label, href: (DESK.routes[one.fix.go.place] || one.fix.go.place + '.html') + '#' + one.fix.go.hash + '&from=overview' };
    if (c.needYou) return { label: 'Go through the ' + c.needYou + ' who need' + (c.needYou === 1 ? 's' : '') + ' you', href: LIFTERS + '#f=need' };
    if (k >= 1 && k <= 3 && c.trainedSince) {
      var who = (data(PL.lifters.list({ f: 'since' })) || [])[0];
      return { label: c.trainedSince === 1 && who ? 'Read ' + firstOf(who.id) + '’s session' : 'Read ' + c.trainedSince + ' sessions', href: LIFTERS + '#f=since' };
    }
    if (k >= 4 && open) return { label: 'Go through the ' + open + ' to keep an eye on', href: LIFTERS + '#f=watch' };
    if (c.programsDue) return { label: 'Write the ' + c.programsDue + ' week' + (c.programsDue === 1 ? '' : 's') + ' due', href: DESK.routes.programs };
    return { label: 'All caught up' };
  }
  function paintTitle() {
    var c = counts(), td = dayNow(), day = K.wd(td) + ' ' + K.dm(td), facts, sz = size(c);
    if (!DEMO_FRESH && window.DEMO && window.DEMO.deskFrom === 'fresh') facts = 'Example desk';
    else if (sz === 'empty') facts = esc(planWords());
    else if (sz === 'small') facts = c.needYou ? esc(String(c.needYou)) + ' need' + (c.needYou === 1 ? 's' : '') + ' you' : 'Nothing needs you';
    else facts = c.needYou ? '<span class="acc">' + esc(String(c.needYou)) + '</span> need you' + (c.needYouDone ? ', ' + esc(String(c.needYouDone)) + ' done' : '') : 'All caught up';
    $('#facts').innerHTML = '<b>' + esc(day) + '</b> · ' + facts;
    /* the toolbar: the quiet "Add a lifter…" (not beside a crimson that already adds one), then the crimson */
    var cr = crimsonOf(), addSame = cr.step === 'add';
    var cluster = $('#tb-acts'), had = document.activeElement && cluster.contains(document.activeElement) ? (document.activeElement.hasAttribute('data-primary') ? 'p' : 'a') : null;
    var crim = cr.href ? '<a class="btn" data-primary data-walk href="' + esc(cr.href) + '" aria-keyshortcuts="E">' + esc(cr.label) + '</a>'
      : '<button class="btn" type="button" data-primary data-walk' + (cr.step ? ' data-setup-step="' + esc(cr.step) + '"' + (cr.step === 'add' || cr.step === 'week1' ? ' aria-haspopup="dialog"' : '') : ' aria-disabled="true"') + ' aria-keyshortcuts="E">' + esc(cr.label) + '</button>';
    cluster.innerHTML = (addSame ? '' : '<button class="btn" type="button" data-add aria-haspopup="dialog">Add a lifter…</button>') + crim;
    if (had) { var back = $(had === 'p' ? '[data-primary]' : '[data-add]', cluster); if (back) back.focus({ preventScroll: true }); }
    $('#need-sum').hidden = !c.doneToday;
    $('#need-h [data-count]').hidden = !c.needYou;
  }

  /* ---------------- the five charts: each a picture, a number, a short line; a click lists its people ---------------- */
  var CHARTS = {};
  /* each chart names what its popover lists (the Strength chart is the lifts) */
  var POPKIND = { behind: 'training', stalled: 'lift', harder: 'effort', health: 'health', meet: 'meet' };
  function chartsHtml() {
    var c = PL.roster.charts().data, t = c.training, s = c.strength, e = c.effort, h = c.health, m = c.meets, cnt = counts();
    var days = t.days.map(function (d) {
      var wd = K.wd(d.iso), last = d.prev + ' last week', plan = d.planned ? d.planned + ' on the plan' : 'nothing on the plan';
      var tip = d.today ? wd + ', today: ' + (d.planned ? d.planned + ' on the plan, ' + (d.done ? d.done + ' done so far' : 'none done yet') : 'nothing on the plan') + '. ' + last
        : d.future ? wd + ': ' + plan + ', ' + last : wd + ': ' + (d.planned > d.done ? d.done + ' of ' + d.planned + ' done' : d.done + ' done') + ', ' + last;
      return { label: wd.charAt(0), now: d.future ? 0 : d.done, ghost: d.prev, today: d.today, tip: tip };
    });
    var maxPct = Math.max.apply(null, LIFTS.map(function (k) { return Math.abs(s.lifts[k] || 0); }));
    var hb = LIFTS.map(function (k) { var v = s.lifts[k] || 0; return { cls: 'lc-' + k, label: K.LIFT[k], value: v, text: minus(v, 1) + '%', tip: K.LIFT[k] + ': ' + minus(v, 1) + '% on average in 4 weeks' }; });

  function theirWords(x) {
    var last = x.last || {}, msgs = (data(PL.threads.get(x.id)) || {}).messages || [];
    var theirs = msgs.filter(function (m) { return !m.me && m.at === last.at; });
    if (last.type === 'voice') return 'Voice note ' + (last.len || '') + (theirs.some(function (m) { return m.type === 'video'; }) ? ' and a video' : '');
    if (last.type === 'video') return 'Video: ' + last.body;
    if (last.type === 'checkin') { var g = data(PL.lifters.get(x.id)); return 'Check-in: ' + (g && g.health && g.health.kind === 'pain' ? String(g.health.text).toLowerCase() : 'see their answers'); }
    if (last.type === 'note') return 'Note: ' + (sentences(last.body)[0] || last.body);
    var s = sentences(last.body), q = s.filter(function (y) { return /\?$/.test(y); });
    return cap1(q.length ? q.join(' ') : String(last.body || ''));
  }
  function msgsHtml() {
    var r = PL.threads.list(), by = {}; (r.data || []).forEach(function (t) { by[t.id] = t; });
    var ids = r.meta && r.meta.groups ? r.meta.groups.waiting : (r.data || []).filter(function (t) { return t.waiting; }).map(function (t) { return t.id; });
    $('#msgs-sub').hidden = !counts().waitingThreads;
    if (!ids.length) return '<p class="empty">No one is waiting for a reply.</p>';
    return ids.map(function (id) {
      var x = by[id]; if (!x) return '';
      var w = theirWords(x);
      return '<a class="lrow two" data-row="' + esc(id) + '" href="' + esc(MESSAGES + '#id=' + encodeURIComponent(id)) + '"><span class="nm" data-fact="name" data-ellipsis title="' + esc(x.name) + '">' + esc(x.name) + '</span>' +
        '<span class="when" data-fact="context">' + esc(whenWords(x.since || (x.last && x.last.at))) + '</span>' +
        '<span class="why" data-fact="reason"><span class="t" data-quote data-ellipsis title="' + esc(w) + '">' + esc(w) + '</span></span></a>';
    }).join('');
  }

  /* ---------------- painting: once at load, then on every store change while no popover is open ---------------- */
  var stale = false;
  function paint() {
    paintTitle();
    var c = counts(), sz = size(c), st = setupOf();
    /* Getting started: alone on an empty desk, above Your lifters on a small one, on a full desk only when asked for */
    var first = $('#first'), setupEl = $('#setup'), showSetup = !!st && (st.show || st.done >= st.of) && (sz !== 'full' || st.show);
    /* on a small desk Getting started sits flat on the floor beside Your lifters (two raised cards at most in view) */
    var on = showSetup && fn(DESK, 'setupCard') ? DESK.setupCard(setupEl, { flat: sz === 'small' }) : false;
    if (on && sz === 'small') setupEl.classList.remove('card');
    if (!on) { setupEl.hidden = true; setupEl.removeAttribute('data-setup'); }
    $('#look').hidden = sz !== 'empty' || !DEMO_FRESH;
    var small = $('#small');
    if (sz === 'small' && fn(DESK, 'smallDesk')) { small.hidden = false; DESK.smallDesk(small); }
    else { small.hidden = true; small.removeAttribute('data-crop'); small.innerHTML = ''; }
    /* a small desk: Getting started heads the Needs you column and Your lifters the side column, each column flowing on its
       own, so a short band ("You're set up") never leaves the height of Your lifters empty above Needs you */
    var needCol = $('#mid .sec.need'), sideCol = $('#mid .col');
    if (sz === 'small') {
      if (setupEl.parentNode !== needCol) needCol.insertBefore(setupEl, needCol.firstChild);
      if (small.parentNode !== sideCol) sideCol.insertBefore(small, sideCol.firstChild);
    } else {
      if (setupEl.parentNode !== first) first.insertBefore(setupEl, first.firstChild);
      if (small.parentNode !== first) first.appendChild(small);
    }
    first.hidden = !Array.prototype.some.call(first.children, function (el) { return !el.hidden; });
    first.classList.toggle('duo', setupEl.parentNode === first && small.parentNode === first && !setupEl.hidden && !small.hidden);
    $('#charts').hidden = sz !== 'full';
    $('#mid').hidden = sz === 'empty';
    if (sz !== 'full') { $('#charts').innerHTML = ''; paintLists(); return; }
    $('#charts').innerHTML = chartsHtml();
    paintLists();
  }
  function paintLists() {
    var hadRow = document.activeElement && document.activeElement.closest ? document.activeElement.closest('#need [data-row]') : null, rowId = hadRow ? hadRow.getAttribute('data-row') : null;
    var lost = !document.activeElement || document.activeElement === document.body || !!hadRow;
    $('#need').innerHTML = needHtml();
    $('#need-f').innerHTML = footHtml();
    $('#need-cols').hidden = !$('#need .lrow:not(.c2)');
    $('#today').innerHTML = todayHtml();
    $('#msgs').innerHTML = msgsHtml();
    var back = rowId || (lost && here) || null, row = back ? rowEl(back) : null;
    if (row && lost) row.focus({ preventScroll: true });
    here = null;
    /* the one-time tip under the Needs you head, on a desk under 4 lifters (first-time-coach §8.4) */
    if (size() !== 'full' && $('#need [data-row]') && fn(DESK, 'tip')) DESK.tip('needs', $('#need-hd'), 'Worst first. Each button shows the change before it makes it.');
  }
  function rowEl(id) { return $$('#need [data-row]').filter(function (r) { return r.getAttribute('data-row') === id; })[0] || null; }
  PL.on('change', function () { if (DESK.pop.isOpen()) stale = true; else paint(); });
  DESK.on('pop:closed', function () {
    $$('#need .lrow.is-sel').forEach(function (r) { r.classList.remove('is-sel'); });
    if (stale) { stale = false; paint(); }
  });
  paint();

  /* ---------------- moves ---------------- */
  function openFix(btn) {
    var row = btn.closest('[data-row]'), id = btn.getAttribute('data-for'), item = btn.getAttribute('data-item'), act = btn.getAttribute('data-act'), rem = btn.getAttribute('data-reminder');
    if (rem) { if (fn(PL.reminders, 'done')) { var r = PL.reminders.done(rem); if (r && r.error) DESK.toast(r.error.message); else PL.toast(r); } return; }
    if (!item) {
      var x = PL.roster.needs().data.filter(function (y) { return y.id === id; })[0];
      if (x && x.fix && x.fix.go) DESK.go(x.fix.go.place, x.fix.go.hash + '&from=overview');
      return;
    }
    here = id;
    if (fn(DESK, 'tip') && DESK.tip.done) DESK.tip.done('needs');
    var opened = DESK.fix.open(btn, { itemId: item, actId: act, forId: id, anchor: row });
    if (opened && DESK.pop.isOpen()) row.classList.add('is-sel');
  }
  function rowMenu(btn) {
    var id = btn.getAttribute('data-more'), x = PL.roster.needs().data.filter(function (y) { return y.id === id; })[0]; if (!x) return;
    var items = menuOf(x); if (!items.length) return;
    DESK.menu.open(btn, items.map(function (m) { return { id: m.id, label: m.label, title: m.title }; }), {
      label: x.name, anchor: btn, place: 'below-end',
      run: function (k) {
        var m = items.filter(function (y) { return y.id === k; })[0]; if (!m) return;
        var r = m.id === 'notpain' ? PL.lifters.notPain(id) : PL.items.run(m.item, m.act, { for: id });
        if (r && r.error) DESK.toast(r.error.message); else PL.toast(r);
      }
    });
  }
  /* one way in for a lifter: the add sheet (first-time-coach §3), Invite first */
  function addLifter() { if (fn(DESK, 'addLifter')) DESK.addLifter({ from: 'overview' }); }

  document.addEventListener('click', function (e) {
    var t = e.target, b;
    if (!t.closest) return;
    if ((b = t.closest('[data-chart-pop]'))) { if (DESK.pop.justClosed(b)) return; openChart(b); return; }
    if ((b = t.closest('[data-add]'))) { addLifter(); return; }
    if ((b = t.closest('[data-setup-step]'))) { var st = setupStep(); if (st && st.key === b.getAttribute('data-setup-step')) DESK.setup.run(st.act, b); return; }
    if ((b = t.closest('[data-pop-close]'))) { DESK.pop.close(); return; }
    if ((b = t.closest('[data-all-send]'))) { sendAll(b.getAttribute('data-all-send')); return; }
    if ((b = t.closest('[data-meetmore]'))) { if (DESK.pop.justClosed(b)) return; meetMenu(b); return; }
    if ((b = t.closest('#need [data-more]'))) { if (DESK.pop.justClosed(b)) return; rowMenu(b); return; }
    if ((b = t.closest('#need [data-fixbtn]'))) { if (DESK.pop.justClosed(b)) return; openFix(b); return; }
    if ((b = t.closest('#need [data-undo]'))) { var r = PL.items.undo(b.getAttribute('data-undo')); if (r && r.error) DESK.toast(r.error.message); else if (r && r.meta && r.meta.label) DESK.toast(r.meta.label); return; }
    if ((b = t.closest('[data-fold]'))) { foldOpen = !foldOpen; paint(); return; }
    if ((b = t.closest('#today [data-row="sessions-today"]'))) { if (DESK.pop.justClosed(b)) return; trainingPop(b); return; }
    /* a Needs you row opens that lifter in Lifters, anywhere but its buttons and links */
    if ((b = t.closest('#need [data-row]')) && !t.closest('a, button')) { var a = $('a.nm', b); if (a) location.href = a.href; }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (t && t.matches && t.matches('[data-all-text]') && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); var s = $('[data-all-send]', DESK.pop.el()); if (s) sendAll(s.getAttribute('data-all-send')); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    var row = t && t.closest ? t.closest('#need [data-row]') : null;
    if (row && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); step(row, e.key === 'ArrowDown' ? 1 : -1); return; }
    if (row && t === row && e.key === 'Enter') { e.preventDefault(); var a = $('a.nm', row); if (a) location.href = a.href; return; }
    if ((e.key === 'e' || e.key === 'E') && !e.shiftKey && !document.querySelector('dialog[open]') && !DESK.pop.isOpen()) {
      var w = $('[data-walk]'); if (w && (w.getAttribute('href') || w.hasAttribute('data-setup-step'))) { e.preventDefault(); w.click(); }
    }
  });
  /* ↑ ↓ (and ⌥↓ ⌥↑, J K) move between Needs you rows, instantly */
  function step(row, dir) {
    var rows = $$('#need [data-row]'), i = row ? rows.indexOf(row) : -1, nx = rows[i < 0 ? (dir > 0 ? 0 : rows.length - 1) : i + dir];
    if (!nx) return;
    nx.focus({ preventScroll: true }); nx.scrollIntoView({ block: 'nearest', behavior: 'auto' });
  }
  DESK.listStepper = function (dir) {
    var a = document.activeElement, row = a && a.closest ? a.closest('#need [data-row]') : null;
    if (!row && a && a.closest && a.closest('#today, #msgs')) return false;
    step(row, dir); return true;
  };

  /* ---------------- the gate's states (§5.8) ---------------- */
  /* the states that end on the list show it whole: the Needs you card scrolled up under the band (it fits one window) */
  function showNeeds() {
    var sec = $('.sec.need'), tb = $('[data-crop=toolbar]'); if (!sec) return;
    var top = sec.getBoundingClientRect().top + window.scrollY - (tb ? tb.getBoundingClientRect().bottom : 0) - 4;
    window.scrollTo({ top: Math.max(0, top), behavior: 'instant' });
  }
  DESK.states({
    'all-done': function () {
      PL.roster.needs().data.filter(function (x) { return !x.done && x.fix; }).forEach(function (x) {
        var f = x.fix;
        if (f.reminderId) { if (fn(PL.reminders, 'done')) PL.reminders.done(f.reminderId); return; }
        if (!f.itemId) return;
        if (f.go) { PL.items.settle(f.itemId, { label: 'Seen, nothing to change' }); return; }
        var pv = data(PL.items.preview(f.itemId, f.actId, { for: x.id }));
        PL.items.run(f.itemId, f.actId, pv && pv.tell ? { for: x.id, text: pv.tell.text } : { for: x.id });
      });
      showNeeds();
    },
    'no-messages': function () {
      var r = PL.threads.list(), ids = r.meta && r.meta.groups ? r.meta.groups.waiting.slice() : [];
      ids.forEach(function (id) { PL.messages.send(id, { text: 'Read it, thanks. More from me tonight.' }); });
    },
    'board-weighed': function () {
      var m = PL.roster.today().data.meets[0]; if (m && fn(PL.meets, 'weighIns')) PL.meets.weighIns(m.id, m.ids, 'made');
      showNeeds();
    }
  });
  DESK.actions([{ title: 'Go through who needs you', run: function () { $('[data-walk]').click(); } }, { title: 'Add a lifter', run: addLifter }]);
})();
</script>
