<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview, POWALIFTA Coach</title>
<script>
/* a phone gets the coach's phone app: this desk is a laptop screen (22 Nov: at 393 px its menu filled the page and the
   rest overlapped). A phone held sideways counts too. ?desk=1 keeps the desk. */
(function () { try { if (window.matchMedia && matchMedia('(max-width: 760px), (pointer: coarse) and (max-height: 520px)').matches && !/[?&]desk=1\b/.test(location.search)) location.replace('/coach.html?demo=1'); } catch (e) {} })();
/* the sidebar's pin before any paint, so a desk kept open does not slide sideways as it loads (desk.js isPinned holds the same rule) */
(function () { try { var v = localStorage.getItem('powa-r6-side'); if (v === 'open' || (v !== 'fold' && window.matchMedia && matchMedia('(hover: none) and (min-width: 1100px)').matches)) document.documentElement.classList.add('side-pinned'); } catch (e) {} })();
/* the theme before any CSS: ?theme= wins, then powa-r6-theme, else dark */
(function () { var t = null; var m = /[?&]theme=(light|dark)\b/.exec(location.search); if (m) t = m[1]; if (!t) { try { t = localStorage.getItem('powa-r6-theme'); } catch (e) { t = null; } } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>
<link rel="stylesheet" href="../kit/r6/tokens.css">
<link rel="stylesheet" href="../kit/r6/glass.css">
<link rel="stylesheet" href="../kit/r6/ui.css">
<link rel="stylesheet" href="../kit/r6/fix.css">
<link rel="stylesheet" href="../kit/r6/newcoach.css">
<link rel="stylesheet" href="../kit/r6/case.css">
<style>
  /* the Overview (overview-lifters.md §5, professional.md §10.2): the charts card, then Needs you (the work card) beside a
     side column of two flat sections, Today and Messages. Two cards on the screen, nothing else raised. Tokens only. */
  body { --side-col: 340px; }
  @media (max-width: 1280px) { body { --side-col: 312px; } }
  .charts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: var(--sp-2); }
  /* the card is drawn a moment after the page: it holds its height from the start, so the list under it does not jump
     down 220 px when the charts land (22 Nov: a layout shift of 0.35 on the first screen of the demo) */
  .charts:empty { min-height: 236px; }
  @media (max-width: 1240px) { .charts:empty { min-height: 254px; } }   /* narrower tiles wrap their sentence onto another line */
  @media (max-width: 1100px) { .charts:empty { min-height: 277px; } }
  @media (max-width: 900px) { .charts:empty { min-height: 297px; } }
  /* with the sidebar kept open the page is 180 px narrower, so the tiles wrap sooner */
  @media (max-width: 1400px) { :root.side-pinned .charts:empty { min-height: 277px; } }
  @media (max-width: 1140px) { :root.side-pinned .charts:empty { min-height: 297px; } }
  .ch-f .said { display: block; margin-top: var(--sp-1); }
  .mid { display: grid; grid-template-columns: minmax(0, 1fr) var(--side-col); gap: var(--sp-7); align-items: start; margin-top: var(--sp-7); }
  /* a tablet held upright: one column, so the Needs-you list keeps its name column (22 Nov: at 820 px the fixed
     columns took the whole card and every lifter's name was squeezed to nothing) */
  @media (max-width: 960px) { .mid { grid-template-columns: minmax(0, 1fr); } }
  .col { display: flex; flex-direction: column; gap: var(--sp-7); min-width: 0; }
  .sec { min-width: 0; }
  .sec-h .sub [data-count] { font-variant-numeric: tabular-nums; }
  /* the page's key count (how many need you) wears the Overview's warm colour */
  .sec-h h2 .n.acc { color: var(--place-ink); }

  /* Needs you is a list of cases (owner, 22 Nov: "clutters of texts and nothing good to look at or easy to understand").
     One row, one lifter, read left to right: the face and name with the kind of case as a word in its colour, the reason
     under it; the evidence as a small picture with its one fact under it (how bad the pain is, how far over the class,
     which days move); then the next step as a real button, in the same place on every row. No column heads: each part
     says what it is. A done row is the name over the shared done row. */
  .mid { --rh: 52px; }
  .need { --fig-w: 248px; --fix-w: 232px; --more-w: 32px; }
  .need .lrow { grid-template-columns: 40px minmax(0, 1fr) var(--fig-w) var(--fix-w) var(--more-w); column-gap: var(--sp-4); min-height: 72px; padding-top: var(--sp-3); padding-bottom: var(--sp-3); }
  @media (max-width: 1280px) { .need { --fig-w: 208px; --fix-w: 212px; } .need .lrow { column-gap: var(--sp-3); } }
  @media (max-width: 1100px) { .need { --fig-w: 0px; } .need .lrow { grid-template-columns: 40px minmax(0, 1fr) var(--fix-w) var(--more-w); } .need .lrow .fg-col { display: none; } }
  .need .list { padding: var(--sp-2); }
  .need .lrow.c2 { grid-template-columns: 40px minmax(0, 1fr); }
  /* Getting started moves into this column on a small desk: its steps have no face, so they keep one column (23 Nov:
     the 40 px face column cut every step to "Ad…", "Re…" once a first lifter was added) */
  .need .lrow.c2.nc-step { grid-template-columns: minmax(0, 1fr); }
  .need .lrow .ph { align-self: center; }
  .need .who { gap: 3px; }
  .need .who-n { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
  .need .nm { text-decoration: none; line-height: var(--lh-tight); flex: 0 0 auto; max-width: 100%; }
  .need .who-n .tg { flex: 0 1 auto; max-width: none; }
  .need .lrow .why { line-height: var(--lh-tight); }
  .need .lrow .why .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .need .act { display: contents; }
  /* the next step: a real button, the same kind and the same place on every row; its words never wrap */
  .need .lrow .go { justify-self: start; min-width: 0; max-width: 100%; }
  .need .lrow .go span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .need .lrow .go svg { width: 14px; height: 14px; margin-right: -4px; color: var(--ink-3); }
  .need .more, .need .more-slot { justify-self: end; width: var(--more-w); }
  .need .done-row { line-height: var(--lh-tight); }
  .need .done-row .btn.sm { --h: 20px; }
  .need .card { --stack-bg: var(--card); }
  /* the card's foot lines: words in ink-3 on hairlines, the way on (a link) at the right */
  .nf { display: flex; align-items: center; gap: var(--sp-3); min-height: 52px; padding: 0 var(--sp-6); border-top: 1px solid var(--line); color: var(--ink-3); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .nf .w { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nf .w b { color: var(--ink-2); font-weight: 500; }
  .nf .btn { margin-left: auto; flex: none; }
  .nf .link { margin-left: auto; flex: none; }
  .need .empty { margin: 0; padding: var(--sp-5) var(--sp-4); color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .need .empty .btn { margin-top: var(--sp-3); }
  /* the day's list done: one line over the done rows, the shared done look a size up (a tick in the gain colour, ink words) */
  .need .need-clear { display: flex; align-items: center; gap: var(--sp-3); min-height: 56px; padding: var(--sp-2) var(--sp-4); border-radius: var(--r-row); color: var(--ink); font: 600 var(--fs-body)/var(--lh-sub) var(--font); }
  .need .need-clear .done-tick svg { width: 20px; height: 20px; }
  .need .need-clear + .lrow::before { content: ''; position: absolute; top: 0; left: var(--sp-4); right: var(--sp-4); height: 1px; background: var(--line); }

  /* Today and Messages: flat sections on the floor, rows on hairlines, built as the Needs you rows (the name over one line
     of words, 52 px) and on their rhythm: the first row starts level with the first Needs you row, and one row's height
     between the two sections puts every Messages hairline level with a Needs you hairline. The right end of a row's first
     line holds its action or its time; the ⋯ (the meet's only) sits after it. */
  .col { gap: var(--rh); }
  .flat .list { padding: var(--sp-1) 0 0; }
  .flat .sec-h { margin-left: 0; margin-right: 0; }
  .flat .lrow, .flat .lrow.two { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'n a' 'w w'; align-items: center; row-gap: 2px; min-height: var(--rh); padding-top: 5px; padding-bottom: 5px; }
  .flat .lrow.two { grid-template-columns: 32px minmax(0, 1fr) auto; grid-template-areas: 'p n a' 'p w w'; column-gap: var(--sp-3); min-height: 60px; }
  .flat .lrow.two > .ph { grid-area: p; align-self: center; }
  .flat .lrow.duo { grid-template-areas: 'n a' 'w w' 's s'; row-gap: 3px; padding-top: var(--sp-3); padding-bottom: var(--sp-3); }
  .flat .lrow.duo > .stack { grid-area: s; margin-top: var(--sp-2); }
  .flat .lrow > .nm { grid-area: n; line-height: var(--lh-tight); }
  .flat .lrow > .why { grid-area: w; line-height: var(--lh-tight); }
  .flat .lrow > .acts, .flat .lrow > .when { grid-area: a; }
  .flat .lrow.two .why .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-line-clamp: none; line-clamp: none; }
  .flat .lrow .when { font-size: var(--fs-label); line-height: var(--lh-tight); }
  .flat .lrow.two > .nm, .flat .lrow.two > .when { align-self: baseline; }
  /* the action sits in the name's line: the 32 px button hangs into the row's padding, so every row stays 52 px; its words
     end on the column's right edge, as the times do */
  .lrow.duo > .acts { display: flex; align-items: center; gap: var(--sp-1); margin: -8px 0; }
  .lrow.duo .act-t { display: inline-flex; align-items: center; height: var(--ctl-s); padding: 0 14px; border-radius: var(--r-pill); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink); font: 600 var(--fs-label)/var(--lh-tight) var(--font); white-space: nowrap; }
  .lrow.duo .more-slot { flex: none; width: var(--ctl-s); }
  .flat .empty { min-height: var(--rh); display: flex; align-items: center; }
  button.lrow { width: 100%; border: 0; background-color: transparent; color: inherit; font: inherit; text-align: left; }
  a.lrow { color: inherit; text-decoration: none; }
  .flat .empty { margin: 0; padding: var(--sp-3) 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .sfoot { display: flex; align-items: center; min-height: 48px; padding: 0; border-top: 1px solid var(--line); }

  /* a desk under 4 lifters (first-time-coach §5): Getting started, then Your lifters in the charts' place */
  .first-col { display: grid; gap: var(--sp-7); align-items: start; }
  .first-col > [hidden] { display: none; }
  /* both on screen: Getting started over the Needs you column, Your lifters over Today and Messages (one grid with .mid) */
  .first-col.duo { grid-template-columns: minmax(0, 1fr) var(--side-col); }
  .first-col.duo > .look-around { grid-column: 1 / -1; }
  /* in the columns (a small desk): one step of space under Getting started, as between the side column's sections */
  .sec.need > #setup:not([hidden]) { margin-bottom: var(--sp-7); }
  /* a done step's words read in ink, as every done row on the desk (one line, never a grey sentence in a row) */
  #setup .is-done .done-tick span { color: var(--ink); }
  /* flat (beside Your lifters): the words start under the heading, as every flat section's do (PX2) */
  #setup:not(.card) { max-width: none; }
  #setup:not(.card) .nc-set-h { min-height: var(--ctl-h); padding: 0 var(--sp-1); margin-bottom: var(--sp-1); }
  #setup:not(.card) .nc-steps { margin-inline: calc(var(--sp-1) - var(--sp-6)); padding-top: 0; }
  .look-around { margin: 0; color: var(--ink-3); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .nf .w.none { color: var(--ink-3); }

  /* popovers on this page: a title with its count, people as rows, one quiet way on at the foot */
  .pop h3 .n { color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: var(--sp-1); }
  .pop .pk-h { margin: var(--sp-4) 0 var(--sp-1); font: 600 var(--fs-sub)/var(--lh-tight) var(--font); }
  .pop .pk-h .n { color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: var(--sp-1); }
  .pop .ppl { margin-top: var(--sp-3); }
  .pop a.pick { text-decoration: none; }
  .pop .pop-f { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); padding-top: var(--sp-3); border-top: 1px solid var(--line); }
  .pop .inv { margin: var(--sp-3) 0 0; font: 600 var(--fs-sub)/var(--lh-sub) var(--font); font-variant-numeric: tabular-nums; user-select: all; }
  .pop .seats { margin: var(--sp-1) 0 0; color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .pop .compose { display: block; width: 100%; margin-top: var(--sp-3); }

  /* ---------------- 23 Nov: the same page, organised by Hick, Fitts and Jakob ---------------- */
  /* Fitts: a row's one fix fills its column at the toolbar's height, so every row's button has the same two edges and a
     coach clears the list down one vertical line. The crimson stays the largest button on the page (same height, wider). */
  .need .lrow .go { --h: var(--ctl-h); width: 100%; justify-content: flex-start; }
  .need .lrow .go > span { flex: 1 1 auto; text-align: left; }
  /* a key, shown where its action is: the fix's E on the row the keys are on; the menu's own keys in the menu */
  .kk { display: inline-grid; place-items: center; flex: none; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-3); font: 600 var(--fs-cap)/1 var(--font); font-style: normal; }
  .need .lrow .go .kk { display: none; }
  .need .lrow:focus-visible .go .kk, .need .lrow .go:focus-visible .kk { display: inline-grid; }
  /* Hick: a row's other moves wait behind its ⋯, drawn on the row the pointer or the keys are on (touch keeps it drawn);
     its place is held, so nothing moves when it appears */
  @media (hover: hover) and (pointer: fine) {
    .need .lrow:not(.is-done):not(:hover):not(:focus-within):not(.is-sel) .more { opacity: 0; }
  }
  /* the first five, then one line for the rest: how many, who, and the way to show them */
  .need .nmore { display: flex; align-items: center; gap: var(--sp-3); width: 100%; min-height: 48px; margin: 0; padding: 0 var(--sp-4); border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; color: var(--ink-3); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-align: left; cursor: pointer; }
  .need .nmore .w { min-width: 0; flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .need .nmore .w b { color: var(--ink-2); font-weight: 500; }
  .need .nmore .l { flex: none; color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
  @media (hover: hover) and (pointer: fine) { .need .nmore:hover { background: var(--hover); } .need .nmore:hover .l { text-decoration-color: currentColor; } }
  .need .nmore:focus-visible { outline: 0; box-shadow: inset 0 0 0 2px var(--focus); }
  /* decided in this sitting: the done rows follow the open ones (the next case slides up into the place just decided) */
  .need .nmore + .lrow::before { opacity: 0; }
  /* the list's own width decides (the sidebar kept open takes 180 px): under it, the figure column goes and the name
     keeps its room, as below 1100 px already (23 Nov: at 1280 with the sidebar pinned every name was cut to "Priy…") */
  .sec.need { container: needc / inline-size; }
  @media (min-width: 1281px) { @container needc (max-width: 880px) { .need .lrow:not(.c2) { grid-template-columns: 40px minmax(0, 1fr) var(--fix-w) var(--more-w); } .need .lrow .fg-col { display: none; } } }
  @media (max-width: 1280px) { @container needc (max-width: 800px) { .need .lrow:not(.c2) { grid-template-columns: 40px minmax(0, 1fr) var(--fix-w) var(--more-w); } .need .lrow .fg-col { display: none; } } }
  /* "2 done today" opens the day's done rows, as an archive */
  #need-sum button { padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
  @media (hover: hover) and (pointer: fine) { #need-sum button:hover { color: var(--ink); text-decoration-color: currentColor; } }
  /* Messages: who waits and is not already in Needs you; the rest is one line */
  .flat .msg-in { min-height: var(--rh); display: flex; align-items: center; margin: 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  /* a chart's people, drawn: the week as seven days (lifted, to come, missed, rest), effort as written against felt */
  .wk7 { display: inline-flex; gap: 3px; vertical-align: middle; }
  .wk7 i { display: grid; place-items: center; width: 16px; height: 18px; border-radius: 5px; background: transparent; color: var(--ink-4); font: 600 10px/1 var(--font); font-style: normal; }
  .wk7 i.come { box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-3); }
  .wk7 i.done { background: var(--place-sel); color: var(--place-ink); box-shadow: inset 0 0 0 1px var(--place-ink); }
  .wk7 i.miss { background: var(--warn-tint); box-shadow: inset 0 0 0 1px var(--warn); color: color-mix(in srgb, var(--warn) 80%, var(--ink)); text-decoration: line-through; }
  /* names keep their capitals in the Health headline ("2 in pain: Sarah, Priya") */
  .ch[data-chart-pop=health] .unit { text-transform: none; }
  .wk7 i.now { font-weight: 800; color: var(--ink); }
  .pop .pick .v .wk7 + small, .pop .pick .v .n7 { display: block; margin-top: 3px; color: var(--ink-3); font: 500 var(--fs-cap)/1 var(--font); text-align: right; }
  .pop .pick .v .fg { height: 22px; width: 132px; gap: var(--sp-2); }
  .pop .pick .v .fg b { font-size: var(--fs-sub); }
  .pop .key7 { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-3); margin: var(--sp-2) 0 0; color: var(--ink-3); font: 500 var(--fs-cap)/1.3 var(--font); }
  .pop .key7 span { display: inline-flex; align-items: center; gap: 5px; }
  .pop .key7 .wk7 i { width: 12px; height: 14px; font-size: 0; }

  /* 24 Nov: Training as a cell a day (done of planned), Effort as three counts of lifters, in words */
  .dr { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; width: 100%; }
  .dr-d { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 7px; border-radius: 8px; background: var(--fill); font-variant-numeric: tabular-nums; }
  .dr-d b { color: var(--ink-3); font: 600 11px/1 var(--font); }
  .dr-d > span { color: var(--ink); font: 750 15px/1 var(--font); }
  .dr-d > span i { color: var(--ink-3); font-style: normal; font-weight: 500; font-size: 11px; }
  .dr-d[data-st='full'] { background: var(--up-tint); } .dr-d[data-st='full'] > span { color: var(--up-ink); }
  .dr-d[data-st='short'] > span { color: var(--warn); }
  .dr-d[data-st='future'] { background: none; box-shadow: inset 0 0 0 1px var(--line); } .dr-d[data-st='future'] > span { color: var(--ink-3); font-weight: 600; }
  .dr-d[data-today] { box-shadow: inset 0 0 0 1.5px var(--ink); } .dr-d[data-today] b { color: var(--ink); }
  .er { display: flex; flex-direction: column; gap: 2px; width: 100%; margin-bottom: 8px; }
  .er-c { display: flex; align-items: baseline; gap: 10px; min-width: 0; padding: 3px 0; border-top: 1px solid var(--line); }
  .er-c:first-child { border-top: 0; }
  .er-c b { min-width: 22px; font: 800 17px/1.1 var(--font); font-variant-numeric: tabular-nums; color: var(--ink); }
  .er-c span { color: var(--ink-2); font: 500 13px/1.2 var(--font); white-space: nowrap; }
  .er-c[data-k='h'] b { color: var(--warn); } .er-c[data-k='a'] b { color: var(--up-ink); }
</style>
</head>
<body data-place="overview">
<div id="page">
  <main class="page" id="main">
    <div class="lt"><div><h1>Overview</h1><p class="facts" id="facts"></p></div></div>
    <div class="first-col" id="first" hidden>
      <div id="setup" hidden></div>
      <p class="look-around" id="look" hidden>Want to look around first? <a class="link" data-demo href="overview.html?fresh=0">Open the example desk</a></p>
      <div id="small" hidden></div>
    </div>
    <div class="card charts" id="charts" data-crop="charts" role="group" aria-label="This week across your lifters"></div>
    <div class="mid" id="mid">
      <div class="sec need" aria-labelledby="need-h">
        <div class="sec-h" id="need-hd"><h2 id="need-h">Needs you <span class="n acc" data-count="needYou"></span></h2><span class="grow"></span><span class="sub" id="need-sum"><button type="button" data-donejump aria-label="Show what was done today"><span data-count="doneToday"></span> done today</button></span></div>
        <div class="card" data-crop="needs"><div class="list" id="need" data-list aria-label="Needs you"></div><div id="need-f"></div></div>
      </div>
      <div class="col">
        <div class="sec flat" data-crop="today" aria-labelledby="today-h">
          <div class="sec-h"><h2 class="sec-t" id="today-h">Today</h2></div>
          <div class="list" id="today" data-list aria-label="Today"></div>
        </div>
        <div class="sec flat" data-crop="messages" aria-labelledby="msgs-h">
          <div class="sec-h"><h2 class="sec-t" id="msgs-h">Messages</h2><span class="grow"></span><span class="sub" id="msgs-sub"><span data-count="waitingThreads"></span> waiting</span></div>
          <div class="list" id="msgs" data-list aria-label="Waiting for a reply"></div>
          <div class="sfoot"><a class="link" href="messages.html">Open messages</a></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../kit/data.js"></script>
<script src="../kit/kit.js"></script>

<script>
(function () {
  'use strict';
  var K = window.K, PL = window.PL, DESK = window.DESK, CH = window.CHARTS, esc = K.esc, n = K.n;
  var $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };
  var fn = function (o, k) { return !!o && typeof o[k] === 'function'; };
  var data = function (r) { return r && !r.error ? r.data : null; };
  var LIFTS = ['squat', 'bench', 'deadlift'];
  var L = function (id) { return K.L(id); };

  /* "Ines, Tomas, Leo and 2 more": up to three first names, then how many more */
  var names = function (ids, max) { max = max || 3; var f = ids.map(firstOf); return f.length <= max ? f.join(', ') : f.slice(0, max).join(', ') + ' and ' + (f.length - max) + ' more'; };
  var minus = function (v, d) { var x = Math.abs(v), s = d ? x.toFixed(d) : n(x); return (v > 0 ? '+' : v < 0 ? '−' : '') + s; };
  var hm = function (iso) { return iso ? String(iso).slice(11, 16) : ''; };
  var counts = function () { return PL.counts().data; };
  var LIFTERS = DESK.routes.lifters, MESSAGES = DESK.routes.messages;
  var DEMO_FRESH = !!(window.DEMO && window.DEMO.fresh);
  var lifterHref = function (id, f) { return LIFTERS + '#id=' + encodeURIComponent(id) + (f ? '&f=' + f : ''); };
  var words = function (s) { return String(s || '').trim().split(/\s+/).filter(Boolean).length; };
  /* the desk's day is the demo clock's (PL.now moves on when the demo skips to a lifter's session), never a fixed date */
  var dayNow = function () { var t = fn(PL, 'now') ? String(PL.now() || '') : ''; return /^\d{4}-\d{2}-\d{2}/.test(t) ? t.slice(0, 10) : K.today; };
  var localDay = function (iso) { if (!iso) return ''; var x = String(iso); if (!/Z$/.test(x)) return x.slice(0, 10); var d = new Date(x); return isNaN(d) ? x.slice(0, 10) : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  /* Needs you is today's: a row done on an earlier day has left it (its Undo with it) */
  var needsNow = function () { var td = dayNow(); return PL.roster.needs().data.filter(function (x) { return !(x.done && x.done.at && localDay(x.done.at) < td); }); };

  /* ---------------- the toolbar: Add a lifter… (quiet), then the crimson ---------------- */
  DESK.mount({ place: 'overview', title: 'Overview',
    trail: '<div class="cluster" role="group" aria-label="Overview actions" id="tb-acts"></div>' });
  /* the lifters on the desk who are not invited-and-unjoined (first-time-coach §5): 0, 1 to 3, or 4 and more */
  var rosterN = function (c) { c = c || counts(); return Math.max(0, (c.lifters || 0) - (c.invited || 0)); };
  var size = function (c) { c = c || counts(); var k = rosterN(c); return k >= 4 ? 'full' : k === 0 && !(c.invited || 0) ? 'empty' : 'small'; };
  var setupOf = function () { return fn(PL.setup, 'get') ? data(PL.setup.get()) : null; };
  /* the next Getting started step, while the card is shown and not done (§4.2 rule 1) */
  function setupStep() {
    var s = setupOf(); if (!s || !s.show || s.done >= s.of || !s.next) return null;
    return s.steps.filter(function (x) { return x.key === s.next; })[0] || null;
  }
  /* the list keys, as in a mail inbox: move, open, act, archive (Nothing to change), undo (⌘Z, the desk's) */
  DESK.keyMap([['↑ ↓', 'Move between Needs you rows'], ['Enter', 'Open the lifter'], ['E', 'The row’s fix (no row picked: go through them all)'], ['D', 'Nothing to change: keep it as written'], ['⌘↵', 'Apply the open fix'], ['Esc', 'Close the fix or the popover']]);

  /* ---------------- the title row and the crimson, in this order of truth (§5.2) ---------------- */
  /* Keep an eye on: the store's list, and the ones not handled today (function-polish F10.1: the line counts open ones) */
  function watchList() { var r = PL.lifters.list({ f: 'watch' }); return r && r.data ? r : { data: [], meta: { total: 0 } }; }
  function handled(x) { if (!x) return false; if (x.handled || x.group === 'done') return true; var t = fn(PL.lifters, 'today') ? data(PL.lifters.today(x.id)) : null; return !!(t && t.length); }
  function watchOpen() { return watchList().data.filter(function (x) { return !handled(x); }); }
  /* the plan in words: "Free, 0 of 3 lifters" (the sidebar's coach line says the same) */
  function planWords() {
    var bs = fn(PL.billing, 'summary') ? data(PL.billing.summary()) : null, st = bs && bs.seats; if (!st) return '';

  }
  /* the crimson, in this order of truth (first-time-coach §4.2): the next setup step; who needs you; a small desk's new

    if (one) return { label: one.fix.label, href: (DESK.routes[one.fix.go.place] || one.fix.go.place + '.html') + '#' + one.fix.go.hash + '&from=overview' };
    if (c.needYou) return { label: 'Go through the ' + c.needYou + ' who need' + (c.needYou === 1 ? 's' : '') + ' you', href: LIFTERS + '#f=need' };
    if (k >= 1 && k <= 3 && c.trainedSince) {
      var who = (data(PL.lifters.list({ f: 'since' })) || [])[0];

  }
  function paintTitle() {
    var c = counts(), td = dayNow(), day = K.wd(td) + ' ' + K.dm(td), facts, sz = size(c);

    else if (sz === 'small') facts = c.needYou ? esc(String(c.needYou)) + ' need' + (c.needYou === 1 ? 's' : '') + ' you' : 'Nothing needs you';
    else facts = c.needYou ? '<span class="acc">' + esc(String(c.needYou)) + '</span> need you' + (c.needYouDone ? ', ' + esc(String(c.needYouDone)) + ' done' : '') : 'All caught up';
    $('#facts').innerHTML = '<b>' + esc(day) + '</b> · ' + facts;
    /* the toolbar: the quiet "Add a lifter…" (not beside a crimson that already adds one), then the crimson */
    var cr = crimsonOf(), addSame = cr.step === 'add';
    var cluster = $('#tb-acts'), had = document.activeElement && cluster.contains(document.activeElement) ? (document.activeElement.hasAttribute('data-primary') ? 'p' : 'a') : null;
    var crim = cr.href ? '<a class="btn" data-primary data-walk href="' + esc(cr.href) + '" aria-keyshortcuts="E">' + esc(cr.label) + '</a>'

    cluster.innerHTML = (addSame ? '' : '<button class="btn" type="button" data-add aria-haspopup="dialog">Add a lifter…</button>') + crim;
    if (had) { var back = $(had === 'p' ? '[data-primary]' : '[data-add]', cluster); if (back) back.focus({ preventScroll: true }); }
    $('#need-sum').hidden = !c.doneToday;
    $('#need-h [data-count]').hidden = !c.needYou;
  }

  /* ---------------- the five charts: each a picture, a number, a short line; a click lists its people ---------------- */
  var CHARTS = {};
  /* each chart names what its popover lists (the Strength chart is the lifts) */
  var POPKIND = { behind: 'training', stalled: 'lift', harder: 'effort', health: 'health', meet: 'meet' };
  function chartsHtml() {
    var c = PL.roster.charts().data, t = c.training, s = c.strength, e = c.effort, h = c.health, m = c.meets, cnt = counts();
    var days = t.days.map(function (d) {
      var wd = K.wd(d.iso), last = d.prev + ' last week', plan = d.planned ? d.planned + ' on the plan' : 'nothing on the plan';
      var tip = d.today ? wd + ', today: ' + (d.planned ? d.planned + ' on the plan, ' + (d.done ? d.done + ' done so far' : 'none done yet') : 'nothing on the plan') + '. ' + last

      return { label: wd.charAt(0), now: d.future ? 0 : d.done, ghost: d.prev, today: d.today, future: d.future, planned: d.planned, done: d.done, tip: tip };

    /* 24 Nov (the owner: bars nobody can read): the week as numbers, a cell a day, done of planned in words */

      var st = d.future ? 'future' : d.planned && d.done >= d.planned ? 'full' : d.done < d.planned ? 'short' : 'none';
      return '<span class="dr-d" data-st="' + st + '"' + (d.today ? ' data-today' : '') + ' title="' + esc(d.tip) + '"><b>' + esc(d.label) + '</b><span>' + (d.future ? (d.planned ? d.planned : '–') : d.planned ? d.done + '<i>/' + d.planned + '</i>' : (d.done || '–')) + '</span></span>';
    }).join('') + '</span>';
    var maxPct = Math.max.apply(null, LIFTS.map(function (k) { return Math.abs(s.lifts[k] || 0); }));
    var hb = LIFTS.map(function (k) { var v = s.lifts[k] || 0; return { cls: 'lc-' + k, label: K.LIFT[k], value: v, text: minus(v, 1) + '%', tip: K.LIFT[k] + ': best lift ' + minus(v, 1) + '% on average in 4 weeks (estimated max, e1RM)' }; });
    var eh = 0, ea = 0, ee = 0; e.perLifter.forEach(function (x) { if (Math.abs(x.drift) < 0.05) ea++; else if (x.drift > 0) eh++; else ee++; });
    var effRow = '<span class="er">' + [['h', eh, 'Harder'], ['a', ea, 'As written'], ['e', ee, 'Easier']].map(function (q) { return '<span class="er-c" data-k="' + q[0] + '"><b>' + q[1] + '</b><span>' + q[2] + '</span></span>'; }).join('') + '</span>';
    var order = h.pain.map(function (id) { return { id: id, tone: 'pain', w: 'pain' }; }).concat(h.low.map(function (id) { return { id: id, tone: 'warn', w: 'low recovery' }; }), h.ok.map(function (id) { return { id: id, tone: 'up', w: 'fine' }; }), h.none.map(function (id) { return { id: id, none: true, w: 'no check-in' }; }));
    var dots = order.map(function (x) { return { tone: x.tone, none: x.none, tip: firstOf(x.id) + ': ' + x.w }; });
    var bunches = []; m.list.forEach(function (mm) { var b = bunches[bunches.length - 1]; if (b && mm.days - b.days <= 4) b.list.push(mm); else bunches.push({ days: mm.days, list: [mm] }); });
    var marks = bunches.map(function (b) { var ids = [].concat.apply([], b.list.map(function (x) { return x.ids; })); return { x: b.days / m.span, n: ids.length, now: b.days === 0, tip: b.list.map(function (x) { var o = fn(PL.fmt, 'out') ? PL.fmt.out(x.days) : null; o = o && o.data !== undefined ? o.data : o; return x.name + ', ' + (o && o.text ? o.text : x.days ? 'in ' + x.days + ' days' : 'today') + ': ' + names(x.ids, 4); }).join('. ') }; });
    var ticks = []; for (var i = 1; i < 8; i++) ticks.push(i * 7 / m.span);
    var today = m.list.filter(function (x) { return x.days === 0; })[0];
    /* each chart carries its sentence as its title too (function-polish F11), and its head word's meaning (data-term) */
    var TERM = { stalled: 'strength', harder: 'effort' };
    var col = function (key, title, per, val, unit, plot, foot, aria) {
      var head = TERM[key] ? '<b data-term="' + TERM[key] + '">' + title + '</b>' : '<b>' + title + '</b>';
      if (key === 'harder') unit = unit.replace('felt as written', '<span data-term="felt">felt as written</span>');
      return '<button type="button" class="ch" data-chart-pop="' + key + '" data-pop="' + (POPKIND[key] || key) + '" aria-haspopup="dialog" aria-label="' + esc(aria) + '" title="' + esc(aria.replace(/ Show who\.$/, '')) + '"><span class="ch-h">' + head + '<span>' + per + '</span></span>' +
        '<span class="ch-v">' + val + '<span class="unit">' + unit + '</span></span><span class="plot">' + plot + '</span><span class="ch-f">' + foot + '</span></button>';
    };
    var behind = t.behind.length ? 'Behind: ' + esc(names(t.behind)) : 'Nobody is behind';
    var flat = s.flat.length ? 'Flat: ' + esc(names(s.flat)) : 'Nobody is flat';
    var harder = e.harder.length ? 'Harder: ' + esc(names(e.harder)) : 'Nobody found it harder';
    var meetLine = today ? 'Today: ' + esc(names(today.ids)) : 'No meet this week';
    /* Health names who in its headline ("2 in pain: Sarah, Priya": the red dots), its key counts the other colours */
    var sore = h.pain.length ? 'In pain: ' + esc(names(h.pain)) : 'Nobody in pain';
    var tiles = {
      behind: col('behind', 'Training', 'Mon to Sun', t.done, 'of ' + t.planned + ' sessions', dayRow, '<span class="said">' + behind + '</span>',
        'Training, Monday to Sunday: ' + t.done + ' of ' + t.planned + ' sessions. ' + behind + '. Show who.'),
      stalled: col('stalled', 'Strength', '4 weeks', minus(s.pct, 1) + '%', 'on average', CH.hbars(hb, { max: maxPct }), flat,
        'Strength over 4 weeks: best lifts ' + minus(s.pct, 1) + '% on average (estimated max, e1RM). ' + flat + '. Show who.'),
      harder: col('harder', 'Effort', '7 days', e.asWrittenPct + '%', 'felt as written', effRow, harder,
        'Effort over 7 days: ' + e.asWrittenPct + '% of sets felt as hard as written (RPE). ' + harder + '. Show who.'),
      health: col('health', 'Health', 'Today', cnt.pain, 'in pain' + (h.pain.length ? ': ' + esc(names(h.pain, 2)) : ''), CH.waffle(dots), CH.legend([{ label: h.low.length + ' low', tone: 'warn' }, { label: h.ok.length + ' fine', tone: 'up' }, { label: h.none.length + ' no check-in', none: true }]),
        'Health today: ' + h.pain.length + ' in pain, ' + h.low.length + ' low recovery, ' + h.ok.length + ' fine, ' + h.none.length + ' without a check-in. ' + sore + '. Show who.'),
      meet: col('meet', 'Meets', '8 weeks', cnt.meetsSoon, 'meets, ' + cnt.meetLifters + ' lifters', CH.timeline(marks, { ticks: ticks, left: 'Today', right: K.dm(K.add(K.today, m.span)) }), meetLine,
        'Meets in the next 8 weeks: ' + cnt.meetsSoon + ' meets, ' + cnt.meetLifters + ' lifters. ' + meetLine + '. Show who.')
    };
    return chartOrder(h).map(function (k) { return tiles[k]; }).join('');
  }
  /* the most urgent picture first (Hick: the eye starts where the answer is): Health leads while someone is in pain */
  function chartOrder(h) { return h && h.pain && h.pain.length ? ['health', 'behind', 'stalled', 'harder', 'meet'] : ['behind', 'stalled', 'harder', 'health', 'meet']; }
  /* a chart's people (§5.3): title and count, up to 8 rows, each opening the lifter in Lifters, one quiet way on */
  function pickHtml(id, f, sub, val) {
    var l = L(id); if (!l) return '';
    return '<a class="pick" href="' + esc(lifterHref(id, f)) + '"><span class="pk"><b>' + esc(l.name) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' + (val ? '<span class="v">' + (val.html || esc(val)) + '</span>' : '') + '</a>';
  }
  /* a lifter's week as seven days, Monday first: lifted (lit), to come (outlined), missed (struck), rest (blank); today bold */
  var D1 = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  function week7(id) {
    var w = fn(PL.lifters, 'week') ? data(PL.lifters.week(id)) : null, td = dayNow(), dow = (new Date(td + 'T12:00:00').getDay() + 6) % 7, by = {}, done = 0, of = 0, said = [];
    ((w && w.sessions) || []).forEach(function (x) { if (x.date) by[x.date] = x; });
    var cells = D1.map(function (l, i) {
      var iso = K.add(td, i - dow), x = by[iso], c = 'rest', st = 'rest';
      if (x) { of++; if (x.state === 'done' || x.state === 'part') { c = 'done'; st = 'lifted'; done++; } else if (x.state === 'missed') { c = 'miss'; st = 'missed'; } else { c = 'come'; st = 'to come'; } said.push(WD[i] + ' ' + st); }
      return '<i class="' + c + (iso === td ? ' now' : '') + '" title="' + esc(WD[i] + ': ' + (x ? x.name + ', ' + st : 'rest')) + '">' + l + '</i>';
    }).join('');
    return { h: '<span class="wk7" role="img" aria-label="' + esc(said.join(', ') || 'No sessions this week') + '">' + cells + '</span>', done: done, of: of };
  }
  var KEY7 = '<p class="key7"><span><span class="wk7"><i class="done"></i></span>Lifted</span><span><span class="wk7"><i class="come"></i></span>To come</span><span><span class="wk7"><i class="miss"></i></span>Missed</span></p>';
  function rowsOf(f) { var r = PL.lifters.list({ f: f }); return r && r.data ? r.data : []; }
  var POPS = {
    behind: function () {
      var rows = rowsOf('behind');
      return { title: 'Behind on sessions', n: rows.length, f: 'behind', key: KEY7, rows: rows.slice(0, 8).map(function (r) { var wk = week7(r.id); return pickHtml(r.id, 'behind', null, { html: wk.h + '<small>' + (r.week ? r.week.done + ' of ' + r.week.of : wk.done + ' of ' + wk.of) + ' this week</small>' }); }).join('') };
    },
    stalled: function () {
      var rows = rowsOf('stalled');
      return { title: 'Not getting stronger', n: rows.length, f: 'stalled', rows: rows.slice(0, 8).map(function (r) { return pickHtml(r.id, 'stalled', null, r.change == null ? '' : minus(r.change, 1).replace(/\.0$/, '') + ' kg in 4 weeks'); }).join('') };
    },
    harder: function () {
      var rows = rowsOf('harder');
      /* effort as written against felt: the ring is what was written, the dot what it felt like (RPE, 6 to 10) */
      return { title: 'Finding it harder', n: rows.length, f: 'harder', key: '<p class="key7">Ring: as written. Dot: as it felt (effort out of 10, RPE).</p>', rows: rows.slice(0, 8).map(function (r) { var lt = r.lastTop; return pickHtml(r.id, 'harder', r.reason ? r.reason.text : '', lt && lt.felt != null && lt.written != null ? { html: figRpe(lt.felt, lt.written) } : null); }).join('') };
    },
    health: function () {
      var rows = rowsOf('health'), none = rowsOf('nocheckin');
      var more = none.length ? '<p class="pk-h">No check-in<span class="n">' + none.length + '</span></p>' + none.slice(0, 8).map(function (r) { return pickHtml(r.id, 'nocheckin', r.health ? [r.health.text, r.health.sub].filter(Boolean).join(', ') : '', null); }).join('') +
        '<div class="pop-f"><a class="btn quiet sm" href="' + LIFTERS + '#f=nocheckin">Show the ' + none.length + ' in Lifters</a></div>' : '';
      return { title: 'Pain or low recovery', n: rows.length, f: 'health', rows: rows.slice(0, 8).map(function (r) { return pickHtml(r.id, 'health', r.health ? r.health.text : '', null); }).join(''), after: more };
    },
    meet: function () {
      var rows = rowsOf('meet');
      var out = function (d) { var o = fn(PL.fmt, 'out') ? PL.fmt.out(d) : null; o = o && o.data !== undefined ? o.data : o; return o && o.text ? o.text : d === 0 ? 'today' : 'in ' + d + ' days'; };
      var job = function (id) { var p = fn(PL.meets, 'plan') ? data(PL.meets.plan(id)) : null; return p && p.job && p.job.label ? p.job.label : null; };
      return { title: 'Meet in 8 weeks', n: rows.length, f: 'meet', rows: rows.slice(0, 8).map(function (r) { return pickHtml(r.id, 'meet', r.meet ? r.meet.name + ', ' + out(r.meet.days) : '', job(r.id)); }).join('') };
    }
  };
  function openChart(btn) {
    var p = POPS[btn.getAttribute('data-chart-pop')](); if (!p) return;
    var html = '<h3>' + esc(p.title) + '<span class="n">' + p.n + '</span></h3>' + (p.key || '') + '<div class="pop-b"><div class="ppl">' + p.rows + '</div>' +
      '<div class="pop-f"><a class="btn quiet sm" href="' + LIFTERS + '#f=' + p.f + '">Show them in Lifters</a></div>' + (p.after || '') + '</div>';
    DESK.pop.open(btn, html, { label: p.title, focus: true });
  }

  /* ---------------- Needs you ---------------- */
  /* lifters handled before this visit fold into "Done today"; lifters handled during it keep their row in place. The
     visit is the coach's sitting: everything since they last looked (the store's lastLook, the line "Trained since you
     looked" counts from). So a row handled on Lifters a minute ago still shows its done row here, with its Undo. */
  /* "Elena, Marcus, Kofi and 3 others": who waits under the fold */
  var restNames = function (xs) { var f = xs.map(function (x) { return firstOf(x.id); }); return f.length <= 4 ? f.slice(0, -1).join(', ') + (f.length > 1 ? ' and ' : '') + f[f.length - 1] : f.slice(0, 3).join(', ') + ' and ' + (f.length - 3) + ' others'; };
  var folded = {}, foldOpen = false, here = null, hereIdx = -1, showAll = false, SHOW = 5;
  var since = fn(PL.lifters, 'since') ? PL.lifters.since() : null, lastLook = since && since.meta && since.meta.from ? String(since.meta.from) : null;
  PL.roster.needs().data.forEach(function (x) { if (x.done && lastLook && x.done.at && String(x.done.at) < lastLook) folded[x.id] = true; });
  function ctxHtml(c) {

    return d <= 0 ? 'Today' : d === 1 ? 'Yesterday' : d < 7 ? K.wd(String(at).slice(0, 10)) : K.wd3(String(at).slice(0, 10)) + ' ' + K.dm(String(at).slice(0, 10));
  }
  function theirWords(x) {
    var last = x.last || {}, msgs = (data(PL.threads.get(x.id)) || {}).messages || [];
    var theirs = msgs.filter(function (m) { return !m.me && m.at === last.at; });
    if (last.type === 'voice') return 'Voice note ' + (last.len || '') + (theirs.some(function (m) { return m.type === 'video'; }) ? ' and a video' : '');
    if (last.type === 'video') return 'Video: ' + last.body;
    if (last.type === 'checkin') { var g = data(PL.lifters.get(x.id)); return 'Check-in: ' + (g && g.health && g.health.kind === 'pain' ? String(g.health.text).toLowerCase() : 'see their answers'); }
    if (last.type === 'note') return 'Note: ' + (sentences(last.body)[0] || last.body);
    var s = sentences(last.body), q = s.filter(function (y) { return /\?$/.test(y); });
    return cap1(q.length ? q.join(' ') : String(last.body || ''));
  }
  function msgsHtml() {
    var r = PL.threads.list(), by = {}; (r.data || []).forEach(function (t) { by[t.id] = t; });
    var ids = r.meta && r.meta.groups ? r.meta.groups.waiting : (r.data || []).filter(function (t) { return t.waiting; }).map(function (t) { return t.id; });
    $('#msgs-sub').hidden = !counts().waitingThreads;
    if (!ids.length) return '<p class="empty">No one is waiting for a reply.</p>';
    /* 23 Nov (Hick): a lifter with an open case in Needs you is answered from that row (its fix carries the words); here
       only the others, then one line for those (the way to every thread stays at the foot: Open messages) */
    var inNeed = {}; needsNow().forEach(function (x) { if (!x.done) inNeed[x.id] = true; });
    var dup = ids.filter(function (id) { return inNeed[id]; }).length; ids = ids.filter(function (id) { return !inNeed[id]; });
    var line = dup ? '<p class="msg-in">' + (ids.length ? (dup === 1 ? 'One more is' : dup + ' more are') : dup === 1 ? 'The one waiting is' : 'All ' + dup + ' are') + ' in Needs you.</p>' : '';
    return ids.map(function (id) {
      var x = by[id]; if (!x) return '';
      var w = theirWords(x);
      return '<a class="lrow two" data-row="' + esc(id) + '" href="' + esc(MESSAGES + '#id=' + encodeURIComponent(id)) + '">' + DESK.photo(L(id) || x, 32) + '<span class="nm" data-fact="name" data-ellipsis title="' + esc(x.name) + '">' + esc(x.name) + '</span>' +
        '<span class="when" data-fact="context">' + esc(whenWords(x.since || (x.last && x.last.at))) + '</span>' +
        '<span class="why" data-fact="reason"><span class="t" data-quote data-ellipsis title="' + esc(w) + '">' + esc(w) + '</span></span></a>';
    }).join('') + line;
  }

  /* ---------------- painting: once at load, then on every store change while no popover is open ---------------- */
  var stale = false, painted = false;
  function paint() {
    paintTitle();
    var c = counts(), sz = size(c), st = setupOf();
    /* Getting started: alone on an empty desk, above Your lifters on a small one, on a full desk only when asked for */
    var first = $('#first'), setupEl = $('#setup'), showSetup = !!st && (st.show || st.done >= st.of) && (sz !== 'full' || st.show);
    /* on a small desk Getting started sits flat on the floor beside Your lifters (two raised cards at most in view) */
    var on = showSetup && fn(DESK, 'setupCard') ? DESK.setupCard(setupEl, { flat: sz === 'small' }) : false;
    if (on && sz === 'small') setupEl.classList.remove('card');
    if (!on) { setupEl.hidden = true; setupEl.removeAttribute('data-setup'); }
    $('#look').hidden = sz !== 'empty' || !DEMO_FRESH;
    var small = $('#small');
    if (sz === 'small' && fn(DESK, 'smallDesk')) { small.hidden = false; DESK.smallDesk(small); }
    else { small.hidden = true; small.removeAttribute('data-crop'); small.innerHTML = ''; }
    /* a small desk: Getting started heads the Needs you column and Your lifters the side column, each column flowing on its
       own, so a short band ("You're set up") never leaves the height of Your lifters empty above Needs you */
    var needCol = $('#mid .sec.need'), sideCol = $('#mid .col');
    if (sz === 'small') {
      if (setupEl.parentNode !== needCol) needCol.insertBefore(setupEl, needCol.firstChild);
      if (small.parentNode !== sideCol) sideCol.insertBefore(small, sideCol.firstChild);
    } else {
      if (setupEl.parentNode !== first) first.insertBefore(setupEl, first.firstChild);
      if (small.parentNode !== first) first.appendChild(small);
    }
    first.hidden = !Array.prototype.some.call(first.children, function (el) { return !el.hidden; });
    first.classList.toggle('duo', setupEl.parentNode === first && small.parentNode === first && !setupEl.hidden && !small.hidden);
    $('#charts').hidden = sz !== 'full';
    $('#mid').hidden = sz === 'empty';
    if (sz !== 'full') { $('#charts').innerHTML = ''; paintLists(); return; }
    $('#charts').innerHTML = chartsHtml();
    drawOnce();
    paintLists();
  }
  /* the charts draw themselves once a session, on the first Overview of the day's sitting: bars rise from their baseline,
     the strength lines run out from their start, the dots and marks come up from 45 %; 260 ms with a 25 ms step per
     column, 400 ms at most. Every later paint (a store change, the next visit) draws them at rest at once: a picture the
     coach reads many times a day never makes them wait. Reduced motion: no drawing. */
  function drawOnce() {
    var K0 = 'powa-r6-charts-drawn';
    try { if (sessionStorage.getItem(K0)) return; sessionStorage.setItem(K0, '1'); } catch (e) { return; }
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || !document.body.animate) return;
    var ease = 'cubic-bezier(.23, 1, .32, 1)', o = function (i) { return { duration: 260, delay: Math.min(140, i * 25), easing: ease, fill: 'backwards' }; };
    $$('#charts .bars .b i.now').forEach(function (el, i) { el.animate([{ clipPath: 'inset(100% 0 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], o(i)); });
    $$('#charts .hbars .t i').forEach(function (el, i) { el.animate([{ clipPath: 'inset(0 100% 0 0 round 999px)' }, { clipPath: 'inset(0 0 0 0 round 999px)' }], o(i)); });
    $$('#charts :is(.div .c i, .waffle i, .tl .m)').forEach(function (el, i) { el.animate([{ opacity: 0.45 }, { opacity: 1 }], o(Math.floor(i / 4))); });
  }
  function paintLists() {
    var hadRow = document.activeElement && document.activeElement.closest ? document.activeElement.closest('#need [data-row]') : null, rowId = hadRow ? hadRow.getAttribute('data-row') : null;
    var lost = !document.activeElement || document.activeElement === document.body || !!hadRow;
    /* a row decided during this visit turns into its done row where it is (DESK.done: the tick draws, the words come up);
       the decision that empties the day's list is a moment: the line that says so lands once (clearHtml) */
    var wasDone = {}, wasOpen = painted ? $$('#need [data-row]:not(.is-done)').length : -1, prevOpen = $$('#need [data-row]:not(.is-done)').map(function (r) { return r.getAttribute('data-row'); });
    $$('#need [data-row].is-done').forEach(function (r) { wasDone[r.getAttribute('data-row')] = 1; });
    $('#need').innerHTML = needHtml();
    if (painted && fn(DESK, 'done')) {
      $$('#need [data-row].is-done').forEach(function (r) { if (!wasDone[r.getAttribute('data-row')]) DESK.done(r); });
      /* an Undo brings the case back where it was: its parts come up from 45 % (never a jump from nothing) */
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) $$('#need [data-row]:not(.is-done)').forEach(function (r) {
        if (wasDone[r.getAttribute('data-row')] && r.animate) r.animate([{ opacity: 0.45 }, { opacity: 1 }], { duration: 180, easing: 'cubic-bezier(.23, 1, .32, 1)' });
      });
      var cl = $('#need .need-clear'); if (cl && wasOpen > 0) DESK.done(cl, { big: true });
    }
    painted = true;
    $('#need-f').innerHTML = footHtml();
    $('#today').innerHTML = todayHtml();
    $('#msgs').innerHTML = msgsHtml();
    var back = rowId || (lost && here) || null, row = back ? rowEl(back) : null;
    /* a case just decided has left the open rows: the keys stay where they were, on the case that took its place */
    if (back && (!row || row.classList.contains('is-done')) && (prevOpen.indexOf(back) >= 0 || hereIdx >= 0)) {
      var opens = $$('#need [data-row]:not(.is-done)'), at = prevOpen.indexOf(back) >= 0 ? prevOpen.indexOf(back) : hereIdx;
      if (opens.length) row = opens[Math.min(at, opens.length - 1)];
    }
    if (row && lost) row.focus({ preventScroll: true });
    here = null; hereIdx = -1;
    /* the one-time tip under the Needs you head, on a desk under 4 lifters (first-time-coach §8.4) */
    if (size() !== 'full' && $('#need [data-row]') && fn(DESK, 'tip')) DESK.tip('needs', $('#need-hd'), 'Worst first. Each button shows the change before it makes it.');
  }
  /* the day's done rows, as an archive: unfolded, the first one focused */
  function doneJump() {
    if (!foldOpen && $('[data-fold]')) { foldOpen = true; paint(); }
    var d = $('#need [data-row].is-done'); if (!d) return;
    d.focus({ preventScroll: true }); d.scrollIntoView({ block: 'nearest', behavior: 'auto' });
  }
  function rowEl(id) { return $$('#need [data-row]').filter(function (r) { return r.getAttribute('data-row') === id; })[0] || null; }
  PL.on('change', function () { if (DESK.pop.isOpen()) stale = true; else paint(); });
  DESK.on('pop:closed', function () {
    $$('#need .lrow.is-sel').forEach(function (r) { r.classList.remove('is-sel'); });
    if (stale) { stale = false; paint(); }
  });
  paint();

  /* ---------------- moves ---------------- */
  function openFix(btn) {
    var row = btn.closest('[data-row]'), id = btn.getAttribute('data-for'), item = btn.getAttribute('data-item'), act = btn.getAttribute('data-act'), rem = btn.getAttribute('data-reminder');
    if (rem) { if (fn(PL.reminders, 'done')) { var r = PL.reminders.done(rem); if (r && r.error) DESK.toast(r.error.message); else PL.toast(r); } return; }
    if (!item) {
      var x = PL.roster.needs().data.filter(function (y) { return y.id === id; })[0];
      if (x && x.fix && x.fix.go) DESK.go(x.fix.go.place, x.fix.go.hash + '&from=overview');
      return;
    }
    fixFor(btn, row, id, item, act);
  }
  /* the one way a case's move opens: the fix sheet grown from what was pressed, under its row */
  function fixFor(btn, row, id, item, act) {
    here = id; hereIdx = $$('#need [data-row]:not(.is-done)').indexOf(row);
    if (fn(DESK, 'tip') && DESK.tip.done) DESK.tip.done('needs');
    var opened = DESK.fix.open(btn, { itemId: item, actId: act, forId: id, anchor: row });
    if (opened && DESK.pop.isOpen()) row.classList.add('is-sel');
  }
  /* D: nothing to change. The case's keep move, previewed like any other (⌘↵ applies it); a case with none says so */
  function keepRow(row) {
    var id = row.getAttribute('data-row'), x = needsNow().filter(function (y) { return y.id === id; })[0]; if (!x || x.done) return;
    var it = itemOf(x), k = keepAct(it);
    if (!k) { DESK.toast(x.first + '’s case has no “keep as written”: E opens the fix, the ⋯ its other moves.'); return; }
    fixFor($('[data-fixbtn]', row) || row, row, id, it.id, k.id);
  }
  function rowMenu(btn) {
    var id = btn.getAttribute('data-more'), x = PL.roster.needs().data.filter(function (y) { return y.id === id; })[0]; if (!x) return;
    var items = menuOf(x); if (!items.length) return;
    DESK.menu.open(btn, items.map(function (m) { return { id: m.id, label: m.label, title: m.title, key: m.key || undefined }; }), {
      label: x.name, anchor: btn, place: 'below-end',
      run: function (k) {
        var m = items.filter(function (y) { return y.id === k; })[0]; if (!m) return;
        var row = btn.closest('[data-row]');
        if (m.id === 'open') { location.href = lifterHref(id, 'need'); return; }
        if (m.id === 'msg') { location.href = MESSAGES + '#id=' + encodeURIComponent(id); return; }
        if (/^act:/.test(m.id)) { fixFor(btn, row, id, m.item, m.act); return; }
        var r = m.id === 'notpain' ? PL.lifters.notPain(id) : PL.items.run(m.item, m.act, { for: id });
        if (r && r.error) DESK.toast(r.error.message); else PL.toast(r);
      }
    });
  }
  /* one way in for a lifter: the add sheet (first-time-coach §3), Invite first */
  function addLifter() { if (fn(DESK, 'addLifter')) DESK.addLifter({ from: 'overview' }); }

  document.addEventListener('click', function (e) {
    var t = e.target, b;
    if (!t.closest) return;
    if ((b = t.closest('[data-chart-pop]'))) { if (DESK.pop.justClosed(b)) return; openChart(b); return; }
    if ((b = t.closest('[data-add]'))) { addLifter(); return; }
    if ((b = t.closest('[data-setup-step]'))) { var st = setupStep(); if (st && st.key === b.getAttribute('data-setup-step')) DESK.setup.run(st.act, b); return; }
    if ((b = t.closest('[data-pop-close]'))) { DESK.pop.close(); return; }
    if ((b = t.closest('[data-all-send]'))) { sendAll(b.getAttribute('data-all-send')); return; }
    if ((b = t.closest('[data-meetmore]'))) { if (DESK.pop.justClosed(b)) return; meetMenu(b); return; }
    if ((b = t.closest('#need [data-more]'))) { if (DESK.pop.justClosed(b)) return; rowMenu(b); return; }
    if ((b = t.closest('#need [data-fixbtn]'))) { if (DESK.pop.justClosed(b)) return; openFix(b); return; }
    if ((b = t.closest('#need [data-undo]'))) { var r = PL.items.undo(b.getAttribute('data-undo')); if (r && r.error) DESK.toast(r.error.message); else if (r && r.meta && r.meta.label) DESK.toast(r.meta.label); return; }
    if ((b = t.closest('[data-fold]'))) { foldOpen = !foldOpen; paint(); return; }
    if ((b = t.closest('[data-showall]'))) { showAll = b.getAttribute('aria-expanded') !== 'true'; paint(); var sb = $('[data-showall]'); if (sb) sb.focus({ preventScroll: true }); return; }
    if ((b = t.closest('[data-donejump]'))) { doneJump(); return; }
    if ((b = t.closest('#today [data-row="sessions-today"]'))) { if (DESK.pop.justClosed(b)) return; trainingPop(b); return; }
    /* a Needs you row opens that lifter in Lifters, anywhere but its buttons and links */
    if ((b = t.closest('#need [data-row]')) && !t.closest('a, button')) { var a = $('a.nm', b); if (a) location.href = a.href; }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (t && t.matches && t.matches('[data-all-text]') && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); var s = $('[data-all-send]', DESK.pop.el()); if (s) sendAll(s.getAttribute('data-all-send')); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    var row = t && t.closest ? t.closest('#need [data-row]') : null;
    if (row && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); step(row, e.key === 'ArrowDown' ? 1 : -1); return; }
    if (row && t === row && e.key === 'Enter') { e.preventDefault(); var a = $('a.nm', row); if (a) location.href = a.href; return; }
    var free = !e.shiftKey && !document.querySelector('dialog[open]') && !DESK.pop.isOpen();
    if ((e.key === 'e' || e.key === 'E') && free) {
      /* on a case: its fix (the row's button); anywhere else: the walk through everyone (the crimson) */
      var fb = row && !row.classList.contains('is-done') ? $('[data-fixbtn]', row) : null;
      if (fb) { e.preventDefault(); openFix(fb); return; }
      var w = $('[data-walk]'); if (w && (w.getAttribute('href') || w.hasAttribute('data-setup-step'))) { e.preventDefault(); w.click(); }
      return;
    }
    if ((e.key === 'd' || e.key === 'D') && free && row && !row.classList.contains('is-done')) { e.preventDefault(); keepRow(row); return; }
  });
  /* ↑ ↓ (and ⌥↓ ⌥↑, J K) move between Needs you rows, instantly */
  function step(row, dir) {
    var rows = $$('#need [data-row]'), i = row ? rows.indexOf(row) : -1, nx = rows[i < 0 ? (dir > 0 ? 0 : rows.length - 1) : i + dir];
    /* past the fifth open case, the list opens on (an inbox never ends at its fold) */
    var opens = $$('#need [data-row]:not(.is-done)');
    if (dir > 0 && row && opens.length && row === opens[opens.length - 1] && !showAll && $('[data-showall]')) {
      var k = opens.length; showAll = true; paint(); nx = $$('#need [data-row]:not(.is-done)')[k] || null;
    }
    if (!nx) return;
    nx.focus({ preventScroll: true }); nx.scrollIntoView({ block: 'nearest', behavior: 'auto' });
  }
  DESK.listStepper = function (dir) {
    var a = document.activeElement, row = a && a.closest ? a.closest('#need [data-row]') : null;
    if (!row && a && a.closest && a.closest('#today, #msgs')) return false;
    step(row, dir); return true;
  };

  /* ---------------- the gate's states (§5.8) ---------------- */
  /* the states that end on the list show it whole: the Needs you card scrolled up under the band (it fits one window) */
  function showNeeds() {
    var sec = $('.sec.need'), tb = $('[data-crop=toolbar]'); if (!sec) return;
    var top = sec.getBoundingClientRect().top + window.scrollY - (tb ? tb.getBoundingClientRect().bottom : 0) - 4;
    window.scrollTo({ top: Math.max(0, top), behavior: 'instant' });
  }
  DESK.states({
    'all-done': function () {
      PL.roster.needs().data.filter(function (x) { return !x.done && x.fix; }).forEach(function (x) {
        var f = x.fix;
        if (f.reminderId) { if (fn(PL.reminders, 'done')) PL.reminders.done(f.reminderId); return; }
        if (!f.itemId) return;
        if (f.go) { PL.items.settle(f.itemId, { label: 'Seen, nothing to change' }); return; }
        var pv = data(PL.items.preview(f.itemId, f.actId, { for: x.id }));
        PL.items.run(f.itemId, f.actId, pv && pv.tell ? { for: x.id, text: pv.tell.text } : { for: x.id });
      });
      showNeeds();
    },
    'no-messages': function () {
      var r = PL.threads.list(), ids = r.meta && r.meta.groups ? r.meta.groups.waiting.slice() : [];
      ids.forEach(function (id) { PL.messages.send(id, { text: 'Read it, thanks. More from me tonight.' }); });
    },
    'board-weighed': function () {
      var m = PL.roster.today().data.meets[0]; if (m && fn(PL.meets, 'weighIns')) PL.meets.weighIns(m.id, m.ids, 'made');
      showNeeds();
    }
  });
  DESK.actions([{ title: 'Go through who needs you', run: function () { $('[data-walk]').click(); } }, { title: 'Add a lifter', run: addLifter }]);
})();
</script>
