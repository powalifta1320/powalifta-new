<title>Programs, POWALIFTA Coach</title>
<script>
/* a phone gets the coach's phone app: this desk is a laptop screen (22 Nov: at 393 px its menu filled the page and the
   rest overlapped). A phone held sideways counts too. ?desk=1 keeps the desk. */
(function () { try { if (window.matchMedia && matchMedia('(max-width: 760px), (pointer: coarse) and (max-height: 520px)').matches && !/[?&]desk=1\b/.test(location.search)) location.replace('/coach.html?demo=1'); } catch (e) {} })();
/* the sidebar's pin before any paint, so a desk kept open does not slide sideways as it loads (desk.js isPinned holds the same rule) */
(function () { try { var v = localStorage.getItem('powa-r6-side'); if (v === 'open' || (v !== 'fold' && window.matchMedia && matchMedia('(hover: none) and (min-width: 1100px)').matches)) document.documentElement.classList.add('side-pinned'); } catch (e) {} })();
/* the theme before any CSS: ?theme= wins, then powa-r6-theme (auto follows the Mac), else dark */
(function () { var t = null; var m = /[?&]theme=(light|dark)\b/.exec(location.search); if (m) t = m[1]; if (!t) { try { t = localStorage.getItem('powa-r6-theme'); } catch (e) { t = null; } } if (t === 'auto') { try { t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { t = 'dark'; } } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>
<!-- 22 Nov: the files this page's editor is made of carry a version (?v=). A browser that kept an older copy of one
     stylesheet beside a newer script drew the grid a column out with an unstyled button over it; a new address is
     never answered from an old copy. Change the number whenever one of these files changes. -->
<link rel="stylesheet" href="../kit/r6/tokens.css">
<link rel="stylesheet" href="../kit/r6/glass.css">
<link rel="stylesheet" href="../kit/r6/ui.css?v=1125c">
<link rel="stylesheet" href="../kit/r6/week.css?v=1125c">
<link rel="stylesheet" href="../kit/r6/sheet.css?v=1125c">
<link rel="stylesheet" href="../kit/r6/simple.css?v=1125c">
<link rel="stylesheet" href="../kit/r6/picker.css?v=1125c">
<link rel="stylesheet" href="../kit/r6/importer.css?v=1125c">
<link rel="stylesheet" href="../kit/r6/fix.css">
<link rel="stylesheet" href="../kit/r6/newcoach.css">
<link rel="stylesheet" href="../kit/r6/case.css">
<style>
  /* Programs (r6/spec-b/programs.md): the queue of weeks to write beside the week in hand. The queue is the desk's one
     list width and never hides; the detail is the lifter's header, flat on the floor, then one work card: the week bar,
     the grid (kit/r6/week.js), the week's note. Tokens only; layout widths in px.
     A week is a sheet: the window never scrolls (as Messages). The queue and the work card scroll on their own, so the
     list beside the week never moves and the status line, the column heads and the shape foot stay put while the rows
     scroll. Once the rows scroll past the header (or the coach works the grid by keys) the header folds: it collapses
     into the toolbar's title, and the week gets the window. A start panel, a template and all done are documents: they
     scroll with the window. */
  .pg .split { align-items: start; }
  .pg .pane-detail { padding-left: var(--sp-6); }
  /* the list column starts at the toolbar's foot, as every list does (PX3, PC16: one head height and one search top) */
  .pg .pane-list { height: calc(100dvh - var(--edge-h)); margin-top: calc(var(--sp-3) * -1); padding-top: 0; }
  .tb-slot { display: contents; }
  body.pg-frame { overflow: hidden; }
  body.pg-frame .page { padding-bottom: 0; }
  .pg-frame .pg .pane-detail { display: flex; flex-direction: column; height: calc(100dvh - var(--edge-h) - var(--sp-3)); min-height: 0; padding-bottom: var(--sp-4); }
  .pg-frame .pg .pane-detail > * { flex: none; }
  .pg-frame .pg .pane-detail > .wk { flex: 1 1 auto; min-height: 0; }
  .pg-frame .wk.is-rows { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  /* 22 Nov: the week bar holds at the card's top for good (it used to slide away, and the week on screen lost its
     name). The grid's own pinned lines sit under it: --wb-h is the bar's height, set after each paint (syncWbH). */
  .pg-frame .wk.is-rows > .wb { position: sticky; top: 0; z-index: 5; background: var(--card); border-radius: var(--r-card) var(--r-card) 0 0; }
  /* the Block view: the sheet is the pane that scrolls, both ways, its week heads and exercise names pinned inside it */
  .pg-frame .wk.is-sheet { display: flex; flex-direction: column; overflow: hidden; }
  .pg-frame .wk.is-sheet > #wg { --sx-top: 0px; --sx-reach: 0px; flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin;
    -webkit-mask-image: linear-gradient(var(--ink) calc(100% - var(--sp-5)), transparent); mask-image: linear-gradient(var(--ink) calc(100% - var(--sp-5)), transparent); }


  /* ---------------- the queue ---------------- */
  .ql { display: flex; flex-direction: column; gap: var(--sp-3); padding-right: var(--sp-1); }
  /* the list head (DESK.listHead, PX3) is the first group's own head; the search and New block… sit right under it */
  .ql-g > .lh[data-list-head] { gap: var(--sp-2); padding-right: 0; margin-bottom: var(--sp-3); }
  .ql-g > .lh[data-list-head] h2 { flex: none; }
  .ql-g > .lh[data-list-head] .seg > button { padding: 0 5px; }
  .ql-new { flex: none; height: 32px; padding: 0 var(--sp-2); }
  .ql-q { display: flex; align-items: center; gap: var(--sp-2); margin: 0 0 var(--sp-2); }
  .ql-q .field { flex: 1; min-width: 0; height: var(--ctl-h); }
  .ql-q .field::after { content: ''; }
  .ql-g { display: flex; flex-direction: column; }
  .ql-h { display: flex; align-items: baseline; gap: var(--sp-2); min-height: 32px; margin: var(--sp-3) var(--sp-4) var(--sp-1); color: var(--ink-2); font: 600 var(--fs-sub)/var(--lh-tight) var(--font); }
  .ql-line { margin: 0 var(--sp-4) var(--sp-2); color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .ql-h .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .ql-h .n.acc { color: color-mix(in srgb, var(--place-ink) 82%, var(--ink)); }   /* the count is small and thin: a shade deeper than the place ink, so it passes 4.5:1 on the lit floor */
  .ql-fold { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 40px; margin: var(--sp-2) 0 0; padding: 0 var(--sp-4); border: 0; border-radius: var(--r-row); background: none; color: var(--ink-2); font: 600 var(--fs-sub)/var(--lh-tight) var(--font); text-align: left; cursor: pointer; }
  .ql-fold .n { margin-left: var(--sp-2); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .ql-fold .sh { color: var(--ink); font: 600 var(--fs-label)/var(--lh-none) var(--font); }
  @media (hover: hover) and (pointer: fine) { .ql-fold:hover { background: var(--hover); } }
  .ql-sort { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-1) var(--sp-4) var(--sp-1); color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-none) var(--font); }
  .ql .lrow { min-height: 60px; padding: 10px var(--sp-4); }
  .ql .lrow .ctx.tw { color: var(--tone); }
  .ql .lrow.two { row-gap: 2px; }
  .ql .lrow .ctx { color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; }
  .ql .lrow[aria-current='true'] { background: var(--place-sel); }
  .ql .lrow[aria-current='true']::before, .ql .lrow[aria-current='true'] + .lrow::before { opacity: 0; }
  .ql .lrow .done-row { gap: var(--sp-2); }
  .ql .lrow .done-row .tk { flex: none; width: 6px; height: 11px; margin: 0 5px 3px 3px; border: solid var(--up); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .ql .lrow .done-row .btn { height: 28px; }
  .ql .qrow.is-done { grid-template-areas: 'n e' 't t' 'r r'; }
  .ql .qrow.is-done > .done-row { grid-column: 1 / -1; align-items: baseline; }
  .ql .qrow.is-done > .done-row .btn { margin-left: auto; }
  .ql .qrow.is-done .dw { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; text-overflow: clip; text-wrap: pretty; }
  .ql .qrow.is-done > .rc { grid-area: r; padding-left: 22px; color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); white-space: nowrap; }
  .ql-empty { margin: var(--sp-2) var(--sp-4); color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }
  .ql-pick { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin: var(--sp-2) var(--sp-4); color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }
  .ql-empty .link { margin-left: var(--sp-2); }
  .ql-foot { display: flex; margin: var(--sp-3) var(--sp-4) 0; }

  /* ---------------- the header: one band ---------------- */
  /* 22 Nov, after a cold review ("more than half the window is header"): the lifter, their block and their training
     maxes share one line, what they said is a slim strip under it, and nothing folds or jumps. A start panel, a
     template and All done keep the large title (they are documents, not a week being written). */
  .hd { margin: 0 var(--sp-1) var(--sp-3); }
  .hd h1 { margin: 0; font: 700 var(--fs-title)/var(--lh-title) var(--font); letter-spacing: var(--ls-title); text-wrap: balance; }
  .hd .facts { margin: 2px 0 0; color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); text-wrap: pretty; }
  .hd-top { display: flex; align-items: center; column-gap: var(--sp-3); min-height: var(--ctl-h); }
  .hd-top h1 { flex: none; max-width: 38%; overflow: hidden; font: 700 var(--fs-head)/var(--lh-head) var(--font); letter-spacing: var(--ls-head); white-space: nowrap; text-overflow: ellipsis; }
  .hd-top .facts { flex: 1 1 0; min-width: 0; margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .hd-line { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--sp-3); row-gap: var(--sp-2); margin-top: var(--sp-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .hd-line .say { color: var(--ink); text-wrap: pretty; }
  .hd-line .who { color: var(--ink-3); white-space: nowrap; }
  .hd-line .acts { display: inline-flex; flex-wrap: wrap; align-items: center; column-gap: var(--sp-2); row-gap: var(--sp-2); }
  .hd-line .done-say { color: var(--ink-2); }
  /* what the lifter said, and what can be done about it, where the coach reads it: the words take the room, the moves
     keep their size at the end of the line */
  .hd-words { flex-wrap: nowrap; align-items: center; min-height: var(--ctl-h); padding: var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-3); border-radius: var(--r-row); background: var(--fill); }
  .hd-words .say, .hd-words .done-say { flex: 1 1 auto; min-width: 0; padding: var(--sp-1) 0; }
  .hd-words .acts { flex: none; flex-wrap: nowrap; margin-left: auto; }
  .hd-words .link { background: var(--fill-2); }
  .hd-words .link.is-main { background: var(--ink); color: var(--card); }
  .hd .link, .wb .link {
    position: relative; height: 28px; padding: 0 var(--sp-3); border-radius: var(--r-pill); background: var(--fill); font: 600 var(--fs-label)/1 var(--font); text-decoration: none; white-space: nowrap;
    transition: background-color var(--dur-fast) var(--ease-out), transform var(--dur-press) var(--ease-out);
  }
  .hd .link::after, .wb .link::after { content: ''; position: absolute; inset: -6px 0; }
  .hd .link *, .wb .link * { text-decoration: none; }   /* a word the desk can explain keeps its meaning, not its underline, inside a button */
  .hd .link:active, .wb .link:active { transform: scale(var(--press)); }
  @media (hover: hover) and (pointer: fine) { .hd .link:hover, .wb .link:hover { background: var(--fill-2); } .hd-words .link:hover { background: var(--fill-3); } .hd-words .link.is-main:hover { background: var(--ink-2); } }
  .hd-limits { color: var(--ink-2); }
  /* the training maxes at the end of the lifter's line: three quiet numbers in their lifts' colours, each a button */
  .hd-maxes { flex: none; display: flex; align-items: center; column-gap: var(--sp-1); margin: 0; }
  .hd-maxes .mx { background: transparent; padding: 0 var(--sp-2); font-variant-numeric: tabular-nums; font-weight: 500; }
  .hd-maxes .mx b { font-weight: 700; }
  .hd-maxes .mx-use { color: var(--ink-2); }
  .hd-maxes .quiet { color: var(--ink-2); font-weight: 500; }
  .hd .composer { max-width: 640px; margin-top: var(--sp-2); }
  .hd .composer textarea.input { min-height: 76px; }
  .hd .composer .row { gap: var(--sp-3); }
  .hd .composer .kbd { color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-none) var(--font); }
  /* folded: the whole header collapses into the toolbar, where the title (the page's one h1) moves; a click on it opens
     the header again, and so does scrolling back past the week's top */
  .hd.is-folded { display: none; }
  .tb-h1 { margin: 0; min-width: 0; font: 600 var(--fs-head)/var(--lh-none) var(--font); letter-spacing: var(--ls-head); }
  /* the button's box is its words (so the title starts exactly on the large title's left, PX5); the hover fill is a
     ::before 8 px wider each side */
  .tb-h1 > button { position: relative; isolation: isolate; display: block; max-width: 320px; height: var(--ctl-h); margin: 0; padding: 0; overflow: visible; white-space: nowrap;
    border: 0; border-radius: var(--r-field); background: none; color: var(--ink); font: inherit; letter-spacing: inherit; cursor: pointer; }
  .tb-h1 > button > span { display: block; overflow: hidden; text-overflow: ellipsis; }
  .tb-h1 > button::before { content: ''; position: absolute; z-index: -1; inset: 0 calc(var(--sp-2) * -1); border-radius: var(--r-field); }
  @media (hover: hover) and (pointer: fine) { .tb-h1 > button:hover::before { background: var(--hover); } }
  /* Programs keeps its own toolbar h1 (the gate's one h1), so the shell's collapsed title takes no room in the lead */
  .tb-lead:has(#ttl-tb) .tb-title { display: none; }

  /* ---------------- the work card ---------------- */
  .wk { min-width: 0; }
  /* the week bar: the week, its dates and its one state word on the first line; what moved, what is held, what to check
     and what waits on a session on a quieter second line, only when there is any */
  .wb { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-bottom: 1px solid var(--line); }
  .wb-r1 { grid-column: 1; grid-row: 1; display: flex; align-items: center; column-gap: var(--sp-3); min-width: 0; min-height: 44px; padding: 0 0 0 var(--sp-3); }
  .wb-r2 { grid-column: 1 / -1; grid-row: 2; display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--sp-2); row-gap: var(--sp-1); min-height: 28px; margin-top: calc(var(--sp-1) * -1); padding: 0 var(--sp-4) var(--sp-2); }
  .wb > .wb-end { grid-column: 2; grid-row: 1; display: inline-flex; align-items: center; gap: 2px; margin-right: var(--sp-2); }
  .wb-end .wb-rule { width: 1px; height: 18px; margin: 0 var(--sp-1); background: var(--line-2); }
  .wk.is-compact .wb-r1 { min-height: 44px; }
  .wk.is-compact .wb-r2 { min-height: 24px; margin-top: calc(var(--sp-1) * -1); padding-bottom: var(--sp-1); }
  .wb h2 { margin: 0; font: 600 var(--fs-head)/var(--lh-head) var(--font); letter-spacing: var(--ls-head); white-space: nowrap; }
  .wb .wb-step { display: inline-flex; align-items: center; gap: 2px; min-width: 0; }
  .wb .wb-d, .wb .wb-st, .wb .wb-o { color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* the week's tags: its state first, then what kind of week it is (P21: one weight, one colour) */
  .wb .wb-st, .wb .wb-tag, .wb .wb-sep { color: var(--ink-3); font-weight: 400; }
  .wb .wb-tag, .wb .wb-sep { font: 400 var(--fs-sub)/var(--lh-sub) var(--font); white-space: nowrap; }
  .wb .wb-sep { margin: 0 calc(var(--sp-2) * -1); }
  .wb .wb-st.is-strong { color: var(--ink); font-weight: 600; }
  .wb .wb-w { color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .wb .link { height: 26px; }
  .wb .link.is-stop { background: var(--warn-tint); color: var(--warn); }
  /* 22 Nov, the Apple pass: one thing on each line carries weight, the rest is words. Beside the lifter's note the
     answer the desk suggests is the one filled button; Reply and Keep are words that light under the pointer. On the
     week bar what the desk noticed reads as a quiet line of words after the week's state (it was a row of pills the
     same weight as the buttons). The maxes are numbers in their lifts' colours; the offer beside them is words too. */
  .hd-words { background: var(--hover); }
  .hd-words .link:not(.is-main) { background: transparent; color: var(--ink-2); padding: 0 var(--sp-2); }
  .hd-maxes .mx-use { background: transparent; padding: 0 var(--sp-2); }
  .wb .wb-r1 .link:not(.is-stop):not(.wb-more), .wb .wb-r2 .link:not(.is-stop) { background: transparent; color: var(--ink-2); padding: 0 var(--sp-2); font-weight: 500; }
  .wb .wb-more { background: var(--fill); color: var(--ink-2); padding: 0 var(--sp-2); }
  .wb .wb-r1 .link[data-checks]:not(.is-stop):not(.wb-more), .wb .wb-r2 .link[data-checks]:not(.is-stop) { color: var(--warn); font-weight: 600; }   /* a flag keeps its colour: colour with a job */
  @media (hover: hover) and (pointer: fine) {
    .hd-words .link:not(.is-main):hover, .hd-maxes .mx-use:hover, .wb .wb-r1 .link:not(.is-stop):not(.wb-more):hover, .wb .wb-r2 .link:not(.is-stop):hover { background: var(--fill); color: var(--ink); }
  }
  .wb .btn.icon.sm { width: 30px; height: 30px; }
  .wb .btn.icon.sm svg { width: 18px; height: 18px; }

  .wk-f { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-4) var(--sp-6) var(--sp-5); border-top: 1px solid var(--line); }
  /* under a sheet the page is dimmed and inert: its pinned foot steps out of the way */
  #page[inert] .wg-shape { visibility: hidden; }
  /* a change's message: the words beside their label, one line until it needs more, so the change's own lines show */
  .wk-f.is-msg { display: grid; grid-template-columns: max-content minmax(0, 1fr); align-items: center; column-gap: var(--sp-4); row-gap: var(--sp-2); padding: var(--sp-3) var(--sp-6); border-top: 0; border-bottom: 1px solid var(--line); }
  .wk-f.is-msg > label { grid-column: 1; }
  .wk-f.is-msg > textarea, .wk-f.is-msg > .warn, .wk-f.is-msg > .tick { grid-column: 2; }
  .wk-f label { color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .wk-f textarea.input { width: 100%; min-height: 40px; max-height: 108px; padding: var(--sp-2) var(--sp-3); resize: none; field-sizing: content; }
  .wk-f .warn { margin: 0; color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .wk-f .tick { margin-top: var(--sp-1); }
  .wk-off { padding: var(--sp-6); color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }

  /* ---------------- start and run-in panels: the start panel is the work card, the intake flat beside it ---------------- */
  .sp { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: var(--sp-6); align-items: start; }
  .sp-c { padding: var(--sp-5) var(--sp-6) var(--sp-6); }
  .sp-c h2 { margin: 0 0 var(--sp-3); font: 600 var(--fs-head)/var(--lh-head) var(--font); letter-spacing: var(--ls-head); }
  .sp-opts { display: flex; flex-direction: column; margin: 0 calc(var(--sp-3) * -1); }
  .sp-opts.is-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: var(--sp-1); row-gap: 2px; }
  .sp-opts.is-two > .sp-sub { grid-column: 1 / -1; }
  .sp-opts.is-two > .sp-o::before { display: none; }
  .sp-opts.is-two > .sp-o { min-height: 44px; padding-top: 6px; padding-bottom: 6px; }
  .sp-c.is-first h2 { margin-bottom: var(--sp-2); }
  .sp-c.is-first .sp-sub { margin: var(--sp-2) 0 0; }
  .sp-c.is-first .sp-about { margin-top: var(--sp-3); }
  .sp-c.is-first .sp-ph { margin-top: var(--sp-3); }
  .sp-c.is-first .sp-kv { margin-top: var(--sp-4); padding-top: var(--sp-3); row-gap: var(--sp-1); }
  .sp-kv .k small { display: block; color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .sp-o { display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; column-gap: var(--sp-3); min-height: 48px; padding: var(--sp-2) var(--sp-3); border: 0; border-radius: var(--r-row); background: none; color: var(--ink); text-align: left; font: inherit; cursor: pointer; }
  .sp-o { position: relative; }
  .sp-o + .sp-o::before { content: ''; position: absolute; top: 0; left: var(--sp-3); right: var(--sp-3); height: 1px; background: var(--line); }
  .sp-o[aria-checked='true'] { background: var(--place-sel); }
  .sp-o[aria-checked='true']::before, .sp-o[aria-checked='true'] + .sp-o::before { opacity: 0; }
  @media (hover: hover) and (pointer: fine) { .sp-o:hover:not([aria-checked='true']) { background: var(--hover); } }
  .sp-o .rd { width: 18px; height: 18px; border-radius: var(--r-pill); border: 2px solid var(--ink-3); }
  .sp-o[aria-checked='true'] .rd { border: 5px solid var(--ink); }
  .sp-o .t { min-width: 0; }
  .sp-o b { display: block; font: 600 var(--fs-body)/var(--lh-tight) var(--font); }
  .sp-o small { display: block; margin-top: 2px; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-label) var(--font); }
  .sp-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); align-items: center; column-gap: var(--sp-3); row-gap: var(--sp-2); margin-top: var(--sp-5); padding-top: var(--sp-4); border-top: 1px solid var(--line); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }
  .sp-kv .k { color: var(--ink-2); }
  .sp-kv .v { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--sp-5); row-gap: var(--sp-1); }
  .sp-kv .v .mx { font-variant-numeric: tabular-nums; }
  .sp-in { padding-top: var(--sp-2); }
  .sp-in h3 { margin: 0 0 var(--sp-2); font: 600 var(--fs-head)/var(--lh-head) var(--font); }
  .sp-in .kvr .k { color: var(--ink-2); }
  .sp-in .kvr [data-lift] { color: var(--lc-ink); }
  .sp-in p { margin: var(--sp-3) 0 0; color: var(--ink); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; }
  .sp-in p .k { display: block; color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .sp-warn { margin: var(--sp-3) 0 0; color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  /* the first block (first-time-coach §7.2): who the pick suits and how it moves, its phases, the days, the maxes */
  .sp-sub { margin: var(--sp-3) 0 var(--sp-1); padding: 0 var(--sp-3); color: var(--ink-3); font: 600 var(--fs-label)/var(--lh-label) var(--font); }
  .sp-o[aria-disabled='true'] { cursor: default; }
  .sp-o[aria-disabled='true'] b { color: var(--ink-3); }
  .sp-about { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: var(--sp-4); row-gap: var(--sp-1); margin-top: var(--sp-4); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .sp-about .k { color: var(--ink-2); }
  .sp-about .v { color: var(--ink); text-wrap: pretty; }
  .sp-ph { margin-top: var(--sp-4); }
  .sp-days { display: inline-flex; flex-wrap: wrap; gap: var(--sp-1); }
  .sp-days > button { min-width: 40px; height: 36px; padding: 0 var(--sp-2); border: 1px solid var(--line-2); border-radius: var(--r-field); background: none; color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-none) var(--font); cursor: pointer; }
  .sp-days > button.is-hers { color: var(--ink); font-weight: 600; }
  .sp-days > button[aria-pressed='true'] { border-color: transparent; background: var(--ink); color: var(--card); }
  @media (hover: hover) and (pointer: fine) { .sp-days > button:not([aria-pressed='true']):hover { background: var(--hover); } }
  .sp-kv .v .n-of { color: var(--ink-2); }
  .sp-lifts { display: inline-flex; flex-wrap: wrap; column-gap: var(--sp-5); }
  .sp-lifts > button { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 36px; padding: 0; border: 0; background: none; color: var(--ink); font: 500 var(--fs-sub)/var(--lh-none) var(--font); cursor: pointer; }
  .sp-lifts > button .rd { width: 18px; height: 18px; border-radius: var(--r-pill); border: 2px solid var(--ink-3); }
  .sp-lifts > button[aria-checked='true'] .rd { border: 5px solid var(--ink); }
  .sp-old { grid-column: 2; margin: 0; color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .sp-kv .mx.link { font-size: var(--fs-sub); }
  /* New block… (P27): a search over the lifters, the list scrolling inside the menu */
  .pop .nb-q { margin-top: var(--sp-3); }
  .pop .nb-q .field { width: 100%; height: 36px; }
  .pop .nb-div { height: 1px; margin: var(--sp-3) 0 0; background: var(--line); }
  .pop .nb-l { max-height: 360px; }
  .pop .nb-l .pick:first-child { border-top: 0; }
  .pop .nb-l .pick.is-on { background: var(--hover); }
  .pop .nb-g { margin: var(--sp-3) 0 var(--sp-1); color: var(--ink-3); font: 600 var(--fs-label)/var(--lh-label) var(--font); }
  .pop .rl-rule { margin: var(--sp-2) 0 0; color: var(--ink); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; }
  .pop .rl-set { margin-top: var(--sp-3); }

  /* ---------------- a template: its weeks as written, read-only ---------------- */
  .tp-w { overflow-x: auto; }
  .tp-t { width: 100%; border-collapse: collapse; font: 500 var(--fs-sub)/var(--lh-label) var(--font); }
  .tp-t th, .tp-t td { height: 40px; padding: 0 var(--sp-3); border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  .tp-t th { color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-none) var(--font); border-bottom-color: var(--line-2); }
  .tp-t th:first-child, .tp-t td:first-child { padding-left: var(--sp-6); }
  .tp-t td { font-variant-numeric: tabular-nums; }
  .tp-t td.ex { font-weight: 600; }
  .tp-t td.ex.is-sub { color: var(--ink-2); font-weight: 500; padding-left: calc(var(--sp-6) + var(--sp-4)); }
  .tp-t tr.day td { height: 44px; color: var(--ink); font-weight: 600; border-top: 1px solid var(--line-2); }

  /* ---------------- all done ---------------- */
  .ad { padding: var(--sp-7) var(--sp-6); }
  .ad h2 { margin: 0; font: 700 var(--fs-title)/var(--lh-title) var(--font); letter-spacing: var(--ls-title); text-wrap: balance; }
  .ad p { margin: var(--sp-2) 0 0; color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }

  /* ---------------- the sheets: preview and import ---------------- */
  .shb { display: flex; flex-direction: column; max-height: var(--sheet-max); }
  .shb-h { padding: var(--sp-5) var(--sp-6) var(--sp-3); }
  .shb-h h2 { margin: 0; font: 700 var(--fs-title)/var(--lh-title) var(--font); letter-spacing: var(--ls-title); }
  .shb-h p { margin: var(--sp-1) 0 0; color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }
  .shb-b { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--sp-2) var(--sp-6) var(--sp-4);
    -webkit-mask-image: linear-gradient(transparent, var(--ink) var(--sp-3), var(--ink) calc(100% - var(--sp-4)), transparent); mask-image: linear-gradient(transparent, var(--ink) var(--sp-3), var(--ink) calc(100% - var(--sp-4)), transparent); }
  .shb-f { display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-3); padding: var(--sp-3) var(--sp-6) var(--sp-5); border-top: 1px solid var(--line); }
  .shb-f .grow { color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .pv-days { margin: 0 0 var(--sp-4); }
  .pv-days.is-two > button { flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; height: auto; padding: 7px 14px; line-height: var(--lh-tight); }
  .pv-ph h3 { margin: 0; font: 600 var(--fs-head)/var(--lh-head) var(--font); }
  .pv-ph .when { margin: 2px 0 var(--sp-3); color: var(--ink-2); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .pv-ph .wnote { margin: 0 0 var(--sp-3); color: var(--ink); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }
  .pv-ex { padding: var(--sp-3) 0; border-top: 1px solid var(--line); }
  .shb-b .pv-wks { display: flex; width: fit-content; max-width: 100%; margin-bottom: var(--sp-3); }
  .pv-ex b { display: block; font: 600 var(--fs-sub)/var(--lh-label) var(--font); }
  .pv-ex p { margin: 2px 0 0; color: var(--ink); font: 500 var(--fs-sub)/var(--lh-label) var(--font); font-variant-numeric: tabular-nums; }
  .pv-ex p .nm { color: var(--ink-2); }
  .pv-ex p.cue { color: var(--ink-2); }
  .pv-ex p.was { color: var(--ink-3); font-size: var(--fs-label); }
  .im-drop { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); }
  .im-paste { width: 100%; margin-top: var(--sp-3); }
  .im-paste textarea.input { width: 100%; min-height: 76px; max-height: 160px; }
  .im-h { margin: var(--sp-5) 0 var(--sp-2); font: 600 var(--fs-sub)/var(--lh-label) var(--font); }
  .im-map { display: grid; grid-template-columns: minmax(0, 1fr) 180px; align-items: center; column-gap: var(--sp-3); min-height: 44px; border-top: 1px solid var(--line); }
  .im-map .k { font: 500 var(--fs-sub)/var(--lh-label) var(--font); }
  .im-map select { height: var(--ctl-h); padding: 0 var(--sp-2); border: 0; border-radius: var(--r-field); background: var(--fill); color: var(--ink); font: 500 var(--fs-sub)/var(--lh-none) var(--font); }
  .im-read { margin: var(--sp-1) 0 0; color: var(--ink); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }
  .im-tabs { margin: 0; padding: 0; list-style: none; }
  .im-tabs li { display: flex; justify-content: space-between; gap: var(--sp-3); min-height: 40px; align-items: center; border-top: 1px solid var(--line); font: 500 var(--fs-sub)/var(--lh-label) var(--font); }
  .im-tabs li span { color: var(--ink-2); }
  .im-to { display: flex; flex-direction: column; }
  .im-to .sp-o { margin: 0 calc(var(--sp-3) * -1); }
  .im-wk { display: inline-flex; align-items: center; gap: var(--sp-1); }
  .im-wk .btn { height: 28px; }
  .im-to .sp-o .t { display: flex; align-items: center; gap: var(--sp-2); }
  .im-to [data-imp-lifter] { margin-left: auto; color: var(--ink-2); font-weight: 500; }
  .im-why { margin: var(--sp-2) 0 0; color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); }

  /* ---------------- a submenu beside its menu ---------------- */
  .pop.subm { width: 240px; padding: var(--sp-3); }
  .mi .mi-sub { color: var(--ink-3); font: 600 var(--fs-sub)/var(--lh-none) var(--font); }
  .pop .mxp .row-f .input { width: 112px; }
  .pop .mxp .e1 { margin-top: var(--sp-3); }
  .pop .mxp .e1 .kv { padding: 7px 0; }
  .pop .mxp .e1 .kv.is-mid b { color: var(--ink); }
  .pop .mxp .e1 .kv:not(.is-mid) b { color: var(--ink-2); font-weight: 500; }
  .pop .mxp .err { margin-top: var(--sp-2); }
  .pop .nm-f .input { width: 100%; text-align: left; }
  .pop .row-f .input.lf-felt { width: 64px; }
  .sp-kv .tick { margin-top: 0; }
  .pop .pick-l { display: flex; flex-direction: column; }

  /* ================= 22 Nov, the redo (owner: "redo it all ... from a professional coach's perspective") =================
     The lifter is a band: the face, the name over where they are in the block, and the three training maxes as labelled
     numbers. What they said is one notice with the kind of case as a tag and real buttons. The week bar shows the whole
     block as a strip of weeks, so the coach sees where the week sits and jumps to any other in one click. The list
     wears faces, as every list of people on the desk does. */
  .ql .qrow.has-ph { grid-template-columns: 32px minmax(0, 1fr) auto; grid-template-areas: 'p n e' 'p t t'; column-gap: var(--sp-3); }
  .ql .qrow.has-ph > .ph { grid-area: p; align-self: center; }
  .ph.ph-team { display: inline-grid; place-items: center; background: var(--fill-2); color: var(--ink-2); }
  .ph.ph-team svg { width: 16px; height: 16px; }
  .ql .qrow .why .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 22px; }
  .ql .qrow .why .tg { display: inline-block; max-width: none; margin-left: var(--sp-1); padding: 0 7px; line-height: 18px; vertical-align: 1px; }
  .ql .lrow.qrow { min-height: 64px; }
  .hd { margin-bottom: var(--sp-2); }
  .hd-line { margin-top: var(--sp-2); }
  .hd-top { column-gap: var(--sp-3); min-height: 44px; }
  .hd-top > .ph { flex: none; }
  .hd-id { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .hd-top h1 { max-width: 100%; font: 700 var(--fs-title)/var(--lh-tight) var(--font); letter-spacing: var(--ls-title); }
  .hd-top h1 { line-height: var(--lh-none); }
  .hd-top .facts { flex: none; display: flex; align-items: center; min-width: 0; column-gap: var(--sp-3); color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-tight) var(--font); }
  .hd-top .facts > span { flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .hd-top .facts > span + span { flex: 0 2 auto; padding-left: var(--sp-3); border-left: 1px solid var(--line-2); color: var(--ink-3); }
  /* the training maxes: the lift's name in its colour over the number the loads are worked out from; each opens its popover */
  .hd-maxes { align-items: stretch; column-gap: 2px; }
  .hd-maxes .mx-cap { align-self: center; margin-right: var(--sp-2); color: var(--ink-3); font: 400 var(--fs-label)/var(--lh-tight) var(--font); white-space: nowrap; }
  .hd .hd-maxes .mx { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; height: 44px; min-width: 72px; padding: 0 var(--sp-3); border-radius: var(--r-row); background: transparent; font-size: 0; }
  .hd-maxes .mx .mx-l { color: var(--lc-ink); font: 600 var(--fs-cap)/1 var(--font); }
  .hd-maxes .mx b, .hd-maxes .mx .quiet { color: var(--ink); font: 700 var(--fs-head)/1 var(--font); font-stretch: var(--num-stretch); font-variant-numeric: tabular-nums; letter-spacing: var(--ls-head); }
  .hd-maxes .mx .quiet { color: var(--ink-3); font-weight: 500; font-size: var(--fs-sub); font-stretch: 100%; }
  .hd-maxes .mx-use { align-self: center; }
  @media (max-width: 1400px) { .hd-maxes .mx-cap { display: none; } }
  /* what the lifter said: the kind of case, their words, then the answers as buttons (the suggested one filled) */
  .hd-words { column-gap: var(--sp-3); min-height: 36px; padding: 2px 2px 2px var(--sp-3); background: var(--fill); }
  .hd-words .say { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .hd-words > .tg { flex: none; max-width: none; }
  .hd-words .say { font: 500 var(--fs-sub)/var(--lh-tight) var(--font); }
  .hd-words .acts { column-gap: var(--sp-2); }
  .hd-words .btn.is-main { background: var(--ink); color: var(--card); box-shadow: none; }
  @media (hover: hover) and (pointer: fine) { .hd-words .btn.is-main:hover:not(:disabled) { background: var(--ink-2); } }
  /* the block as a strip: one mark a week */
  .wb-blk { display: inline-flex; align-items: center; gap: 3px; flex: none; }
  .wb-wk { position: relative; width: 26px; height: 26px; padding: 0; border: 0; border-radius: var(--sp-2); background: var(--fill); color: var(--ink-3); font: 600 var(--fs-cap)/1 var(--font); font-variant-numeric: tabular-nums; cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out), transform var(--dur-press) var(--ease-out); }
  .wb-wk::after { content: ''; position: absolute; inset: -7px -1px; }
  .wb-wk[data-st='lifted'] { background: var(--up-tint); color: var(--up); }
  .wb-wk[data-st='now'] { background: var(--fill-3); color: var(--ink); }
  .wb-wk[data-st='sent'] { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-2); }
  .wb-wk[aria-current='true'] { background: var(--ink); color: var(--card); box-shadow: none; }
  .wb-wk:active { transform: scale(var(--press)); }
  .wb-wk:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { .wb-wk:not([aria-current='true']):hover { background: var(--fill-2); color: var(--ink); } }
  @media (prefers-reduced-motion: reduce) { .wb-wk { transition: none; } }
  .wb .wb-st.tg { flex: none; max-width: none; font: 600 var(--fs-cap)/var(--lh-cap) var(--font); }
  .wb .wb-st.tg:not([data-tone]) { color: var(--ink-2); }
  .wb-r1 { column-gap: var(--sp-3); min-height: 40px; }
  /* Simple: a step larger and calmer. The day is a heading with its date beside it; lifts are 15 px, fields 32 px tall */
  .sv-dh h3 { font: 700 var(--fs-body)/var(--lh-tight) var(--font); letter-spacing: var(--ls-head); }
  .sv-dd { color: var(--ink-2); font: 400 var(--fs-label)/var(--lh-tight) var(--font); }
  .sv-name { height: 32px; font-size: var(--fs-sub); }
  .sv-sub { font-size: var(--fs-label); }
  .sv-var { font-size: var(--fs-label); }
  .sv-in { height: 32px; font-size: var(--fs-sub); }
  .sv-in.sv-note { font-size: var(--fs-label); }
  .sv-last { color: var(--ink-2); }
  /* the week's shape at the grid's foot: the label, then each lift as its name in its colour and its number */
  .wg-shape-t .ws-g { display: inline-flex; align-items: baseline; gap: var(--sp-3); margin-right: var(--sp-5); }
  .wg-shape-t .wg-sl { color: var(--ink-3); }
  .wg-shape-t .ws-i { display: inline-flex; align-items: baseline; gap: 5px; }
  .wg-shape-t .ws-i small { color: var(--lc-ink); font: 600 var(--fs-cap)/1 var(--font); }
  .wg-shape-t .ws-i b { color: var(--ink); font: 700 var(--fs-label)/1 var(--font); font-stretch: var(--num-stretch); font-variant-numeric: tabular-nums; }
  .wg-shape-t .ws-i i { color: var(--ink-3); font: 500 var(--fs-cap)/1 var(--font); font-style: normal; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .sp-o, .ql-fold { transition: none; } }
  /* 23 Nov, how it feels: the send lands where the coach is looking. For a moment the crimson says "Sent to Mei" with a
     check drawn in, at the width it had, while the next lifter's week opens under it; a press in that moment does
     nothing (sentFlash). The check and the words are a one-time moment, so keyframes; reduced motion shows them still. */
  .tb .btn[data-primary].is-sent { gap: var(--sp-2); justify-content: center; cursor: default; }
  .tb .btn[data-primary].is-sent:hover { filter: none; }
  .btn.is-sent svg { flex: none; width: 16px; height: 16px; }
  .btn.is-sent svg path { stroke-dasharray: 22; animation: pg-tick var(--dur-move, 220ms) var(--ease-out) both; }
  .btn.is-sent span { animation: pg-sent var(--dur-fast, 150ms) var(--ease-out) both; }
  @keyframes pg-tick { from { stroke-dashoffset: 22; } to { stroke-dashoffset: 0; } }
  @keyframes pg-sent { from { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .btn.is-sent svg path, .btn.is-sent span { animation: none; } }

  /* ================= 23 Nov, the upgrade by Hick, Fitts and Jakob: same look, fewer choices at a time ================= */
  /* one mode switch: Simple | Advanced, and inside Advanced its Week | Block, joined on one pill so it reads as one control */
  .pg-mode { display: inline-flex; align-items: center; border-radius: var(--r-pill); }
  .pg-mode .seg > button[data-mode] svg { width: 15px; height: 15px; }
  .pg-mode.is-adv { gap: 2px; background: var(--fill); }
  .pg-mode.is-adv > .seg { background: transparent; }
  .pg-mode.is-adv > .seg-sub { position: relative; padding-left: 7px; }
  .pg-mode.is-adv > .seg-sub::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 1px; background: var(--line-2); }
  /* the queue: what is due this week leads; next week's, what went and everyone else fold to a count */
  .ql-fold.is-sub { min-height: 36px; margin-top: var(--sp-1); }
  /* what the lifter said: the one recommended answer, then Other options (a menu) */
  .hd-words .hd-more { display: inline-flex; align-items: center; gap: 4px; }
  .hd-words .hd-more svg { width: 12px; height: 12px; }
  /* the week's name and its arrows never shrink under the strip of weeks (at 1280 with the sidebar pinned the arrow sat
     on week 1); the dates give way first, with an ellipsis */
  .wb .wb-step { flex: none; }
  .wb .wb-d { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* Fitts: the block's week marks are 32 px targets (26 px marks, the rest invisible) */
  .wb-wk::after { inset: -9px -2px; }
  /* the start panel: the pick's recommended tag and what Create makes, in one line above it */
  .sp-o .rec { margin-left: var(--sp-2); color: var(--ink-3); font: 500 var(--fs-cap)/1 var(--font); }
  .sp-make { margin: var(--sp-4) 0 0; padding: var(--sp-3) var(--sp-3); border-radius: var(--r-row); background: var(--fill); color: var(--ink); font: 500 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; }
  .sp-make b { font-weight: 600; }
  .sp-make .k { display: block; margin-bottom: 2px; color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .pop .nb-rec { margin: var(--sp-3) 0 var(--sp-1); color: var(--ink-3); font: 600 var(--fs-label)/var(--lh-label) var(--font); }
  .pop .nb-l .pick.is-on { background: var(--hover); }
