<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Overview, POWALIFTA Coach</title>
<script>
/* the theme before any CSS: ?theme= wins, then powa-r6-theme, else dark */
(function () { var t = null; var m = /[?&]theme=(light|dark)\b/.exec(location.search); if (m) t = m[1]; if (!t) { try { t = localStorage.getItem('powa-r6-theme'); } catch (e) { t = null; } } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>
<link rel="stylesheet" href="../kit/r6/tokens.css">
<style>html, body { margin: 0; min-height: 100dvh; background-color: var(--floor); }</style>
<script>
/* roster.html, the round-6 Roster, is now two places (overview-lifters.md §3.2, shared.md §7):
     no id and no f      → overview.html
     f=<x> (query/hash)  → lifters.html#f=<x>, where msg becomes waiting and every other filter name stays
     id=<lifter>         → lifters.html#id=<lifter> (plus f when given)
   The Lifters parameters go into the hash. reset, theme, probe and anything unknown travel where they were (query or
   hash). location.replace leaves no history entry. */
(function () {
  var PAGE = /^(id|f|tab|q|sort|view|from)$/;
  var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var p = {}, query = new URLSearchParams(), rest = new URLSearchParams();
  q.forEach(function (v, k) { if (PAGE.test(k)) p[k] = v; else query.append(k, v); });
  h.forEach(function (v, k) { if (PAGE.test(k)) p[k] = v; else rest.append(k, v); });
  if (p.f === 'msg') p.f = 'waiting';
  var lifters = !!(p.id || p.f), hash = new URLSearchParams();
  if (lifters) ['id', 'f', 'tab', 'q', 'sort', 'view', 'from'].forEach(function (k) { if (p[k] != null && p[k] !== '') hash.set(k, p[k]); });
  rest.forEach(function (v, k) { hash.append(k, v); });
  var qs = query.toString(), hs = hash.toString();
  location.replace((lifters ? 'lifters.html' : 'overview.html') + (qs ? '?' + qs : '') + (hs ? '#' + hs : ''));
})();
</script>
</head>
<body>
<noscript><a href="overview.html">Open the Overview</a></noscript>
</body>
</html>
