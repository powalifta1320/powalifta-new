<style>
  /* Settings (screens.md §8): the sections in a list that never hides, the chosen section beside it. One card a screen
     (the section's work), groups inside it under 18/600 titles, rows on hairlines. No crimson on this page. Tokens only. */
  .page { padding-bottom: 0; }
  .st { align-items: start; }
  .sl { position: sticky; top: calc(var(--edge-h) + var(--sp-3)); display: flex; flex-direction: column; gap: var(--sp-5); min-width: 0; padding: 0 var(--sp-4) var(--sp-6) 0; }
  .sl h1 { margin: 0 var(--sp-3); font: 700 var(--fs-large)/var(--lh-large) var(--font); letter-spacing: var(--ls-large); }
  .sl-l { display: flex; flex-direction: column; gap: 2px; }
  .si {
    position: relative; display: flex; align-items: center; min-height: 44px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-row);
    background: none; color: var(--ink-2); font: 500 var(--fs-body)/var(--lh-tight) var(--font); text-align: left; cursor: pointer; outline: 0;
    transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);

  .sx { max-width: 760px; }

  .sx-c { padding: var(--sp-2) var(--sp-6) var(--sp-4); }

  .line { margin: var(--sp-2) 0 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); text-wrap: pretty; }
  .line.q { color: var(--ink-3); }
  .err { margin: var(--sp-1) 0 0; color: var(--warn); font: 500 var(--fs-label)/var(--lh-label) var(--font); }

  /* a switch: on wears the place's colour (a choice made, as a chosen row), off is the quiet fill */
  .sw { position: relative; flex: none; width: 44px; height: 26px; padding: 0; border: 0; border-radius: var(--r-pill); background: var(--fill-2); cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out), transform var(--dur-press) var(--ease-out); }
  .sw::after { content: ''; position: absolute; inset: -7px -2px; }
  .sw i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: var(--r-pill); background: var(--ink-2); transition: transform var(--dur-snap) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
  .sw[aria-checked='true'] { background: var(--place); }
  .sw[aria-checked='true'] i { transform: translateX(18px); background: var(--card); }
  .sw:active { transform: scale(var(--press)); }

  /* Plan and seats */
  .plan { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-4); padding: var(--sp-3) 0 var(--sp-4); }
  .plan .nm { display: block; font: 800 var(--fs-num)/var(--lh-num) var(--font); letter-spacing: var(--ls-num); }
  .plan .pr { display: block; margin-top: var(--sp-1); color: var(--ink-2); font: 400 var(--fs-body)/var(--lh-body) var(--font); font-variant-numeric: tabular-nums; }
  .plan .used { color: var(--ink-2); font: 400 var(--fs-body)/var(--lh-body) var(--font); white-space: nowrap; }
  .plan .used b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .plan-n { margin: 0 0 var(--sp-3); color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  /* P48: Plans sits 32 px under the rows above it */
  .gh.plans { margin-top: var(--sp-7); }
  /* a quiet action's words end on the section's right edge, like the links beside it (P48) */
  .row .end .mv:last-child, .sx .tbl td:last-child .mv { margin-right: calc(var(--sp-2) * -1); }
  .seats .row:first-child { border-top: 1px solid var(--line); }
  .sx .tbl td { height: 48px; }
  .sx .tbl th { height: 36px; }
  .sx .tbl td:first-child, .sx .tbl th:first-child { padding-left: 0; }
  .sx .tbl td:last-child, .sx .tbl th:last-child { padding-right: 0; text-align: right; }

  .pk th small { display: block; color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-tight) var(--font); }

  .pk td { padding-top: var(--sp-1); padding-bottom: var(--sp-1); height: 56px; }

  .cv {

    border: 0; border-radius: var(--r-field); background: none; color: var(--ink); font: 500 var(--fs-sub)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; text-align: left; cursor: text;
    transition: background-color var(--dur-fast) var(--ease-out);
  }
  .cv.nm { font-weight: 600; }
  .cv.add { color: var(--ink-3); }
  .cv span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (hover: hover) and (pointer: fine) { .cv:hover { background: var(--fill); } }
  .ci { width: 100%; min-width: 0; }
  .csel { width: 100%; height: 36px; margin: 0 calc(var(--sp-2) * -1); padding: 0 var(--sp-1); border: 0; border-radius: var(--r-field); background: transparent; color: var(--ink); font: 500 var(--fs-sub)/var(--lh-tight) var(--font); cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out); }
  .csel option { background: var(--pop); color: var(--ink); }
  @media (hover: hover) and (pointer: fine) { .csel:hover { background: var(--fill); } }
  .pk tr.new td { vertical-align: top; padding-top: var(--sp-2); }

  .foot { display: flex; align-items: center; gap: var(--sp-2); min-height: 52px; margin-top: var(--sp-1); border-top: 1px solid var(--line); }

  /* Payment reminders and Your words: words you write, the buttons that insert a name, the message as it goes out */
  .ta { display: block; width: 100%; }
  .ins { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-2); margin-top: var(--sp-2); }
  .ins .lb { color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .pv { margin-top: var(--sp-4); }
  .pv .to { display: block; margin: 0 0 var(--sp-2); color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .pv .bubble, #wd-pv .bubble { max-width: 560px; }
  .pvh { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-top: var(--sp-3); padding-top: var(--sp-2); border-top: 1px solid var(--line); }
  .pvh .to { margin: 0; min-width: 0; color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .pvh .ins { margin: 0; }
  #wd-pv { margin-top: var(--sp-1); }
  .num { width: 64px; text-align: right; }
  .tm { width: 104px; }

  /* Loads and rules: the rules read as sentences with their numbers in them */
  .rl { margin: var(--sp-2) 0 0; color: var(--ink); font: 500 var(--fs-body)/calc(var(--ctl-h) + var(--sp-3)) var(--font); text-wrap: pretty; }
  .rl .input { width: 60px; height: 34px; margin: 0 2px; text-align: right; vertical-align: middle; }
  .rl + .line { margin-top: 0; }
  .rl-g + .rl-g { margin-top: var(--sp-3); padding-top: var(--sp-2); border-top: 1px solid var(--line); }
  .seg-row { padding: var(--sp-1) 0 var(--sp-1); }

  /* Your words */
  .wd .row { grid-template-columns: 196px minmax(0, 1fr); }
  .wd .row .input { width: 100%; }
  .wd .row .link { justify-self: start; }
  .sv .row { grid-template-columns: minmax(0, 1fr) auto; }
  .sv .row .s { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sv-ed { display: grid; gap: var(--sp-2); padding: var(--sp-3) 0; }
  .sv-ed .input { width: 100%; }
  .sv-ed .acts { display: flex; gap: var(--sp-2); }
  .sv-ed + .row, .row + .sv-ed, .ghr + .sv > .row:first-child, .ghr + .sv > .sv-ed:first-child { border-top: 1px solid var(--line); }

  /* a switch row toggles from anywhere on it (F8.4) */
  .row.swr { cursor: pointer; }
  /* Intake: what every lifter is asked, read-only */
  .row.ro .t { color: var(--ink-2); font-weight: 400; }
  .qadd { display: flex; gap: var(--sp-2); padding: var(--sp-3) 0 var(--sp-1); border-top: 1px solid var(--line); }
  .qadd .input { flex: 1; min-width: 0; }
  .pk .wk { width: 100%; margin-top: var(--sp-1); }

<body data-place="settings">

</div>

<script>
(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };
  var fn = function (o, k) { return !!o && typeof o[k] === 'function'; };
  var data = function (r) { return r && !r.error ? r.data : null; };
  var nf = function (v) { return v == null || v === '' || isNaN(v) ? '' : String(Math.round(Number(v) * 100) / 100); };   /* exact: 1.25 stays 1.25 */
  /* the store writes a typographer's apostrophe; this page writes the plain one throughout */
  var plain = function (s) { return String(s || '').replace(/[’‘]/g, '\''); };
  var LIFTS = ['squat', 'bench', 'deadlift'];

  var SECTIONS = [['plan', 'Plan and seats'], ['packages', 'Packages'], ['intake', 'Intake'], ['reminders', 'Payment reminders'], ['loads', 'Loads and rules'], ['words', 'Your words'], ['notifications', 'Notifications'], ['appearance', 'Appearance'], ['help', 'Help']];
  var LABEL = {}; SECTIONS.forEach(function (s) { LABEL[s[0]] = s[1]; });
  var SYM = { USD: '$', GBP: '£', EUR: '€', CAD: 'CA$', AUD: 'A$' };
  var CURS = ['USD', 'GBP', 'EUR', 'CAD', 'AUD'];
  var EVERY = [['weekly', 'Week'], ['fortnightly', '2 weeks'], ['4-weekly', '4 weeks'], ['monthly', 'Month'], ['quarterly', 'Quarter'], ['yearly', 'Year'], ['once', 'Once (fixed price)']];
  var DELOADS = [['half-easier', 'Half the sets, 1.5 easier'], ['half', 'Half the sets, same RPE'], ['easier', 'Same sets, 1.5 easier']];
  var STEPS = [2.5, 1.25, 0.5];
  /* your drafts, one per kind of fix; each previews on the first lifter the desk has that fix for */
  var KINDS = [['move', 'Move a session', ['move']], ['swap', 'Swap a lift', ['swap']], ['cap', 'Cap at an RPE', ['cap']], ['light', 'Make the week lighter', ['light']], ['checkin', 'Check in', ['nudge']], ['attempts', 'Attempts', ['safe']]];
  var TOKENS = [['{first}', 'First name'], ['{day}', 'Day'], ['{load}', 'Load'], ['{lift}', 'Lift']];
  var RM_TOKENS = [['{first}', 'First name'], ['{amount}', 'Amount'], ['{due}', 'Due date'], ['{link}', 'Payment link']];

  /* what the coach has open: the section, a cell in edit, a new package, a saved reply in edit; kept across redraws */
  var ui = { s: 'plan', edit: null, editErr: '', addPkg: null, addErr: '', wordKind: 'move', reply: null, replyErr: '', rulesErr: '', rmErr: '' };

  var ordinal = function (n) { var w = ['', 'first', 'second', 'third', '4th', '5th', '6th', '7th', '8th', '9th', '10th', '11th']; return w[n] || n + 'th'; };
  var money = function (v, cur) { var s = Number(v) % 1 ? Number(v).toFixed(2) : Number(v).toLocaleString('en-US'); return (SYM[cur] || '$') + s; };
  var settings = function () { return fn(PL.settings, 'get') ? data(PL.settings.get()) : null; };
  var bsum = function () { return fn(PL.billing, 'summary') ? data(PL.billing.summary()) : null; };
  var pkgs = function () { return fn(PL.billing, 'packages') ? data(PL.billing.packages()) || [] : []; };

  /* every write: the store's words in a toast with its Undo (the store decides what Undo does) */

  function save(patch, text) {

    var r = PL.settings.set(patch);

  /* ---------------- the toolbar and the list ---------------- */
  DESK.mount({ place: 'settings', title: 'Settings' });
  DESK.keyMap([['↑ ↓', 'Move between sections in the list'], ['Enter', 'Save the field'], ['Esc', 'Put the field back']]);

    { title: 'Add a package', run: function () { go('packages'); startPkg(); } },
    { title: 'Add a saved reply', run: function () { go('words'); startReply(); } }
  ]));

  function paintList() {
    $('#sl').innerHTML = SECTIONS.map(function (s) {
      var on = s[0] === ui.s;
      return '<button class="si" type="button" role="tab" id="tab-' + s[0] + '" data-row="' + s[0] + '" aria-selected="' + on + '" aria-controls="sx" tabindex="' + (on ? 0 : -1) + '"><span data-fact="name">' + s[1] + '</span></button>';
    }).join('');
  }
  function fromHash() { var s = DESK.url.get().s; return LABEL[s] ? s : 'plan'; }
  function go(s, focusTab) {

    var moved = s !== ui.s;
    ui.s = s; ui.edit = null; ui.editErr = '';
    if (DESK.url.get().s !== s) DESK.url.set({ s: s });
    paintList(); render();
    if (moved) scrollTo(0, 0);
    if (focusTab) { var t = $('#tab-' + s); if (t) t.focus({ preventScroll: true }); }
  }
  $('#sl').addEventListener('click', function (e) { var b = e.target.closest('[data-row]'); if (b) go(b.getAttribute('data-row'), document.activeElement && document.activeElement.closest('#sl')); });
  $('#sl').addEventListener('keydown', function (e) {
    var i = SECTIONS.map(function (s) { return s[0]; }).indexOf(ui.s), n = SECTIONS.length, to = null;
    if (e.key === 'ArrowDown') to = (i + 1) % n; else if (e.key === 'ArrowUp') to = (i - 1 + n) % n; else if (e.key === 'Home') to = 0; else if (e.key === 'End') to = n - 1;
    if (to == null) return;
    e.preventDefault(); go(SECTIONS[to][0], true);
  });
  addEventListener('hashchange', function () { var s = fromHash(); if (s !== ui.s) go(s); });

  /* ---------------- drawing a section, keeping the coach's place ---------------- */
  var row = function (t, s, end, o) { o = o || {}; return '<div class="row' + (o.cls ? ' ' + o.cls : '') + '"' + (o.id ? ' id="' + o.id + '"' : '') + '><div class="t"' + (o.tid ? ' id="' + o.tid + '"' : '') + '>' + t + (s ? '<span class="s' + (o.cut ? ' cut' : '') + '"' + (o.title ? ' data-ellipsis title="' + esc(o.title) + '"' : '') + (o.quote ? ' data-quote' : '') + '>' + s + '</span>' : '') + '</div>' + (end != null ? '<div class="end">' + end + '</div>' : '') + '</div>'; };
  var sw = function (k, on, label, o) { o = o || {}; return '<button class="sw" type="button" role="switch" aria-checked="' + !!on + '" data-k="' + k + '"' + (label ? ' aria-label="' + esc(label) + '"' : '') + (o.by ? ' aria-labelledby="' + o.by + '"' : '') + '><i></i></button>'; };
  var seg = function (k, items, cur, label) { return '<div class="seg" role="group" aria-label="' + esc(label) + '" data-seg="' + k + '">' + items.map(function (x) { return '<button type="button" data-k="' + k + ':' + x[0] + '" data-v="' + x[0] + '" aria-pressed="' + (String(x[0]) === String(cur)) + '">' + esc(x[1]) + '</button>'; }).join('') + '</div>'; };
  var group = function (title, body, o) { o = o || {}; var id = 'g-' + (o.id || title.toLowerCase().replace(/[^a-z]+/g, '-')); return '<div class="grp ' + (o.cls || '') + '" role="group" aria-labelledby="' + id + '"><div class="ghr"><h3 class="gh" id="' + id + '">' + esc(title) + (o.n != null ? ' <span class="n">' + o.n + '</span>' : '') + '</h3>' + (o.end || '') + '</div>' + body + '</div>'; };

  function render() {
    var box = $('#sd'), a = document.activeElement, key = a && box.contains(a) ? a.getAttribute('data-k') : null;
    var val = key && 'value' in a ? a.value : null, sel = key && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
    var body = '';
    try { body = (BODY[ui.s] || BODY.plan)(); }
    catch (err) { body = '<div class="card sx-c"><p class="line">This section could not be read.</p></div>'; if (window.console) console.error(err); }
    box.innerHTML = '<div class="sx" id="sx" role="tabpanel" aria-labelledby="tab-' + ui.s + '" data-crop="section"><h2 class="sx-t">' + LABEL[ui.s] + '</h2>' + body + '</div>';

    $$('.seg', box).forEach(function (sg) { DESK.segSync(sg); });

      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); ui.addPkg = null; ui.addErr = ''; render(); var a = $('[data-k="np-start"]'); if (a) a.focus(); }
      return;
    }
    if (t.hasAttribute('data-rl')) {
      if (e.key === 'Enter') { e.preventDefault(); saveRules(); }
      else if (e.key === 'Escape') { e.preventDefault(); ui.rulesErr = ''; render(); }
      return;
    }
    if (t.hasAttribute('data-rp')) {
      if (e.key === 'Enter' && (t.tagName === 'INPUT' || e.metaKey || e.ctrlKey)) { e.preventDefault(); if (t.tagName === 'INPUT') { var ta = $('[data-rp="text"]'); if (ta) ta.focus(); } else { ui.reply.text = t.value; saveReply(); } }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); ui.reply = null; ui.replyErr = ''; render(); }
      return;
    }
    if (t.matches('[data-rm="template"]') && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveTemplate(t); return; }
    if (t.hasAttribute('data-qnew') && e.key === 'Enter') { e.preventDefault(); addQ(); return; }
    if (t.hasAttribute('data-word')) {
      if (e.key === 'Enter') { e.preventDefault(); var w = {}; w[t.getAttribute('data-word')] = t.value.trim(); save({ words: w }); }
      else if (e.key === 'Escape') { e.preventDefault(); var s = settings(); t.value = s ? s.words[t.getAttribute('data-word')] || '' : ''; paintPreview(); }
    }
  });

  ui.s = fromHash();
  paintList(); render();
})();
