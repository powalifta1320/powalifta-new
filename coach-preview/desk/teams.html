<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teams, POWALIFTA Coach</title>
<script>
/* a phone gets the coach's phone app: this desk is a laptop screen (22 Nov: at 393 px its menu filled the page and the
   rest overlapped). A phone held sideways counts too. ?desk=1 keeps the desk. */
(function () { try { if (window.matchMedia && matchMedia('(max-width: 760px), (pointer: coarse) and (max-height: 520px)').matches && !/[?&]desk=1\b/.test(location.search)) location.replace('/coach.html?demo=1'); } catch (e) {} })();
/* the sidebar's pin before any paint, so a desk kept open does not slide sideways as it loads (desk.js isPinned holds the same rule) */
(function () { try { var v = localStorage.getItem('powa-r6-side'); if (v === 'open' || (v !== 'fold' && window.matchMedia && matchMedia('(hover: none) and (min-width: 1100px)').matches)) document.documentElement.classList.add('side-pinned'); } catch (e) {} })();
/* the theme before any CSS: ?theme= wins, then powa-r6-theme, else dark */
(function () { var t = null; var m = /[?&]theme=(light|dark)\b/.exec(location.search); if (m) t = m[1]; if (!t) { try { t = localStorage.getItem('powa-r6-theme'); } catch (e) { t = null; } } document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>
<link rel="stylesheet" href="../kit/r6/tokens.css">
<link rel="stylesheet" href="../kit/r6/glass.css">
<link rel="stylesheet" href="../kit/r6/ui.css">
<link rel="stylesheet" href="../kit/r6/week.css">
<link rel="stylesheet" href="../kit/r6/fix.css">
<link rel="stylesheet" href="../kit/r6/newcoach.css">
<link rel="stylesheet" href="../kit/r6/case.css">
<style>
  /* Teams (screens.md §4, spec B): the team's lifters in a list that never hides, the team or one lifter beside it. Tokens
     only; widths in px. The list is a pane of its own (Lifters' list): pinned from the toolbar's foot to the window's
     foot, it scrolls by itself, a hairline on its right edge, on the floor. The detail runs 812 px at 1440 and 696 at
     1280, 16 px right of that line. Two raised cards at most: the picture and the work. */
  .tml {
    position: fixed; z-index: var(--z-side); top: calc(var(--inset) + var(--tb-h)); bottom: 0; left: calc(var(--col-l) - var(--sp-6)); width: calc(var(--list-w) + var(--sp-6) * 2);
    display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); background: var(--floor);
  }
  /* the one list head (function-polish PX3, DESK.listHead): at the column's top, its words on the rows' words; the label
     at its end names the rows' numbers (P35) */
  .tml > .lh[data-list-head] { flex: none; padding-left: calc(var(--sp-4) + var(--sp-3)); padding-right: calc(var(--sp-4) + var(--sp-3)); }
  .tml > .lh[data-list-head] .lh-l { color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); white-space: nowrap; }
  /* 16 Nov (the owner: "think like a coach after 5 years of Excel"): the switcher IS the list's one head, "Meet team ⌄",
     on the head's own line box (no "Teams 1" above it, no second title); the count stays for the store, read aloud only.
     Its fill and 40 px hit area are drawn outside the line box so the head's baseline matches every other list's. */
  .tml > .lh[data-list-head] h2 { min-width: 0; }
  .tml-sw { position: relative; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; height: 24px; margin: 0; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; letter-spacing: inherit; cursor: pointer; white-space: nowrap; }
  .tml-sw::before { content: ''; position: absolute; inset: -6px -8px; border-radius: var(--r-field); background: transparent; transition: background-color var(--dur-fast) var(--ease-out); }
  .tml-sw::after { content: ''; position: absolute; inset: -8px -8px; }
  .tml-sw > * { position: relative; }
  .tml-sw .vt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tml-sw svg { width: 16px; height: 16px; flex: none; color: var(--ink-3); }
  .tml-sw.is-open::before, .tml-sw[aria-expanded='true']::before { background: var(--fill-2); }
  .tml-sw:focus-visible { outline: 0; }
  .tml-sw:focus-visible::before { outline: 2px solid var(--focus); }
  @media (hover: hover) and (pointer: fine) { .tml-sw:hover::before { background: var(--hover); } }
  .tml-s {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: var(--sp-2) var(--sp-4) var(--sp-6);
    -webkit-mask-image: linear-gradient(transparent, var(--ink) var(--sp-4), var(--ink) calc(100% - var(--sp-6)), transparent);
    mask-image: linear-gradient(transparent, var(--ink) var(--sp-4), var(--ink) calc(100% - var(--sp-6)), transparent);
  }
  .tml-s::-webkit-scrollbar { display: none; }
  .tml-f { flex: none; display: flex; align-items: center; min-height: 56px; padding: 0 var(--sp-6); border-top: 1px solid var(--line); }
  .tml-f .btn { margin-left: calc(var(--sp-3) * -1); padding: 0 var(--sp-3); }
  .tml-empty { margin: 0; padding: var(--sp-4) var(--sp-3); color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }

  /* a row: the name and the week's sessions on line one, one line in words under it; no face, no ring, no glyph */
  .lr { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'n v' 'r r'; align-items: center; column-gap: var(--sp-3); row-gap: 2px; min-height: 64px; padding: var(--sp-2) var(--sp-3); border-radius: var(--r-row); cursor: pointer; outline: 0; user-select: none; }
  .lr + .lr::before { content: ''; position: absolute; top: 0; left: var(--sp-3); right: var(--sp-3); height: 1px; background: var(--line); }
  /* the chosen row wears the place's tint (Teams: cyan), dark and light */
  .lr[aria-selected='true'] { background: var(--place-sel); }
  .lr[aria-selected='true']::before, .lr[aria-selected='true'] + .lr::before { opacity: 0; }
  .lr:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) { .lr:hover:not([aria-selected='true']) { background: var(--hover); } }
  .lr .nm { grid-area: n; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font: 600 var(--fs-body)/var(--lh-tight) var(--font); }
  .lr .nv { grid-area: v; color: var(--ink-2); font: 500 var(--fs-sub)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lr .rs { grid-area: r; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  .lr .done-row { grid-area: r; }

  /* the detail */
  .td { min-width: 0; margin-left: calc(var(--list-w) + var(--sp-6)); margin-right: calc(var(--sp-4) - var(--gutter)); padding-left: var(--sp-4); }
  .td-fade { position: fixed; z-index: var(--z-edge); top: calc(var(--inset) + var(--tb-h)); left: calc(var(--col-l) + var(--list-w) + var(--sp-6)); right: 0; height: var(--sp-5); pointer-events: none; background: linear-gradient(var(--floor), transparent); opacity: 0; }
  body.is-scrolled .td-fade { opacity: 1; }
  .tt { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-5); margin: 0 var(--sp-1) var(--sp-4); min-width: 0; }
  .tt > div { min-width: 0; }
  .tt h1 { margin: 0; min-width: 0; font: 700 var(--fs-large)/var(--lh-large) var(--font); letter-spacing: var(--ls-large); text-wrap: balance; outline: 0; }
  /* the date line sits under the title, on its left edge, as on Overview and Meets (P29) */
  .tt .facts { margin: var(--sp-2) 0 0; color: var(--ink-2); font: 400 var(--fs-body)/var(--lh-body) var(--font); font-variant-numeric: tabular-nums; }
  .tt .facts b { color: var(--ink); font-weight: 600; }
  .tt .open { flex: none; }
  .sec { margin-top: var(--sp-5); min-width: 0; }
  .sec-h .grow { flex: 1; }
  .sec-h .sub { color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); font-variant-numeric: tabular-nums; }

  /* 22 Nov (the owner: "just info dump and nothing practical"): the team page is ordered by the coach's week. This week
     (who has trained, who has not, day by day, and the move for whoever needs one in their own row), strength (is the
     block working: each lifter's e1RM over 4 weeks as a line in the lift's colour), then the week as written with who
     differs from it. One card: This week. The rest sits open on the floor, on hairlines. */
  @media (max-width: 1180px) { body { --list-w: 264px; } }
  .th { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-6); margin: 0 var(--sp-1) var(--sp-2); min-width: 0; }
  .th > div:first-child { min-width: 0; }
  .th .t-h1 { margin: 0; font: 700 var(--fs-large)/var(--lh-large) var(--font); letter-spacing: var(--ls-large); text-wrap: balance; outline: 0; }
  .th .t-sub { margin: var(--sp-1) 0 0; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); font-variant-numeric: tabular-nums; }
  .th-m { flex: none; align-items: flex-end; text-align: right; padding-bottom: 2px; }
  .th-m .fg b { font-size: var(--fs-title); }
  .th-m .fg b small { margin-left: var(--sp-1); color: var(--ink-2); font-size: var(--fs-label); }

  /* This week: one row a lifter. The face, the name with the one thing to know under it, the seven days (a day's mark
     is lit in its lift's colour once it is lifted, outlined while it is to come, struck when it was missed), how many
     are done, and the move in the same column on every row. */
  .wkc { --day: 28px; --day-gap: 4px; --days-w: calc(var(--day) * 7 + var(--day-gap) * 6); --act-w: 222px; --cnt-w: 48px; padding: var(--sp-1) 0 0; }
  .wr { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr) var(--days-w) var(--cnt-w) var(--act-w) var(--ctl-s); align-items: center; column-gap: var(--sp-4); min-height: 68px; padding: var(--sp-2) var(--sp-5); outline: 0; cursor: pointer; }
  .wr + .wr::before { content: ''; position: absolute; top: 0; left: var(--sp-5); right: var(--sp-5); height: 1px; background: var(--line); }
  .wr.hd { min-height: 36px; padding-top: 0; padding-bottom: 0; color: var(--ink-3); font: 500 var(--fs-cap)/var(--lh-cap) var(--font); cursor: default; }
  .wr.hd + .wr::before { opacity: 0; }
  .wr.hd .hd-l { grid-column: 1 / 3; font-size: var(--fs-label); }
  .wr.hd .wd i { height: auto; font-weight: 500; }
  .wr.hd .wd i.is-today { color: var(--place-ink); font-weight: 700; }
  .wr.hd .cnt { font-size: var(--fs-label); }
  .wr:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
  @media (hover: hover) and (pointer: fine) { .wr:not(.hd):hover { background: var(--hover); } }
  .wr .who { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .wr .who-n { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
  .wr .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font: 600 var(--fs-body)/var(--lh-tight) var(--font); }
  .wr .st { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font: 400 var(--fs-label)/var(--lh-tight) var(--font); }
  .wd { display: grid; grid-template-columns: repeat(7, var(--day)); column-gap: var(--day-gap); }
  .wd i, .dm { display: grid; place-items: center; width: var(--day, 28px); height: var(--day, 28px); border-radius: var(--r-field); color: var(--ink-3); font: 700 var(--fs-cap)/1 var(--font); font-style: normal; }
  .dm.come { box-shadow: inset 0 0 0 1px var(--line-2); }
  .dm.done { background: color-mix(in srgb, var(--lc, var(--place)) 26%, transparent); color: var(--lc-ink, var(--place-ink)); }
  .dm.part { box-shadow: inset 0 0 0 1.5px var(--lc, var(--place)); color: var(--lc-ink, var(--place-ink)); }
  .dm.miss { background: var(--warn-tint); color: var(--warn); text-decoration: line-through; }
  .dm.live { box-shadow: inset 0 0 0 1.5px var(--up); color: var(--up); }
  .wd-x { min-width: 0; }
  .wd-x .fg { gap: var(--sp-2); }
  .wr .cnt { display: flex; align-items: baseline; gap: var(--sp-1); color: var(--ink-3); font: 500 var(--fs-cap)/1 var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wr .cnt b { color: var(--ink); font: 700 var(--fs-head)/1 var(--font); font-stretch: var(--num-stretch); letter-spacing: var(--ls-head); }
  .wr .act { display: flex; align-items: center; min-width: 0; }
  .wr .act .btn { min-width: 0; max-width: 100%; }
  .wr .act .btn > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wr .more { justify-self: end; }
  .wr .done-row.one { flex: 0 1 auto; flex-wrap: nowrap; gap: var(--sp-2); min-width: 0; }
  .wr .done-row.one .dw { flex: none; }
  .wr .done-row.one .btn, .lr .done-row .btn { margin: 0; }
  .wkc-f { display: flex; align-items: center; gap: var(--sp-5); min-height: 48px; padding: 0 var(--sp-5); border-top: 1px solid var(--line); color: var(--ink-3); font: 400 var(--fs-label)/var(--lh-label) var(--font); }
  .wkc-f .lg { display: inline-flex; align-items: center; gap: var(--sp-2); white-space: nowrap; }
  .wkc-f .dm { --day: 20px; border-radius: var(--r-mark); }
  .wkc-f .sum { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .wkc-f .sum b { color: var(--ink); font-weight: 600; }
  @media (max-width: 1280px) {
    .wkc { --day: 26px; --day-gap: 3px; --act-w: 204px; }
    .wr { column-gap: var(--sp-3); padding-left: var(--sp-4); padding-right: var(--sp-4); }
    .wr + .wr::before { left: var(--sp-4); right: var(--sp-4); }
    .wkc-f { padding: 0 var(--sp-4); gap: var(--sp-4); }
  }
  @media (max-width: 1180px) {
    .wkc { --day: 24px; --day-gap: 2px; --act-w: 192px; }
    .wr { grid-template-columns: 32px minmax(0, 1fr) var(--days-w) var(--act-w) var(--ctl-s); min-height: 72px; }
    .wr .tg { display: none; }
    .wr .st { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; text-wrap: pretty; }
    .wr .act .btn { padding: 0 var(--sp-3); }
    .wd-x .fg-gap .m { grid-template-columns: repeat(14, 5px); gap: 2px; }
    .wr .cnt { display: none; }
    .wr.hd .hd-l { grid-column: 1 / 3; }
    .wkc-f .lg.opt { display: none; }
  }
  .lr .done-row { flex-wrap: wrap; column-gap: var(--sp-2); row-gap: 0; }
  .lr .done-row .dw { flex: 1 1 calc(100% - 28px); white-space: normal; overflow: visible; text-wrap: pretty; }
  .lr .done-row .at { margin-left: 28px; }

  /* Strength: one cell a lifter, the lift's e1RM as the number, its change over 4 weeks beside it, the line in the
     lift's colour on one shared scale (a flat line is flat, whoever it is). A cell opens the lifter. */
  .sg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: var(--sp-5); margin: 0 var(--sp-1); }
  .sc { position: relative; display: grid; grid-template-rows: auto auto 40px auto; row-gap: var(--sp-2); min-width: 0; margin: 0; padding: var(--sp-3) 0 var(--sp-3); border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; transition: transform var(--dur-press) var(--ease-out); }
  .sc::after { content: ''; position: absolute; inset: 1px calc(var(--sp-2) * -1) 0; border-radius: var(--r-row); background: transparent; transition: background-color var(--dur-fast) var(--ease-out); pointer-events: none; }
  .sc > * { position: relative; z-index: 1; }
  .sc:focus-visible { outline: 0; }
  .sc:focus-visible::after { box-shadow: inset 0 0 0 2px var(--focus); }
  .sc:active { transform: scale(.985); }
  @media (hover: hover) and (pointer: fine) { .sc:hover::after { background: var(--hover); } }
  .sc-n { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
  .sc-n .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 var(--fs-sub)/var(--lh-tight) var(--font); }
  .sc-v { display: flex; align-items: baseline; gap: var(--sp-2); min-width: 0; white-space: nowrap; }
  .sc-v b { font: 700 var(--fs-num)/var(--lh-num) var(--font); font-stretch: var(--num-stretch); letter-spacing: var(--ls-num); font-variant-numeric: tabular-nums; }
  .sc-v b small { margin-left: 3px; color: var(--ink-3); font: 500 var(--fs-cap)/1 var(--font); font-stretch: 100%; letter-spacing: 0; }
  .sc-v .dl { color: var(--ink-2); font: 600 var(--fs-label)/1 var(--font); font-variant-numeric: tabular-nums; }
  .sc-v .dl.dn { color: var(--warn); }
  .sc-c { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-3); font: 400 var(--fs-label)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; }
  .spk { display: block; width: 100%; height: 100%; overflow: visible; }
  .spk path { fill: none; stroke: var(--lc, var(--place)); stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .spk .sl { stroke-width: 2; }
  .spk .s0 { stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 2 4; }
  .spk .sp { stroke-width: 7; }
  .sg-none { margin: 0 var(--sp-1); color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-sub) var(--font); }
  @media (max-width: 1180px) { .sg { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  /* the week as written: tabs with their state, then the days as three columns of lines; a cell edits in place */
  .wk-tabs { display: flex; gap: var(--sp-2); margin: 0 0 var(--sp-3); border-bottom: 1px solid var(--line); }
  .wk-tab { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 96px; min-height: 52px; padding: var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-1); border: 0; border-radius: var(--r-field) var(--r-field) 0 0; border-bottom: 2px solid transparent; background: none; color: var(--ink-2); text-align: left; cursor: pointer; }
  .wk-tab b { font: 600 var(--fs-sub)/var(--lh-tight) var(--font); }
  .wk-tab small { color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .wk-tab[aria-selected='true'] { color: var(--ink); border-bottom-color: var(--place); }
  .wk-tab[aria-selected='true'] small { color: var(--ink-2); }
  .wk-tab:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) { .wk-tab:hover:not([aria-selected='true']) { background: var(--hover); } }
  .wk-say { min-height: 20px; margin: 0 var(--sp-1) var(--sp-2); color: var(--ink-3); font: 500 var(--fs-label)/var(--lh-label) var(--font); }
  .wk-say.is-warn { color: var(--warn); }
  .days { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-6); }
  .day h3 { margin: 0 0 var(--sp-1); padding: 0 var(--sp-1); font: 600 var(--fs-sub)/var(--lh-sub) var(--font); }
  .ln { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; min-height: 40px; border-top: 1px solid var(--line); }
  .ln-h { display: flex; min-width: 0; }
  .ln-n { display: flex; align-items: center; flex: 1; min-width: 0; height: 40px; padding: 0 var(--sp-1); border: 0; border-radius: var(--r-field); background: none; color: var(--ink); font: 500 var(--fs-body)/var(--lh-tight) var(--font); text-align: left; cursor: pointer; }
  .ln-n span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ln-n.is-open { background: var(--fill-2); }
  @media (hover: hover) and (pointer: fine) { .ln-n:hover { background: var(--hover); } }
  .ln-c { display: block; color: var(--ink-2); font: 400 var(--fs-sub)/var(--lh-tight) var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ln-c .x { color: var(--ink-3); }
  .cell { display: inline-flex; align-items: center; min-width: 10px; height: 32px; padding: 0 1px; border-radius: var(--r-mark); outline: 0; cursor: text; vertical-align: middle; }
  .cell:empty { min-width: 24px; }
  .cell:focus-visible, .cell.is-hand { outline: 1.5px solid var(--ink-3); outline-offset: -1.5px; }
  .cell.is-ro { cursor: default; }
  @media (hover: hover) and (pointer: fine) { .cell:not(.is-ro):hover { background: var(--hover); } }
  .cell-in { width: 6ch; height: 30px; padding: 0 var(--sp-1); border: 0; border-radius: var(--r-mark); background: var(--fill); box-shadow: var(--shadow-field); color: var(--ink); font: 500 var(--fs-sub)/var(--lh-none) var(--font); font-variant-numeric: tabular-nums; outline: 0; }
  .cell-in.is-error { outline: 1.5px solid var(--pain); outline-offset: -1.5px; }
  .own { display: flex; align-items: baseline; gap: var(--sp-2); margin: 0; padding: 0 var(--sp-1) var(--sp-2); color: var(--ink-2); font: 400 var(--fs-label)/var(--lh-label) var(--font); font-variant-numeric: tabular-nums; }

    if (T) {
      if (T.week.next) out.unshift({ title: 'Send week ' + T.week.next + ' to the team…', sub: T.name, run: function () { sendSheet(T.week.next); } });
      out.splice(1, 0, { title: 'Message the team', sub: T.name, run: function () { var b = $('[data-team-msg]'); if (b) teamCompose(b); } });
    }
    DESK.actions(out);
  }

  /* first paint, then the links that open a sheet (#new=1, Find's "New team") */
  var wantNew = hashGet().nw === '1';   /* read before the first paint: it rewrites a hash with no team id and would drop new=1 */
  onHash();
  registerActions();
  PL.on('change', registerActions);
  if (wantNew) {
    history.replaceState(null, '', location.pathname + location.search + '#' + hashOf({ id: st.team }));
    newTeamSheet();
  }
})();
</script>
<script src="../kit/glassdash/glassdash.js"></script>
<script src="/demo-tour.js" defer></script>
