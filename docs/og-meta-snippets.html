<!--
  POWALIFTA — Per-page OG / Twitter meta tag snippets.
  Paste each block into the corresponding HTML page's <head>, replacing any
  existing og: / twitter: tags.

  IMPORTANT BEFORE PASTING:
  1. Replace https://powalifta.com with your actual production domain everywhere below.
  2. All og:image / twitter:image URLs MUST be absolute https URLs — relative paths
     get ignored by most social platforms (Facebook, LinkedIn, iMessage, Slack).
  3. og.png is the launch fallback image. You can later make per-page versions
     (og-marketplace.png, og-coach.png, etc.) and swap the URLs.
  4. index.html already has its block — these are for the OTHER pages.
-->
