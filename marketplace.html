<script>
const TIER_LABELS_MK = { short: 'Short cycle', block: 'Full block', premium: 'Premium' };
let _currentUser = null;
let _allCoaches = [];
// Marketplace pagination — fetch once into _mkPrograms/_mkStats, page client-side.
let _mkPrograms = [];
let _mkStats = {};
let _mkPage = 1;
const MK_PER_PAGE = 6;

// Read the program id from the URL — if present, render the detail view
function getProgramIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id') || '';
}

// Delegate to app.js's locale-aware formatter (shows international buyers "US$…"
// and localizes grouping). Falls back to a plain "$X" if app.js hasn't loaded.
function fmtUsd(cents) {
  return (typeof fmtPrice === 'function')
    ? fmtPrice(cents)
    : '$' + (cents / 100).toFixed(cents % 100 === 0 ? 0 : 2);
}

async function renderMarketplace() {
  const root = document.getElementById('mkRoot');
  const id = getProgramIdFromUrl();
  if (id) {
    await renderDetail(id);
  } else {
    await renderBrowse();
  }
}

async function renderBrowse() {
  const root = document.getElementById('mkRoot');
  root.innerHTML = '';

  // Hero
  const hero = el('section', { class: 'mk-hero' });
  const heroIn = el('div', { class: 'container' });
  heroIn.appendChild(el('h1', {}, 'Program marketplace'));
  heroIn.appendChild(el('p', {}, 'Programs from real powerlifting coaches, written in RPE. Buy once and it lands in your account, ready to train.'));
  hero.appendChild(heroIn);
  root.appendChild(hero);

  // Body container
  const body = el('div', { class: 'container', style: 'padding-top: 28px; padding-bottom: 60px;' });

  // Filters
  const filters = el('div', { class: 'mk-filters', id: 'mkFilters' });
  const tiers = [
    { key: '',        label: 'All' },
    { key: 'short',   label: 'Short cycle' },
    { key: 'block',   label: 'Full block' },
    { key: 'premium', label: 'Premium' }
  ];
  tiers.forEach((t, i) => {
    const btn = el('button', { class: 'mk-tier-btn' + (i === 0 ? ' active' : ''), 'data-tier': t.key }, t.label);
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mk-tier-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      reloadGrid();
    });
    filters.appendChild(btn);
  });

  // Right-aligned group: free-text search + sort. Sort is applied client-side
  // after ratings are aggregated, so "Top rated" can use the same stats the
  // cards display (no extra round-trip).
  const right = el('div', { class: 'mk-filters-right' });
  const search = el('input', { type: 'text', class: 'mk-search', placeholder: 'Search programs…', 'aria-label': 'Search programs' });
  let _searchTimer = null;
  search.addEventListener('input', () => {
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(reloadGrid, 200);
  });
  right.appendChild(search);

  const sort = el('select', { class: 'mk-sort', id: 'mkSort', 'aria-label': 'Sort programs' });
  [
    ['featured', 'Featured'],
    ['popular',  'Most popular'],
    ['rating',   'Top rated'],
    ['price-asc',  'Price: low to high'],
    ['price-desc', 'Price: high to low']
  ].forEach(([val, label]) => sort.appendChild(el('option', { value: val }, label)));
  sort.addEventListener('change', reloadGrid);
  right.appendChild(sort);

  filters.appendChild(right);
  body.appendChild(filters);

  // Second row: training-focus categories (distinct from the length/format
  // tiers above). Built from the shared taxonomy so it stays in sync.
  const catRow = el('div', { class: 'mk-filters mk-cat-row', id: 'mkCats' });
  catRow.appendChild(el('span', { class: 'mk-cat-row-label' }, 'Focus'));
  const cats = [{ key: '', label: 'All' }].concat(window.MARKET_CATEGORIES || []);
  cats.forEach((c, i) => {
    const btn = el('button', { class: 'mk-cat-btn' + (i === 0 ? ' active' : ''), 'data-cat': c.key }, c.label);
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mk-cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      reloadGrid();
    });
    catRow.appendChild(btn);
  });
  body.appendChild(catRow);

  // Grid container (filled by loadAndRenderGrid)
  const grid = el('div', { id: 'mkGrid' });
  body.appendChild(grid);
  root.appendChild(body);

  // Initial load
  reloadGrid();
}

// Reads the live state of the three controls and re-renders the grid.
function reloadGrid() {
  const tier = document.querySelector('.mk-tier-btn.active')?.dataset?.tier || '';
  const category = document.querySelector('.mk-cat-btn.active')?.dataset?.cat || '';
  const search = document.querySelector('.mk-search')?.value || '';
  const sort = document.getElementById('mkSort')?.value || 'featured';
  loadAndRenderGrid(tier, search, sort, category);
}

// Client-side ordering. `featured` keeps whatever order the DB returned.
function sortPrograms(programs, sort, statsByProgram) {
  const arr = programs.slice();
  const avg = id => { const s = statsByProgram[id]; return s && s.count ? s.avg : -1; };
  const cnt = id => { const s = statsByProgram[id]; return (s && s.count) || 0; };
  switch (sort) {
    case 'popular':    arr.sort((a, b) => (b.soldCount || 0) - (a.soldCount || 0)); break;
    case 'rating':     arr.sort((a, b) => avg(b.id) - avg(a.id) || cnt(b.id) - cnt(a.id)); break;
    case 'price-asc':  arr.sort((a, b) => a.priceCents - b.priceCents); break;
    case 'price-desc': arr.sort((a, b) => b.priceCents - a.priceCents); break;
    default: break; // featured
  }
  return arr;
}

async function loadAndRenderGrid(tier, search, sort, category) {
  const grid = document.getElementById('mkGrid');
  if (!grid) return;
  grid.innerHTML = '<div class="mk-loading"><p>Loading programs…</p></div>';

  let programs = [];
  try {
    programs = await DB.listPublishedPrograms({ tier: tier || undefined, search: search || undefined });
  } catch (e) {
    console.error('listPublishedPrograms', e);
    grid.innerHTML = '<div class="mk-empty"><h3>Could not load programs</h3><p>Try refreshing.</p></div>';
    return;
  }

  // Training-focus filter is client-side (the column may not exist pre-migration,
  // so we never push it into the query). Listings with no category never match a
  // specific focus filter, but still appear under "All".
  if (category) programs = programs.filter(p => p.category === category);

  // Eleven filters over a handful of programs is noise: they appear once there are eight.
  if (!tier && !search && !category) {
    const few = programs.length < 8;
    ['mkFilters', 'mkCats'].forEach(id => { const n = document.getElementById(id); if (n) n.style.display = few ? 'none' : ''; });
  }

  if (!programs.length) {
    grid.innerHTML = '';
    const empty = el('div', { class: 'mk-empty' });
    empty.appendChild(el('h3', {}, (tier || search || category) ? 'Nothing matches that' : 'No programs here yet'));
    empty.appendChild(el('p', {}, (tier || search || category) ? 'Try a different filter.' : 'Coaches publish programs here. Check back soon.'));
    grid.appendChild(empty);
    return;
  }

  // Aggregate ratings per program (one batched query) so each card can show
  // social proof. Failure is non-fatal — cards just render without a badge.
  let statsByProgram = {};
  try {
    const reviews = await DB.listReviewsForPrograms(programs.map(p => p.id));
    const byProg = {};
    reviews.forEach(r => { (byProg[r.marketplaceProgramId] = byProg[r.marketplaceProgramId] || []).push(r); });
    programs.forEach(p => { statsByProgram[p.id] = reviewStats(byProg[p.id] || []); });
  } catch (e) { console.warn('reviews aggregate', e); }

  // Order client-side once ratings are known (so "Top rated" works without
  // an extra query). Default "featured" leaves the DB order intact.
  programs = sortPrograms(programs, sort || 'featured', statsByProgram);

  // Stash the full result set + reset to page 1; paging is pure client-side
  // from here (filter/sort changes refetch, page changes don't).
  _mkPrograms = programs;
  _mkStats = statsByProgram;
  _mkPage = 1;
  renderMkPage();
}

// Render just the current page window of _mkPrograms into the grid + a pager.
function renderMkPage() {
  const grid = document.getElementById('mkGrid');
  if (!grid) return;
  const pageCount = Math.max(1, Math.ceil(_mkPrograms.length / MK_PER_PAGE));
  if (_mkPage > pageCount) _mkPage = pageCount;
  const start = (_mkPage - 1) * MK_PER_PAGE;
  const pagePrograms = _mkPrograms.slice(start, start + MK_PER_PAGE);

  grid.innerHTML = '';
  const g = el('div', { class: 'mk-grid' });
  pagePrograms.forEach(p => {
    const coach = _allCoaches.find(c => c.id === p.coachId);
    const card = el('div', { class: 'mk-card' });
    card.addEventListener('click', () => { location.href = 'marketplace.html?id=' + p.id; });
    card.appendChild(el('div', { class: 'mk-card-tier' }, TIER_LABELS_MK[p.tier] || 'Program'));
    const cardCat = (typeof marketCategoryLabel === 'function' && p.category) ? marketCategoryLabel(p.category) : '';
    if (cardCat) card.appendChild(el('div', { class: 'mk-cat-tag', style: 'margin-bottom:10px' }, cardCat));
    card.appendChild(el('div', { class: 'mk-card-title' }, p.title));
    card.appendChild(el('div', { class: 'mk-card-coach' }, 'by ' + (coach ? coach.name : 'a POWALIFTA coach')));
    const st = _mkStats[p.id];
    if (st && st.count) {
      const rating = el('div', { class: 'mk-rating' });
      rating.innerHTML = starsHtml(st.avg) +
        '<span class="mk-rating-num">' + st.avg.toFixed(1) + '</span>' +
        '<span class="mk-rating-count">(' + st.count + ')</span>';
      card.appendChild(rating);
    }
    card.appendChild(el('p', { class: 'mk-card-desc' }, (p.description || '').slice(0, 140) + ((p.description || '').length > 140 ? '…' : '')));
    const foot = el('div', { class: 'mk-card-foot' });
    foot.appendChild(el('div', { class: 'mk-card-price' }, fmtUsd(p.priceCents)));
    foot.appendChild(el('div', { class: 'mk-card-meta' }, p.weekCount + ' wk · ' + p.soldCount + ' sold'));
    card.appendChild(foot);
    g.appendChild(card);
  });
  grid.appendChild(g);

  const pager = buildPager(_mkPrograms.length, MK_PER_PAGE, _mkPage, function (pg) {
    _mkPage = pg;
    renderMkPage();
    grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  if (pager) grid.appendChild(pager);
}

async function renderDetail(id) {
  const root = document.getElementById('mkRoot');
  root.innerHTML = '<div class="mk-loading"><p>Loading program…</p></div>';

  let program;
  try { program = await DB.getMarketplaceProgram(id); }
  catch (e) { console.error(e); }

  if (!program || program.status !== 'published') {
    root.innerHTML = '';
    const empty = el('div', { class: 'mk-empty container' });
    empty.appendChild(el('h3', {}, 'Program not available'));
    empty.appendChild(el('p', {}, 'This program is no longer listed, or the link is wrong.'));
    empty.appendChild(el('p', { style: 'margin-top: 18px;' }, el('a', { href: 'marketplace.html', class: 'btn btn-ghost' }, '← Browse all programs')));
    root.appendChild(empty);
    return;
  }

  const coach = _allCoaches.find(c => c.id === program.coachId);

  root.innerHTML = '';
  const wrap = el('div', { class: 'mk-detail' });
  wrap.appendChild(el('a', { href: 'marketplace.html', class: 'mk-detail-back' }, '← Back to marketplace'));
  const detCat = (typeof marketCategoryLabel === 'function' && program.category) ? marketCategoryLabel(program.category) : '';
  const tierRow = el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:20px 0 12px' });
  tierRow.appendChild(el('span', { class: 'mk-detail-tier', style: 'margin:0' }, TIER_LABELS_MK[program.tier] || 'Program'));
  if (detCat) tierRow.appendChild(el('span', { class: 'mk-cat-tag' }, detCat));
  wrap.appendChild(tierRow);
  wrap.appendChild(el('h1', { class: 'mk-detail-title' }, program.title));

  const meta = el('p', { class: 'mk-detail-meta' });
  meta.innerHTML = 'by <strong>' + (coach ? escapeHtml(coach.name) : 'a POWALIFTA coach') + '</strong> · ' +
                   program.weekCount + ' weeks · ' + program.soldCount + ' athletes own this';
  wrap.appendChild(meta);

  wrap.appendChild(el('div', { class: 'mk-detail-desc' }, program.description || ''));

  // Buy card
  const buyCard = el('div', { class: 'mk-buy-card' });
  buyCard.appendChild(el('div', { class: 'mk-buy-price' }, fmtUsd(program.priceCents)));
  buyCard.appendChild(el('div', { class: 'mk-buy-cur' }, 'Priced in USD · your local total is shown at checkout'));
  buyCard.appendChild(el('div', { class: 'mk-buy-note' }, 'One-time purchase. The program loads into your POWALIFTA account the moment payment clears.'));

  // Apple 3.1.1: the iOS app can't sell digital goods or link out to external
  // web payment. On native, replace the buy CTA with a plain, non-linked note.
  const _nativeShell = !!(window.PowaNative && PowaNative.isNative());
  if (_nativeShell) {
    buyCard.appendChild(el('div', { class: 'btn btn-lg', style: 'opacity:.6; cursor:default; pointer-events:none;' }, 'Available on the web'));
    buyCard.appendChild(el('p', { class: 'faded text-xs', style: 'margin-top: 18px;' }, 'Programs are purchased on powalifta.com. Once you own one, it appears in your library here.'));
  } else {
    const buyBtn = el('a', { class: 'btn btn-primary btn-lg', id: 'mkBuyBtn' }, 'Buy program');
    // Wire the buy button
    buyBtn.addEventListener('click', e => {
      e.preventDefault();
      onBuyClick(program);
    });
    buyBtn.style.cursor = 'pointer';
    buyCard.appendChild(buyBtn);
    // Refund note + share link
    buyCard.appendChild(el('p', { class: 'faded text-xs', style: 'margin-top: 18px;' }, 'Secure checkout via Lemon Squeezy. Refunds available within 7 days if you haven\'t opened the program.'));
  }
  wrap.appendChild(buyCard);

  // Reviews section — rendered async so the detail above paints immediately.
  const reviewsSection = el('div', { class: 'mk-reviews-section', id: 'mkReviews' });
  wrap.appendChild(reviewsSection);

  root.appendChild(wrap);

  // Update OG / title for sharing
  document.title = program.title + ' | POWALIFTA marketplace';

  renderReviews(program);
}

// Renders the rating summary + review list + (for verified buyers) the
// write-a-review form into #mkReviews. Pulled out so renderDetail stays lean.
async function renderReviews(program) {
  const host = document.getElementById('mkReviews');
  if (!host) return;

  let reviews = [];
  try { reviews = await DB.listProgramReviews(program.id); }
  catch (e) { console.warn('listProgramReviews', e); }

  const stats = reviewStats(reviews);

  host.innerHTML = '';
  host.appendChild(el('h2', { class: 'mk-reviews-title' }, 'Reviews'));

  // Summary header
  const summary = el('div', { class: 'mk-rating-summary' });
  if (stats.count) {
    summary.appendChild(el('div', { class: 'mk-rating-big' }, stats.avg.toFixed(1)));
    const sumRight = el('div', {});
    sumRight.innerHTML = starsHtml(stats.avg, 'lg');
    sumRight.appendChild(el('div', { class: 'mk-rating-count', style: 'margin-top:4px;' },
      stats.count + (stats.count === 1 ? ' review' : ' reviews')));
    summary.appendChild(sumRight);
  } else {
    summary.appendChild(el('p', { class: 'mk-reviews-empty' }, 'No reviews yet. Be the first to review this program after you train it.'));
  }
  host.appendChild(summary);

  // Review list
  if (stats.count) {
    const list = el('div', { class: 'mk-reviews' });
    reviews.forEach(r => {
      const item = el('div', { class: 'mk-review' });
      const head = el('div', { class: 'mk-review-head' });
      const nameWrap = el('div', { class: 'mk-review-name' });
      nameWrap.innerHTML = starsHtml(r.rating) + '<span>' + escapeHtml(r.buyerName || 'Verified buyer') + '</span>';
      head.appendChild(nameWrap);
      head.appendChild(el('div', { class: 'mk-review-date' }, fmtReviewDate(r.createdAt)));
      item.appendChild(head);
      if (r.body) item.appendChild(el('p', { class: 'mk-review-body' }, r.body));
      list.appendChild(item);
    });
    host.appendChild(list);
  }

  // Write-a-review form, gated on a verified purchase.
  if (!_currentUser) return;
  let owns = false;
  try { owns = await DB.hasPurchasedProgram(program.id, _currentUser.id); }
  catch (e) { console.warn('hasPurchasedProgram', e); }
  if (!owns) return;

  const mine = reviews.find(r => r.buyerId === _currentUser.id);
  renderReviewForm(host, program, mine);
}

function renderReviewForm(host, program, existing) {
  const form = el('div', { class: 'mk-review-form' });
  form.appendChild(el('h3', {}, existing ? 'Edit your review' : 'Write a review'));

  let picked = existing ? existing.rating : 0;
  const picker = el('div', { class: 'star-picker' });
  const starBtns = [];
  for (let i = 1; i <= 5; i++) {
    const b = el('button', { type: 'button', 'aria-label': i + ' star' + (i > 1 ? 's' : '') }, '★');
    b.addEventListener('click', () => { picked = i; paint(); });
    starBtns.push(b);
    picker.appendChild(b);
  }
  function paint() { starBtns.forEach((b, idx) => b.classList.toggle('on', idx < picked)); }
  paint();
  form.appendChild(picker);

  const ta = el('textarea', { placeholder: 'How did this program go? Honest, specific reviews help other lifters.', maxlength: '1200' });
  if (existing && existing.body) ta.value = existing.body;
  form.appendChild(ta);

  const actions = el('div', { class: 'mk-rf-actions' });
  const submit = el('button', { class: 'btn btn-primary' }, existing ? 'Update review' : 'Post review');
  submit.addEventListener('click', async () => {
    if (!picked) { toast('Pick a star rating first.'); return; }
    const reviewText = checkUserText([ta.value.trim()]);   // public review: the content filter applies
    if (!reviewText) return;
    submit.disabled = true;
    try {
      await DB.upsertProgramReview({
        marketplaceProgramId: program.id,
        coachId: program.coachId,
        buyerId: _currentUser.id,
        buyerName: _currentUser.name || 'Verified buyer',
        rating: picked,
        body: reviewText[0] || null
      });
      toast('Thanks. Your review is live.');
      renderReviews(program);
    } catch (e) {
      console.error('upsertProgramReview', e);
      toast('Could not save your review. Try again.');
      submit.disabled = false;
    }
  });
  actions.appendChild(submit);

  if (existing) {
    const del = el('button', { class: 'btn btn-ghost' }, 'Delete');
    del.addEventListener('click', async () => {
      if (!confirm('Delete your review?')) return;
      try { await DB.deleteProgramReview(existing.id); toast('Review deleted.'); renderReviews(program); }
      catch (e) { console.error('deleteProgramReview', e); toast('Could not delete. Try again.'); }
    });
    actions.appendChild(del);
  }
  form.appendChild(actions);
  host.appendChild(form);
}

function fmtReviewDate(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  } catch (e) { return ''; }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function onBuyClick(program) {
  if (!_currentUser) {
    // Not logged in — prompt to sign up or log in
    if (confirm('Sign in (or sign up) to buy this program. Continue?')) {
      // Send them home with a marker so they can return after auth
      sessionStorage.setItem('mk-return', 'marketplace.html?id=' + program.id);
      location.href = 'index.html#signup-solo';
    }
    return;
  }

  if (!program.lsCheckoutUrl) {
    toast('Checkout is not configured for this program yet. An admin needs to set up the LS product.');
    return;
  }

  // Build the LS checkout URL with custom_data so the webhook can match the buyer + program.
  // Lemon Squeezy supports `checkout[custom][key]=value` query params.
  const url = new URL(program.lsCheckoutUrl);
  url.searchParams.set('checkout[email]', _currentUser.email);
  url.searchParams.set('checkout[custom][user_id]', _currentUser.id);
  url.searchParams.set('checkout[custom][marketplace_program_id]', program.id);
  url.searchParams.set('checkout[name]', _currentUser.name || '');

  window.location.href = url.toString();
}

bootstrap(null, async () => {
  renderNav('#nav');
  _currentUser = getCurrentUser();
  // Preload the coach directory so we can show "by Coach Name" without N+1 queries
  try { _allCoaches = await DB.listCoaches(); } catch (e) {}
  // If we came back from a marketplace return, resume
  const ret = sessionStorage.getItem('mk-return');
  if (ret && _currentUser) {
    sessionStorage.removeItem('mk-return');
    if (location.search.indexOf('id=') < 0) {
      location.href = ret;
      return;
    }
  }
  renderMarketplace();
}, { staticPublic: true });
</script>
