<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<defs>
  <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff2d3f"/><stop offset="100%" stop-color="#b71629"/></linearGradient>
  <radialGradient id="bg" cx="50%" cy="0%" r="100%"><stop offset="0%" stop-color="#1a0608"/><stop offset="60%" stop-color="#0b0b0c"/></radialGradient>
  <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect width="1200" height="630" fill="url(#grid)"/>

<!-- Eyebrow -->
<g transform="translate(80, 110)">
  <rect x="0" y="0" width="380" height="42" rx="21" fill="#ff2d3f" fill-opacity="0.1" stroke="#ff2d3f" stroke-opacity="0.3"/>
  <circle cx="22" cy="21" r="4" fill="#ff2d3f"/>
  <text x="38" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ff2d3f" letter-spacing="0.18em">POWERLIFTING'S NEW HOME</text>
</g>

<!-- Headline -->
<g transform="translate(80, 200)">
  <text font-family="Anton, sans-serif" font-size="148" font-weight="400" fill="#f4f4f6" letter-spacing="-3">BUILT FOR</text>
  <text y="148" font-family="Anton, sans-serif" font-size="148" font-weight="400" fill="url(#r)" letter-spacing="-3">THE BARBELL.</text>
</g>

<!-- Subline -->
<text x="80" y="540" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" fill="#b8b8c0" font-weight="500">Programs · RPE-based logging · Auto e1RM · Goals · Bodyweight</text>

<!-- Brand mark + name corner -->
<g transform="translate(80, 580)">
  <g transform="scale(1.4)">
    <rect x="2" y="11" width="3.5" height="6" rx="1" fill="url(#r)"/>
    <rect x="6.5" y="9" width="2.2" height="10" rx="0.5" fill="url(#r)"/>
    <rect x="9.5" y="13" width="9" height="2" fill="url(#r)"/>
    <rect x="19.3" y="9" width="2.2" height="10" rx="0.5" fill="url(#r)"/>
    <rect x="22.5" y="11" width="3.5" height="6" rx="1" fill="url(#r)"/>
  </g>
  <text x="50" y="22" font-family="Anton, sans-serif" font-size="22" fill="#f4f4f6" letter-spacing="0.04em">POWA<tspan fill="#ff2d3f">LIFTA</tspan></text>
</g>

<!-- Right side: stylized chart -->
<g transform="translate(750, 250)" opacity="0.85">
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.08">
    <line x1="0" y1="0" x2="380" y2="0"/>
    <line x1="0" y1="60" x2="380" y2="60"/>
    <line x1="0" y1="120" x2="380" y2="120"/>
    <line x1="0" y1="180" x2="380" y2="180"/>
  </g>
  <!-- Lines -->
  <path d="M 0 100 C 60 95, 120 80, 180 65 C 240 50, 300 35, 380 18" fill="none" stroke="#ff2d3f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 0 150 C 60 145, 120 138, 180 130 C 240 122, 300 115, 380 108" fill="none" stroke="#ffb547" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 0 75 C 60 65, 120 50, 180 35 C 240 22, 300 12, 380 0" fill="none" stroke="#4ed884" stroke-width="3.5" stroke-linecap="round"/>
  <!-- End dots -->
  <circle cx="380" cy="18" r="6" fill="#ff2d3f" stroke="#0b0b0c" stroke-width="3"/>
  <circle cx="380" cy="108" r="6" fill="#ffb547" stroke="#0b0b0c" stroke-width="3"/>
  <circle cx="380" cy="0" r="6" fill="#4ed884" stroke="#0b0b0c" stroke-width="3"/>
</g>
</svg>
