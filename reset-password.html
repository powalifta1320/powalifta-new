<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — POWALIFTA</title>
<meta name="theme-color" content="#0b0b0c">
<script>(function(){try{var k='powa-theme';var s=localStorage.getItem(k);var t=(s==='light'||s==='dark')?s:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);if(t==='light'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#ffffff');}}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="POWALIFTA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.reset-wrap {
  min-height: calc(100vh - 60px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.reset-card {
  width: 100%;
  max-width: 420px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 36px 32px;
  box-shadow: var(--shadow);
}
.reset-card h1 {
  font-size: 1.8rem;
  letter-spacing: 0.005em;
  margin-bottom: 6px;
  text-transform: uppercase;
}
.reset-card .reset-sub { color: var(--text-2); font-size: 0.92rem; margin-bottom: 22px; line-height: 1.55; }
.reset-status { font-size: 0.86rem; padding: 10px 14px; border-radius: var(--r-sm); margin-top: 14px; }
.reset-status.err { background: rgba(255,45,63,0.08); color: var(--red); border: 1px solid rgba(255,45,63,0.3); }
.reset-status.ok  { background: rgba(78,216,132,0.06); color: var(--green); border: 1px solid rgba(78,216,132,0.3); }
</style>
</head>
<body>

<nav class="nav" id="nav"></nav>

<main class="reset-wrap">
  <div class="reset-card">
    <h1>Reset <span style="color:var(--red)">password</span></h1>
    <p class="reset-sub">Enter your new password below. The link from your email logs you in temporarily so you can change it.</p>

    <div id="resetForm">
      <div class="form-group">
        <label>New password</label>
        <input type="password" id="newPwd" placeholder="At least 6 characters" autocomplete="new-password" data-pwd>
      </div>
      <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" id="newPwd2" placeholder="Type it again" autocomplete="new-password" data-pwd>
      </div>
      <button class="btn btn-primary btn-block btn-lg" onclick="doReset()" id="resetBtn">Update password</button>
    </div>

    <div id="resetMsg"></div>

    <p class="dim text-sm center" style="margin-top: 18px;">
      <a href="index.html">← Back to home</a>
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script>
let _hasRecoverySession = false;

// Supabase listens for the recovery token in the URL hash on load and emits
// a PASSWORD_RECOVERY event. We use that to know we're allowed to update
// the password.
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && location.hash.includes('type=recovery'))) {
    _hasRecoverySession = true;
  }
});

async function doReset() {
  const pwd1 = document.getElementById('newPwd').value;
  const pwd2 = document.getElementById('newPwd2').value;
  const msg = document.getElementById('resetMsg');
  msg.innerHTML = '';

  if (!pwd1 || pwd1.length < 6) {
    msg.innerHTML = '<div class="reset-status err">Password must be at least 6 characters.</div>';
    return;
  }
  if (pwd1 !== pwd2) {
    msg.innerHTML = '<div class="reset-status err">Passwords don\'t match.</div>';
    return;
  }

  // Confirm we have an active session (recovery or otherwise) before updating
  let session = null;
  try { session = await DB.getSession(); } catch {}
  if (!session) {
    msg.innerHTML = '<div class="reset-status err">Reset link expired or invalid. Request a new one from the home page.</div>';
    return;
  }

  const btn = document.getElementById('resetBtn');
  btn.disabled = true; btn.textContent = 'Updating…';
  try {
    await DB.updatePassword(pwd1);
    msg.innerHTML = '<div class="reset-status ok">Password updated. Redirecting you to log in…</div>';
    document.getElementById('resetForm').style.display = 'none';
    // Sign out to clear the recovery session, then bounce back to login
    setTimeout(async () => {
      try { await DB.signOut(); } catch {}
      location.href = 'index.html#login';
    }, 1600);
  } catch (e) {
    console.error('updatePassword', e);
    msg.innerHTML = '<div class="reset-status err">' + (e.message || 'Could not update password') + '</div>';
    btn.disabled = false; btn.textContent = 'Update password';
  }
}
window.doReset = doReset;

// Boot — render nav, attach password show/hide toggles, do nothing else.
bootstrap(null, () => {
  renderNav('#nav');
  if (typeof attachPwdToggles === 'function') attachPwdToggles();
}, { staticPublic: true });
</script>
</body>
</html>
