# Supabase CLI project config.
# `project_id` is your project ref — the subdomain of your project URL
# (https://<project_id>.supabase.co). Connect the repo to the remote project once:
#
#   npx --yes supabase login
#   npx --yes supabase link --project-ref cxnotrikxvzncupswvio
#
# After that, ./deploy.sh can deploy functions + push secrets from here.
project_id = "cxnotrikxvzncupswvio"

# Each function's gateway login check, so every deploy applies it (the CLI otherwise keeps
# whatever the deployed copy had). Same lists as deploy.sh.
[functions.ls-webhook]
verify_jwt = false
[functions.ls-marketplace-webhook]
verify_jwt = false
[functions.send-welcome]
verify_jwt = false
[functions.send-client-error]
verify_jwt = false
[functions.send-weekly-digest]
verify_jwt = false
[functions.unsubscribe]
verify_jwt = false
[functions.apple-notifications]
verify_jwt = false
[functions.send-program-assigned]
verify_jwt = true
[functions.send-push]
verify_jwt = true
[functions.ai-chat]
verify_jwt = true
[functions.send-invite]
verify_jwt = true
[functions.delete-account]
verify_jwt = true
[functions.ls-portal]
verify_jwt = true
[functions.apple-iap]
verify_jwt = true
