<script>
/* ===========================================================
   Tiny zero-dependency test framework
   =========================================================== */
const T = { pass: 0, fail: 0, skip: 0, groups: [] };
let _cur = null;
function group(name) { _cur = { name, cases: [] }; T.groups.push(_cur); }
function test(name, fn) {
  const c = { name, status: 'pass', err: '' };
  try { fn(); T.pass++; }
  catch (e) { c.status = 'fail'; c.err = (e && e.message) || String(e); T.fail++; }
  _cur.cases.push(c);
}
function skip(name, reason) {
  _cur.cases.push({ name, status: 'skip', err: reason || '' });
  T.skip++;
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
function eq(actual, expected, msg) {
  if (actual !== expected) throw new Error((msg ? msg + ' — ' : '') + 'expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
}
function close(actual, expected, eps, msg) {
  eps = eps == null ? 0.01 : eps;
  if (typeof actual !== 'number' || !isFinite(actual) || Math.abs(actual - expected) > eps)
    throw new Error((msg ? msg + ' — ' : '') + 'expected ≈' + expected + ' (±' + eps + '), got ' + actual);
}

/* ===========================================================
   State helpers
   =========================================================== */
function resetState() { Store.reset(); window._user = null; }
function seed(partial) {
  Store.update(s => { Object.keys(partial).forEach(k => { s[k] = partial[k]; }); });
}
const iso = d => d.toISOString().slice(0, 10);
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };

/* ===========================================================
   1. e1RM math
   =========================================================== */
group('e1RM math');
test('zero inputs → 0', () => eq(calcE1RM(0, 5, 8), 0));
test('1 rep @ RPE 10 returns the weight itself', () => eq(calcE1RM(100, 1, 10), 100));
test('100×5 @ RPE 8 ≈ 124.97', () => close(calcE1RM(100, 5, 8), 124.97, 0.1));
test('higher RPE → lower e1RM (fewer reps in reserve)', () => assert(calcE1RM(100, 5, 9) < calcE1RM(100, 5, 8)));
test('more reps → higher e1RM', () => assert(calcE1RM(100, 6, 8) > calcE1RM(100, 5, 8)));
test('extreme fatigue floors at weight/0.4 (=250)', () => close(calcE1RM(100, 30, 1), 250, 0.01));

/* ===========================================================
   2. Variant multipliers
   =========================================================== */
group('variant multipliers');
test('squat Competition = 1.0', () => eq(multiplierFor('squat', 'Competition'), 1.0));
test('bench Close Grip = 1.09', () => eq(multiplierFor('bench', 'Close Grip'), 1.09));
test('deadlift Deficit = 1.06', () => eq(multiplierFor('deadlift', 'Deficit'), 1.06));
test('unknown variant falls back to 1.0', () => eq(multiplierFor('squat', 'Nope'), 1.0));
test('unknown lift falls back to 1.0', () => eq(multiplierFor('zercher', 'Competition'), 1.0));
test('comp e1RM scales by multiplier (CG bench 1×RPE10)', () => close(calcCompE1RM(100, 1, 10, 'bench', 'Close Grip'), 109, 0.01));

/* ===========================================================
   3. Unit conversion (saves & restores the user's real setting)
   =========================================================== */
group('unit conversion');
(() => {
  const saved = (() => { try { return localStorage.getItem('powa-unit'); } catch { return null; } })();
  try {
    setUnit('kg');
    test('kg mode: 100kg displays as 100', () => eq(kgToDisplay(100), 100));
    test('kg mode: displayToKg is identity', () => eq(displayToKg(100), 100));
    setUnit('lbs');
    test('lbs mode: 100kg ≈ 220.5 lb', () => close(kgToDisplay(100, 1), 220.5, 0.1));
    test('lbs mode: 225 lb entry ≈ 102.06 kg', () => close(displayToKg(225), 102.058, 0.01));
    test('lbs round-trip kg→display→kg is lossless', () => close(displayToKg(kgToDisplay(142.5, 6)), 142.5, 0.001));
    test('empty string passes through unchanged', () => eq(displayToKg(''), ''));
  } finally {
    // Restore so the harness never clobbers the real app's unit preference.
    try { if (saved == null) localStorage.removeItem(UNIT_KEY); else localStorage.setItem(UNIT_KEY, saved); } catch {}
  }
})();

/* ===========================================================
   4. PR detection
   =========================================================== */
group('PR detection');
(() => {
  resetState();
  const L = (id, date, e) => ({ id, athleteId: 'ath1', lift: 'squat', variant: 'Competition', e1rmComp: e, date });
  const a = L('l1', '2026-01-01', 100), b = L('l2', '2026-01-02', 105), c = L('l3', '2026-01-03', 102);
  seed({ workoutLogs: [a, b, c] });
  test('first-ever log of a lift is not a PR (it beats nothing yet)', () => eq(isPRForLog('ath1', a), false));
  test('beating prior best is a PR', () => eq(isPRForLog('ath1', b), true));
  test('below prior best is NOT a PR', () => eq(isPRForLog('ath1', c), false));
  resetState();
})();

/* ===========================================================
   5. Weekly delta
   =========================================================== */
group('weekly delta');
(() => {
  resetState();
  seed({ workoutLogs: [
    { id: 'w1', athleteId: 'ath1', lift: 'squat', e1rmComp: 100, date: daysAgo(9) },  // prev week
    { id: 'w2', athleteId: 'ath1', lift: 'squat', e1rmComp: 110, date: daysAgo(1) },  // this week
  ] });
  const d = getWeeklyDelta('ath1');
  test('squat delta = +10 this week vs last', () => close(d.squat.delta, 10, 0.001));
  test('current best reflected', () => close(d.squat.current, 110, 0.001));
  resetState();
})();

/* ===========================================================
   6. Best e1RM / current total
   =========================================================== */
group('best e1RM & total');
(() => {
  resetState();
  seed({ workoutLogs: [
    { id: 's1', athleteId: 'ath1', lift: 'squat', e1rmComp: 100, date: '2026-01-01' },
    { id: 's2', athleteId: 'ath1', lift: 'squat', e1rmComp: 120, date: '2026-01-02' },
    { id: 'b1', athleteId: 'ath1', lift: 'bench', e1rmComp: 80, date: '2026-01-01' },
    { id: 'd1', athleteId: 'ath1', lift: 'deadlift', e1rmComp: 150, date: '2026-01-01' },
    { id: 'x1', athleteId: 'other', lift: 'squat', e1rmComp: 999, date: '2026-01-01' },
  ] });
  test('bestE1RM picks the max for the athlete', () => eq(bestE1RM('ath1', 'squat'), 120));
  test('foreign athlete logs are excluded', () => eq(bestE1RM('ath1', 'squat') !== 999, true));
  test('currentTotal sums best SBD (120+80+150=350)', () => eq(currentTotal('ath1'), 350));
  resetState();
})();

/* ===========================================================
   6b. Lift balance (SBD split vs typical raw ranges)
   =========================================================== */
group('lift balance');
(() => {
  test('null when any lift is missing', () => eq(liftBalance(200, 0, 240), null));
  test('null when total is zero', () => eq(liftBalance(0, 0, 0), null));
  test('shares sum to 1', () => {
    const b = liftBalance(200, 130, 240);
    close(b.rows.reduce((s, r) => s + r.share, 0), 1, 1e-9);
  });
  test('balanced split flags no weakest lift', () => {
    // 35% / 23% / 42% of 600 → all inside their bands
    const b = liftBalance(210, 138, 252);
    eq(b.weakest, null);
    assert(b.rows.every(r => r.status === 'balanced'), 'expected all balanced');
  });
  test('low bench is flagged lagging and chosen as weakest', () => {
    // bench only ~15% of total
    const b = liftBalance(220, 70, 250);
    const bench = b.rows.find(r => r.lift === 'bench');
    eq(bench.status, 'lagging');
    eq(b.weakest.lift, 'bench');
  });
  test('oversized deadlift reads as strong', () => {
    const b = liftBalance(150, 100, 320);
    eq(b.rows.find(r => r.lift === 'deadlift').status, 'strong');
  });
  test('unit-agnostic: scaling all three keeps statuses', () => {
    const a = liftBalance(220, 70, 250);
    const b = liftBalance(220 * 2.2046, 70 * 2.2046, 250 * 2.2046);
    eq(a.weakest.lift, b.weakest.lift);
  });
})();

/* ===========================================================
   7. Signal center — coach
   =========================================================== */
group('signals · coach');
(() => {
  resetState();
  window._user = { id: 'coach1', name: 'Coach Bob', userType: 'coach' };
  Store.update(s => {
    s.athletes = [{ id: 'ath1', name: 'Test Athlete', coachId: 'coach1' }];
    s.sessionNotes = [{ id: 'n1', athleteId: 'ath1', note: 'felt heavy', date: '2026-06-01' }]; // no coachComment
    s.checkins = [{ id: 'c1', athleteId: 'ath1', feel: 8, sleep: 7, stress: 3, weekStart: '2026-06-22' }];
    s.workoutLogs = [];
  });
  const sig = computeSignals();
  test('athlete note awaiting reply surfaces', () => assert(sig.some(x => x.id === 'cnote-n1' && x.type === 'reply'), 'no cnote-n1 in ' + JSON.stringify(sig.map(s => s.id))));
  test('check-in surfaces as a signal', () => assert(sig.some(x => x.id === 'cci-c1' && x.type === 'checkin')));
  test('note already replied to is suppressed', () => {
    Store.update(s => { s.sessionNotes[0].coachComment = 'good work'; });
    assert(!computeSignals().some(x => x.id === 'cnote-n1'));
  });
  resetState();
})();

/* ===========================================================
   8. Signal center — athlete
   =========================================================== */
group('signals · athlete');
(() => {
  resetState();
  window._user = { id: 'ath1', name: 'Test Athlete', userType: 'athlete', coachId: 'coach1' };
  Store.update(s => {
    s.coaches = [{ id: 'coach1', name: 'Coach Bob' }];
    s.sessionNotes = [{ id: 'n2', athleteId: 'ath1', coachComment: 'great session', date: '2026-06-01' }];
    s.checkins = [];
  });
  const sig = computeSignals();
  test('coach reply surfaces with coach name', () => {
    const r = sig.find(x => x.id === 'areply-n2');
    assert(r && /Coach Bob/.test(r.title), 'reply missing or unnamed: ' + JSON.stringify(r));
  });
  test('weekly check-in due when none submitted', () => assert(sig.some(x => x.type === 'checkin' && x.id.indexOf('aci-due-') === 0)));
  resetState();
})();

/* ===========================================================
   9. Data export
   =========================================================== */
group('data export');
(() => {
  resetState();
  window._user = { id: 'ath1', name: 'Test Athlete', email: 'a@b.com', userType: 'athlete', coachId: 'coach1' };
  Store.update(s => {
    s.workoutLogs = [
      { id: 'l1', athleteId: 'ath1', lift: 'squat', variant: 'Competition', weight: 150, reps: 3, rpe: 8, e1rm: 170.4, date: '2026-06-01', note: 'crisp' },
      { id: 'l2', athleteId: 'ath1', lift: 'accessory', exerciseName: 'Bicep Curls', variant: '', weight: 20, reps: 12, rpe: 9, e1rm: 0, date: '2026-06-02', note: '' },
      { id: 'l3', athleteId: 'other', lift: 'bench', variant: 'Competition', weight: 100, reps: 5, rpe: 8, e1rm: 124, date: '2026-06-01', note: '' },
    ];
    s.bodyweight = [{ id: 'bw1', athleteId: 'ath1', date: '2026-06-01', weight: 84 }];
  });
  const payload = buildExportPayload();
  test('payload account id matches user', () => eq(payload.account.id, 'ath1'));
  test('only the athlete\'s own logs are exported', () => eq(payload.workoutLogs.length, 2));
  test('bodyweight included for athlete', () => eq(payload.bodyweight.length, 1));

  const csv = _logsToCsv();
  const lines = csv.split('\n');
  test('CSV header has no colliding exercise column', () => eq(lines[0], 'date,lift,variant,weight_kg,reps,rpe,e1rm_kg,note'));
  test('accessory name lands in the lift column', () => {
    const row = lines.find(l => l.indexOf('Bicep Curls') >= 0);
    assert(row && row.indexOf('2026-06-02,Bicep Curls,') === 0, 'row was: ' + row);
  });
  test('weights exported in kg (150), not converted', () => assert(lines.some(l => l.indexOf(',squat,Competition,150,') >= 0)));
  test('foreign athlete logs excluded from CSV', () => assert(!csv.includes('2026-06-01,bench')));
  resetState();
})();

/* ===========================================================
   9b. Program → spreadsheet export
   =========================================================== */
group('program export');
(() => {
  const saved = (() => { try { return localStorage.getItem('powa-unit'); } catch { return null; } })();
  try {
    setUnit('kg');
    const program = { id: 'p1', athleteId: 'ath1', name: 'Test Block', weeks: [
      { number: 1, days: [
        { id: 'd1', name: 'Squat Day', exercises: [
          { id: 'e1', lift: 'squat', variant: 'Competition', exerciseName: '', note: 'brace hard', sets: [
            { weight: 150, reps: 5, rpe: 7 }, { weight: 150, reps: 5, rpe: 8 } ] },
          { id: 'e2', lift: 'legs', variant: '', exerciseName: 'Leg Curls', note: '', sets: [
            { weight: 30, reps: 12, rpe: 8 } ] },
        ] },
        { id: 'd2', name: 'Rest', exercises: [] },
      ] },
    ] };
    const csv = buildProgramCsv(program);
    const lines = csv.split('\n');
    test('header carries the unit + tracking columns', () =>
      eq(lines[0], 'week,day,exercise,variant,set,weight (kg),reps,target_rpe,done,actual_weight,actual_rpe,notes'));
    test('one row per prescribed set', () =>
      eq(lines.filter(l => l.indexOf('Week 1,Squat Day,Squat,Competition,') === 0).length, 2));
    test('main lift labelled, variant in its own column, kg weight', () =>
      assert(lines.some(l => l.indexOf('Week 1,Squat Day,Squat,Competition,1,150,5,7,,,,brace hard') === 0)));
    test('coach note only on the first set of an exercise', () => {
      const set2 = lines.find(l => l.indexOf('Week 1,Squat Day,Squat,Competition,2,') === 0);
      assert(set2 && /,,,,$/.test(set2), 'set 2 row was: ' + set2);
    });
    test('accessory keeps its name', () =>
      assert(lines.some(l => l.indexOf('Week 1,Squat Day,Leg Curls,,1,30,12,8,') === 0)));
    test('rest day emits a marker row', () =>
      assert(lines.some(l => l.indexOf('Week 1,Rest,Rest day,') === 0)));
    setUnit('lbs');
    test('lbs mode: header + weight convert (150kg ≈ 330.7lb)', () => {
      const l = buildProgramCsv(program).split('\n');
      assert(l[0].indexOf('weight (lbs)') >= 0, 'header: ' + l[0]);
      assert(l.some(r => r.indexOf('Week 1,Squat Day,Squat,Competition,1,330.7,') === 0), 'no converted row');
    });
  } finally {
    try { if (saved == null) localStorage.removeItem(UNIT_KEY); else localStorage.setItem(UNIT_KEY, saved); } catch {}
  }
})();

group('marketplace reviews');
test('reviewStats: empty list → zeros', () => {
  const s = reviewStats([]);
  eq(s.count, 0); eq(s.avg, 0); eq(s.rounded, 0);
});
test('reviewStats: average rounded to 1 decimal', () => {
  const s = reviewStats([{ rating: 5 }, { rating: 4 }, { rating: 4 }]); // 13/3 = 4.333
  eq(s.count, 3); eq(s.avg, 4.3); eq(s.rounded, 4);
});
test('reviewStats: distribution buckets each rating', () => {
  const s = reviewStats([{ rating: 5 }, { rating: 5 }, { rating: 3 }, { rating: 1 }]);
  eq(s.dist[5], 2); eq(s.dist[3], 1); eq(s.dist[1], 1); eq(s.dist[2], 0);
});
test('reviewStats: drops out-of-range / malformed entries', () => {
  const s = reviewStats([{ rating: 5 }, { rating: 0 }, { rating: 6 }, null, { rating: 3 }]);
  eq(s.count, 2); eq(s.avg, 4); // (5+3)/2
});
test('reviewStats: non-array input is safe', () => {
  const s = reviewStats(null);
  eq(s.count, 0); eq(s.avg, 0);
});
test('starString: fills round(value) of 5 glyphs', () => {
  eq(starString(0), '☆☆☆☆☆');
  eq(starString(4.4), '★★★★☆');
  eq(starString(5), '★★★★★');
});
test('starString: clamps out-of-range input', () => {
  eq(starString(99), '★★★★★');
  eq(starString(-3), '☆☆☆☆☆');
});
test('starsHtml: emits 5 spans, filled ones marked st-on', () => {
  const h = starsHtml(3);
  eq((h.match(/st-on/g) || []).length, 3);
  eq((h.match(/st-off/g) || []).length, 2);
});

/* ===========================================================
   8b. Referral rewards ledger (migration-referral-rewards)
   Pure earn-gating: a tier is `earned` only when count >= at; claims
   merge in by tier_at; the server still re-checks on claim.
   =========================================================== */
group('referral rewards');
test('ledger: one row per tier, in order', () => {
  const l = referralRewardsLedger(0, []);
  eq(l.length, REFERRAL_TIERS.length);
  eq(l[0].at, 1); eq(l[l.length - 1].at, 25);
  assert(l.every(r => r.reward && r.reward.length), 'every tier carries reward copy');
});
test('ledger: count gates earned + remaining', () => {
  const l = referralRewardsLedger(5, []);
  const byAt = {}; l.forEach(r => { byAt[r.at] = r; });
  eq(byAt[1].earned, true); eq(byAt[3].earned, true); eq(byAt[5].earned, true);
  eq(byAt[10].earned, false); eq(byAt[25].earned, false);
  eq(byAt[5].remaining, 0); eq(byAt[10].remaining, 5); eq(byAt[25].remaining, 20);
});
test('ledger: zero referrals earns nothing', () => {
  const l = referralRewardsLedger(0, []);
  assert(l.every(r => !r.earned), 'nothing earned at 0');
  assert(l.every(r => !r.claimed), 'nothing claimed at 0');
});
test('ledger: claims merge by tier (object form)', () => {
  const l = referralRewardsLedger(10, [{ tierAt: 1, status: 'requested' }, { tierAt: 3, status: 'fulfilled' }]);
  const byAt = {}; l.forEach(r => { byAt[r.at] = r; });
  eq(byAt[1].claimed, true); eq(byAt[1].status, 'requested');
  eq(byAt[3].claimed, true); eq(byAt[3].status, 'fulfilled');
  eq(byAt[5].claimed, false); eq(byAt[5].status, null);
});
test('ledger: claims accept plain tier numbers', () => {
  const l = referralRewardsLedger(3, [1, 3]);
  const byAt = {}; l.forEach(r => { byAt[r.at] = r; });

  const log = (id, a, lift, kg, date) => ({ id, athleteId: a, lift, variant: 'Competition', weight: kg, reps: 3, rpe: 8, e1rm: kg * 1.1, e1rmComp: kg * 1.1, date });

    meets: [{ id: 'm', athleteId: 'a', name: 'State', date: '2026-11-01', weightClass: '74 kg' }],
    bodyweight: [{ id: 'bw', athleteId: 'a', date: '2026-10-21', weight: 75.9 }]
  }));
  try {

    eq(deskRpeDrift(prog, t).avg, 1);   // (+1.5 and +0.5) / 2
    const rb = deskReasons('b', { coachId: 'c', today: t, now });
    eq(rb.map(r => r.type).join(','), 'quiet,noprogram'); eq(rb[0].text, 'Quiet'); eq(rb[0].tone, 'warn');
    eq(deskBodyweightVsClass('a', { weightClass: '120+' }), null);
    const rows = deskRows('c', { today: t, now });
    let q = deskQueue(rows, { today: t });
    eq(q.queue.map(r => r.athlete.id).join(), 'a,b'); eq(q.total, 2);
    // Reviewed: out of the queue; a NEW kind of reason brings them back this week.
    const rev = { a: { at: now, sig: deskReasonSig(rows[0].reasons) } };
    q = deskQueue(rows, { today: t, reviewed: rev });
    eq(q.queue.map(r => r.athlete.id).join(), 'b'); eq(q.done.length, 1); eq(q.total, 2);
    q = deskQueue(rows, { today: t, reviewed: { a: { at: now, sig: 'meet,overshoot,weight' } } });
    eq(q.queue[0].athlete.id, 'a');
    q = deskQueue(rows, { today: t, snoozed: { b: '2026-10-23' } });
    eq(q.queue.map(r => r.athlete.id).join(), 'a'); eq(q.snoozed.length, 1);
    eq(deskQueue(rows, { today: '2026-10-23', snoozed: { b: '2026-10-23' } }).queue.length, 2);   // tomorrow it's back
    // Today's bar counts real work: nothing yet = 0; a reply / applied week = handled (still listed);
    // E = done; S = snoozed (still counted in the total); a NEW reason after a reply un-handles them.
    q = deskQueue(rows, { today: t });
    eq(q.progress, 0); eq(q.total, 2); eq(q.handled.length, 0);
    const hb = { b: { at: now, sig: deskReasonSig(rows[1].reasons), via: 'reply' } };

    eq(q.progress, 1); eq(q.handled.map(r => r.athlete.id).join(), 'b'); eq(q.queue.length, 2);   // stays listed till E
    q = deskQueue(rows, { today: t, handled: hb, reviewed: rev });
    eq(q.progress, 2); eq(q.done.length, 1); eq(q.handled.length, 1);
    q = deskQueue(rows, { today: t, handled: hb, reviewed: { b: { at: now, sig: deskReasonSig(rows[1].reasons) } } });
    eq(q.progress, 1); eq(q.handled.length, 0);   // done, not double-counted
    q = deskQueue(rows, { today: t, snoozed: { b: '2026-10-23' } });
    eq(q.progress, 1); eq(q.total, 2);
    q = deskQueue(rows, { today: t, handled: { a: { at: now, sig: 'meet,weight', via: 'apply' } } });
    eq(q.progress, 0);   // pain and overshoot came after the reply: not handled
    // The reply cleared their only reason: they leave the list but still count (N doesn't shrink).
    const rowsB = rows.map(r => r.athlete.id === 'b' ? Object.assign({}, r, { reasons: [] }) : r);
    q = deskQueue(rowsB, { today: t, handled: hb });
    eq(q.total, 2); eq(q.progress, 1); eq(q.queue.length, 1); eq(q.cleared.length, 1);
    // Views
    eq(deskViewCount(rows, 'meet', now), 1); eq(deskViewCount(rows, 'pain', now), 1);
    eq(deskViewCount(rows, 'quiet', now), 1); eq(deskViewCount(rows, 'new', now), 1); eq(deskViewCount(rows, 'needs', now), 2);
    // Wins: a PR this week; a streak only on a 4-week milestone
    const s2 = Store.get();
    s2.workoutLogs.push(log('l3', 'b', 'squat', 160, '2026-10-21'));
    eq(deskWins('b', { today: t }).map(w => w.text).join(), 'Squat PR');
    s2.workoutLogs = ['2026-10-01', '2026-10-08', '2026-10-15', '2026-10-22'].map((d, i) => log('s' + i, 'c1', 'bench', 100, d));
    eq(deskWins('c1', { today: t }).map(w => w.type).join(), 'streak');
    s2.workoutLogs.push(log('s9', 'c1', 'bench', 100, '2026-09-24'));
    eq(deskWins('c1', { today: t }).some(w => w.type === 'streak'), false);   // 5 weeks: no milestone
    // The e1RM total starts once all three lifts have a number: no jump from a squat-only week.
    s2.workoutLogs = [log('t1', 'n', 'squat', 100, '2026-10-01'), log('t2', 'n', 'bench', 60, '2026-10-08'), log('t3', 'n', 'deadlift', 120, '2026-10-08'), log('t4', 'n', 'squat', 105, '2026-10-15')];
    const tt = deskTotalTrend('n', t);
    eq(tt.values.length, 2); eq(Math.round(tt.values[0]), 308); eq(Math.round(tt.delta * 10) / 10, 5.5);
  } finally { Store.set(saved); }
});
test('athlete workspace: last week vs next week, RPE suggestions, apply', () => {

        { lift: 'squat', variant: 'Paused', sets: [mk(147.5, 4, null, true, 7, { pct: 70 })] }] },
      { name: 'Bench', exercises: [{ lift: 'bench', variant: 'Competition', sets: [mk(0, 3, 8, true, 7, { weight: 110, plannedWeight: 0 })] }] },
      { name: 'Pull', exercises: [{ lift: 'deadlift', variant: 'Competition', sets: [mk(200, 3, 8, false)] }] } ] },
    { number: 2, days: [
      { name: 'Squat', exercises: [{ lift: 'squat', variant: 'Competition', sets: [mk(182.5, 3, 8, false), mk(160, 5, 7.5, false), mk(160, 5, 7.5, false)] },
        { lift: 'squat', variant: 'Paused', sets: [mk(150, 4, null, false, null, { pct: 72.5 })] }] },
      { name: 'Bench', exercises: [{ lift: 'bench', variant: 'Competition', sets: [mk(0, 3, 8.5, false)] }] },
      { name: 'Pull', exercises: [{ lift: 'deadlift', variant: 'Competition', sets: [mk(205, 3, 8, false)] }] } ] }
  ] };
  const r = deskWeekReview(prog, { unit: 'kg' });
  eq(r.lastIdx, 0); eq(r.nextIdx, 1); eq(r.rows.length, 5);
  const top = r.rows[0];

  eq(top.suggest.dir, 'down'); eq(top.suggest.kg < 182.5, true); eq(top.suggest.kg >= 182.5 * 0.9, true);   // a point over: lighter, never more than 10%
  eq(r.rows[1].logged.n, 2); eq(r.rows[1].delta, 0.5);   // the heavier RPE of the two back-offs counts
  eq(r.rows[2].suggest, null);    // a % block follows the max: no guess

  eq(deskApplyNextWeek(prog.weeks, 1, [{ di: 0, ei: 0, startIdx: 0, count: 1, sets: [newSet(170, 3, 8)] }]), 0);

test('switch kit: crc32 and a store-only zip that reads back', () => {
  eq(SK.crc32(SK.utf8('hello')), 0x3610a686); eq(SK.crc32(SK.utf8('')), 0);
  const files = [{ name: 'a.csv', text: 'x,y\n1,2\n' }, { name: 'é.txt', text: 'héllo' }];
  const z = SK.zip(files, new Date(2026, 9, 22, 10, 30, 0));
  const dec = (b) => decodeURIComponent(escape(Array.from(b).map(c => String.fromCharCode(c)).join('')));
  const dv = new DataView(z.buffer);
  eq(dv.getUint32(0, true), 0x04034b50);
  const eocd = z.length - 22;
  eq(dv.getUint32(eocd, true), 0x06054b50); eq(dv.getUint16(eocd + 10, true), 2);
  let at = dv.getUint32(eocd + 16, true);
  const names = [];
  for (let i = 0; i < 2; i++) {
    eq(dv.getUint32(at, true), 0x02014b50);
    const crc = dv.getUint32(at + 16, true), size = dv.getUint32(at + 20, true), nl = dv.getUint16(at + 28, true), off = dv.getUint32(at + 42, true);
    names.push(dec(z.slice(at + 46, at + 46 + nl)));
    const lnl = dv.getUint16(off + 26, true);
    const data = z.slice(off + 30 + lnl, off + 30 + lnl + size);
    eq(SK.crc32(data), crc); eq(dec(data), files[i].text);
    at += 46 + nl;
  }
  eq(names.join('|'), 'a.csv|é.txt');
});

test('offline: thirty minutes of marks replay into a server that moved, with no lost marks', () => {
  let n = 0; const stamp = () => new Date(Date.parse('2026-10-24T09:10:00Z') + (++n) * 1000).toISOString();
  let srv = {};
  const cells = _mdCells();
  let s = MP.serverApply(srv, Object.keys(cells).map(k => Object.assign({ key: k }, cells[k])), stamp);
  srv = s.srv; eq(s.rows.length, 54);
  const seen = JSON.parse(JSON.stringify(srv));   // what the laptop saw before the wifi went
  let local = {}; Object.keys(seen).forEach(k => { local[k] = seen[k]; });
  let outbox = {};
  // Offline: a whole flight-A squat round marked on the laptop.
  ['L3', 'L1', 'L2'].forEach((id, i) => {
    const r = MP.applyAction(local, { type: i === 2 ? 'no' : 'good', lifterId: id, lift: 'squat', n: 1 }, 100000 + i);
    local = r.cells; outbox = MP.queue(outbox, r.keys, local);
  });
  // Meanwhile the assistant's phone (online) declared L3's second and changed L2's opener.
  s = MP.serverApply(srv, [Object.assign({ key: MP.attemptKey('L3', 'squat', 2) }, srv[MP.attemptKey('L3', 'squat', 2)], { status: 'declared', kg: 107.5, at: 100500, base: srv[MP.attemptKey('L3', 'squat', 2)].srvAt }),
    Object.assign({ key: MP.attemptKey('L2', 'squat', 1) }, srv[MP.attemptKey('L2', 'squat', 1)], { status: 'declared', kg: 122.5, changes: 1, at: 100900, base: srv[MP.attemptKey('L2', 'squat', 1)].srvAt })], stamp);
  srv = s.srv;
  // Back online: the outbox goes up.
  const sent = MP.outgoing(outbox, local);
  eq(sent.length, 3);
  s = MP.serverApply(srv, sent, stamp); srv = s.srv;
  const af = MP.afterFlush(local, outbox, sent, s.rows); local = af.cells; outbox = af.outbox;
  eq(Object.keys(outbox).length, 0, 'everything acknowledged');
  eq(srv[MP.attemptKey('L3', 'squat', 1)].status, 'good'); eq(srv[MP.attemptKey('L1', 'squat', 1)].status, 'good');
  eq(srv[MP.attemptKey('L2', 'squat', 1)].status, 'no', 'the miss made offline beats the later declaration'); eq(srv[MP.attemptKey('L2', 'squat', 1)].changes, 1);
  eq(srv[MP.attemptKey('L3', 'squat', 2)].kg, 107.5, 'the assistant-s declaration is kept: we never touched it');
  eq(local[MP.attemptKey('L2', 'squat', 1)].status, 'no'); assert(local[MP.attemptKey('L2', 'squat', 1)].srvAt, 'stamped by the server');
  // A realtime echo of a cell with an edit still waiting never overwrites that edit.
  const k = MP.attemptKey('L4', 'squat', 1);
  const r = MP.applyAction(local, { type: 'declare', lifterId: 'L4', lift: 'squat', n: 1, kg: 202.5 }, 200000);
  const ob = MP.queue({}, r.keys, r.cells);
  const merged = MP.mergeIncoming(r.cells, ob, [Object.assign({}, srv[k], { key: k, kg: 197.5 })]);
  eq(merged[k].kg, 202.5);
  eq(MP.mergeIncoming(r.cells, {}, [Object.assign({}, srv[k], { key: k, kg: 197.5 })])[k].kg, 197.5);
});

/* ===========================================================
   Ask AI, the coach's prompt (ai-chat.js coachPrompt): the ai-chat edge function keeps the first
   6,000 characters, so the rules go first, a roster of 25 fits under 5,500, a longer one says who
   was left out, and nothing a lifter wrote (notes, messages, check-in words, pain notes) or Apple
   Health brought in reaches it.
   =========================================================== */
group('Ask AI: the coach prompt');
(() => {
  const P = window.PowaAIPrompt || null;
  test('the prompt builder is loaded', () => assert(P && typeof P.coach === 'function', 'window.PowaAIPrompt.coach'));
  if (!P) return;
  const SECRET = { note: 'zebra-note-77', log: 'otter-log-71', msg: 'walrus-msg-73', ci: 'ibis-checkin-79', ans: 'heron-answer-83', pain: 'lynx-pain-89', fc: 'yak-video-97', coach: 'kiwi-private-61' };
  const NAMES = ['Arjun Mehta', 'Sarah Kim', 'Tom Boyle', 'Nina Petrova', 'Leo Grant', 'Priya Shah', 'Marcus Doyle', 'Elena Rossi', 'Jonah Reed', 'Mei Tanaka',
    'Callum Ward', 'Ines Duarte', 'Kofi Mensah', 'Hannah Berg', 'Dev Patel', 'Sofia Alvarez', 'Ryan O\'Neill', 'Amara Okafor', 'Tomas Novak', 'Grace Liu',
    'Mateo Fernandez-Garcia', 'Aisha Rahman', 'Lukas Becker', 'Chloe Martin', 'Oskar Lindqvist'];
  const today = todayISO(), dA = n => _addDaysISO(today, -n);
  // n lifters like the demo's: six weeks of the three lifts, a 4-week block, and a mix of what a
  // roster has: meets with a class, pain, notes and messages waiting, a set over its RPE, PRs.
  function roster(n) {
    const S = { athletes: [], workoutLogs: [], programs: [], meets: [], bodyweight: [], sessionNotes: [], messages: [], painReports: [], checkins: [], coachNotes: [],
      checkinQuestions: [{ id: 'q1', coachId: 'c', prompt: 'Anything I should know?', kind: 'text', cadence: 'daily', active: true }], checkinAnswers: [] };
    for (let i = 0; i < n; i++) {
      const id = 'ai' + i, base = [150 + (i % 9) * 6, 95 + (i % 7) * 5, 185 + (i % 8) * 7], rise = i % 4 === 0 ? 2.5 : 0;
      S.athletes.push({ id, name: NAMES[i % NAMES.length] + (i >= NAMES.length ? ' ' + (i + 1) : ''), coachId: 'c' });
      for (let w = 5; w >= 0; w--) ['squat', 'bench', 'deadlift'].forEach((L, k) => {
        const kg = base[k] + (5 - w) * rise;
        S.workoutLogs.push({ id: id + 'l' + w + k, athleteId: id, lift: L, variant: 'Competition', exerciseName: '', weight: kg, reps: 3, rpe: 8,
          e1rm: calcE1RM(kg, 3, 8), e1rmComp: calcCompE1RM(kg, 3, 8, L, 'Competition'), date: dA(w * 7 + k + (i % 2)), note: SECRET.log });
      });
      S.programs.push({ id: id + 'p', athleteId: id, coachId: 'c', name: ['Strength Block', 'Peak', 'Hypertrophy Wave', 'Volume Block'][i % 4],
        weeks: [1, 2, 3, 4].map(wn => ({ id: id + 'w' + wn, number: wn, days: ['squat', 'bench', 'deadlift'].map((L, di) => ({ id: id + 'd' + wn + di, name: L, exercises: [{ id: id + 'e' + wn + di, lift: L, variant: 'Competition', exerciseName: '', note: 'Brace hard.',
          sets: [{ id: id + 's' + wn + di, weight: base[di], reps: 3, rpe: 8, completed: wn === 1, actualRpe: wn === 1 ? (i % 5 === 0 && di === 1 ? 9.5 : 8) : null, completedAt: wn === 1 ? dA(8 - di) : null, note: SECRET.log }] }] })) })) });
      if (i % 3 === 0) {
        S.meets.push({ id: id + 'm', athleteId: id, name: 'State Open', date: dA(-(12 + i)), weightClass: '93 kg', status: 'planned' });
        S.bodyweight.push({ id: id + 'bw', athleteId: id, date: dA(2), weight: 92.4 });                 // typed: under the class
        S.bodyweight.push({ id: healthBwUid(), athleteId: id, date: dA(0), weight: 95.8 });              // from Apple Health: over it, never read
      }
      if (i % 4 === 1) S.sessionNotes.push({ id: id + 'n', athleteId: id, date: dA(1), note: SECRET.note, coachComment: null });
      if (i % 4 === 2) S.messages.push({ id: id + 'g', coachId: 'c', athleteId: id, senderId: id, body: SECRET.msg, createdAt: new Date(Date.now() - 30 * 3600000).toISOString(), readAt: null });
      if (i % 6 === 3) S.painReports.push({ id: id + 'x', athleteId: id, coachId: 'c', day: dA(1), bodyPart: 'knee', side: 'left', severity: 5, phase: 'top', lift: 'squat', note: SECRET.pain, createdAt: dA(1) + 'T18:00:00Z', resolvedAt: null });
      S.checkins.push({ id: id + 'c', athleteId: id, weekStart: _monISO(dA(9)), sleep: 7, soreness: 6, stress: 7, feel: 8, note: SECRET.ci, createdAt: dA(9) + 'T08:00:00Z' });
      S.checkinAnswers.push({ id: id + 'a', questionId: 'q1', athleteId: id, coachId: 'c', period: dA(0), num: null, text: SECRET.ans });
      S.coachNotes.push({ id: id + 'k', coachId: 'c', athleteId: id, body: SECRET.coach });
    }
    return Object.assign(defaultStore(), S);
  }
  const lines = s => s.slice(s.indexOf('\nRoster, ')).split('\n- ').length - 1;   // the roster's lines (the rules are bullets too)
  const saved = Store.get();
  try {
    Store.set(roster(25));
    const fcs = [{ id: 'fc1', athleteId: 'ai0', coachId: 'c', lift: 'squat', note: SECRET.fc, coachReply: null, createdAt: new Date().toISOString() }];
    const p25 = P.coach({ coachId: 'c', coachName: 'Kay Coach', unit: 'kg', formChecks: fcs });
    test('the rules come first, before any lifter', () => {
      assert(/^You are the POWALIFTA coaching assistant for coach Kay Coach\./.test(p25), 'starts with who it is');
      const firstLifter = Math.min.apply(null, NAMES.map(nm => p25.indexOf(nm + ':')).filter(i => i >= 0));
      ['Never invent numbers', 'training data only', 'Weights below are kg', 'Under ~120 words'].forEach(rule => {
        const at = p25.indexOf(rule);
        assert(at >= 0 && at < firstLifter, '"' + rule + '" before the roster');
      });
    });
    test('25 demo-like lifters fit under 5,500 characters, one line each', () => {
      assert(p25.length < 5500, 'length ' + p25.length);
      NAMES.forEach(nm => assert(p25.indexOf('\n- ' + nm + ':') >= 0, nm + ' is in'));
      eq(lines(p25), 25, 'a line per lifter');
      assert(p25.indexOf('more lifters not shown') < 0, 'nobody left out');
      assert(/Arjun Mehta: e1RM \d+ \(S\d+\/B\d+\/D\d+\)/.test(p25), 'the total and the three lifts');
      assert(/; \d\/\d sessions; /.test(p25), 'sessions done of planned');
      assert(/Strength Block wk \d\/4/.test(p25), 'the program and its week');
      assert(/meet in \d+d \(93 kg class\)/.test(p25), 'a meet coming up');
      assert(/pain left knee 5\/10/.test(p25), 'pain, the part and how bad');
    });
    test('nothing a lifter wrote, nor Apple Health, reaches the coach prompt', () => {
      Object.keys(SECRET).forEach(k => assert(p25.indexOf(SECRET[k]) < 0, 'their ' + k + ' text leaked'));
      assert(!/over class/.test(p25), 'the Health weigh-in (95.8 for 93) is never read: the typed 92.4 is under');
      assert(p25.indexOf('Brace hard.') < 0, 'no exercise notes either');
    });
    Store.set(roster(60));
    const p60 = P.coach({ coachId: 'c', coachName: 'Kay Coach', unit: 'lb' });

      assert(p60.length <= 5500, 'length ' + p60.length);
      const shown = lines(p60), m = /\n\(\+(\d+) more lifters not shown\)$/.exec(p60);
      assert(m, 'ends with (+N more lifters not shown)');
      eq(shown + Number(m[1]), 60, 'everyone is either shown or counted');
      assert(/Answer in lb/.test(p60), 'the coach’s unit');
    });
  } finally { Store.set(saved); }
})();

      assert(/- \*\*Pia Lund\*\*: L knee 6\/10, squat/.test(a), a);
      assert(a.indexOf('secret-pain-words') < 0 && a.indexOf('Omar') < 0, 'only Pia, and none of her words');
      eq(ask('Is Omar in pain?'), "**Omar Haddad** hasn't reported pain.");
    });
    test('who has stalled: a lift with no new best in 4 weeks', () => {
      const a = ask("Who's stalled?");
      assert(/- \*\*Omar Haddad\*\*: Squat$/m.test(a), a);
      assert(a.indexOf('Pia') < 0, 'too little data on Pia to call it');
    });
    test('quiet, over the class, PRs, intakes', () => {
      assert(/- \*\*Lena Brandt\*\*: Last trained 9 days ago/.test(ask("Who's gone quiet?")), 'Lena is quiet');
      assert(/- \*\*Omar Haddad\*\*: \+1\.1 kg over the 93 kg class, meet in 20 days/.test(ask("Who's over their class?")), 'Omar is over');
      assert(/- \*\*Pia Lund\*\*: Bench PR/.test(ask('Any PRs this week?')), 'Pia PR’d');
      assert(/- \*\*Will Carter\*\*: Sent yesterday, no program yet/.test(ask('New intakes?')), 'Will sent the intake');
    });
    test('payments: overdue, due soon, the month so far', () => {
      const a = ask('Who owes me money?');
      assert(/\*\*One payment overdue\*\*, \$150:/.test(a), a);
      assert(/- \*\*Pia Lund\*\*: \$150, 3 days late/.test(a), a);
      assert(/- \*\*Omar Haddad\*\*: \$120 in 2 days/.test(a), a);
      assert(/Received this month: \*\*\$120\*\*/.test(a), a);
      eq(ask('Has Pia paid?'), '**Pia Lund**: $150, overdue 3 days.');
    });
    test('an everyday-word first name only counts with a capital', () => {
      const a = ask('who will make weight?');
      assert(/Omar Haddad/.test(a) && a.indexOf('Will Carter') < 0, a);
      eq(ask('Is Will in pain?'), "**Will Carter** hasn't reported pain.");
    });
    test('the team in a few lines, and one lifter’s week', () => {
      const t = ask('Summarise this week');
      assert(/^\*\*4 lifters\*\*: /.test(t), t);
      assert(/- \*\*1\*\* in pain: \*\*Pia Lund\*\*/.test(t), t);
      assert(t.indexOf('Zed') < 0, 'another coach’s lifter never shows');
      const o = ask("How's Omar doing?");
      assert(/^\*\*Omar Haddad\*\*\n- /.test(o) && /e1RM total \d+ kg/.test(o) && /State Open in 20 days, 93 kg/.test(o), o);
    });
    test('pounds when the coach uses pounds', () => {
      assert(/\+2\.4 lb over the 93 kg class/.test(ask("Who's over their class?", { unit: 'lb' })), 'the gap in lb');
      assert(/e1RM total \d+ lb/.test(ask("How's Omar doing?", { unit: 'lb' })), 'the total in lb');
    });
    test('not a roster question: nothing', () => {
      eq(ask('How do I export a program?'), null);
      eq(R.ask("Who's in pain?", {}), null, 'no coach, no answer');
    });
  } finally { Store.set(saved); }
  test('linkNames: every mention, never inside a tag or code, ids escaped', () => {
    const roster = [{ id: 'a"1', name: 'Pia Lund' }, { id: 'b2', name: 'Will Carter' }, { id: 'c3', name: 'Omar Haddad' }, { id: 'c4', name: 'Omar Said' }];
    const html = '<p><strong>Pia Lund</strong> and Pia again, <span title="Pia Lund">x</span> <code>Pia Lund</code> Will said; Omar too; Will Carter; Lena</p>';
    const out = R.link(html, roster);
    eq((out.match(/class="ai-who"/g) || []).length, 3, 'Pia twice (full and first) and Will Carter once');
    assert(out.indexOf('data-ai-lifter="a&quot;1"') >= 0, 'the id is escaped');
    assert(out.indexOf('<span title="Pia Lund">') >= 0, 'an attribute is never touched');
    assert(out.indexOf('<code>Pia Lund</code>') >= 0, 'code is never touched');
    assert(/ Will said/.test(out), '"Will" alone is an everyday word');
    assert(/Omar too/.test(out), 'two Omars: a first name alone is not enough');
  });
})();

function render() {
  const sum = document.getElementById('summary');
  const total = T.pass + T.fail + T.skip;
  sum.innerHTML =
    '<span class="pill tot">' + total + ' tests</span>' +
    '<span class="pill pass">✓ ' + T.pass + ' passed</span>' +
    (T.fail ? '<span class="pill fail">✗ ' + T.fail + ' failed</span>' : '') +
    (T.skip ? '<span class="pill skip">• ' + T.skip + ' skipped</span>' : '') +
    '<span class="pill dur" id="dur"></span>' +
    '<button class="rerun" onclick="location.reload()">Re-run</button>';

  const banner = document.getElementById('banner');
  if (T.fail === 0) banner.innerHTML = '<div class="banner ok">ALL GREEN — ' + T.pass + ' assertions passing' + (T.skip ? ' (' + T.skip + ' skipped)' : '') + '</div>';
  else banner.innerHTML = '<div class="banner bad">' + T.fail + ' FAILING — see red rows below</div>';

  const out = document.getElementById('results');
  out.innerHTML = T.groups.map(g => {
    const cases = g.cases.map(c => {
      const m = c.status === 'pass' ? '<span class="mark p">✓</span>'
        : c.status === 'fail' ? '<span class="mark f">✗</span>'
        : '<span class="mark s">•</span>';
      const extra = c.status === 'fail' ? '<div class="cerr">' + esc(c.err) + '</div>'
        : (c.status === 'skip' && c.err) ? '<div class="cnote">skipped: ' + esc(c.err) + '</div>' : '';
      return '<div class="case">' + m + '<div class="ctext"><div class="cname">' + esc(c.name) + '</div>' + extra + '</div></div>';
    }).join('');
    return '<div class="grp"><p class="grp-h">' + esc(g.name) + '</p>' + cases + '</div>';
  }).join('');
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function bootImporterThenRender(t0) {
  const iframe = document.createElement('iframe');
  iframe.className = 'sandbox';
  iframe.src = 'athlete.html?demo=1';
  document.body.appendChild(iframe);
  const start = Date.now();
  const TIMEOUT = 8000;
  (function poll() {
    let win = null;
    try { win = iframe.contentWindow; } catch (e) { win = null; }
    const ready = win && typeof win._impBuild === 'function' && win._user && win._user.id;
    if (ready) {
      try { runImporterTests(win); }
      catch (e) { group('importer (athlete.html)'); skip('importer round-trip', 'threw while running: ' + ((e && e.message) || e)); }
      finish(t0); return;
    }
    if (Date.now() - start > TIMEOUT) {
      group('importer (athlete.html)');
      skip('importer round-trip', 'demo iframe did not expose _impBuild within ' + (TIMEOUT / 1000) + 's');
      finish(t0); return;
    }
    setTimeout(poll, 150);
  })();
}
function finish(t0) {
  render();
  const dur = document.getElementById('dur');
  if (dur) dur.textContent = (Date.now() - t0) + ' ms';
}

window.addEventListener('load', () => {
  const t0 = Date.now();
  // Synchronous groups already ran at script-parse time above.
  bootImporterThenRender(t0);
});
</script>
