<script>
/* ===========================================================
   Tiny zero-dependency test framework
   =========================================================== */
const T = { pass: 0, fail: 0, skip: 0, groups: [] };
let _cur = null;
function group(name) { _cur = { name, cases: [] }; T.groups.push(_cur); }
function test(name, fn) {
  const c = { name, status: 'pass', err: '' };
  try { fn(); T.pass++; }
  catch (e) { c.status = 'fail'; c.err = (e && e.message) || String(e); T.fail++; }
  _cur.cases.push(c);
}
function skip(name, reason) {
  _cur.cases.push({ name, status: 'skip', err: reason || '' });
  T.skip++;
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
function eq(actual, expected, msg) {
  if (actual !== expected) throw new Error((msg ? msg + ' — ' : '') + 'expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
}
function close(actual, expected, eps, msg) {
  eps = eps == null ? 0.01 : eps;
  if (typeof actual !== 'number' || !isFinite(actual) || Math.abs(actual - expected) > eps)
    throw new Error((msg ? msg + ' — ' : '') + 'expected ≈' + expected + ' (±' + eps + '), got ' + actual);
}

/* ===========================================================
   State helpers
   =========================================================== */
function resetState() { Store.reset(); window._user = null; }
function seed(partial) {
  Store.update(s => { Object.keys(partial).forEach(k => { s[k] = partial[k]; }); });
}
const iso = d => d.toISOString().slice(0, 10);
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };

/* ===========================================================
   1. e1RM math
   =========================================================== */
group('e1RM math');
test('zero inputs → 0', () => eq(calcE1RM(0, 5, 8), 0));
test('1 rep @ RPE 10 returns the weight itself', () => eq(calcE1RM(100, 1, 10), 100));
test('100×5 @ RPE 8 ≈ 124.97', () => close(calcE1RM(100, 5, 8), 124.97, 0.1));
test('higher RPE → lower e1RM (fewer reps in reserve)', () => assert(calcE1RM(100, 5, 9) < calcE1RM(100, 5, 8)));
test('more reps → higher e1RM', () => assert(calcE1RM(100, 6, 8) > calcE1RM(100, 5, 8)));
test('extreme fatigue floors at weight/0.4 (=250)', () => close(calcE1RM(100, 30, 1), 250, 0.01));

/* ===========================================================
   2. Variant multipliers
   =========================================================== */
group('variant multipliers');
test('squat Competition = 1.0', () => eq(multiplierFor('squat', 'Competition'), 1.0));
test('bench Close Grip = 1.09', () => eq(multiplierFor('bench', 'Close Grip'), 1.09));
test('deadlift Deficit = 1.06', () => eq(multiplierFor('deadlift', 'Deficit'), 1.06));
test('unknown variant falls back to 1.0', () => eq(multiplierFor('squat', 'Nope'), 1.0));
test('unknown lift falls back to 1.0', () => eq(multiplierFor('zercher', 'Competition'), 1.0));
test('comp e1RM scales by multiplier (CG bench 1×RPE10)', () => close(calcCompE1RM(100, 1, 10, 'bench', 'Close Grip'), 109, 0.01));

/* ===========================================================
   3. Unit conversion (saves & restores the user's real setting)
   =========================================================== */
group('unit conversion');
(() => {
  const saved = (() => { try { return localStorage.getItem('powa-unit'); } catch { return null; } })();
  try {
    setUnit('kg');
    test('kg mode: 100kg displays as 100', () => eq(kgToDisplay(100), 100));
    test('kg mode: displayToKg is identity', () => eq(displayToKg(100), 100));
    setUnit('lbs');
    test('lbs mode: 100kg ≈ 220.5 lb', () => close(kgToDisplay(100, 1), 220.5, 0.1));
    test('lbs mode: 225 lb entry ≈ 102.06 kg', () => close(displayToKg(225), 102.058, 0.01));
    test('lbs round-trip kg→display→kg is lossless', () => close(displayToKg(kgToDisplay(142.5, 6)), 142.5, 0.001));
    test('empty string passes through unchanged', () => eq(displayToKg(''), ''));
  } finally {
    // Restore so the harness never clobbers the real app's unit preference.
    try { if (saved == null) localStorage.removeItem(UNIT_KEY); else localStorage.setItem(UNIT_KEY, saved); } catch {}
  }
})();

/* ===========================================================
   4. PR detection
   =========================================================== */
group('PR detection');
(() => {
  resetState();
  const L = (id, date, e) => ({ id, athleteId: 'ath1', lift: 'squat', variant: 'Competition', e1rmComp: e, date });
  const a = L('l1', '2026-01-01', 100), b = L('l2', '2026-01-02', 105), c = L('l3', '2026-01-03', 102);
  seed({ workoutLogs: [a, b, c] });
  test('first-ever log of a lift is not a PR (it beats nothing yet)', () => eq(isPRForLog('ath1', a), false));
  test('beating prior best is a PR', () => eq(isPRForLog('ath1', b), true));
  test('below prior best is NOT a PR', () => eq(isPRForLog('ath1', c), false));
  resetState();
})();

/* ===========================================================
   5. Weekly delta
   =========================================================== */
group('weekly delta');
(() => {
  resetState();
  seed({ workoutLogs: [
    { id: 'w1', athleteId: 'ath1', lift: 'squat', e1rmComp: 100, date: daysAgo(9) },  // prev week
    { id: 'w2', athleteId: 'ath1', lift: 'squat', e1rmComp: 110, date: daysAgo(1) },  // this week
  ] });
  const d = getWeeklyDelta('ath1');
  test('squat delta = +10 this week vs last', () => close(d.squat.delta, 10, 0.001));
  test('current best reflected', () => close(d.squat.current, 110, 0.001));
  resetState();
})();

/* ===========================================================
   6. Best e1RM / current total
   =========================================================== */
group('best e1RM & total');
(() => {
  resetState();
  seed({ workoutLogs: [
    { id: 's1', athleteId: 'ath1', lift: 'squat', e1rmComp: 100, date: '2026-01-01' },
    { id: 's2', athleteId: 'ath1', lift: 'squat', e1rmComp: 120, date: '2026-01-02' },
    { id: 'b1', athleteId: 'ath1', lift: 'bench', e1rmComp: 80, date: '2026-01-01' },
    { id: 'd1', athleteId: 'ath1', lift: 'deadlift', e1rmComp: 150, date: '2026-01-01' },
    { id: 'x1', athleteId: 'other', lift: 'squat', e1rmComp: 999, date: '2026-01-01' },
  ] });
  test('bestE1RM picks the max for the athlete', () => eq(bestE1RM('ath1', 'squat'), 120));
  test('foreign athlete logs are excluded', () => eq(bestE1RM('ath1', 'squat') !== 999, true));
  test('currentTotal sums best SBD (120+80+150=350)', () => eq(currentTotal('ath1'), 350));
  resetState();
})();

/* ===========================================================
   6b. Lift balance (SBD split vs typical raw ranges)
   =========================================================== */
group('lift balance');
(() => {
  test('null when any lift is missing', () => eq(liftBalance(200, 0, 240), null));
  test('null when total is zero', () => eq(liftBalance(0, 0, 0), null));
  test('shares sum to 1', () => {
    const b = liftBalance(200, 130, 240);
    close(b.rows.reduce((s, r) => s + r.share, 0), 1, 1e-9);
  });
  test('balanced split flags no weakest lift', () => {
    // 35% / 23% / 42% of 600 → all inside their bands
    const b = liftBalance(210, 138, 252);
    eq(b.weakest, null);
    assert(b.rows.every(r => r.status === 'balanced'), 'expected all balanced');
  });
  test('low bench is flagged lagging and chosen as weakest', () => {
    // bench only ~15% of total
    const b = liftBalance(220, 70, 250);
    const bench = b.rows.find(r => r.lift === 'bench');
    eq(bench.status, 'lagging');
    eq(b.weakest.lift, 'bench');
  });
  test('oversized deadlift reads as strong', () => {
    const b = liftBalance(150, 100, 320);
    eq(b.rows.find(r => r.lift === 'deadlift').status, 'strong');
  });
  test('unit-agnostic: scaling all three keeps statuses', () => {
    const a = liftBalance(220, 70, 250);
    const b = liftBalance(220 * 2.2046, 70 * 2.2046, 250 * 2.2046);
    eq(a.weakest.lift, b.weakest.lift);
  });
})();

/* ===========================================================
   7. Signal center — coach
   =========================================================== */
group('signals · coach');
(() => {
  resetState();
  window._user = { id: 'coach1', name: 'Coach Bob', userType: 'coach' };
  Store.update(s => {
    s.athletes = [{ id: 'ath1', name: 'Test Athlete', coachId: 'coach1' }];
    s.sessionNotes = [{ id: 'n1', athleteId: 'ath1', note: 'felt heavy', date: '2026-06-01' }]; // no coachComment
    s.checkins = [{ id: 'c1', athleteId: 'ath1', feel: 8, sleep: 7, stress: 3, weekStart: '2026-06-22' }];
    s.workoutLogs = [];
  });
  const sig = computeSignals();
  test('athlete note awaiting reply surfaces', () => assert(sig.some(x => x.id === 'cnote-n1' && x.type === 'reply'), 'no cnote-n1 in ' + JSON.stringify(sig.map(s => s.id))));
  test('check-in surfaces as a signal', () => assert(sig.some(x => x.id === 'cci-c1' && x.type === 'checkin')));
  test('note already replied to is suppressed', () => {
    Store.update(s => { s.sessionNotes[0].coachComment = 'good work'; });
    assert(!computeSignals().some(x => x.id === 'cnote-n1'));
  });
  resetState();
})();

/* ===========================================================
   8. Signal center — athlete
   =========================================================== */
group('signals · athlete');
(() => {
  resetState();
  window._user = { id: 'ath1', name: 'Test Athlete', userType: 'athlete', coachId: 'coach1' };
  Store.update(s => {
    s.coaches = [{ id: 'coach1', name: 'Coach Bob' }];
    s.sessionNotes = [{ id: 'n2', athleteId: 'ath1', coachComment: 'great session', date: '2026-06-01' }];
    s.checkins = [];
  });
  const sig = computeSignals();
  test('coach reply surfaces with coach name', () => {
    const r = sig.find(x => x.id === 'areply-n2');
    assert(r && /Coach Bob/.test(r.title), 'reply missing or unnamed: ' + JSON.stringify(r));
  });
  test('weekly check-in due when none submitted', () => assert(sig.some(x => x.type === 'checkin' && x.id.indexOf('aci-due-') === 0)));
  resetState();
})();

/* ===========================================================
   9. Data export
   =========================================================== */
group('data export');
(() => {
  resetState();
  window._user = { id: 'ath1', name: 'Test Athlete', email: 'a@b.com', userType: 'athlete', coachId: 'coach1' };
  Store.update(s => {
    s.workoutLogs = [
      { id: 'l1', athleteId: 'ath1', lift: 'squat', variant: 'Competition', weight: 150, reps: 3, rpe: 8, e1rm: 170.4, date: '2026-06-01', note: 'crisp' },
      { id: 'l2', athleteId: 'ath1', lift: 'accessory', exerciseName: 'Bicep Curls', variant: '', weight: 20, reps: 12, rpe: 9, e1rm: 0, date: '2026-06-02', note: '' },
      { id: 'l3', athleteId: 'other', lift: 'bench', variant: 'Competition', weight: 100, reps: 5, rpe: 8, e1rm: 124, date: '2026-06-01', note: '' },
    ];
    s.bodyweight = [{ id: 'bw1', athleteId: 'ath1', date: '2026-06-01', weight: 84 }];
  });
  const payload = buildExportPayload();
  test('payload account id matches user', () => eq(payload.account.id, 'ath1'));
  test('only the athlete\'s own logs are exported', () => eq(payload.workoutLogs.length, 2));
  test('bodyweight included for athlete', () => eq(payload.bodyweight.length, 1));

  const csv = _logsToCsv();
  const lines = csv.split('\n');
  test('CSV header has no colliding exercise column', () => eq(lines[0], 'date,lift,variant,weight_kg,reps,rpe,e1rm_kg,note'));
  test('accessory name lands in the lift column', () => {
    const row = lines.find(l => l.indexOf('Bicep Curls') >= 0);
    assert(row && row.indexOf('2026-06-02,Bicep Curls,') === 0, 'row was: ' + row);
  });
  test('weights exported in kg (150), not converted', () => assert(lines.some(l => l.indexOf(',squat,Competition,150,') >= 0)));
  test('foreign athlete logs excluded from CSV', () => assert(!csv.includes('2026-06-01,bench')));
  resetState();
})();

/* ===========================================================
   9b. Program → spreadsheet export
   =========================================================== */
group('program export');
(() => {
  const saved = (() => { try { return localStorage.getItem('powa-unit'); } catch { return null; } })();
  try {
    setUnit('kg');
    const program = { id: 'p1', athleteId: 'ath1', name: 'Test Block', weeks: [
      { number: 1, days: [
        { id: 'd1', name: 'Squat Day', exercises: [
          { id: 'e1', lift: 'squat', variant: 'Competition', exerciseName: '', note: 'brace hard', sets: [
            { weight: 150, reps: 5, rpe: 7 }, { weight: 150, reps: 5, rpe: 8 } ] },
          { id: 'e2', lift: 'legs', variant: '', exerciseName: 'Leg Curls', note: '', sets: [
            { weight: 30, reps: 12, rpe: 8 } ] },
        ] },
        { id: 'd2', name: 'Rest', exercises: [] },
      ] },
    ] };
    const csv = buildProgramCsv(program);
    const lines = csv.split('\n');
    test('header carries the unit + tracking columns', () =>
      eq(lines[0], 'week,day,exercise,variant,set,weight (kg),reps,target_rpe,done,actual_weight,actual_rpe,notes'));
    test('one row per prescribed set', () =>
      eq(lines.filter(l => l.indexOf('Week 1,Squat Day,Squat,Competition,') === 0).length, 2));
    test('main lift labelled, variant in its own column, kg weight', () =>
      assert(lines.some(l => l.indexOf('Week 1,Squat Day,Squat,Competition,1,150,5,7,,,,brace hard') === 0)));
    test('coach note only on the first set of an exercise', () => {
      const set2 = lines.find(l => l.indexOf('Week 1,Squat Day,Squat,Competition,2,') === 0);
      assert(set2 && /,,,,$/.test(set2), 'set 2 row was: ' + set2);
    });
    test('accessory keeps its name', () =>
      assert(lines.some(l => l.indexOf('Week 1,Squat Day,Leg Curls,,1,30,12,8,') === 0)));
    test('rest day emits a marker row', () =>
      assert(lines.some(l => l.indexOf('Week 1,Rest,Rest day,') === 0)));
    setUnit('lbs');
    test('lbs mode: header + weight convert (150kg ≈ 330.7lb)', () => {
      const l = buildProgramCsv(program).split('\n');
      assert(l[0].indexOf('weight (lbs)') >= 0, 'header: ' + l[0]);
      assert(l.some(r => r.indexOf('Week 1,Squat Day,Squat,Competition,1,330.7,') === 0), 'no converted row');
    });
  } finally {
    try { if (saved == null) localStorage.removeItem(UNIT_KEY); else localStorage.setItem(UNIT_KEY, saved); } catch {}
  }
})();

group('marketplace reviews');
test('reviewStats: empty list → zeros', () => {
  const s = reviewStats([]);
  eq(s.count, 0); eq(s.avg, 0); eq(s.rounded, 0);
});
test('reviewStats: average rounded to 1 decimal', () => {
  const s = reviewStats([{ rating: 5 }, { rating: 4 }, { rating: 4 }]); // 13/3 = 4.333
  eq(s.count, 3); eq(s.avg, 4.3); eq(s.rounded, 4);
});
test('reviewStats: distribution buckets each rating', () => {
  const s = reviewStats([{ rating: 5 }, { rating: 5 }, { rating: 3 }, { rating: 1 }]);
  eq(s.dist[5], 2); eq(s.dist[3], 1); eq(s.dist[1], 1); eq(s.dist[2], 0);
});
test('reviewStats: drops out-of-range / malformed entries', () => {
  const s = reviewStats([{ rating: 5 }, { rating: 0 }, { rating: 6 }, null, { rating: 3 }]);
  eq(s.count, 2); eq(s.avg, 4); // (5+3)/2
});
test('reviewStats: non-array input is safe', () => {
  const s = reviewStats(null);
  eq(s.count, 0); eq(s.avg, 0);
});
test('starString: fills round(value) of 5 glyphs', () => {
  eq(starString(0), '☆☆☆☆☆');
  eq(starString(4.4), '★★★★☆');
  eq(starString(5), '★★★★★');
});
test('starString: clamps out-of-range input', () => {
  eq(starString(99), '★★★★★');
  eq(starString(-3), '☆☆☆☆☆');
});
test('starsHtml: emits 5 spans, filled ones marked st-on', () => {
  const h = starsHtml(3);
  eq((h.match(/st-on/g) || []).length, 3);
  eq((h.match(/st-off/g) || []).length, 2);
});

/* ===========================================================
   8b. Referral rewards ledger (migration-referral-rewards)
   Pure earn-gating: a tier is `earned` only when count >= at; claims
   merge in by tier_at; the server still re-checks on claim.
   =========================================================== */
group('referral rewards');
test('ledger: one row per tier, in order', () => {
  const l = referralRewardsLedger(0, []);
  eq(l.length, REFERRAL_TIERS.length);
  eq(l[0].at, 1); eq(l[l.length - 1].at, 25);
  assert(l.every(r => r.reward && r.reward.length), 'every tier carries reward copy');
});
test('ledger: count gates earned + remaining', () => {
  const l = referralRewardsLedger(5, []);
  const byAt = {}; l.forEach(r => { byAt[r.at] = r; });
  eq(byAt[1].earned, true); eq(byAt[3].earned, true); eq(byAt[5].earned, true);
  eq(byAt[10].earned, false); eq(byAt[25].earned, false);

  const logs = [L('2026-10-01', 200, 1, 9), L('2026-10-01', 170, 5, 7), L('2026-10-08', 200, 1, 9), L('2026-10-08', 170, 5, 7), L('2026-10-15', 200, 1, 9), L('2026-10-15', 170, 5, 7),
    L('2026-10-15', 120, 8, 6)];   // one eight: not enough to judge
  const d = rpeDrift(logs, 'squat', { today: '2026-10-20' });
  eq(d.buckets['4-6'].n, 3);
  eq(d.buckets['4-6'].drift > 1.3 && d.buckets['4-6'].drift < 1.9, true);
  eq(d.worst.bucket, '4-6');
  eq(d.buckets['7+'].n, 1); eq(d.n, 4);
  eq(rpeDrift(logs, 'bench', { today: '2026-10-20' }).n, 0);
  eq(rpeDrift(logs, 'squat', { today: '2026-12-20' }).n, 0);                        // out of the window
  eq(Math.round(d.refMax), 207);                                            // the single's max, not the inflated five's 222
  // 165 × 5 said @ 7.5 beside 162.5 × 3 @ 8.5: by the triple's max the five is past a max ⇒ reads as a 10, drift +2.5
  const lie = [L('2026-10-01', 162.5, 3, 8.5), L('2026-10-01', 165, 5, 7.5), L('2026-10-08', 162.5, 3, 8.5), L('2026-10-08', 165, 5, 7.5), L('2026-10-15', 162.5, 3, 8.5), L('2026-10-15', 165, 5, 7.5)];
  eq(rpeDrift(lie, 'squat', { today: '2026-10-20' }).buckets['4-6'].drift, 2.5);
  // honest calls: 170 × 5 @ 8.6-ish ⇒ no drift
  const fair = [L('2026-10-01', 200, 1, 9), L('2026-10-01', 170, 5, 8.5), L('2026-10-08', 200, 1, 9), L('2026-10-08', 170, 5, 8.5), L('2026-10-15', 200, 1, 9), L('2026-10-15', 170, 5, 8.5)];

test('switch kit: crc32 and a store-only zip that reads back', () => {
  eq(SK.crc32(SK.utf8('hello')), 0x3610a686); eq(SK.crc32(SK.utf8('')), 0);
  const files = [{ name: 'a.csv', text: 'x,y\n1,2\n' }, { name: 'é.txt', text: 'héllo' }];
  const z = SK.zip(files, new Date(2026, 9, 22, 10, 30, 0));
  const dec = (b) => decodeURIComponent(escape(Array.from(b).map(c => String.fromCharCode(c)).join('')));
  const dv = new DataView(z.buffer);
  eq(dv.getUint32(0, true), 0x04034b50);
  const eocd = z.length - 22;
  eq(dv.getUint32(eocd, true), 0x06054b50); eq(dv.getUint16(eocd + 10, true), 2);
  let at = dv.getUint32(eocd + 16, true);
  const names = [];
  for (let i = 0; i < 2; i++) {
    eq(dv.getUint32(at, true), 0x02014b50);
    const crc = dv.getUint32(at + 16, true), size = dv.getUint32(at + 20, true), nl = dv.getUint16(at + 28, true), off = dv.getUint32(at + 42, true);
    names.push(dec(z.slice(at + 46, at + 46 + nl)));
    const lnl = dv.getUint16(off + 26, true);
    const data = z.slice(off + 30 + lnl, off + 30 + lnl + size);
    eq(SK.crc32(data), crc); eq(dec(data), files[i].text);
    at += 46 + nl;
  }
  eq(names.join('|'), 'a.csv|é.txt');
});

/* ===========================================================
   Imports (import-core.js): the intake that takes any file a
   coach has. Fixtures come from published headers only; where
   a header's spelling or a row's values aren't published, the
   test name says "assumed".
   =========================================================== */
group('imports (import-core.js)');
const IC = window.ImportCore;
const IM_TODAY = '2026-10-28';
const imBytes = (arr) => new Uint8Array(arr);
const imUtf8 = (s) => new TextEncoder().encode(s);
const imTable = (csv, name) => IC.tablesFromText(csv, name || 'file.csv')[0];
const imTC_HEAD = 'First Name,Last Name,Email,Compliance Score,Total Workouts Completed,Birthday,Location,Timezone,Phone Number,Client Type,Client State,Height,Weight,Unit Preference,Gender';
const imCRX_HEAD = 'Client ID,Client Name,Client Email,Coach,Coach Email,Status,Start Date,Archive Date,Height (cm),Weight (kg),Sex,Birthday,Phone Number,Timezone,Location,Address,Emergency Contact,T-Shirt Size,Referred By,Exercise Sessions Completed,Lifestyle Rx\'s Completed,Highest Streak,Tags,Last Consultation,Synced with Stripe,Product,Plan,Card Brand,Card Last 4,Monthly Revenue,Payment Status';
// A zip built by hand, so a test can make it lie. entries: [{ name, data (bytes or text), method (8 by default,
// 0 stored), comp (the bytes written: data deflated, or data), size / csize (the sizes it declares: the real
// ones by default), flags, lx / cx (local / central extra field bytes), offset (where the directory says it
// is) }]. opts: { onDisk, total (the end record's two counts), cdAt (where it says the directory starts), more
// (that many extra directory entries pointing at the first file) }.
const imLE = (v, n) => { const out = []; for (let i = 0; i < n; i++) { out.push(v % 256); v = Math.floor(v / 256); } return out; };
function imZip(entries, opts) {
  opts = opts || {};
  const enc = new TextEncoder(), out = [], central = [];
  const put = (arr, list) => { for (let i = 0; i < list.length; i++) arr.push(list[i]); };
  const recs = entries.map(e => {
    const name = Array.from(enc.encode(e.name));
    const raw = typeof e.data === 'string' ? enc.encode(e.data) : (e.data || new Uint8Array(0));
    const method = e.method == null ? 8 : e.method;
    const comp = e.comp || (method === 8 ? fflate.deflateSync(raw) : raw);
    const r = { name, method, comp, size: e.size == null ? raw.length : e.size, csize: e.csize == null ? comp.length : e.csize, flags: e.flags || 0, lx: e.lx || [], cx: e.cx || [], at: out.length };
    put(out, imLE(0x04034b50, 4)); put(out, imLE(20, 2)); put(out, imLE(r.flags, 2)); put(out, imLE(method, 2)); put(out, imLE(0, 4));
    put(out, imLE(0, 4)); put(out, imLE(r.csize, 4)); put(out, imLE(r.size, 4)); put(out, imLE(name.length, 2)); put(out, imLE(r.lx.length, 2));
    put(out, name); put(out, r.lx); put(out, comp);
    r.offset = e.offset == null ? r.at : e.offset;
    return r;
  });
  const cdAt = out.length;
  const cd = (r) => {
    put(central, imLE(0x02014b50, 4)); put(central, imLE(20, 2)); put(central, imLE(20, 2)); put(central, imLE(r.flags, 2)); put(central, imLE(r.method, 2)); put(central, imLE(0, 4));
    put(central, imLE(0, 4)); put(central, imLE(r.csize, 4)); put(central, imLE(r.size, 4)); put(central, imLE(r.name.length, 2)); put(central, imLE(r.cx.length, 2)); put(central, imLE(0, 2));
    put(central, imLE(0, 2)); put(central, imLE(0, 2)); put(central, imLE(0, 4)); put(central, imLE(r.offset, 4)); put(central, r.name); put(central, r.cx);
  };
  recs.forEach(cd);
  for (let k = 0; k < (opts.more || 0); k++) cd(Object.assign({}, recs[0], { name: Array.from(enc.encode('f' + (k + 1) + '.csv')) }));
  put(out, central);
  const n = recs.length + (opts.more || 0);
  put(out, imLE(0x06054b50, 4)); put(out, imLE(0, 2)); put(out, imLE(0, 2)); put(out, imLE(opts.onDisk == null ? n : opts.onDisk, 2)); put(out, imLE(opts.total == null ? n : opts.total, 2));
  put(out, imLE(central.length, 4)); put(out, imLE(opts.cdAt == null ? cdAt : opts.cdAt, 4)); put(out, imLE(0, 2));
  return new Uint8Array(out);
}
// A ZIP64 extra field (type 1): an uncompressed and a compressed size.
const imZip64 = (usz, csz) => [1, 0, 16, 0].concat(imLE(usz, 8), imLE(csz, 8));
// Reading it must be refused with this code, in words for the coach.
function imRefused(read, code) {
  try { read(); } catch (e) { eq(e.code, code, String(e.message)); assert(e.user && e.message.length > 20, 'worded for the coach: ' + e.message); return; }
  throw new Error('read a file it should refuse (' + code + ')');
}
// fflate's inflater with what it gives out counted (imOut.n): a bomb must stop long before its end.
const imOut = { n: 0 };
function imCounting(fn) {
  const realF = window.fflate;
  window.fflate = Object.assign({}, realF, { Inflate: function (cb) { const inner = new realF.Inflate((c, f) => { imOut.n += c.length; cb(c, f); }); this.push = (d, f) => inner.push(d, f); } });
  try { fn(); } finally { window.fflate = realF; }
}

test('imports: a file\'s column fingerprint, and the mapping a coach set is used next time (kept by place, never as header text)', () => {

  assert(fp !== IC.fingerprint(['Date', 'Lift', 'Kilos']), 'different columns');

  let a = IC.analyse(imTable(csv));

  // A map kept the older way (by header text) goes; the new one holds a hash and a field per column, no header text.
  const maps = IC.rememberMapping({ 'm1-old': { h: { 'maya chen': 'fullName' }, at: '2026-10-01' } }, a.headers, fields, IM_TODAY);

  eq(a.fields[2], 'weight'); eq(a.fields[4], 'rpe'); eq(a.fromMemory, true); eq(a.unplaced.length, 0);
  // A field that isn't one (a tampered setting) is ignored.

test('imports: a 20,000-row CSV, read and planned in chunks with the same result as one pass', () => {
  const lines = ['Date,Exercise,Weight,Reps,RPE'];
  const lifts = ['Squat', 'Bench Press', 'Deadlift', 'Barbell Row'];
  for (let i = 0; i < 20000; i++) { const d = new Date(Date.UTC(2019, 0, 1) + Math.floor(i / 8) * 86400000).toISOString().slice(0, 10); lines.push([d, lifts[i % 4], 100 + (i % 37), 5, 8].join(',')); }
  const t0 = Date.now();
  const a = IC.analyse(imTable(lines.join('\n')));
  eq(a.layout, 'log'); eq(a.rowsCount, 20000);
  const body = IC.bodyRows(a), map = IC.historyMap(a), opts = { athleteId: 'a1', unit: 'kg', today: IM_TODAY };
  const one = SwitchKit.finishHistoryPlan(SwitchKit.extractHistory(body, map, opts), opts);
  const ms = Date.now() - t0;
  eq(one.logs.length, 20000);

test('imports: a zip is read one way, strictly: entry counts that disagree, ZIP64 and a directory outside the file are refused', () => {
  const log = 'Date,Exercise,Weight,Reps\n2026-01-05,Squat,150,5';
  eq(IC.tablesFromZip(IC.unzip(imZip([{ name: 'log.csv', data: log }]))).tables[0].rows.length, 2);
  eq(IC.tablesFromZip(IC.unzip(imZip([{ name: 'log.csv', data: log, method: 0 }]))).tables[0].rows.length, 2);   // stored too
  // The review's file: the end record says 1 entry in all and 300 on this disk (fflate went by the 300).
  imRefused(() => IC.unzip(imZip([{ name: 'f0.csv', data: log }], { total: 1, more: 299 })), 'bad_zip');
  // ZIP64: the classic end record saturated, the real counts elsewhere.
  imRefused(() => IC.unzip(imZip([{ name: 'a.csv', data: log }], { total: 0xFFFF, onDisk: 0xFFFF })), 'bad_zip');
  imRefused(() => IC.unzip(imZip([{ name: 'a.csv', data: log, size: 0xFFFFFFFF, csize: 0xFFFFFFFF }])), 'bad_zip');
  // A directory past the end of the file; a file that isn't where the directory says.
  imRefused(() => IC.unzip(imZip([{ name: 'a.csv', data: log }], { cdAt: 1 << 20 })), 'bad_zip');
  imRefused(() => IC.unzip(imZip([{ name: 'a.csv', data: log, offset: 3 }])), 'bad_zip');
  imRefused(() => IC.unzip(imZip([{ name: 'a.csv', data: log, method: 0, size: 3 }])), 'bad_zip');   // stored, sizes disagree
  // A UTF-8 name without the UTF-8 flag (what macOS writes) is read, not skipped.
  const z = IC.tablesFromZip(IC.unzip(imZip([{ name: 'José log.csv', data: log }])));
  eq(z.tables.length, 1); eq(z.tables[0].name, 'José log.csv');
  // sniff still tells a workbook by its parts, and a zip it refuses by its extension.
  eq(IC.sniff('x.xlsx', imZip([{ name: 'xl/workbook.xml', data: '<x/>' }])), 'xlsx');
  eq(IC.sniff('x.xlsx', imZip([{ name: 'xl/workbook.xml', data: '<x/>' }], { total: 1, more: 3 })), 'xlsx');
  eq(IC.zipEntries(imZip([{ name: 'a.csv', data: log }], { total: 1, more: 3 })).length, 0);
});
test('imports: a zip bomb stops before it costs anything: a size that lies, a stream past its size, too many files, too much in all', () => {
  const zeros = fflate.deflateSync(new Uint8Array(32 << 20));   // 32 MB of zeros in about 32 KB
  imCounting(() => {
    // Declared as 100 bytes (deflate never writes more than it was given): refused before a byte is inflated.
    imOut.n = 0; imRefused(() => IC.unzip(imZip([{ name: 'a.csv', comp: zeros, size: 100 }])), 'too_big'); eq(imOut.n, 0);
    // Declared as 1 MB, which looks honest: inflating stops within one 16 KB slice, not after all 32 MB.
    imOut.n = 0; imRefused(() => IC.unzip(imZip([{ name: 'a.csv', comp: zeros, size: 1 << 20 }])), 'too_big');
    assert(imOut.n < 20 << 20, 'stopped after ' + imOut.n + ' bytes');
    // 401 files; five declaring 17 MB each (85 MB): refused from the directory, nothing inflated.
    imOut.n = 0; imRefused(() => IC.unzip(imZip(Array.from({ length: 401 }, (x, i) => ({ name: 'f' + i + '.csv', data: 'a,b\n1,2' })))), 'too_big'); eq(imOut.n, 0);
    imOut.n = 0; imRefused(() => IC.unzip(imZip(Array.from({ length: 5 }, (x, i) => ({ name: 'f' + i + '.csv', comp: zeros, size: 17 << 20 })))), 'too_big'); eq(imOut.n, 0);
    // The review's count trick with honest sizes: 300 directory entries of 20 MB each, the end record saying 1.
    imOut.n = 0; imRefused(() => IC.unzip(imZip([{ name: 'f0.csv', comp: fflate.deflateSync(new Uint8Array(20 << 20)), size: 20 << 20 }], { total: 1, more: 299 })), 'bad_zip'); eq(imOut.n, 0);
    // A photo or a file over 20 MB is listed, never inflated.
    imOut.n = 0;
    const big = IC.unzip(imZip([{ name: 'big.csv', comp: zeros, size: 32 << 20 }, { name: 'photo.jpg', data: 'jpg' }, { name: 'log.csv', data: 'Date,Exercise,Weight,Reps\n2026-01-05,Squat,150,5' }]));
    eq(big.map(f => f.bytes ? 1 : 0).join(''), '001'); assert(imOut.n < 1000, 'only the small CSV inflated');
  });
});
test('imports: a file a deflater made bigger than it was (old .NET ones grow data that won\'t compress by a few percent) still opens', () => {
  // One fixed-Huffman block, every byte a literal: bytes 144-255 take 9 bits, so random data comes out about 6% bigger.
  const fixedDeflate = (bytes) => {
    const out = []; let acc = 0, n = 0;
    const bits = (v, len) => { for (let i = 0; i < len; i++) { acc |= ((v >> i) & 1) << n; if (++n === 8) { out.push(acc); acc = 0; n = 0; } } };
    const code = (c, len) => { let r = 0; for (let i = 0; i < len; i++) r |= ((c >> i) & 1) << (len - 1 - i); bits(r, len); };
    bits(1, 1); bits(1, 2);
    for (let i = 0; i < bytes.length; i++) { const b = bytes[i]; if (b < 144) code(0x30 + b, 8); else code(0x190 + b - 144, 9); }
    code(0, 7);
    if (n) out.push(acc);
    return new Uint8Array(out);
  };
  const data = new Uint8Array(64 * 1024); let x = 12345;
  for (let i = 0; i < data.length; i++) { x = (x * 1103515245 + 12345) >>> 0; data[i] = x >>> 24; }
  const comp = fixedDeflate(data);
  assert(comp.length > data.length * 1.04, 'grew ' + comp.length + ' from ' + data.length);
  const got = IC.unzip(imZip([{ name: 'export.csv', comp, size: data.length }]))[0].bytes;
  eq(got.length, data.length); eq(got.every((b, i) => b === data[i]), true);
});

  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Date', 'Exercise', 'Weight', 'Reps'], ['2026-03-02', 'Squat', 180, 5]]), 'Log');

  eq(IC.readWorkbook(book({}))[0].rows.length, 2);                     // the same parts rebuilt here: read as before

  });

  const cell = '<?xml version="1.0"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData><row r="1"><c r="A1" t="inlineStr"><is><t>' + 'a'.repeat(2 << 20) + '</t></is></c></row></sheetData></worksheet>';

  imRefused(() => IC.readWorkbook(imZip(Object.keys(files).map(n => ({ name: n, data: files[n] })), { onDisk: Object.keys(files).length + 1 })), 'bad_zip');
});

test('offline: thirty minutes of marks replay into a server that moved, with no lost marks', () => {

  let srv = {};

  let outbox = {};

  ['L3', 'L1', 'L2'].forEach((id, i) => {
    const r = MP.applyAction(local, { type: i === 2 ? 'no' : 'good', lifterId: id, lift: 'squat', n: 1 }, 100000 + i);

  eq(srv[MP.attemptKey('L3', 'squat', 2)].kg, 107.5, 'the assistant-s declaration is kept: we never touched it');

test('odds fall as the bar rises past the max, and never claim certainty', () => {
  let last = 2;
  for (let pct = 70; pct <= 120; pct += 0.5) {
    const o = MP.attemptOdds(pct * 2, 200);
    assert(o.p <= last, pct + '% of the max: ' + o.p + ' after ' + last);
    assert(o.p >= 0.01 && o.p <= 0.99, 'held to 1%–99% at ' + pct + '%: ' + o.p);
    assert(Math.abs(o.p * 20 - Math.round(o.p * 20)) < 1e-9 || o.p === 0.01 || o.p === 0.99, 'on 0.05 (or a bound): ' + o.p);
    eq(o.pct, Math.round(o.p * 100));
    last = o.p;
  }
  assert(MP.attemptOdds(180, 200).p > MP.attemptOdds(200, 200).p && MP.attemptOdds(200, 200).p > MP.attemptOdds(210, 200).p, 'heavier is less likely');
  eq(MP.ODDS_K, 0.4, 'the documented slope: each 1% past the max cuts the odds by e^0.4');
});

/* ===========================================================
   Aim for a total (meetday.js, 2026-10-28): the chance a set of

group('aim for a total');
const _odd = (w, e) => 1 / (1 + Math.exp(0.4 * (w / e * 100 - 100)));
test('the chance of a total: tiny cases, exactly', () => {
  // An attempt at the max is a coin flip: one lift, one attempt.
  close(MP.totalChance({ squat: [200] }, { squat: 200 }, 200), 0.5, 1e-12);
  close(MP.totalChance({ squat: [200] }, { squat: 200 }, 150), 0.5, 1e-12, 'made or bombed: under the bar is the same as at it');
  // Two lifts, a coin flip each: both for the sum, either for the heavier alone.
  const two = { squat: [200], bench: [100] }, b2 = { squat: 200, bench: 100 };
  close(MP.totalChance(two, b2, 300), 0.25, 1e-12);
  close(MP.totalChance(two, b2, 200), 0.5, 1e-12, '200 needs the squat; the bench alone never gets there');
  close(MP.totalChance(two, b2, 100), 0.75, 1e-12, 'either lift makes 100');
  close(MP.totalChance({ squat: [200], bench: [100], deadlift: [250] }, { squat: 200, bench: 100, deadlift: 250 }, 550), 0.125, 1e-12, 'three thirds at the max: one in eight');
  // Three attempts on one lift: the result is the heaviest made.
  const po = _odd(180, 200), ps = _odd(190, 200), pt = _odd(200, 200);
  const sq = { squat: [180, 190, 200] }, b = { squat: 200 };
  close(MP.totalChance(sq, b, 200), pt, 1e-12, 'only the third makes 200');
  close(MP.totalChance(sq, b, 190), 1 - (1 - ps) * (1 - pt), 1e-12, 'the second or the third makes 190');
  close(MP.totalChance(sq, b, 180), 1 - (1 - po) * (1 - ps) * (1 - pt), 1e-12, 'anything but three misses makes 180');
  close(MP.totalChance(sq, b, 201), 0, 1e-12, 'nothing planned reaches 201');
  // A repeat after a miss: the same bar three times.
  close(MP.totalChance({ squat: [200, 200, 200] }, b, 200), 0.875, 1e-12);
  // Blank attempts are not taken; attempts in any order still count by weight.
  close(MP.totalChance({ squat: [200, null, null] }, b, 200), 0.5, 1e-12);
  close(MP.totalChance({ squat: [200, 180, 190] }, b, 190), 1 - (1 - ps) * (1 - pt), 1e-12);
});

test('aim: the attempts with the best chance of a target, never worse than Safe, Balanced or Bold', () => {
  const cases = [{ e: { squat: 200, bench: 127, deadlift: 240 } }, { e: { squat: 115, bench: 67.5, deadlift: 147.5 } }, { e: { squat: 262.5, bench: 172.5, deadlift: 300 }, ref: { squat: 240 } },
    { e: { squat: 96, bench: 54, deadlift: 125 } }, { e: { squat: 205, bench: 132 } }];
  cases.forEach(c => {
    const plans = MP.attemptPlans(c.e, { refByLift: c.ref || {} });
    const sum = Object.keys(c.e).reduce((a, l) => a + c.e[l], 0);
    for (let t = Math.round(sum * 0.84 / 2.5) * 2.5; t <= sum * 1.03; t += 7.5) {
      const r = MP.planForTotal(t, c.e, { refByLift: c.ref || {} });
      if (r.outOfReach) continue;
      plans.forEach(pl => {
        const kg = {}; Object.keys(pl.lifts).forEach(l => { kg[l] = pl.lifts[l].map(a => a.kg); });
        const pc = MP.totalChance(kg, c.e, t);
        assert(r.p >= pc - 1e-12, pl.key + ' at ' + t + ': ' + pc + ' beats the aim ' + r.p);
      });
      close(MP.totalChance(r.lifts, c.e, t), r.p, 1e-12, 'p is the plan\'s own chance');
      Object.keys(r.lifts).forEach(l => {
        const a = r.lifts[l];
        a.forEach(k => assert(Math.abs(k / 2.5 - Math.round(k / 2.5)) < 1e-9 && k >= 20, l + ' ' + k + ' on 2.5 kg'));
        assert(a[1] - a[0] >= 2.5 - 1e-9 && a[2] - a[1] >= 2.5 - 1e-9, l + ' climbs: ' + a.join());
      });
      eq(r.total, Object.keys(r.lifts).reduce((s, l) => s + r.lifts[l][2], 0), 'the total is the thirds');
    }
  });
});

/* ===========================================================

group('Ask AI: the coach prompt');
(() => {

    'Mateo Fernandez-Garcia', 'Aisha Rahman', 'Lukas Becker', 'Chloe Martin', 'Oskar Lindqvist'];

  // n lifters like the demo's: six weeks of the three lifts, a 4-week block, and a mix of what a
  // roster has: meets with a class, pain, notes and messages waiting, a set over its RPE, PRs.
  function roster(n) {

      checkinQuestions: [{ id: 'q1', coachId: 'c', prompt: 'Anything I should know?', kind: 'text', cadence: 'daily', active: true }], checkinAnswers: [] };
    for (let i = 0; i < n; i++) {

      S.athletes.push({ id, name: NAMES[i % NAMES.length] + (i >= NAMES.length ? ' ' + (i + 1) : ''), coachId: 'c' });
      for (let w = 5; w >= 0; w--) ['squat', 'bench', 'deadlift'].forEach((L, k) => {
        const kg = base[k] + (5 - w) * rise;
        S.workoutLogs.push({ id: id + 'l' + w + k, athleteId: id, lift: L, variant: 'Competition', exerciseName: '', weight: kg, reps: 3, rpe: 8,
          e1rm: calcE1RM(kg, 3, 8), e1rmComp: calcCompE1RM(kg, 3, 8, L, 'Competition'), date: dA(w * 7 + k + (i % 2)), note: SECRET.log });
      });

        weeks: [1, 2, 3, 4].map(wn => ({ id: id + 'w' + wn, number: wn, days: ['squat', 'bench', 'deadlift'].map((L, di) => ({ id: id + 'd' + wn + di, name: L, exercises: [{ id: id + 'e' + wn + di, lift: L, variant: 'Competition', exerciseName: '', note: 'Brace hard.',
          sets: [{ id: id + 's' + wn + di, weight: base[di], reps: 3, rpe: 8, completed: wn === 1, actualRpe: wn === 1 ? (i % 5 === 0 && di === 1 ? 9.5 : 8) : null, completedAt: wn === 1 ? dA(8 - di) : null, note: SECRET.log }] }] })) })) });
      if (i % 3 === 0) {
        S.meets.push({ id: id + 'm', athleteId: id, name: 'State Open', date: dA(-(12 + i)), weightClass: '93 kg', status: 'planned' });
        S.bodyweight.push({ id: id + 'bw', athleteId: id, date: dA(2), weight: 92.4 });                 // typed: under the class
        S.bodyweight.push({ id: healthBwUid(), athleteId: id, date: dA(0), weight: 95.8 });              // from Apple Health: over it, never read
      }
      if (i % 4 === 1) S.sessionNotes.push({ id: id + 'n', athleteId: id, date: dA(1), note: SECRET.note, coachComment: null });
      if (i % 4 === 2) S.messages.push({ id: id + 'g', coachId: 'c', athleteId: id, senderId: id, body: SECRET.msg, createdAt: new Date(Date.now() - 30 * 3600000).toISOString(), readAt: null });
      if (i % 6 === 3) S.painReports.push({ id: id + 'x', athleteId: id, coachId: 'c', day: dA(1), bodyPart: 'knee', side: 'left', severity: 5, phase: 'top', lift: 'squat', note: SECRET.pain, createdAt: dA(1) + 'T18:00:00Z', resolvedAt: null });
      S.checkins.push({ id: id + 'c', athleteId: id, weekStart: _monISO(dA(9)), sleep: 7, soreness: 6, stress: 7, feel: 8, note: SECRET.ci, createdAt: dA(9) + 'T08:00:00Z' });
      S.checkinAnswers.push({ id: id + 'a', questionId: 'q1', athleteId: id, coachId: 'c', period: dA(0), num: null, text: SECRET.ans });

    }
    return Object.assign(defaultStore(), S);

      const firstLifter = Math.min.apply(null, NAMES.map(nm => p25.indexOf(nm + ':')).filter(i => i >= 0));
      ['Never invent numbers', 'training data only', 'Weights below are kg', 'Under ~120 words'].forEach(rule => {
        const at = p25.indexOf(rule);
        assert(at >= 0 && at < firstLifter, '"' + rule + '" before the roster');
      });
    });
    test('25 demo-like lifters fit under 5,500 characters, one line each', () => {
      assert(p25.length < 5500, 'length ' + p25.length);
      NAMES.forEach(nm => assert(p25.indexOf('\n- ' + nm + ':') >= 0, nm + ' is in'));
      eq(lines(p25), 25, 'a line per lifter');
      assert(p25.indexOf('more lifters not shown') < 0, 'nobody left out');
      assert(/Arjun Mehta: e1RM \d+ \(S\d+\/B\d+\/D\d+\)/.test(p25), 'the total and the three lifts');
      assert(/; \d\/\d sessions; /.test(p25), 'sessions done of planned');
      assert(/Strength Block wk \d\/4/.test(p25), 'the program and its week');
      assert(/meet in \d+d \(93 kg class\)/.test(p25), 'a meet coming up');
      assert(/pain left knee 5\/10/.test(p25), 'pain, the part and how bad');
    });

      Object.keys(SECRET).forEach(k => assert(p25.indexOf(SECRET[k]) < 0, 'their ' + k + ' text leaked'));

      assert(/Answer in lb/.test(p60), 'the coach’s unit');
    });
  } finally { Store.set(saved); }
})();

/* ===========================================================
   Block DNA + block review (block-dna.js): a block's fingerprint week by week (main-lift sets written and
   done, sessions done against the ones that came round, top-set RPE written against felt, % of the starting
   e1RM), its e1RM from the 8 weeks before it to its best in it, the pain reports inside it, the running
   block's partial week, the log-only fallback, the default pair, and the compare sentences (what changed,
   never why). All dates fixed.

group('block DNA (block-dna.js)');

// deadlift); week 2's squat day lifted (a back-off skipped, a set added), bench day skipped, deadlift day never reached.

  { number: 1, days: [

    { name: 'Bench Day', exercises: [bdEx('bench', [bdDone(100, 5, 7, 8, '2026-09-09', { rpeHi: 8 }), bdDone(90, 5, 7, 7, '2026-09-09'), bdDone(90, 5, 7, 7, '2026-09-09')]), bdEx('pull', [bdDone(60, 10, 8, 8, '2026-09-09')])] },

    { name: 'Rest', exercises: [] }] },

/* ===========================================================
   Progression rules (app.js): the coach's own rules for next week ("add 2.5 kg when the top set is
   RPE 8 or less"). The base is last week's top set as lifted; first match wins; main lifts only; a
   %-written, a logged, a deload or a rep-change block keeps what's written. And next week's
   suggestions never compound: a week the coach already set from this evidence holds.
   =========================================================== */
group('progression rules');
const PGR = (lift, when, wv, then, tv, id) => ({ id: id || (lift + when + then), lift, when: { kind: when, value: wv }, then: { kind: then, value: tv } });
test('a rule reads as one plain sentence, in the coach\'s unit', () => {
  eq(progressionRuleText(PGR('squat', 'rpeAtOrUnder', 8, 'addLoad', 2.5), 'kg'), 'When the top set feels RPE 8 or easier on squat, add 2.5 kg');
  eq(progressionRuleText(PGR('all', 'rpeAtOrOver', 9.5, 'cutPct', 5), 'kg'), 'When the top set feels RPE 9.5 or harder, take 5% off');
  eq(progressionRuleText(PGR('all', 'rpeAtOrUnder', 7.5, 'addLoad', 5 * KG_PER_LB), 'lbs'), 'When the top set feels RPE 7.5 or easier, add 5 lbs');
  eq(progressionRuleText(PGR('bench', 'easier', 1, 'addSet', null), 'kg'), 'When the top set feels at least 1 RPE easier than written on bench, add a set');
  eq(progressionRuleText(PGR('all', 'harder', 0.5, 'dropSet', null), 'kg'), 'When the top set feels at least half an RPE harder than written, drop a set');
  eq(progressionRuleText(PGR('deadlift', 'missedReps', 1, 'hold', null), 'kg'), 'When they miss a rep on deadlift, keep the load');
  eq(progressionRuleText(PGR('all', 'missedReps', 2, 'cutPct', 10), 'kg'), 'When they miss 2 reps or more, take 10% off');
  eq(progressionRuleText(null, 'kg'), '');
});
test('clean: a saved rule set is checked before anything reads it', () => {
  const c = progressionClean({ v: 1, fallback: 'nonsense', rules: [

  const lifters = [{ id: 'a', hasProgram: true }, { id: 'b', hasProgram: true }, { id: 'c', hasProgram: true }, { id: 'd', hasProgram: false }];
  const tally = { weeks: 4, messages: 48, notes: 12, formChecks: 8, checkins: 14 };
  const logs = [];
  ['a', 'b', 'c', 'd'].forEach(id => ['2026-10-06', '2026-10-13', '2026-10-20', '2026-10-27'].forEach(date => logs.push({ athleteId: id, date })));
  const sig = capacitySignals({ today: T0, lifters, tally, trained: true, logs });
  // reviewed 1 × 10 + written 0.75 × 15 + messages 3 × 2 + form checks 0.5 × 6 + check-ins 0.875 × 3 + notes 0.75 × 3 = 35.125
  eq(Capacity.measuredMinutes({ lifters: 4, trained: true, tally, signals: sig }), 35);
  eq(Capacity.measuredMinutes({ lifters: 4, trained: true, tally, signals: sig, minutes: { review: 0, program: 0 } }), 14, 'at the coach\'s own minutes');
  eq(Capacity.measuredMinutes({ demo: true, lifters: 4, trained: true, tally, signals: sig }), null, 'never the demo');
  eq(Capacity.measuredMinutes({ lifters: 4, trained: false, tally, signals: sig }), null, 'nobody trained here: no history');
  eq(Capacity.measuredMinutes({ lifters: 4, trained: true, tally: null, signals: sig }), null, 'messages not counted yet');
  const part = capacitySignals({ today: T0, lifters, trained: true, logs });   // no tally: messages and notes stand in
  eq(Capacity.measuredMinutes({ lifters: 4, trained: true, tally: {}, signals: part }), null, 'a part standing in: no line');
  eq(Capacity.measuredMinutes({ lifters: 0, trained: true, tally, signals: sig }), null, 'nobody yet');
  const idle = capacitySignals({ today: T0, lifters: [{ id: 'a', hasProgram: false }], tally: { weeks: 4, messages: 0, notes: 0, formChecks: 0, checkins: 0 }, trained: true, logs: [] });
  eq(Capacity.measuredMinutes({ lifters: 1, trained: true, tally: { weeks: 4 }, signals: idle }), null, 'under a minute says nothing');
});

const bwProg = () => {
  const set = (o) => Object.assign({ id: uid('set'), weight: 100, reps: 5, rpe: 8, completed: false, actualRpe: null, completedAt: null }, o || {});
  const ex = (lift, variant, name, sets, o) => Object.assign({ id: uid('ex'), lift, variant, exerciseName: name || '', note: '', sets }, o || {});
  const wk = (n, done) => ({ id: 'w' + n, number: n, days: [
    { id: 'w' + n + 'd0', name: 'Squat Day', exercises: [ex('squat', 'Competition', '', [set({ completed: done, completedAt: done ? '2026-10-20' : null }), set({ completed: done })]), ex('legs', '', 'Leg Press', [set()])] },
    { id: 'w' + n + 'd1', name: 'Bench Day', exercises: [ex('bench', 'Competition', '', [set({ completed: done }), set({ tempo: '3-1-0', pause: 1, pauseAt: 'chest', rpeHi: 8.5 })], { srcId: 'tm-b' }), ex('push', '', 'DB Press', [set()])] },
    { id: 'w' + n + 'd2', name: 'Deadlift Day', exercises: [ex('deadlift', 'Competition', '', [set({ completed: done })], { srcId: 'tm-d', ovr: true }), ex('deadlift', 'RDL', '', [set({ weight: 140, cx: { Belt: 'off' } })]), ex('pull', '', 'Row', [set()])] },
    { id: 'w' + n + 'd3', name: 'Rest', exercises: [] }
  ] });
  const P = { id: 'bwp', athleteId: 'bw-a', weeks: [wk(1, true), wk(2, false), wk(3, false)] };
  P.weeks[0].days.forEach(d => d.exercises.forEach(e => e.sets.forEach(s => { s.completed = true; s.completedAt = '2026-10-20'; })));   // last week: all done
  return P;
};

test('applying a plan: pins the dates, copies the main lifts into the host with their set fields, the merged-away day skipped as a busy week', () => {
  const P = bwProg();
  P.weeks[2].days[1].scheduledDate = '2026-10-31';   // next week's day pinned to Saturday: one day per date, as Train's pin keeps it
  P.weeks[2].days[0].scheduledDate = '2026-11-02';   // a pin on another date stays
  P.weeks[1].days[3].scheduledDate = '2026-10-29';   // this week's rest day pinned to Thu: cleared, Thu is Squat Day's now
  const S = BusyWeek.sessionsLeft(P).sessions;
  const plan = busyWeekPlan({ sessionsLeft: S, dates: ['2026-10-29', '2026-10-31'], today: BWT });
  const out = busyWeekApply(P, Object.assign({ weekIdx: 1 }, plan));
  const w = out.weeks[1];
  eq(w.days[0].scheduledDate, '2026-10-29'); eq(w.days[1].scheduledDate, '2026-10-31'); eq(w.days[3].scheduledDate || null, null);
  eq(out.weeks[2].days[1].scheduledDate, null, 'Saturday is this week\'s Bench Day now'); eq(out.weeks[2].days[0].scheduledDate, '2026-11-02', 'other dates untouched');
  eq(out.weeks[2].days[1].exercises.length, 2, 'only this week\'s days change');
  const host = w.days[1].exercises;
  eq(host.map(e => e.lift + ':' + (e.variant || e.exerciseName)).join(), 'bench:Competition,push:DB Press,deadlift:Competition,deadlift:RDL', 'the deadlifts join, the row stays behind');
  const moved = host[2];
  assert(moved.id !== P.weeks[1].days[2].exercises[0].id, 'a fresh exercise id'); eq(moved.srcId, undefined, 'no team link: the coach added it for them'); eq(moved.ovr, undefined);
  assert(moved.sets.every(s => !s.completed && !s.skipped && s.id), 'fresh sets to do');
  eq(host[3].sets[0].cx.Belt, 'off', 'the coach\'s columns ride along'); eq(host[3].sets[0].weight, 140);
  const away = w.days[2];
  assert(away.exercises.every(e => e.sets.every(s => s.skipped && s.note === 'Busy week' && !s.completed)), 'every set of the merged day skipped, "Busy week"');
  eq(away.scheduledDate || null, null);
  eq(P.weeks[1].days[1].exercises.length, 2, 'the program passed in is not changed');
});

      if (hadBefore && isPRForLog(l.athleteId, l)) app.add(l.athleteId + ':' + l.lift);
    });
    eq([...mine].sort().join(), [...app].sort().join());
  } finally { Store.set(saved); }
});

  eq('weight' in CPg.cpModePatch(Object.assign({}, inPct, { pctHi: 80, weightHi: pctLoadKg(80, 210) }), 'pct', false, 210), false, 'so does a range they added');
  eq(CPg.cpModePatch({ weight: 160, pctFeel: 75 }, 'pct', true, 200).pctFeel, null, 'a block with a load has no mark (a stale one goes)');

  const noMax = put({ weight: 0, reps: 5 }, CPg.cpModePatch({ weight: 0, reps: 5 }, 'pct', true, 0));
  eq(noMax.pct + ' ' + noMax.weight, '75 0', 'no max yet: 75% and still no load');

  // ⋯ Every block in kg / in % of max: block by block, the way each block's own switch does it

  const real = { persist: persistProgram, demo: window._demoMode, g: keys.map((k) => [k, k in window, window[k]]) };
  const saves = [], told = [], undo = [], sent = [];
  const P = () => Store.get().programs[0];
  try {
    resetState();
    seed({ athletes: [{ id: 'PWA', name: 'Arjun Mehta', coachId: 'C' }], programs: [{ id: 'PW', athleteId: 'PWA', coachId: 'C', name: 'Strength', weeks: [w(1), w(2), w(3, { draft: true }), w(4, { draft: true })] }] });
    persistProgram = (id) => { saves.push(id); };
    window._demoMode = false;
    window.notifyAthleteAssigned = (aid, o) => { told.push([aid, o]); };
    // The phone (no desk): saved, the heads-up straight from the app; no desk undo.
    eq(DPg.publishWeek('PWA', 2), 1);
    assert(P().weeks[2].draft !== true && P().weeks[3].draft === true, 'week 3 is out, week 4 still a draft');
    eq(saves.join(), 'PW', 'saved once'); eq(JSON.stringify(told), JSON.stringify([['PWA', { week: 3 }]]), 'the heads-up names week 3');
    eq(DPg.publishWeek('PWA', 2), 0, 'already published: nothing to do'); eq(saves.length, 1); eq(told.length, 1);
    // The desk: the undo step first (the drafts as they were), then dkPublish with the week.
    window.isDesk = () => true;
    window._dk = { pbUndo: [] };
    window.dkPbRemember = (p, label) => { undo.push({ label, weeks: JSON.parse(JSON.stringify(p.weeks)) }); window._dk.pbUndo.push({ id: p.id, label }); };
    window.dkPublish = (aid, o) => { sent.push([aid, o]); };

    eq(undo.length, 1); eq(undo[0].label, 'Publish week 5'); assert(undo[0].weeks[3].draft === true && undo[0].weeks[4].draft === true, 'the undo step holds the drafts as they were');
    eq(JSON.stringify(sent), JSON.stringify([['PWA', { quietDemo: true, week: 4 }]]), 'the heads-up names the first week they can now see');
    eq(told.length, 1, 'on the desk the heads-up goes through dkPublish'); eq(saves.length, 2);
    // Undo (desk.js dkPbUndo puts the remembered weeks back): the drafts are drafts again.
    Store.update((s) => { s.programs[0].weeks = JSON.parse(JSON.stringify(undo[0].weeks)); });
    assert(P().weeks[3].draft === true && P().weeks[4].draft === true, 'undone: weeks 4 and 5 are drafts again');

  } finally {
    persistProgram = real.persist; window._demoMode = real.demo;
    real.g.forEach(([k, had, v]) => { if (had) window[k] = v; else delete window[k]; });
    resetState();
  }
});

/* ===========================================================
   The coach's inbox on the phone (coach.html renderMessages): threads waiting on the coach (the lifter wrote
   last) first, then the rest, then everyone with no thread; its one answer counts the waiting threads and
   names who has waited longest. Pure (app.js msgInboxOrder / msgInboxHead / msgAgoWords).
   =========================================================== */
group('messages: the coach inbox (waiting on you)');
(() => {
  const NOW = Date.parse('2026-10-29T12:00:00Z');
  const at = (h) => new Date(NOW - h * 3600e3).toISOString();
  const roster = [{ id: 'a1', name: 'Arjun Mehta' }, { id: 'a2', name: 'Sarah Kim' }, { id: 'a3', name: 'Tom Boyle' }, { id: 'a4', name: 'Nina Petrova' }, { id: 'a5', name: 'Ben Ode' }];
  const digest = {
    a1: { lastAt: at(21), lastSenderId: 'a1', unread: 2 },
    a2: { lastAt: at(30), lastSenderId: 'c1', unread: 0 },
    a3: { lastAt: at(6), lastSenderId: 'a3', unread: 1 },
    a5: { lastAt: at(2), lastSenderId: 'c1', unread: 0 }
  };
  test('waiting first (the lifter wrote last), newest first; then the rest, newest first; then no thread, A to Z', () => {
    const o = msgInboxOrder(roster, digest, 'c1');
    eq(o.list.map(a => a.id).join(), 'a3,a1,a5,a2,a4');
    eq(o.waiting.join(), 'a3,a1');
  });
  test('read but not answered still waits; a set they sent waits too (it came to be answered)', () => {
    const o = msgInboxOrder(roster.slice(0, 2), { a1: { lastAt: at(3), lastSenderId: 'a1', unread: 0 }, a2: { lastAt: at(1), lastSenderId: 'a2', unread: 0 } }, 'c1');
    eq(o.waiting.join(), 'a2,a1');
  });
  test('the answer: how many wait, and who has waited longest (12 hours and up), or who wrote last', () => {
    const o = msgInboxOrder(roster, digest, 'c1');
    const h = msgInboxHead(o, digest, NOW);
    eq(h.n, 2); eq(h.title, 'waiting on you'); eq(h.sub, 'Arjun has waited 21 hours');
    const one = msgInboxOrder([roster[2]], digest, 'c1');
    eq(msgInboxHead(one, digest, NOW).sub, 'Tom wrote 6 hours ago', 'under 12 hours: when they wrote');
    eq(msgInboxHead(msgInboxOrder([roster[2]], { a3: { lastAt: new Date(NOW - 20e3).toISOString(), lastSenderId: 'a3' } }, 'c1'), { a3: { lastAt: new Date(NOW - 20e3).toISOString(), lastSenderId: 'a3' } }, NOW).sub, 'Tom wrote just now');
  });
  test('nothing waiting: all answered; no thread at all: says where messages will land', () => {
    const d2 = { a2: digest.a2, a5: digest.a5 };
    const h = msgInboxHead(msgInboxOrder(roster, d2, 'c1'), d2, NOW);
    eq(h.n, 0); eq(h.title, 'All answered'); eq(h.sub, '');
    const h0 = msgInboxHead(msgInboxOrder(roster, {}, 'c1'), {}, NOW);
    eq(h0.title, 'No messages yet'); eq(/land here/.test(h0.sub), true);
  });
  test('ages in a coach\'s words', () => {
    eq(msgAgoWords(new Date(NOW - 30e3).toISOString(), NOW), '');
    eq(msgAgoWords(new Date(NOW - 60e3).toISOString(), NOW), '1 minute');
    eq(msgAgoWords(at(1), NOW), '1 hour');
    eq(msgAgoWords(at(47), NOW), '47 hours');
    eq(msgAgoWords(at(72), NOW), '3 days');
    eq(msgAgoWords('not a date', NOW), '');
  });
})();

/* ===========================================================
   The merge review's two-factor follow-ups (29 Oct). "Sign out" on the code prompt takes the stored session even
   when the sign-out call fails offline (_dropStoredSession). Two-factor turned on from another device: Auth's own
   answer (GET /user) says the code is owed when this session's stored copy of the user can't (mfaCodeOwed); a
   write refused by the database's rules (writeRefusedByPolicy) then asks for it in place instead of counting
   tries. The prompt and the queues themselves are async: browser flows drive them. Every powa-* and sb-* key is
   put back as it was.
   =========================================================== */
group('the merge review\'s two-factor follow-ups (29 Oct)');
(() => {
  const lsKeys = () => { const a = []; for (let i = 0; i < localStorage.length; i++) a.push(localStorage.key(i)); return a; };
  const keep = {};
  lsKeys().forEach(k => { if (/^(powa-|sb-)/.test(k)) keep[k] = localStorage.getItem(k); });
  try {
    test('"Sign out" on the code prompt: the stored session goes even when the sign-out call can\'t (offline)', () => {
      localStorage.setItem('sb-fu-test-auth-token', '{"access_token":"x.y.z"}');
      localStorage.setItem('sb-fu-test-auth-token-code-verifier', 'v');
      localStorage.setItem('powa-fu-test-keep', '1');
      _dropStoredSession();
      eq(localStorage.getItem('sb-fu-test-auth-token'), null, 'the half-finished sign-in stays, and the prompt comes back next load');
      eq(localStorage.getItem('sb-fu-test-auth-token-code-verifier'), 'v', 'only the session itself');
      eq(localStorage.getItem('powa-fu-test-keep'), '1', 'nothing else on the device');
      localStorage.removeItem('sb-fu-test-auth-token-code-verifier'); localStorage.removeItem('powa-fu-test-keep');
    });
    test('the code is owed by Auth\'s own answer: a verified factor and a token still at aal1', () => {
      const user = { id: 'u1', factors: [{ id: 'f1', factor_type: 'totp', status: 'verified' }] };
      eq(mfaCodeOwed(user, 'aal1'), true);
      eq(mfaCodeOwed(user, 'aal2'), false, 'the code is in');
      eq(mfaCodeOwed(user, null), false, 'a token with no level: no prompt on a guess');
      eq(mfaCodeOwed({ factors: [{ id: 'f2', status: 'unverified' }] }, 'aal1'), false, 'an abandoned enroll protects nothing');
      eq(mfaCodeOwed({ factors: [] }, 'aal1'), false);
      eq(mfaCodeOwed({ id: 'u2' }, 'aal1'), false, 'no factors at all (the stored copy from before two-factor looks like this)');
      eq(mfaCodeOwed(null, 'aal1'), false, 'Auth gave no user');
    });
    test('a write the database refused by its rules, not a network failure, a duplicate or an expired token', () => {
      eq(writeRefusedByPolicy({ code: '42501', message: 'new row violates row-level security policy for table "workout_logs"' }), true, 'row 60 at aal1');
      eq(writeRefusedByPolicy({ message: 'new row violates row-level security policy for table "bodyweight"' }), true, 'no code');
      eq(writeRefusedByPolicy({ status: 403, message: 'Forbidden' }), true);
      eq(writeRefusedByPolicy({ status: '403', message: 'new row violates row-level security policy' }), true, 'a status as text (Storage)');
      eq(writeRefusedByPolicy({ code: '42501', message: 'permission denied for table workout_logs' }), true);
      eq(writeRefusedByPolicy(new TypeError('Failed to fetch')), false, 'offline');
      eq(writeRefusedByPolicy({ code: '23505', message: 'duplicate key value violates unique constraint "workout_logs_pkey"' }), false, 'a duplicate (it landed before)');
      eq(writeRefusedByPolicy({ code: 'PGRST301', message: 'JWT expired' }), false, 'an expired token (supabase-js refreshes it)');
      eq(writeRefusedByPolicy({ code: '23503', message: 'insert or update on table "workout_logs" violates foreign key constraint' }), false, 'a bad row');
      eq(writeRefusedByPolicy(null), false);
    });
  } finally {
    lsKeys().filter(k => /^(powa-|sb-)/.test(k) && !(k in keep)).forEach(k => localStorage.removeItem(k));
    Object.keys(keep).forEach(k => localStorage.setItem(k, keep[k]));
  }
})();

group('the lost set, Esc on the code prompt, an offline Log out (night C)');
test('a set queued while the queue was being sent stays queued (it used to be written over)', () => {
  const A = { id: 'a' }, B = { id: 'b' }, C = { id: 'c' };
  eq(pendingAfterFlush([A], [], [A, B]).map(l => l.id).join(), 'b', 'A landed, B came in meanwhile');
  eq(pendingAfterFlush([A, B], [B], [A, B, C]).map(l => l.id).join(), 'b,c', 'the leftover first, then the newcomer');
  eq(pendingAfterFlush([A], [A], [A]).map(l => l.id).join(), 'a', 'a failed send keeps its set');
});
test('a set that left the queue during the send stays gone (deleted, or a log-out dropped every queue)', () => {
  const A = { id: 'a' }, B = { id: 'b' };
  eq(pendingAfterFlush([A, B], [A, B], [B]).map(l => l.id).join(), 'b', 'A deleted while it was on its way');
  eq(pendingAfterFlush([A], [A], []).length, 0, 'every queue dropped: nothing comes back');
  eq(pendingAfterFlush(null, null, null).length, 0, 'nothing at all');
});
test('the other changes: kept when queued meanwhile, the newest edit of a row wins, a dropped queue stays dropped', () => {
  const e = (key, ts) => ({ key, ts, kind: 'bw', payload: {} });
  const old = e('bw:1', 1), newer = e('bw:1', 5), other = e('bw:2', 6);
  eq(outboxAfterFlush([old], [], [old, other]).map(x => x.key + '@' + x.ts).join(), 'bw:2@6', 'sent, and another row came in');
  eq(outboxAfterFlush([old], [old], [newer]).map(x => x.key + '@' + x.ts).join(), 'bw:1@5', 'failed, but a newer edit of the row replaced it');
  eq(outboxAfterFlush([old], [old], [old]).map(x => x.key + '@' + x.ts).join(), 'bw:1@1', 'failed and still the row\'s edit: kept');
  eq(outboxAfterFlush([old], [old], []).length, 0, 'a log-out dropped the queue: it stays dropped');
});

  test('a name can\'t add a line of its own; commas and semicolons are escaped; a location only when known', () => {

    const raw = r.text.split('\r\n');

  // Night C review m2, m3: a grouped meet gave everyone the first lifter's weigh-in, and its id was its name and date.

/* ===========================================================
   Stronger than X% (night C, 30 Oct): app.js oplKey / oplValues / oplRank / strongerThan / strongerLine over a small
   made-up table (the shipped opl-percentiles.json is checked by a browser flow and the build script).
   =========================================================== */
group('stronger than X% (OpenPowerlifting percentiles)');
(() => {
  // A group whose 1st..99th percentiles run 100.0, 101.0 … 198.0 kg: 200 half-kg units, then +2 each step.
  const steps = [200].concat(Array.from({ length: 98 }, () => 2));
  const T = { since: '2021-01-01', data: '2026-10-24', b: {
    'M|raw|83': { n: 48088, t: steps, s: steps, b: steps, d: steps },
    'F|eq|84+': { n: 2227, t: steps, s: steps, b: steps, d: steps },
    'M|raw|59': { n: 99, t: steps, s: steps, b: steps, d: steps } } };
  test('the key: sex, raw or equipped, the IPF class as the app names it', () => {
    eq(oplKey('male', 'raw', '83 kg'), 'M|raw|83'); eq(oplKey('female', 'equipped', '84 kg+'), 'F|eq|84+');
    eq(oplKey('male', 'raw', '120 kg+'), 'M|raw|120+'); eq(oplKey('male', 'raw', null), null); eq(oplKey('male', 'raw', 'heavy'), null);
    eq(oplClassValid('83 kg', 'male'), true); eq(oplClassValid('83 kg', 'female'), false, 'a cut\'s 83 is no class for a woman');
    eq(oplClassValid('84 kg+', 'female'), true); eq(oplClassValid('105 kg+', 'male'), false); eq(oplClassValid(null, 'male'), false);
  });
  test('the steps decode to the 99 percentile values in kg; a broken list is no list', () => {
    const v = oplValues(steps);
    eq(v.length, 99); eq(v[0], 100); eq(v[49], 149); eq(v[98], 198);
    eq(oplValues([1, 2, 3]), null); eq(oplValues(steps.slice(0, 98).concat([-1])), null); eq(oplValues(null), null);
  });
  test('the rank: the share of the group a weight beats, rounded down, 0 under the 1st, 99 past the 99th', () => {
    const v = oplValues(steps);
    eq(oplRank(v, 149), 50, 'the 50th percentile value'); eq(oplRank(v, 149.9), 50, 'never rounded up');
    eq(oplRank(v, 170.5), 71); eq(oplRank(v, 99.5), 0); eq(oplRank(v, 100), 1); eq(oplRank(v, 250), 99);
    eq(oplRank(v, 0), null); eq(oplRank(null, 150), null);
    const flat = oplValues([200].concat(Array.from({ length: 98 }, (_, i) => (i >= 39 && i < 45 ? 0 : 2))));   // a run of equal values (p40..p46)
    eq(oplRank(flat, flat[40]), 40, 'on a run of equal values: only the ones below it count');
  });
  test('stronger than: the group, the count, the total and each lift; nothing for an unknown or small group', () => {
    const r = strongerThan(T, { sex: 'male', equip: 'raw', cls: '83 kg', kg: { total: 170.5, squat: 149, bench: 99, deadlift: 0 } });
    eq(r.key, 'M|raw|83'); eq(r.group, 'raw men'); eq(r.n, 48088); eq(r.since, '2021');
    eq(r.lifts.total.pct, 71); eq(r.lifts.squat.pct, 50); eq(r.lifts.bench.pct, 0, 'under the 1st: kept as 0'); eq(r.lifts.deadlift, undefined, 'no number, no line');
    eq(strongerLine(r), 'e1RM total: stronger than 71% of 83 kg raw men', 'nothing lifted: the e1RM total, named as one');
    eq(strongerLine(r, 'squat'), 'e1RM: stronger than 50% of 83 kg raw men');
    eq(strongerLine(r, 'bench'), null, 'never "stronger than 0%"');
    eq(strongerThan(T, { sex: 'female', equip: 'equipped', cls: '84 kg+', kg: { total: 300 } }).group, 'equipped women');
    eq(strongerThan(T, { sex: 'male', equip: 'raw', cls: '59 kg', kg: { total: 150 } }), null, 'a group under 100 lifters says nothing');
    eq(strongerThan(T, { sex: 'male', equip: 'raw', cls: '93 kg', kg: { total: 150 } }), null, 'a group the file doesn\'t have');
    eq(strongerThan(null, { sex: 'male', equip: 'raw', cls: '83 kg', kg: { total: 150 } }), null, 'no file, no number');
    eq(strongerThan(T, { sex: 'male', equip: 'raw', cls: '83 kg', kg: {} }), null, 'nothing logged');
  });
  // Night C review M8: a training estimate ranked above a real meet total that ranks lower flattered the lifter.
  test('what was lifted comes first: a meet total (or the best singles) is the headline, the e1RM total its own line', () => {
    const o = { sex: 'male', equip: 'raw', cls: '83 kg', kg: { total: 190, squat: 160, bench: 120, deadlift: 175 },
      lifted: { total: 160.5, squat: 149, bench: 101, deadlift: 160 }, liftedKind: 'meet', liftedMeet: 'Spring Classic' };
    const r = strongerThan(T, o);
    eq(r.lifts.total.pct, 91, 'the e1RM total still ranked'); eq(r.lifted.total.pct, 61, 'and the meet total');
    eq(r.liftedKind, 'meet'); eq(r.liftedMeet, 'Spring Classic');
    eq(JSON.stringify(strongerHeadline(r)), JSON.stringify({ kind: 'meet', kg: 160.5, pct: 61, meet: 'Spring Classic' }), 'the meet total leads');
    eq(strongerLine(r), 'Meet total: stronger than 61% of 83 kg raw men');
    eq(strongerLine(r, 'squat'), 'Best single: stronger than 50% of 83 kg raw men', 'a lift: its best single');
    const sg = strongerThan(T, Object.assign({}, o, { liftedKind: 'singles', liftedMeet: '' }));
    eq(strongerHeadline(sg).kind, 'singles'); eq(strongerLine(sg), 'Best singles: stronger than 61% of 83 kg raw men');
    eq(sg.liftedMeet, '', 'no meet name for singles');
  });
  test('two singles of three: no lifted total, so the e1RM total leads, and each lift says what it ranks', () => {
    const r = strongerThan(T, { sex: 'male', equip: 'raw', cls: '83 kg', kg: { total: 190, squat: 160, bench: 120, deadlift: 175 }, lifted: { squat: 149, bench: 101 }, liftedKind: null });
    eq(strongerHeadline(r).kind, 'e1rm'); eq(r.liftedKind, null);
    eq(strongerLine(r), 'e1RM total: stronger than 91% of 83 kg raw men');
    eq(strongerLine(r, 'squat'), 'Best single: stronger than 50% of 83 kg raw men');
    eq(strongerLine(r, 'deadlift'), 'e1RM: stronger than 76% of 83 kg raw men', 'no single: its e1RM, said so');
  });
  test('a meet total under the 1st percentile says nothing (the e1RM total never stands in for it)', () => {
    const r = strongerThan(T, { sex: 'male', equip: 'raw', cls: '83 kg', kg: { total: 190 }, lifted: { total: 90 }, liftedKind: 'meet', liftedMeet: 'First Meet' });
    eq(strongerHeadline(r).pct, 0); eq(strongerLine(r), null);
    eq(strongerHeadline(null), null); eq(strongerLine(null), null);
  });
  test('only lifted numbers still rank (no e1RMs)', () => {
    const r = strongerThan(T, { sex: 'female', equip: 'equipped', cls: '84 kg+', kg: {}, lifted: { total: 170.5 }, liftedKind: 'singles' });
    eq(JSON.stringify(strongerHeadline(r)), JSON.stringify({ kind: 'singles', kg: 170.5, pct: 71, meet: '' }));
  });
})();

    eq(JSON.stringify(PF.checkBody('  Line one\r\nLine two\u0007  ')), JSON.stringify({ ok: true, body: 'Line one\nLine two' }));
    eq(PF.checkBody('').why, 'empty'); eq(PF.checkBody(' \n\t ').why, 'empty'); eq(PF.checkBody(null).why, 'empty');
    eq(PF.checkBody('x'.repeat(4000)).ok, true); eq(PF.checkBody('x'.repeat(4001)).why, 'long');
    eq(PF.checkBody('💪'.repeat(4000)).ok, true, '4,000 characters, counted as Postgres counts them (not UTF-16 units)');
    eq(PF.checkBody('ok \ud83d then 💪').body, 'ok  then 💪', 'a lone half of an emoji is dropped (Postgres refuses it)');
  });
  test('details are cut by character, never through an emoji', () => {
    const c = PF.buildContext(Object.assign({}, ENV, { screen: 'S' + '😀'.repeat(100), ua: 'a' + '😀'.repeat(400), errors: [{ kind: 'error', msg: '😀'.repeat(250), ts: '2026-11-03T10:42:00.000Z' }] }));
    const lone = /\p{Cs}/u;
    assert(![c.screen, c.ua, c.errors[0].msg].some(v => lone.test(v)), 'no half emoji');
    eq(Array.from(c.screen).length, 80); eq(Array.from(c.ua).length, 300); eq(Array.from(c.errors[0].msg).length, 200);
    eq(PF.scrub('a\ud800b'), 'a b', 'a lone half in a message becomes a space');
  });
  test('"See what\'s sent" lines read the details back in words', () => {
    const L = PF.contextLines(PF.buildContext(ENV));
    eq(L.map(l => l[0]).join(','), 'Screen,Page,App,Device,Screen size,Theme,Recent errors');
    eq(L[2][1], 'iPhone app bundle 1a2b3c4 · 2026-11-03'); eq(L[4][1], '393×852 @3x, phone layout'); eq(L[6][1], 'TypeError: x is undefined');
    eq(PF.contextLines(PF.buildContext(Object.assign({}, ENV, { errors: [] })))[6][1], 'None');
    eq(PF.contextLines({})[0].join(': '), 'App: Web');
  });
  test('the one-line description names everything that goes', () => {
    ['screen', 'app version', 'web or iPhone app', 'device', 'screen size', 'theme', 'error messages', 'Never your training data'].forEach(w => assert(PF.INCLUDES.indexOf(w) >= 0, w));
  });
  test('the draft: kept for this account on this device, gone when sent, emptied or a month old', () => {
    const u = 'test-fb-' + Date.now();
    eq(PF.draft.load(u), null);
    assert(PF.draft.save(u, { kind: 'problem', body: 'It froze on Programs', include: false }, NOW), 'saved');
    const d = PF.draft.load(u, NOW + 3600e3);
    eq(d.kind, 'problem'); eq(d.body, 'It froze on Programs'); eq(d.include, false); eq(d.at, NOW);
    eq(PF.draft.load('someone-else'), null, 'another account on this device sees nothing');
    assert(!PF.draft.save(u, { kind: 'idea', body: '   ' }), 'an emptied box clears it');
    eq(PF.draft.load(u), null);
    PF.draft.save(u, { kind: 'weird', body: 'x' }, NOW);
    eq(PF.draft.load(u, NOW).kind, 'idea', 'an unknown kind reads as idea');
    eq(PF.draft.load(u, NOW + 31 * 864e5), null, 'a month old: dropped');
    eq(localStorage.getItem(PF.draft.key(u)), null, 'and cleared');
    localStorage.setItem(PF.draft.key(u), '{not json');
    eq(PF.draft.load(u), null, 'a broken one reads as none');
    PF.draft.clear(u);
    eq(localStorage.getItem(PF.draft.key(u)), null);
  });
  test('a failed send says why and that the words are kept', () => {
    assert(/20 today/.test(PF.failWords({ ok: false, status: 429, error: 'rate_limited' })));
    assert(/No connection/.test(PF.failWords({ ok: false, status: 0, error: 'network' })));
    assert(/No connection/.test(PF.failWords({ ok: false, status: 0, error: 'timeout' })));
    assert(/Sign in again/.test(PF.failWords({ ok: false, status: 401, error: 'Invalid session' })));
    assert(/Sign in again/.test(PF.failWords({ ok: false, status: 403, error: 'aal2_required' })));
    [{ status: 503, error: 'not_ready' }, { status: 500 }, {}, null].forEach(r => assert(/saved on this device/.test(PF.failWords(r)), JSON.stringify(r)));
  });
  test('You\'s two rows: Feedback, and Report a problem (which opens on a problem)', () => {
    const rows = PF.youRows();
    eq(rows.map(r => r.label).join(','), 'Feedback,Report a problem');
    assert(rows.every(r => /<svg/.test(r.icon) && typeof r.onClick === 'function'), 'icons and actions');
  });
})();

function render() {
  const sum = document.getElementById('summary');
  const total = T.pass + T.fail + T.skip;
  sum.innerHTML =
    '<span class="pill tot">' + total + ' tests</span>' +
    '<span class="pill pass">✓ ' + T.pass + ' passed</span>' +
    (T.fail ? '<span class="pill fail">✗ ' + T.fail + ' failed</span>' : '') +
    (T.skip ? '<span class="pill skip">• ' + T.skip + ' skipped</span>' : '') +
    '<span class="pill dur" id="dur"></span>' +
    '<button class="rerun" onclick="location.reload()">Re-run</button>';

  const banner = document.getElementById('banner');
  if (T.fail === 0) banner.innerHTML = '<div class="banner ok">ALL GREEN — ' + T.pass + ' assertions passing' + (T.skip ? ' (' + T.skip + ' skipped)' : '') + '</div>';
  else banner.innerHTML = '<div class="banner bad">' + T.fail + ' FAILING — see red rows below</div>';

  const out = document.getElementById('results');
  out.innerHTML = T.groups.map(g => {
    const cases = g.cases.map(c => {
      const m = c.status === 'pass' ? '<span class="mark p">✓</span>'
        : c.status === 'fail' ? '<span class="mark f">✗</span>'
        : '<span class="mark s">•</span>';
      const extra = c.status === 'fail' ? '<div class="cerr">' + esc(c.err) + '</div>'
        : (c.status === 'skip' && c.err) ? '<div class="cnote">skipped: ' + esc(c.err) + '</div>' : '';
      return '<div class="case">' + m + '<div class="ctext"><div class="cname">' + esc(c.name) + '</div>' + extra + '</div></div>';
    }).join('');
    return '<div class="grp"><p class="grp-h">' + esc(g.name) + '</p>' + cases + '</div>';
  }).join('');
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function bootImporterThenRender(t0) {
  const iframe = document.createElement('iframe');
  iframe.className = 'sandbox';
  iframe.src = 'athlete.html?demo=1';
  document.body.appendChild(iframe);
  const start = Date.now();
  const TIMEOUT = 8000;
  (function poll() {
    let win = null;
    try { win = iframe.contentWindow; } catch (e) { win = null; }
    const ready = win && typeof win._impBuild === 'function' && win._user && win._user.id;
    if (ready) {
      try { runImporterTests(win); }
      catch (e) { group('importer (athlete.html)'); skip('importer round-trip', 'threw while running: ' + ((e && e.message) || e)); }
      finish(t0); return;
    }
    if (Date.now() - start > TIMEOUT) {
      group('importer (athlete.html)');
      skip('importer round-trip', 'demo iframe did not expose _impBuild within ' + (TIMEOUT / 1000) + 's');
      finish(t0); return;
    }
    setTimeout(poll, 150);
  })();
}
function finish(t0) {
  render();
  const dur = document.getElementById('dur');
  if (dur) dur.textContent = (Date.now() - t0) + ' ms';
}

window.addEventListener('load', () => {
  const t0 = Date.now();
  // Synchronous groups already ran at script-parse time above.
  bootImporterThenRender(t0);
});
</script>
