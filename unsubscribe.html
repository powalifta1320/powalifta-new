<main id="main" class="unsub-wrap">
  <div class="unsub-card">
    <h1>Email preferences</h1>
    <p class="unsub-sub">Manage which emails POWALIFTA sends you. Changes save instantly. No login needed.</p>

    <div id="unsubBody">
      <div class="unsub-loading" id="unsubLoading">Updating your preferences…</div>
    </div>

  </div>

<script src="supabase.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script>
// Token-based, unauthenticated email-preference manager (#36). The ?token=
// UUID is the whole credential; the `unsubscribe` edge function resolves it
// server-side. On load we honour the one-click intent — the footer link is a
// weekly-digest unsubscribe — then render toggles for granular control + undo.
(function () {
  const params = new URLSearchParams(location.search);
  let token = (params.get('token') || '').trim();
  // A coach's weekly report links here with r=coach: the same switch (weekly_digest), the coach's words.
  const isCoach = params.get('r') === 'coach';
  // The token is the whole credential: it leaves the address bar at once (kept for this tab, so a
  // reload still works), so it's never sent on as the next page's referrer (sweep 2026-10-28 #13).
  try {
    if (token) sessionStorage.setItem('powa-unsub-token', token); else token = (sessionStorage.getItem('powa-unsub-token') || '').trim();
    if (params.has('token')) { params.delete('token'); history.replaceState(history.state, '', location.pathname + (params.toString() ? '?' + params.toString() : '') + location.hash); }
  } catch (e) {}
  const body = document.getElementById('unsubBody');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function prefRow(id, label, sub, checked) {
    return '<label class="email-pref-row" for="' + id + '">' +
      '<span class="epr-text">' +
        '<span class="epr-label">' + esc(label) + '</span>' +
        '<span class="epr-sub dim text-xs">' + esc(sub) + '</span>' +
      '</span>' +
      '<input type="checkbox" id="' + id + '"' + (checked ? ' checked' : '') + '>' +
    '</label>';
  }

  function renderInvalid(msg) {
    body.innerHTML =
      '<div class="unsub-result err">' +
        '<span class="ur-ic">!</span>' +
        '<span><span class="ur-title">This link isn\'t valid</span>' +
        '<span class="ur-body">' + esc(msg || 'The unsubscribe link is invalid or has expired. You can manage every email preference from Settings inside the app.') + '</span></span>' +
      '</div>' +
      '<a class="btn btn-primary btn-block" href="athlete.html">Manage preferences in Settings</a>';
  }

  function renderPrefs(state, note) {
    const weekly = state.weeklyDigest !== false;
    const product = state.productEmails !== false;
    body.innerHTML =
      '<div class="unsub-result ok">' +
        '<span class="ur-ic">&#10003;</span>' +
        '<span><span class="ur-title">' + esc(note.title) + '</span>' +
        '<span class="ur-body">' + esc(note.msg) + '</span></span>' +
      '</div>' +
      '<div class="unsub-prefs-head">Your emails</div>' +
      (isCoach ? prefRow('epWeekly', 'Weekly report', 'Your team\u2019s week, at the time you picked in Settings.', weekly)
        : prefRow('epWeekly', 'Weekly progress email', 'A Monday recap of your last 7 days: sessions, tonnage, best e1RMs.', weekly)) +
      prefRow('epProduct', 'Product tips & announcements',
        'Occasional notes on new features. No spam, ever.', product) +
      '<div class="unsub-saving" id="unsubSaving"></div>';

    const saving = document.getElementById('unsubSaving');
    let hideTimer = null;
    function flash(text, isErr) {
      saving.textContent = text;
      saving.style.color = isErr ? 'var(--red)' : 'var(--text-3)';
      saving.style.opacity = '1';
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(function () { saving.style.opacity = '0'; }, 2200);
    }

    function wire(elId, key) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.addEventListener('change', async function () {
        const want = el.checked;
        el.disabled = true;
        flash('Saving…', false);
        const patch = {}; patch[key] = want;
        const res = await DB.unsubscribeEmail(token, patch);
        el.disabled = false;
        if (res && res.ok) {
          // Trust the server's returned state (source of truth).
          if (key === 'weeklyDigest') el.checked = res.weeklyDigest !== false;
          if (key === 'productEmails') el.checked = res.productEmails !== false;
          flash('Saved.', false);
        } else {
          el.checked = !want; // revert the optimistic flip
          flash('Couldn\'t save. Try again.', true);
        }
      });
    }
    wire('epWeekly', 'weeklyDigest');
    wire('epProduct', 'productEmails');
  }

  async function boot() {
    if (!token) { renderInvalid('This page needs the unsubscribe link from one of your emails.'); return; }
    // Honour the one-click intent: the footer link unsubscribes from the weekly
    // digest. This mutates then returns the full resulting state.
    const res = await DB.unsubscribeEmail(token, { weeklyDigest: false });
    if (!res || !res.ok) {
      if (res && res.reason === 'invalid link') { renderInvalid(); return; }
      renderInvalid('Something went wrong reaching our servers. You can manage every email preference from Settings inside the app.');
      return;
    }
    renderPrefs(res, isCoach ? {
      title: 'You\'re unsubscribed from the weekly report',
      msg: 'We won\'t email your team\u2019s week anymore. Changed your mind? Flip it back on below.'
    } : {
      title: 'You\'re unsubscribed from weekly emails',
      msg: 'We won\'t send the Monday progress recap anymore. Changed your mind? Flip it back on below.'
    });
  }

  // The link works on its own (its token is the whole credential), so it is answered at once; bootstrap only fills in
  // the bar (it reads the sign-in and the coach list first: offline, supabase-js retries that for about 14 s).
  boot();
  bootstrap(null, function () {
    if (typeof renderNav === 'function') renderNav('#nav');
  }, { staticPublic: true });
})();
</script>
